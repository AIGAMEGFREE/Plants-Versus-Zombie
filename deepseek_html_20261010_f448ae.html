  ctx.lineWidth = 6;
  ctx.strokeText('ВЫБОР ЛОКАЦИИ', W / 2, 60);
  ctx.fillStyle = '#ffd54f';
  ctx.fillText('ВЫБОР ЛОКАЦИИ', W / 2, 60);

  drawBackBtn(20, 20, 140, 50);

  const locations = [
    { key: 'yard',  name: 'ДВОР',    emoji: '☀',  color: '#5cc42e', bg1: '#a8d8ee', bg2: '#5aa62a', levels: LEVELS.filter(l => l.location === 'yard')  },
    { key: 'night', name: 'НОЧЬ',    emoji: '🌙', color: '#3a4a8a', bg1: '#1a2a52', bg2: '#0a0a1a', levels: LEVELS.filter(l => l.location === 'night') },
    { key: 'pool',  name: 'БАССЕЙН', emoji: '🏊', color: '#1a6a9a', bg1: '#4aa8e0', bg2: '#0a2a4a', levels: LEVELS.filter(l => l.location === 'pool')  },
    { key: 'roof',  name: 'КРЫША',   emoji: '🏠', color: '#a85030', bg1: '#d8a060', bg2: '#5a2010', levels: LEVELS.filter(l => l.location === 'roof')  },
  ];

  const cardW = 260, cardH = 440;
  const gap = 20;
  const totalW = cardW * 4 + gap * 3;
  const startX = (W - totalW) / 2;
  const cardY = 130;

  S.levelNodes = [];

  for (let i = 0; i < locations.length; i++) {
    const loc = locations[i];
    const cx = startX + i * (cardW + gap);
    const cy = cardY;
    const firstLevel = loc.levels[0];
    const unlocked = firstLevel && firstLevel.id <= S.unlockedLevels;

    const g = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
    g.addColorStop(0, loc.bg1);
    g.addColorStop(1, loc.bg2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(cx, cy, cardW, cardH, 16);
    ctx.fill();
    ctx.strokeStyle = unlocked ? loc.color : '#333';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.font = 'bold 32px Impact, Arial Black, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 5;
    ctx.strokeText(loc.emoji + ' ' + loc.name, cx + cardW / 2, cy + 35);
    ctx.fillStyle = '#fff';
    ctx.fillText(loc.emoji + ' ' + loc.name, cx + cardW / 2, cy + 35);

    const btnW = 60, btnH = 50;
    const cols = 3;
    const startBtnX = cx + (cardW - cols * btnW - (cols - 1) * 8) / 2;
    const startBtnY = cy + 70;

    for (let j = 0; j < loc.levels.length; j++) {
      const lvl = loc.levels[j];
      const col = j % cols;
      const row = Math.floor(j / cols);
      const bx = startBtnX + col * (btnW + 8);
      const by = startBtnY + row * (btnH + 8);
      const hover = S.cursorX >= bx && S.cursorX <= bx + btnW && S.cursorY >= by && S.cursorY <= by + btnH;
      const lvlLocked = lvl.id > S.unlockedLevels;
      const isBoss = !!lvl.boss;

      const bg2 = ctx.createLinearGradient(0, by, 0, by + btnH);
      if (lvlLocked) {
        bg2.addColorStop(0, '#444'); bg2.addColorStop(1, '#222');
      } else if (isBoss) {
        bg2.addColorStop(0, '#d32f2f'); bg2.addColorStop(1, '#7f0000');
      } else {
        bg2.addColorStop(0, '#8bc34a'); bg2.addColorStop(1, '#33691e');
      }
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.roundRect(bx, by, btnW, btnH, 8);
      ctx.fill();
      ctx.strokeStyle = lvlLocked ? '#000' : (hover ? '#ffeb3b' : '#1a2a0a');
      ctx.lineWidth = hover ? 3 : 2;
      ctx.stroke();

      ctx.fillStyle = lvlLocked ? '#666' : '#fff';
      ctx.font = 'bold 14px Impact, Arial Black, sans-serif';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      const label = isBoss ? '👹' : lvl.name;
      ctx.strokeText(label, bx + btnW / 2, by + btnH / 2);
      ctx.fillText(label, bx + btnW / 2, by + btnH / 2);

      const stars = S.levelStars[lvl.id] || 0;
      if (!lvlLocked && stars > 0 && !isBoss) {
        for (let s = 0; s < 3; s++) {
          const sx = bx + btnW / 2 - 10 + s * 10;
          const sy = by + btnH - 8;
          drawStar(sx, sy, 4, s < stars ? '#ffeb3b' : 'rgba(0,0,0,0.4)');
        }
      }

      if (!lvlLocked) {
        S.levelNodes.push({ level: lvl, x: bx, y: by, w: btnW, h: btnH, locked: false, hover });
      }
    }
  }
}

function drawStar(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI / 5) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.5;
    const px = x + Math.cos(angle) * rad;
    const py = y + Math.sin(angle) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawBackBtn(x, y, w, h) {
  const hover = S.cursorX >= x && S.cursorX <= x + w && S.cursorY >= y && S.cursorY <= y + h;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (hover) { g.addColorStop(0, '#ff8a65'); g.addColorStop(1, '#d84315'); }
  else { g.addColorStop(0, '#ff7043'); g.addColorStop(1, '#bf360c'); }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 10);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('← НАЗАД', x + w / 2, y + h / 2);
  S.backBtn = { x, y, w, h };
}

// ==================== ВВОД ====================
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height)
  };
}

canvas.addEventListener('mousemove', (e) => {
  const p = getPos(e);
  S.cursorX = p.x; S.cursorY = p.y;

  if (S.scene === 'seedselect') {
    let hov = false;
    for (const c of S.seedSelectCardRects) {
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) hov = true;
    }
    if (S.seedSelectBackBtn && p.x >= S.seedSelectBackBtn.x && p.x <= S.seedSelectBackBtn.x + S.seedSelectBackBtn.w &&
        p.y >= S.seedSelectBackBtn.y && p.y <= S.seedSelectBackBtn.y + S.seedSelectBackBtn.h) hov = true;
    if (S.seedSelectStartBtn && S.seedSelectStartBtn.enabled &&
        p.x >= S.seedSelectStartBtn.x && p.x <= S.seedSelectStartBtn.x + S.seedSelectStartBtn.w &&
        p.y >= S.seedSelectStartBtn.y && p.y <= S.seedSelectStartBtn.y + S.seedSelectStartBtn.h) hov = true;
    canvas.style.cursor = hov ? 'pointer' : 'default';
    return;
  }

  if (S.scene === 'minigames') {
    let hov = false;
    if (S.backBtn && p.x >= S.backBtn.x && p.x <= S.backBtn.x + S.backBtn.w &&
        p.y >= S.backBtn.y && p.y <= S.backBtn.y + S.backBtn.h) hov = true;
    if (S.achMenuBtn && p.x >= S.achMenuBtn.x && p.x <= S.achMenuBtn.x + S.achMenuBtn.w &&
        p.y >= S.achMenuBtn.y && p.y <= S.achMenuBtn.y + S.achMenuBtn.h) hov = true;
    for (const c of S.minigameCards) {
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) hov = true;
    }
    canvas.style.cursor = hov ? 'pointer' : 'default';
    return;
  }

  if (S.scene === 'achievements') {
    let hov = false;
    if (S.backBtn && p.x >= S.backBtn.x && p.x <= S.backBtn.x + S.backBtn.w &&
        p.y >= S.backBtn.y && p.y <= S.backBtn.y + S.backBtn.h) hov = true;
    canvas.style.cursor = hov ? 'pointer' : 'default';
    return;
  }

  let hov = false;
  if (S.scene === 'menu') {
    if (S.menuBtn && p.x >= S.menuBtn.x && p.x <= S.menuBtn.x + S.menuBtn.w &&
        p.y >= S.menuBtn.y && p.y <= S.menuBtn.y + S.menuBtn.h) hov = true;
    if (S.menuMinigameBtn && p.x >= S.menuMinigameBtn.x && p.x <= S.menuMinigameBtn.x + S.menuMinigameBtn.w &&
        p.y >= S.menuMinigameBtn.y && p.y <= S.menuMinigameBtn.y + S.menuMinigameBtn.h) hov = true;
    if (S.achMenuBtn && p.x >= S.achMenuBtn.x && p.x <= S.achMenuBtn.x + S.achMenuBtn.w &&
        p.y >= S.achMenuBtn.y && p.y <= S.achMenuBtn.y + S.achMenuBtn.h) hov = true;
    if (S.resetBtn && p.x >= S.resetBtn.x && p.x <= S.resetBtn.x + S.resetBtn.w &&
        p.y >= S.resetBtn.y && p.y <= S.resetBtn.y + S.resetBtn.h) hov = true;
  } else if (S.scene === 'levelselect') {
    if (S.backBtn && p.x >= S.backBtn.x && p.x <= S.backBtn.x + S.backBtn.w &&
        p.y >= S.backBtn.y && p.y <= S.backBtn.y + S.backBtn.h) hov = true;
    for (const n of S.levelNodes) {
      if (!n.locked && p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h) hov = true;
    }
  }
  canvas.style.cursor = hov ? 'pointer' : 'default';
});

canvas.addEventListener('click', (e) => {
  const p = getPos(e);
  const x = p.x, y = p.y;

  if (S.scene === 'minigames') {
    if (S.backBtn && x >= S.backBtn.x && x <= S.backBtn.x + S.backBtn.w &&
        y >= S.backBtn.y && y <= S.backBtn.y + S.backBtn.h) {
      S.scene = 'menu';
      return;
    }
    if (S.achMenuBtn && x >= S.achMenuBtn.x && x <= S.achMenuBtn.x + S.achMenuBtn.w &&
        y >= S.achMenuBtn.y && y <= S.achMenuBtn.y + S.achMenuBtn.h) {
      S.scene = 'achievements';
      return;
    }
    for (const c of S.minigameCards) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        startMinigame(c.minigame);
        return;
      }
    }
    return;
  }

  if (S.scene === 'achievements') {
    if (S.backBtn && x >= S.backBtn.x && x <= S.backBtn.x + S.backBtn.w &&
        y >= S.backBtn.y && y <= S.backBtn.y + S.backBtn.h) {
      S.scene = 'menu';
      return;
    }
    return;
  }

  if (S.scene === 'seedselect') {
    if (S.seedSelectBackBtn && x >= S.seedSelectBackBtn.x && x <= S.seedSelectBackBtn.x + S.seedSelectBackBtn.w &&
        y >= S.seedSelectBackBtn.y && y <= S.seedSelectBackBtn.y + S.seedSelectBackBtn.h) {
      S.scene = 'levelselect';
      S.seedSelectMode = false;
      return;
    }
    if (S.seedSelectStartBtn && S.seedSelectStartBtn.enabled &&
        x >= S.seedSelectStartBtn.x && x <= S.seedSelectStartBtn.x + S.seedSelectStartBtn.w &&
        y >= S.seedSelectStartBtn.y && y <= S.seedSelectStartBtn.y + S.seedSelectStartBtn.h) {
      const lvl = S.currentLevel;
      const originalSeeds = [...lvl.seeds];
      lvl.seeds = [...S.seedSelectChosen];
      S.seedSelectMode = false;
      startLevel(lvl);
      lvl.seeds = originalSeeds;
      return;
    }
    const slotSize = 90, slotGap = 12;
    const slotRowW = S.seedSelectMaxSlots * slotSize + (S.seedSelectMaxSlots - 1) * slotGap;
    const slotRowX = (W - slotRowW) / 2;
    const slotRowY = 150;
    for (let i = 0; i < S.seedSelectMaxSlots; i++) {
      const sx = slotRowX + i * (slotSize + slotGap);
      if (x >= sx && x <= sx + slotSize && y >= slotRowY && y <= slotRowY + slotSize) {
        if (S.seedSelectChosen[i]) S.seedSelectChosen.splice(i, 1);
        return;
      }
    }
    for (const c of S.seedSelectCardRects) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        const idx = S.seedSelectChosen.indexOf(c.seedId);
        if (idx >= 0) S.seedSelectChosen.splice(idx, 1);
        else if (S.seedSelectChosen.length < S.seedSelectMaxSlots) S.seedSelectChosen.push(c.seedId);
        return;
      }
    }
    return;
  }

  if (S.scene === 'menu') {
    if (S.resetBtn && x >= S.resetBtn.x && x <= S.resetBtn.x + S.resetBtn.w &&
        y >= S.resetBtn.y && y <= S.resetBtn.y + S.resetBtn.h) {
      resetProgress();
      return;
    }
    if (S.achMenuBtn && x >= S.achMenuBtn.x && x <= S.achMenuBtn.x + S.achMenuBtn.w &&
        y >= S.achMenuBtn.y && y <= S.achMenuBtn.y + S.achMenuBtn.h) {
      S.scene = 'achievements';
      return;
    }
    if (S.menuMinigameBtn && x >= S.menuMinigameBtn.x && x <= S.menuMinigameBtn.x + S.menuMinigameBtn.w &&
        y >= S.menuMinigameBtn.y && y <= S.menuMinigameBtn.y + S.menuMinigameBtn.h) {
      S.scene = 'minigames';
      return;
    }
    if (S.menuBtn && x >= S.menuBtn.x && x <= S.menuBtn.x + S.menuBtn.w &&
        y >= S.menuBtn.y && y <= S.menuBtn.y + S.menuBtn.h) {
      S.scene = 'levelselect';
    }
    return;
  }

  if (S.scene === 'levelselect') {
    if (S.backBtn && x >= S.backBtn.x && x <= S.backBtn.x + S.backBtn.w &&
        y >= S.backBtn.y && y <= S.backBtn.y + S.backBtn.h) {
      S.scene = 'menu';
      return;
    }
    for (const n of S.levelNodes) {
      if (n.locked) continue;
      if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) {
        startLevelWithSeedSelect(n.level);
        return;
      }
    }
    return;
  }

  if (S.gameOver) {
    saveProgress(true);
    S.scene = 'levelselect';
    S.gameOver = false;
    S.minigameType = null;
    return;
  }

  const panelY = 8;
  const packetW = 62, packetH = 84;
  const sunW = 78;
  const startX = 8 + sunW + 4;
  const seeds = S.currentLevel.seeds;

  for (let i = 0; i < seeds.length; i++) {
    const sx = startX + i * (packetW + 4);
    if (x >= sx && x <= sx + packetW && y >= panelY && y <= panelY + packetH) {
      const seed = ALL_PLANTS[seeds[i]];
      const cd = S.cooldowns[seed.id] || 0;
      const awake = isPlantAwake(seed.id);
      if (cd > 0 || S.sun < seed.cost || !awake) return;
      S.selectedSeed = (S.selectedSeed === seed.id) ? null : seed.id;
      S.shovelSelected = false;
      return;
    }
  }

  const shX = startX + seeds.length * (packetW + 4) + 4;
  if (x >= shX && x <= shX + packetW && y >= panelY && y <= panelY + packetH) {
    S.shovelSelected = !S.shovelSelected;
    S.selectedSeed = null;
    return;
  }

  if (x >= W - 130 && x <= W - 8 && y >= panelY && y <= panelY + 40) {
    saveProgress(true);
    S.scene = 'levelselect';
    S.gameOver = false;
    S.minigameType = null;
    return;
  }

  for (const s of S.suns) {
    if (dist(s.x, s.y, x, y) < 34) {
      S.sun += s.value;
      addParticles(s.x, s.y, 8, '#ffeb3b', 4, 500, 4);
      s.life = 0;
      return;
    }
  }

  const col = Math.floor((x - GRID_X) / CELL_W);
  const row = Math.floor((y - activeTop()) / CELL_H);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

  if (S.shovelSelected) {
    const plant = S.plants.find(p => p.row === row && p.col === col);
    if (plant) {
      S.plants = S.plants.filter(p => p !== plant);
      S.shovelSelected = false;
      S.usedShovelThisLevel++;
    }
    return;
  }

  if (S.selectedSeed) {
    const seed = ALL_PLANTS[S.selectedSeed];
    if (!seed) return;
    if (S.sun < seed.cost || (S.cooldowns[seed.id] > 0)) return;
    if (!isPlantAwake(seed.id)) return;
    if (S.plants.find(p => p.row === row && p.col === col)) return;

    if (seed.id === 'cherry') {
      S.sun -= seed.cost;
      S.cooldowns[seed.id] = seed.cd;
      S.shake = 16;
      S.plantedThisLevel++;
      for (const z of S.zombies) {
        if (z.hp <= 0 || z.x >= YARD_RIGHT) continue;
        if (Math.abs(z.row - row) <= 1 && Math.abs(z.x - cellCX(col)) < CELL_W * 1.7) {
          z.hp -= 1800;
        }
      }
      S.selectedSeed = null;
      return;
    }
    if (seed.id === 'jalapeno') {
      S.sun -= seed.cost;
      S.cooldowns[seed.id] = seed.cd;
      S.shake = 20;
      S.plantedThisLevel++;
      for (const z of S.zombies) {
        if (z.hp <= 0 || z.x >= YARD_RIGHT) continue;
        if (z.row === row) z.hp -= 1800;
      }
      S.selectedSeed = null;
      return;
    }
    if (seed.id === 'doomshroom') {
      S.sun -= seed.cost;
      S.cooldowns[seed.id] = seed.cd;
      S.shake = 25;
      S.plantedThisLevel++;
      for (const z of S.zombies) {
        if (z.hp <= 0 || z.x >= YARD_RIGHT) continue;
        z.hp -= 5000;
      }
      S.selectedSeed = null;
      return;
    }
    if (seed.id === 'iceshroom') {
      S.sun -= seed.cost;
      S.cooldowns[seed.id] = seed.cd;
      S.plantedThisLevel++;
      for (const z of S.zombies) {
        if (z.hp <= 0 || z.x >= YARD_RIGHT) continue;
        z.slowTimer = 8000;
      }
      S.selectedSeed = null;
      return;
    }

    S.plantedThisLevel++;
    S.plants.push({
      type: seed.id, row, col,
      hp: seed.id === 'wallnut' ? 4000 : seed.id === 'garlic' ? 400 : 100,
      maxHp: seed.id === 'wallnut' ? 4000 : seed.id === 'garlic' ? 400 : 100,
      sunTimer: 0, shootTimer: 0, armTimer: 0, armed: false, born: S.time,
      chewing: false, chewTimer: 0,
    });
    S.sun -= seed.cost;
    S.cooldowns[seed.id] = seed.cd;
    S.selectedSeed = null;
  }
});

document.addEventListener('keydown', (e) => {
  if (S.scene !== 'playing' || S.gameOver) return;
  if (e.key === 'Escape') {
    S.selectedSeed = null;
    S.shovelSelected = false;
  }
  const n = parseInt(e.key);
  if (n >= 1 && n <= S.currentLevel.seeds.length) {
    const seed = ALL_PLANTS[S.currentLevel.seeds[n - 1]];
    const cd = S.cooldowns[seed.id] || 0;
    if (cd <= 0 && S.sun >= seed.cost && isPlantAwake(seed.id)) {
      S.selectedSeed = S.selectedSeed === seed.id ? null : seed.id;
      S.shovelSelected = false;
    }
  }
});

// ==================== СТАРТ УРОВНЯ ====================
function startLevel(level) {
  ROWS = level.rows || 5;
  ROW_START = level.rowsOffset || 0;
  S.dayNight = level.time || 'day';
  S.location = level.location || 'yard';
  bgCacheKey = '';
  bushesCacheKey = '';
  ensureBackgrounds();
  ensureBushes();

  S.currentLevel = level;
  S.scene = 'playing';
  S.sun = 75;
  S.plants = [];
  S.zombies = [];
  S.projectiles = [];
  S.suns = [];
  S.particles = [];
  S.selectedSeed = null;
  S.shovelSelected = false;
  S.cooldowns = {};
  S.sunTimer = 0;
  S.zombieSpawnTimer = 3000;
  S.spawnedZombies = 0;
  S.killedZombies = 0;
  S.totalZombies = level.totalZombies;
  S.spawnInterval = level.spawnInterval;
  S.currentWave = 1;
  S.gameOver = false;
  S.won = false;
  S.shake = 0;
  S.levelProgress = 0;
  S.bossSpawned = false;
  S.plantedThisLevel = 0;
  S.usedShovelThisLevel = 0;
  S.garlicPushes = 0;
  S.levelStartTime = S.time;
  S.mowers = [];
  for (let r = 0; r < ROWS; r++) {
    S.mowers.push({ row: r, x: GRID_X - 32, used: false, active: false });
  }
  for (let i = 0; i < 2; i++) {
    const x = rand(GRID_X + 40, GRID_X + GRID_W - 40);
    const y = rand(activeTop() + 40, activeBottom() - 40);
    S.suns.push({
      x, y, targetY: y,
      life: 12000, maxLife: 12000,
      vy: 0, phase: Math.random() * 10, value: 25
    });
  }
}

// ==================== ГЛАВНЫЙ ЦИКЛ ====================
function loop(now) {
  const dt = Math.min(now - S.lastTime, 50);
  S.lastTime = now;
  S.time += dt;

  if (S.scene === 'playing' && !S.gameOver) {
    update(dt);
  } else {
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 0.02);
  }

  if (S.scene === 'playing') {
    S.killedZombies = Math.min(S.totalZombies,
      S.spawnedZombies - S.zombies.filter(z => z.hp > 0 && z.type !== 'zomboss').length);
  }

  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
  ctx.clearRect(-50, -50, W + 100, H + 100);

  if (S.scene === 'menu') drawMenu();
  else if (S.scene === 'levelselect') drawLevelSelect();
  else if (S.scene === 'seedselect') drawSeedSelect();
  else if (S.scene === 'minigames') drawMinigameMenu();
  else if (S.scene === 'achievements') drawAchievements();
  else {
    drawGameScene();

    if (S.gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (S.won) {
        ctx.font = 'bold 72px Impact, Arial Black, sans-serif';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 8;
        ctx.strokeText('УРОВЕНЬ ПРОЙДЕН!', W / 2, H / 2 - 120);
        ctx.fillStyle = '#ffd54f';
        ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', W / 2, H / 2 - 120);
        const stars = S.currentLevel.id > 0 ? (S.levelStars[S.currentLevel.id] || 0) : 3;
        for (let i = 0; i < 3; i++) {
          drawStar(W / 2 - 100 + i * 100, H / 2 - 10, 40, i < stars ? '#ffeb3b' : 'rgba(255,255,255,0.2)');
        }
        if (S.plantedThisLevel === 0) {
          ctx.fillStyle = '#4fc3f7';
          ctx.font = 'bold 32px Impact, Arial Black, sans-serif';
          ctx.fillText('😎 ПОФИГИЗМ АКТИВИРОВАН!', W / 2, H / 2 + 60);
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Arial';
        ctx.fillText('Прогресс сохранён 💾', W / 2, H / 2 + 110);
        ctx.fillText('Кликните для продолжения', W / 2, H / 2 + 150);
      } else {
        ctx.font = 'bold 72px Impact, Arial Black, sans-serif';
        ctx.fillStyle = '#f44336';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 8;
        ctx.strokeText('ПОРАЖЕНИЕ', W / 2, H / 2 - 40);
        ctx.fillText('ПОРАЖЕНИЕ', W / 2, H / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Arial';
        ctx.fillText('Кликните, чтобы попробовать снова', W / 2, H / 2 + 40);
      }
    }
  }
  ctx.restore();

  if (S.scene === 'playing' && !S.gameOver && (S.selectedSeed || S.shovelSelected)) {
    if (S.cursorX > 0 && S.cursorY > 0) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      if (S.selectedSeed) {
        drawPlant(S.selectedSeed, S.cursorX + 18, S.cursorY + 10, S.time, 1.05, null);
      } else {
        ctx.translate(S.cursorX + 14, S.cursorY + 8);
        ctx.rotate(-0.4);
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(-3, -28, 6, 40);
        ctx.fillStyle = '#5d4037';
        ctx.beginPath();
        ctx.moveTo(-3, 12); ctx.lineTo(3, 12); ctx.lineTo(3, 30);
        ctx.quadraticCurveTo(0, 38, -3, 30);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }
  if (S.scene === 'playing') canvas.style.cursor = 'default';

  // Тост достижения поверх всего
  drawAchievementToasts();

  requestAnimationFrame(loop);
}

// ==================== СТАРТ ====================
loadProgress();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
