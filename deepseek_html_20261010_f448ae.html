<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Plants vs Zombies — Adventure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: #000; user-select: none;
  }
  #app {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; max-width: 100%; max-height: 100%; cursor: default; }
  #saveToast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: linear-gradient(180deg, rgba(60,40,20,0.95), rgba(30,20,10,0.95));
    color: #ffe082; padding: 12px 26px; border-radius: 10px;
    font-weight: bold; font-size: 15px; pointer-events: none; z-index: 1000;
    border: 2px solid #7cb342; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #saveToast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"><canvas id="canvas" width="1280" height="720"></canvas></div>
<div id="saveToast"></div>
<script>
(() => {
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ==================== ИГРОВАЯ СЕТКА ====================
const GRID_X = 258;
const GRID_Y = 118;
const COLS = 9;
const MAX_ROWS = 5;
let ROWS = 5;
let ROW_START = 0;
const CELL_W = 82;
const CELL_H = 98;
const GRID_W = COLS * CELL_W;
const GRID_H = MAX_ROWS * CELL_H;

const YARD_RIGHT = GRID_X + GRID_W;
const ROAD_W = 250;
const ROAD_RIGHT = YARD_RIGHT + ROAD_W;
const ZOMBIE_SPAWN_X = ROAD_RIGHT + 60;
const ZOMBIE_ENTER_YARD_X = YARD_RIGHT - 5;

const cellCX = (c) => GRID_X + c * CELL_W + CELL_W / 2;
const cellCY = (r) => GRID_Y + (ROW_START + r) * CELL_H + CELL_H / 2;
const activeGridH = () => ROWS * CELL_H;
const activeTop = () => GRID_Y + ROW_START * CELL_H;
const activeBottom = () => activeTop() + activeGridH();

// ==================== КЭШ ФОНА ====================
let bgCacheYard = null;
let bgCacheYardNight = null;
let bgCacheRoof = null;
let bgCachePool = null;
let bgCacheKey = '';

function buildYardBackground(isNight, rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W;
  oc.height = H;
  const g = oc.getContext('2d');

  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const sky = g.createLinearGradient(0, 0, 0, 300);
  if (isNight) {
    sky.addColorStop(0, '#0a1530');
    sky.addColorStop(0.5, '#15264a');
    sky.addColorStop(1, '#2a3a5e');
  } else {
    sky.addColorStop(0, '#5aa8dc');
    sky.addColorStop(0.6, '#a8d4ec');
    sky.addColorStop(1, '#d4eaf4');
  }
  g.fillStyle = sky;
  g.fillRect(0, 0, W, 300);

  if (isNight) {
    for (let i = 0; i < 80; i++) {
      const x = (i * 211) % W;
      const y = (i * 89) % 220;
      g.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.5})`;
      g.beginPath();
      g.arc(x, y, Math.random() * 1.5 + 0.5, 0, Math.PI * 2);
      g.fill();
    }
    const moonG = g.createRadialGradient(W * 0.82, 100, 8, W * 0.82, 100, 100);
    moonG.addColorStop(0, 'rgba(255,255,220,0.95)');
    moonG.addColorStop(0.4, 'rgba(220,220,200,0.3)');
    moonG.addColorStop(1, 'rgba(220,220,200,0)');
    g.fillStyle = moonG;
    g.beginPath();
    g.arc(W * 0.82, 100, 100, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#f5f5dc';
    g.beginPath();
    g.arc(W * 0.82, 100, 52, 0, Math.PI * 2);
    g.fill();
  } else {
    const clouds = [
      { x: 280, y: 50, s: 1.0 },
      { x: 620, y: 30, s: 0.85 },
      { x: 900, y: 60, s: 1.1 },
      { x: 1180, y: 35, s: 0.9 },
    ];
    for (const c of clouds) {
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.beginPath();
      g.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
      g.arc(c.x + 26 * c.s, c.y - 8 * c.s, 28 * c.s, 0, Math.PI * 2);
      g.arc(c.x + 56 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
      g.arc(c.x + 30 * c.s, c.y + 10 * c.s, 22 * c.s, 0, Math.PI * 2);
      g.fill();
    }
  }

  for (let i = 0; i < 30; i++) {
    const x = 230 + i * 40;
    const y = 12 + (i % 3) * 6;
    const r = 18 + (i % 4) * 4;
    g.fillStyle = isNight ? '#0a2a10' : '#2e7d32';
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = isNight ? '#153815' : '#43a047';
    g.beginPath();
    g.arc(x - r * 0.2, y - r * 0.2, r * 0.6, 0, Math.PI * 2);
    g.fill();
  }

  const fenceY = 68;
  g.fillStyle = isNight ? '#7a755e' : '#d4ceb8';
  g.fillRect(230, fenceY - 3, W - 230, 6);
  for (let x = 230; x < W + 10; x += 42) {
    const planks = g.createLinearGradient(x, 0, x + 36, 0);
    if (isNight) {
      planks.addColorStop(0, '#6a6550');
      planks.addColorStop(0.5, '#b8b098');
      planks.addColorStop(1, '#6a6550');
    } else {
      planks.addColorStop(0, '#d8d0b8');
      planks.addColorStop(0.5, '#fff9e8');
      planks.addColorStop(1, '#c8c0a0');
    }
    g.fillStyle = planks;
    g.beginPath();
    g.moveTo(x, fenceY);
    g.lineTo(x, 30);
    g.lineTo(x + 18, 18);
    g.lineTo(x + 36, 30);
    g.lineTo(x + 36, fenceY);
    g.closePath();
    g.fill();
    g.strokeStyle = isNight ? '#3a3525' : '#8b8470';
    g.lineWidth = 1.5;
    g.stroke();
  }

  const dirtG = g.createLinearGradient(0, 90, 0, H);
  if (isNight) {
    dirtG.addColorStop(0, '#3a2a1a');
    dirtG.addColorStop(1, '#1a1008');
  } else {
    dirtG.addColorStop(0, '#b08860');
    dirtG.addColorStop(0.5, '#a07850');
    dirtG.addColorStop(1, '#8a6438');
  }
  g.fillStyle = dirtG;
  g.fillRect(0, 90, W, H - 90);

  for (let i = 0; i < 1000; i++) {
    const x = (i * 73 + 17) % W;
    const y = 90 + ((i * 131 + 41) % (H - 90));
    if (x >= GRID_X && x <= GRID_X + GRID_W && y >= aTop && y <= aBottom) continue;
    if (x >= YARD_RIGHT - 10 && x <= ROAD_RIGHT + 10 && y >= aTop - 30 && y <= aBottom + 30) continue;
    if (x < 220) continue;
    g.fillStyle = isNight
      ? `rgba(15,10,5,${0.15 + (i % 3) * 0.08})`
      : `rgba(120,85,50,${0.15 + (i % 3) * 0.08})`;
    g.beginPath();
    g.arc(x, y, 0.8 + (i % 5) * 0.4, 0, Math.PI * 2);
    g.fill();
  }

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      const light = (realRow + c) % 2 === 0;
      const baseG = g.createLinearGradient(x, y, x, y + CELL_H);
      if (isNight) {
        baseG.addColorStop(0, light ? '#1e4a10' : '#1a400c');
        baseG.addColorStop(1, light ? '#2a5a18' : '#245014');
      } else {
        baseG.addColorStop(0, light ? '#6ed636' : '#5cc42e');
        baseG.addColorStop(1, light ? '#5cb82a' : '#4ea826');
      }
      g.fillStyle = baseG;
      g.fillRect(x, y, CELL_W, CELL_H);

      for (let i = 0; i < 30; i++) {
        const px = x + ((i * 17 + realRow * 13 + c * 7) % CELL_W);
        const py = y + ((i * 23 + realRow * 5 + c * 11) % CELL_H);
        const dark = (i + realRow + c) % 2 === 0;
        g.fillStyle = isNight
          ? (dark ? 'rgba(8,30,4,0.35)' : 'rgba(80,140,50,0.25)')
          : (dark ? 'rgba(30,90,15,0.3)' : 'rgba(200,240,150,0.35)');
        g.beginPath();
        g.ellipse(px, py, 1.2, 0.7, 0, 0, Math.PI * 2);
        g.fill();
      }
    }
  }

  const roadX = YARD_RIGHT;
  const roadTop = aTop - 25;
  const roadBottom = aBottom + 25;
  const roadH = roadBottom - roadTop;

  const roadBgG = g.createLinearGradient(0, roadTop, 0, roadBottom);
  if (isNight) {
    roadBgG.addColorStop(0, '#2a2a2a');
    roadBgG.addColorStop(0.5, '#333333');
    roadBgG.addColorStop(1, '#1a1a1a');
  } else {
    roadBgG.addColorStop(0, '#8a8a8a');
    roadBgG.addColorStop(0.5, '#9a9a9a');
    roadBgG.addColorStop(1, '#7a7a7a');
  }
  g.fillStyle = roadBgG;
  g.fillRect(roadX, roadTop, ROAD_W, roadH);

  const tileSize = 80;
  const tilesX = Math.ceil(ROAD_W / tileSize);
  const tilesY = Math.ceil(roadH / tileSize);
  for (let ty = 0; ty < tilesY; ty++) {
    for (let tx = 0; tx < tilesX; tx++) {
      const tileX = roadX + tx * tileSize;
      const tileY = roadTop + ty * tileSize;
      const tileW = Math.min(tileSize, roadX + ROAD_W - tileX);
      const tileH = Math.min(tileSize, roadBottom - tileY);
      const shade = (tx + ty) % 2 === 0;
      const tg = g.createLinearGradient(tileX, tileY, tileX, tileY + tileH);
      if (isNight) {
        tg.addColorStop(0, shade ? '#4a4a4a' : '#424242');
        tg.addColorStop(1, shade ? '#3a3a3a' : '#323232');
      } else {
        tg.addColorStop(0, shade ? '#b8b8b8' : '#a8a8a8');
        tg.addColorStop(1, shade ? '#9c9c9c' : '#8e8e8e');
      }
      g.fillStyle = tg;
      g.fillRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
      g.strokeStyle = isNight ? '#1a1a1a' : '#5a5a5a';
      g.lineWidth = 3;
      g.strokeRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
    }
  }

  const curbX = roadX - 8;
  const curbG = g.createLinearGradient(curbX, 0, curbX + 16, 0);
  if (isNight) {
    curbG.addColorStop(0, '#4a4a4a');
    curbG.addColorStop(0.5, '#7a7a7a');
    curbG.addColorStop(1, '#3a3a3a');
  } else {
    curbG.addColorStop(0, '#a89878');
    curbG.addColorStop(0.5, '#e8d8b8');
    curbG.addColorStop(1, '#8a7860');
  }
  g.fillStyle = curbG;
  g.fillRect(curbX, roadTop, 16, roadH);

  const curbRX = roadX + ROAD_W - 8;
  g.fillStyle = curbG;
  g.fillRect(curbRX, roadTop, 16, roadH);

  for (let x = GRID_X; x < GRID_X + GRID_W; x += 8) {
    g.fillStyle = isNight ? '#1a3a10' : '#4caf50';
    g.beginPath();
    g.moveTo(x, aTop);
    g.lineTo(x + 3, aTop - 6 - (x % 5));
    g.lineTo(x + 6, aTop);
    g.closePath();
    g.fill();
    g.beginPath();
    g.moveTo(x, aBottom);
    g.lineTo(x + 3, aBottom + 6 + (x % 5));
    g.lineTo(x + 6, aBottom);
    g.closePath();
    g.fill();
  }

  // Дом
  const houseW = GRID_X - 45;
  const houseTop = 100;
  const houseBottom = H - 60;
  const houseH = houseBottom - houseTop;

  const wallG = g.createLinearGradient(0, 0, houseW, 0);
  if (isNight) {
    wallG.addColorStop(0, '#8a7a5a');
    wallG.addColorStop(0.5, '#b8a888');
    wallG.addColorStop(1, '#5a4a35');
  } else {
    wallG.addColorStop(0, '#f5e8d0');
    wallG.addColorStop(0.4, '#fff5e0');
    wallG.addColorStop(1, '#c8b090');
  }
  g.fillStyle = wallG;
  g.fillRect(0, houseTop, houseW, houseH);

  g.strokeStyle = isNight ? 'rgba(0,0,0,0.15)' : 'rgba(160,130,90,0.2)';
  g.lineWidth = 1;
  for (let y = houseTop + 20; y < houseBottom; y += 22) {
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(houseW, y);
    g.stroke();
    for (let x = (y / 22) % 2 === 0 ? 0 : 30; x < houseW; x += 60) {
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x, y + 22);
      g.stroke();
    }
  }

  const roofTop = 30;
  const roofBottom = houseTop + 10;
  const roofG = g.createLinearGradient(0, roofTop, 0, roofBottom);
  if (isNight) {
    roofG.addColorStop(0, '#7a3a30');
    roofG.addColorStop(1, '#3a1a15');
  } else {
    roofG.addColorStop(0, '#e8453c');
    roofG.addColorStop(0.5, '#c92f26');
    roofG.addColorStop(1, '#8a1a12');
  }
  g.fillStyle = roofG;
  g.beginPath();
  g.moveTo(-10, roofBottom);
  g.lineTo(houseW * 0.5, roofTop - 10);
  g.lineTo(houseW + 10, roofBottom);
  g.closePath();
  g.fill();

  const winX = 30;
  const winY = houseTop + 40;
  const winW = 60;
  const winH = 70;
  g.fillStyle = '#8b5a2b';
  g.fillRect(winX - 5, winY - 5, winW + 10, winH + 10);
  const winG = g.createLinearGradient(winX, winY, winX + winW, winY + winH);
  if (isNight) {
    winG.addColorStop(0, '#2a3a5a');
    winG.addColorStop(0.5, '#3a4a6a');
    winG.addColorStop(1, '#1a2a4a');
  } else {
    winG.addColorStop(0, '#a8d8f0');
    winG.addColorStop(0.5, '#d4ecf7');
    winG.addColorStop(1, '#8bc0dc');
  }
  g.fillStyle = winG;
  g.fillRect(winX, winY, winW, winH);
  g.strokeStyle = '#8b5a2b';
  g.lineWidth = 4;
  g.beginPath();
  g.moveTo(winX + winW / 2, winY);
  g.lineTo(winX + winW / 2, winY + winH);
  g.moveTo(winX, winY + winH / 2);
  g.lineTo(winX + winW, winY + winH / 2);
  g.stroke();

  const doorX = 45;
  const doorY = houseBottom - 150;
  const doorW = 75;
  const doorH = 150;
  g.fillStyle = '#5d4037';
  g.fillRect(doorX - 6, doorY - 6, doorW + 12, doorH + 6);
  const doorG = g.createLinearGradient(doorX, 0, doorX + doorW, 0);
  if (isNight) {
    doorG.addColorStop(0, '#4a3020');
    doorG.addColorStop(0.5, '#6a4830');
    doorG.addColorStop(1, '#3a2010');
  } else {
    doorG.addColorStop(0, '#8b5a2b');
    doorG.addColorStop(0.5, '#a87848');
    doorG.addColorStop(1, '#6d4c21');
  }
  g.fillStyle = doorG;
  g.beginPath();
  g.moveTo(doorX, doorY + doorH);
  g.lineTo(doorX, doorY + 40);
  g.quadraticCurveTo(doorX + doorW / 2, doorY - 15, doorX + doorW, doorY + 40);
  g.lineTo(doorX + doorW, doorY + doorH);
  g.closePath();
  g.fill();
  g.fillStyle = '#ffd700';
  g.beginPath();
  g.arc(doorX + doorW - 12, doorY + doorH / 2 + 10, 5, 0, Math.PI * 2);
  g.fill();

  return oc;
}

function buildRoofBackground(rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W;
  oc.height = H;
  const g = oc.getContext('2d');

  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const sky = g.createLinearGradient(0, 0, 0, 300);
  sky.addColorStop(0, '#5a8fc4');
  sky.addColorStop(0.6, '#a8d0e8');
  sky.addColorStop(1, '#d8e8f0');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, 300);

  const roofG = g.createLinearGradient(0, 90, 0, H);
  roofG.addColorStop(0, '#8b3a3a');
  roofG.addColorStop(0.5, '#7a3030');
  roofG.addColorStop(1, '#4a1818');
  g.fillStyle = roofG;
  g.fillRect(0, 90, W, H - 90);

  for (let y = 100; y < H; y += 20) {
    g.strokeStyle = 'rgba(0,0,0,0.25)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(W, y);
    g.stroke();
    for (let x = (y / 20) % 2 === 0 ? 0 : 20; x < W; x += 40) {
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x, y + 20);
      g.stroke();
    }
  }

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      const light = (realRow + c) % 2 === 0;
      const tg = g.createLinearGradient(x, y, x, y + CELL_H);
      tg.addColorStop(0, light ? '#b08868' : '#a07858');
      tg.addColorStop(1, light ? '#986848' : '#885838');
      g.fillStyle = tg;
      g.fillRect(x, y, CELL_W, CELL_H);
      g.strokeStyle = 'rgba(60,30,15,0.5)';
      g.lineWidth = 2;
      g.strokeRect(x + 1, y + 1, CELL_W - 2, CELL_H - 2);
    }
  }

  g.fillStyle = '#8b5a2b';
  g.fillRect(0, 80, W, 40);
  g.strokeStyle = '#5d4037';
  g.lineWidth = 3;
  for (let x = 0; x < W; x += 40) {
    g.beginPath();
    g.moveTo(x, 80);
    g.lineTo(x, 120);
    g.stroke();
  }

  return oc;
}

function buildPoolBackground(rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W;
  oc.height = H;
  const g = oc.getContext('2d');

  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const sky = g.createLinearGradient(0, 0, 0, 300);
  sky.addColorStop(0, '#5aa8dc');
  sky.addColorStop(0.6, '#a8d4ec');
  sky.addColorStop(1, '#d4eaf4');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, 300);

  for (let i = 0; i < 30; i++) {
    const x = 230 + i * 40;
    const y = 12 + (i % 3) * 6;
    const r = 18 + (i % 4) * 4;
    g.fillStyle = '#2e7d32';
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }

  const fenceY = 68;
  g.fillStyle = '#d4ceb8';
  g.fillRect(230, fenceY - 3, W - 230, 6);
  for (let x = 230; x < W + 10; x += 42) {
    g.fillStyle = '#f0e9d6';
    g.beginPath();
    g.moveTo(x, fenceY);
    g.lineTo(x, 30);
    g.lineTo(x + 18, 18);
    g.lineTo(x + 36, 30);
    g.lineTo(x + 36, fenceY);
    g.closePath();
    g.fill();
    g.strokeStyle = '#8b8470';
    g.lineWidth = 1.5;
    g.stroke();
  }

  const dirtG = g.createLinearGradient(0, 90, 0, H);
  dirtG.addColorStop(0, '#b08860');
  dirtG.addColorStop(0.5, '#a07850');
  dirtG.addColorStop(1, '#8a6438');
  g.fillStyle = dirtG;
  g.fillRect(0, 90, W, H - 90);

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    const isPoolRow = realRow >= 2 && realRow < 4;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;

      if (isPoolRow) {
        const waterG = g.createLinearGradient(x, y, x, y + CELL_H);
        waterG.addColorStop(0, c % 2 === 0 ? '#3a8ec8' : '#3288c0');
        waterG.addColorStop(0.5, c % 2 === 0 ? '#4aa8e0' : '#42a0d8');
        waterG.addColorStop(1, c % 2 === 0 ? '#2e78b0' : '#2a70a8');
        g.fillStyle = waterG;
        g.fillRect(x, y, CELL_W, CELL_H);
        g.strokeStyle = 'rgba(255,255,255,0.25)';
        g.lineWidth = 1.5;
        for (let w = 0; w < 3; w++) {
          g.beginPath();
          const wy = y + 20 + w * 30;
          g.moveTo(x + 5, wy);
          g.bezierCurveTo(x + 20, wy - 4, x + 35, wy + 4, x + 50, wy);
          g.bezierCurveTo(x + 60, wy - 3, x + 70, wy + 3, x + CELL_W - 5, wy);
          g.stroke();
        }
      } else {
        const light = (realRow + c) % 2 === 0;
        const baseG = g.createLinearGradient(x, y, x, y + CELL_H);
        baseG.addColorStop(0, light ? '#6ed636' : '#5cc42e');
        baseG.addColorStop(1, light ? '#5cb82a' : '#4ea826');
        g.fillStyle = baseG;
        g.fillRect(x, y, CELL_W, CELL_H);
      }
    }
  }

  // Бортики бассейна
  const poolTopY = GRID_Y + 2 * CELL_H;
  const poolBottomY = GRID_Y + 4 * CELL_H;
  g.fillStyle = '#e8d8b8';
  g.fillRect(GRID_X, poolTopY - 8, GRID_W, 12);
  g.fillRect(GRID_X, poolBottomY - 4, GRID_W, 12);
  g.strokeStyle = '#5d4037';
  g.lineWidth = 2;
  g.strokeRect(GRID_X, poolTopY - 8, GRID_W, 12);
  g.strokeRect(GRID_X, poolBottomY - 4, GRID_W, 12);

  // Дорога справа
  const roadX = YARD_RIGHT;
  const roadTop = aTop - 25;
  const roadBottom = aBottom + 25;
  g.fillStyle = '#8a8a8a';
  g.fillRect(roadX, roadTop, ROAD_W, roadBottom - roadTop);

  const tileSize = 80;
  for (let ty = 0; ty < Math.ceil((roadBottom - roadTop) / tileSize); ty++) {
    for (let tx = 0; tx < Math.ceil(ROAD_W / tileSize); tx++) {
      const tileX = roadX + tx * tileSize;
      const tileY = roadTop + ty * tileSize;
      const tileW = Math.min(tileSize, roadX + ROAD_W - tileX);
      const tileH = Math.min(tileSize, roadBottom - tileY);
      g.fillStyle = (tx + ty) % 2 === 0 ? '#b8b8b8' : '#a8a8a8';
      g.fillRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
      g.strokeStyle = '#5a5a5a';
      g.lineWidth = 3;
      g.strokeRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
    }
  }

  // Дом
  const houseW = GRID_X - 45;
  const houseTop = 100;
  const houseBottom = H - 60;
  g.fillStyle = '#f5e8d0';
  g.fillRect(0, houseTop, houseW, houseBottom - houseTop);
  g.fillStyle = '#e8453c';
  g.beginPath();
  g.moveTo(-10, houseTop + 10);
  g.lineTo(houseW * 0.5, 20);
  g.lineTo(houseW + 10, houseTop + 10);
  g.closePath();
  g.fill();

  return oc;
}

function ensureBackgrounds() {
  const key = S.location + '_' + ROWS + '_' + ROW_START;
  if (bgCacheKey === key) return;
  bgCacheKey = key;
  if (S.location === 'roof') {
    bgCacheRoof = buildRoofBackground(ROWS, ROW_START);
  } else if (S.location === 'night') {
    bgCacheYardNight = buildYardBackground(true, ROWS, ROW_START);
  } else if (S.location === 'pool') {
    bgCachePool = buildPoolBackground(ROWS, ROW_START);
  } else {
    bgCacheYard = buildYardBackground(false, ROWS, ROW_START);
  }
}

let bushesCache = null;
let bushesCacheKey = '';

function buildBushes(isNight, rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W;
  oc.height = H;
  const g = oc.getContext('2d');

  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const roadEndX = ROAD_RIGHT;
  const blobs = [];

  for (let i = 0; i < 130; i++) {
    blobs.push({
      x: roadEndX + 15 + Math.random() * 100,
      y: aTop - 30 + Math.random() * (rows * CELL_H + 60),
      r: 20 + Math.random() * 22,
      light: Math.random() > 0.5,
      depth: Math.random()
    });
  }

  for (let i = 0; i < 60; i++) {
    blobs.push({
      x: GRID_X - 60 + Math.random() * (GRID_W + 300),
      y: aBottom + 60 + Math.random() * 40,
      r: 14 + Math.random() * 20,
      light: Math.random() > 0.5,
      depth: Math.random()
    });
  }

  blobs.sort((a, b) => a.y - b.y);

  for (const b of blobs) {
    g.fillStyle = isNight ? 'rgba(0,0,0,0.4)' : 'rgba(0,30,0,0.3)';
    g.beginPath();
    g.arc(b.x + 1, b.y + 2, b.r * 0.9, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = isNight
      ? (b.depth > 0.5 ? '#0a2a0a' : '#0d300d')
      : (b.depth > 0.5 ? '#1b5e20' : '#1a5018');
    g.beginPath();
    g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = isNight
      ? (b.light ? '#2a5a2a' : '#1d4a1d')
      : (b.light ? '#43a047' : '#2e7d32');
    g.beginPath();
    g.arc(b.x - b.r * 0.15, b.y - b.r * 0.2, b.r * 0.75, 0, Math.PI * 2);
    g.fill();
  }

  return oc;
}

function ensureBushes() {
  const key = S.location + '_' + ROWS + '_' + ROW_START;
  if (bushesCacheKey === key) return;
  bushesCacheKey = key;
  if (S.location === 'roof') {
    bushesCache = null;
    return;
  }
  bushesCache = buildBushes(S.location === 'night', ROWS, ROW_START);
}

      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life, maxLife: life, color,
      size: rand(size * 0.5, size * 1.5), gravity: 0.12,
    });
  }
}

function isPlantAwake(plantType) {
  const p = ALL_PLANTS[plantType];
  if (!p) return true;
  if (p.sleep === 'both') return true;
  if (S.location === 'roof') return true;
  return p.sleep === S.dayNight;
}

// ==================== СОХРАНЕНИЕ ====================
const SAVE_KEY = 'pvz_save_v10';

let saveToastTimer = null;
function showSaveToast(msg) {
  const el = document.getElementById('saveToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function saveProgress(silent = false) {
  try {
    const data = {
      version: 10,
      unlocked: S.unlockedLevels,
      stars: S.levelStars,
      totalKills: S.totalKillsEver,
      totalWins: S.totalWinsEver,
      achievements: S.achievements,
      minigameBest: S.minigameBest,
      savedAt: new Date().toISOString(),
    };
    const json = JSON.stringify(data);
    localStorage.setItem(SAVE_KEY, json);
    try { localStorage.setItem('pvz_backup', json); } catch(e) {}
    try { sessionStorage.setItem(SAVE_KEY, json); } catch(e) {}
    console.log('💾 Сохранено:', data);
    if (!silent) showSaveToast('💾 Прогресс сохранён');
    return true;
  } catch(e) {
    console.warn('Ошибка сохранения:', e);
    return false;
  }
}

function loadProgress() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) raw = localStorage.getItem('pvz_backup');
    if (!raw) {
      try { raw = sessionStorage.getItem(SAVE_KEY); } catch(e) {}
    }
    if (!raw) {
      console.log('📂 Прогресс не найден — новая игра');
      return;
    }
    const d = JSON.parse(raw);
    if (typeof d.unlocked === 'number' && d.unlocked > 0) S.unlockedLevels = d.unlocked;
    if (d.stars && typeof d.stars === 'object') S.levelStars = d.stars;
    if (typeof d.totalKills === 'number') S.totalKillsEver = d.totalKills;
    if (typeof d.totalWins === 'number') S.totalWinsEver = d.totalWins;
    if (d.achievements) S.achievements = d.achievements;
    if (d.minigameBest) S.minigameBest = d.minigameBest;
    console.log('📂 Прогресс загружен:', d);
    showSaveToast('📂 Загружено: ' + S.unlockedLevels + ' ур.');
  } catch(e) {
    console.warn('Ошибка загрузки:', e);
  }
}

function resetProgress() {
  if (!confirm('Точно сбросить ВЕСЬ прогресс? Это действие нельзя отменить.')) return;
  try {
    const keys = ['pvz_save_v10', 'pvz_backup', 'pvz_save_v9', 'pvz_save_v8', 'pvz_save_v7'];
    for (const k of keys) {
      try { localStorage.removeItem(k); } catch(e) {}
      try { sessionStorage.removeItem(k); } catch(e) {}
    }
  } catch(e) {}
  S.unlockedLevels = 1;
  S.levelStars = {};
  S.totalKillsEver = 0;
  S.totalWinsEver = 0;
  S.achievements = {};
  S.minigameBest = {};
  showSaveToast('🗑 Прогресс сброшен');
}

setInterval(() => {
  if (S.scene === 'playing' && !S.gameOver) saveProgress(true);
}, 15000);

window.addEventListener('beforeunload', () => {
  if (S.scene === 'playing' && !S.gameOver) saveProgress(true);
});

// ==================== ДОСТИЖЕНИЯ ====================
function unlockAchievement(id) {
  if (S.achievements[id]) return false;
  if (!ACHIEVEMENTS[id]) return false;
  S.achievements[id] = true;
  const a = ACHIEVEMENTS[id];
  S.achievementQueue.push({ id, ...a, time: S.time });
  console.log('🏆 Достижение разблокировано:', a.name);
  saveProgress(true);
  return true;
}

function checkAchievements() {
  if (S.killedZombies > 0) unlockAchievement('first_blood');
  if (S.killedZombies >= 100) unlockAchievement('veteran');
  if (S.sun >= 1000) unlockAchievement('sunflower_farm');
  if (S.unlockedLevels >= 10) unlockAchievement('collector');
  if (S.garlicPushes >= 5) unlockAchievement('garlic_master');

  if (S.gameOver && S.won) {
    const mowersUsed = S.mowers.filter(m => m.used).length;
    if (mowersUsed === 0) unlockAchievement('no_mowers');
    if (S.location === 'night') unlockAchievement('night_owl');
    if (S.location === 'roof') unlockAchievement('roof_walker');
    if (S.location === 'pool') unlockAchievement('pool_party');
    if (S.currentLevel.boss) unlockAchievement('boss_slayer');
    const stars = S.levelStars[S.currentLevel.id] || 0;
    if (stars === 3) unlockAchievement('perfectionist');
    if (S.levelStartTime && S.time - S.levelStartTime < 60000) unlockAchievement('speedrun');
    if (S.unlockedLevels >= 2) unlockAchievement('first_win');
    // 😎 ПОФИГИЗМ
    if (S.plantedThisLevel === 0) unlockAchievement('chill_master');
  }
  if (S.minigameType && S.gameOver && S.won) unlockAchievement('minigame_win');
  if (S.minigameType === 'endless' && S.currentWave >= 10) unlockAchievement('endless_10');
}

function drawAchievementToasts() {
  if (S.achievementQueue.length === 0) return;
  const a = S.achievementQueue[0];
  const elapsed = S.time - a.time;
  if (elapsed > 4200) {
    S.achievementQueue.shift();
    return;
  }
  const slideIn = Math.min(1, elapsed / 400);
  const slideOut = Math.max(0, (elapsed - 3600) / 600);
  const y = -120 + slideIn * 130 - slideOut * 130;

  const boxW = 460, boxH = 100;
  const boxX = W / 2 - boxW / 2;
  const boxY = y;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.roundRect(boxX + 6, boxY + 6, boxW, boxH, 14);
  ctx.fill();

  const g = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
  g.addColorStop(0, '#ffd54f');
  g.addColorStop(0.5, '#ffb300');
  g.addColorStop(1, '#e65100');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(boxX, boxY, boxW, boxH, 14);
  ctx.fill();
  ctx.strokeStyle = '#4a2000';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.roundRect(boxX + 6, boxY + 6, boxW - 12, 30, 10);
  ctx.fill();

  ctx.font = 'bold 50px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(a.icon || '🏆', boxX + 60, boxY + boxH / 2);

  ctx.textAlign = 'left';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#5d4037';
  ctx.fillText('🏆 ДОСТИЖЕНИЕ РАЗБЛОКИРОВАНО', boxX + 110, boxY + 25);

  ctx.font = 'bold 22px Impact, Arial Black, sans-serif';
  ctx.fillStyle = '#3e2723';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeText(a.name, boxX + 110, boxY + 52);
  ctx.fillText(a.name, boxX + 110, boxY + 52);

  ctx.font = 'italic 13px Arial';
  ctx.fillStyle = '#5d4037';
  ctx.fillText(a.desc, boxX + 110, boxY + 78);
  ctx.restore();
}

function startMinigame(mg) {
  S.minigameType = mg.id;
  S.minigameData = {};
  S.minigameTime = 0;
  S.minigameScore = 0;

  const lvl = {
    id: -1,
    name: 'MG',
    location: mg.config.beghouled ? 'pool' : 'yard',
    rows: 5,
    rowsOffset: 0,
    time: 'day',
    seeds: mg.config.seeds || ['peashooter','sunflower','wallnut','snowpea','cherry'],
    totalZombies: mg.config.endless ? 9999 : 30,
    spawnInterval: mg.config.spawnRate || 5000,
    types: ['basic','cone','bucket','flag','football','dancer'],
    waves: mg.config.endless ? 999 : 5,
    desc: mg.name,
    minigame: mg,
  };

  startLevel(lvl);
  S.minigameType = mg.id;
  S.minigameData = { config: mg.config };
  S.scene = 'playing';
}

function startLevelWithSeedSelect(level) {
  const seedList = level.seeds;
  if (seedList.length <= 6) {
    startLevel(level);
    return;
  }
  S.currentLevel = level;
  S.seedSelectMode = true;
  S.seedSelectAvailable = [...seedList];
  S.seedSelectChosen = seedList.slice(0, 6);
  S.scene = 'seedselect';
}

function drawSeedSelect() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);

  bg.addColorStop(0.5, '#1a0f25');
  bg.addColorStop(1, '#0a0510');

  const slotSize = 90;
  const slotGap = 12;
  const slotRowW = S.seedSelectMaxSlots * slotSize + (S.seedSelectMaxSlots - 1) * slotGap;
  const slotRowX = (W - slotRowW) / 2;
  const slotRowY = 150;

  ctx.fillStyle = 'rgba(80,50,20,0.7)';

  ctx.lineWidth = 4;
  ctx.stroke();

  for (let i = 0; i < S.seedSelectMaxSlots; i++) {
    const sx = slotRowX + i * (slotSize + slotGap);
    const sy = slotRowY;
    const chosen = S.seedSelectChosen[i];

    if (chosen) {
      const def = ALL_PLANTS[chosen];
      const paperG = ctx.createLinearGradient(sx, sy, sx, sy + slotSize);
      paperG.addColorStop(0, '#f0e2c0');
      paperG.addColorStop(0.5, '#e0d0a8');
      paperG.addColorStop(1, '#c8b890');
      ctx.fillStyle = paperG;
      ctx.fillRect(sx, sy, slotSize, slotSize);
      ctx.strokeStyle = '#8b5a2b';
      ctx.lineWidth = 3;
      ctx.strokeRect(sx, sy, slotSize, slotSize);

      ctx.save();
      ctx.translate(sx + slotSize / 2, sy + slotSize / 2 - 8);
      ctx.scale(0.85, 0.85);
      drawPlant(chosen, 0, 0, S.time, 1, chosen === 'potato' ? { armed: true } : null);
      ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(sx + 2, sy + slotSize - 22, slotSize - 4, 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.cost, sx + slotSize / 2, sy + slotSize - 12);

      if (S.cursorX >= sx && S.cursorX <= sx + slotSize && S.cursorY >= sy && S.cursorY <= sy + slotSize) {
        ctx.strokeStyle = '#f44336';
        ctx.lineWidth = 4;
        ctx.strokeRect(sx - 2, sy - 2, slotSize + 4, slotSize + 4);
      }
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(sx, sy, slotSize, slotSize);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.strokeRect(sx + 2, sy + 2, slotSize - 4, slotSize - 4);
      ctx.setLineDash([]);
      ctx.fillStyle = '#555';
      ctx.font = 'bold 40px Arial';
      ctx.fillText('+', sx + slotSize / 2, sy + slotSize / 2);
    }
  }

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Доступные растения', W / 2, 300);

  const availSize = 70;
  const availGap = 10;
  const perRow = 12;
  const available = S.seedSelectAvailable;
  const availRowW = Math.min(perRow, available.length) * availSize + (Math.min(perRow, available.length) - 1) * availGap;
  const availRowX = (W - availRowW) / 2;
  const availRowY = 330;

  S.seedSelectCardRects = [];

  for (let i = 0; i < available.length; i++) {
    const seedId = available[i];
    const def = ALL_PLANTS[seedId];
    const col = i % perRow;
    const row = Math.floor(i / perRow);
    const ax = availRowX + col * (availSize + availGap);
    const ay = availRowY + row * (availSize + availGap);

    const isChosen = S.seedSelectChosen.includes(seedId);
    const hover = S.cursorX >= ax && S.cursorX <= ax + availSize && S.cursorY >= ay && S.cursorY <= ay + availSize;

    const bgG = ctx.createLinearGradient(ax, ay, ax, ay + availSize);
    if (isChosen) {
      bgG.addColorStop(0, '#ffe082');
      bgG.addColorStop(1, '#ffb300');
    } else {
      bgG.addColorStop(0, '#f0e2c0');
      bgG.addColorStop(1, '#c8b890');
    }
    ctx.fillStyle = bgG;
    ctx.beginPath();
    ctx.roundRect(ax, ay, availSize, availSize, 8);
    ctx.fill();
    ctx.strokeStyle = isChosen ? '#4caf50' : '#8b5a2b';
    ctx.lineWidth = isChosen ? 4 : 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(ax + availSize / 2, ay + availSize / 2 - 6);
    ctx.scale(0.65, 0.65);
    drawPlant(seedId, 0, 0, S.time, 1, seedId === 'potato' ? { armed: true } : null);
    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(ax + 2, ay + availSize - 18, availSize - 4, 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.cost, ax + availSize / 2, ay + availSize - 10);

    if (isChosen) {
      ctx.fillStyle = '#4caf50';
      ctx.beginPath();
      ctx.arc(ax + availSize - 12, ay + 12, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(ax + availSize - 17, ay + 12);
      ctx.lineTo(ax + availSize - 14, ay + 16);
      ctx.lineTo(ax + availSize - 7, ay + 8);
      ctx.stroke();
    }

    if (hover) {
      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(ax - 2, ay - 2, availSize + 4, availSize + 4, 10);
      ctx.stroke();
    }

    S.seedSelectCardRects.push({ seedId, x: ax, y: ay, w: availSize, h: availSize });
  }

  const backW = 180, backH = 60;
  const backX = 40;
  const backY = H - 90;
  const backHover = S.cursorX >= backX && S.cursorX <= backX + backW && S.cursorY >= backY && S.cursorY <= backY + backH;
  const backG = ctx.createLinearGradient(0, backY, 0, backY + backH);
  if (backHover) { backG.addColorStop(0, '#ff8a65'); backG.addColorStop(1, '#d84315'); }
  else { backG.addColorStop(0, '#ff7043'); backG.addColorStop(1, '#bf360c'); }
  ctx.fillStyle = backG;
  ctx.beginPath();
  ctx.roundRect(backX, backY, backW, backH, 12);
  ctx.fill();
  ctx.strokeStyle = '#3e1a00';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#3e1a00';
  ctx.lineWidth = 4;
  ctx.strokeText('← НАЗАД', backX + backW / 2, backY + backH / 2);
  ctx.fillText('← НАЗАД', backX + backW / 2, backY + backH / 2);
  S.seedSelectBackBtn = { x: backX, y: backY, w: backW, h: backH };

  const startW = 320, startH = 80;
  const startX = W - startW - 40;
  const startY = H - 100;
  const canStart = S.seedSelectChosen.length > 0;
  const startHover = canStart && S.cursorX >= startX && S.cursorX <= startX + startW && S.cursorY >= startY && S.cursorY <= startY + startH;
  const startG = ctx.createLinearGradient(0, startY, 0, startY + startH);
  if (!canStart) {
    startG.addColorStop(0, '#666');
    startG.addColorStop(1, '#333');
  } else if (startHover) {
    startG.addColorStop(0, '#a4d65e');
    startG.addColorStop(1, '#4e7d1a');
  } else {
    startG.addColorStop(0, '#8bc34a');
    startG.addColorStop(1, '#33691e');
  }
  ctx.fillStyle = startG;
  ctx.beginPath();
  ctx.roundRect(startX, startY, startW, startH, 16);
  ctx.fill();
  ctx.strokeStyle = '#1e3a08';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.fillStyle = canStart ? '#fff' : '#aaa';
  ctx.font = 'bold 36px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#1e3a08';
  ctx.lineWidth = 5;
  ctx.strokeText('В БОЙ!', startX + startW / 2, startY + startH / 2);
  ctx.fillText('В БОЙ!', startX + startW / 2, startY + startH / 2);
  S.seedSelectStartBtn = { x: startX, y: startY, w: startW, h: startH, enabled: canStart };

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Выбрано: ' + S.seedSelectChosen.length + ' / ' + S.seedSelectMaxSlots, W / 2, H - 40);
}

// ==================== ИГРОВАЯ СЦЕНА ====================
function drawGameScene() {
  ensureBackgrounds();
  if (S.location === 'roof') {
    if (bgCacheRoof) ctx.drawImage(bgCacheRoof, 0, 0);
  } else if (S.location === 'night') {
    if (bgCacheYardNight) ctx.drawImage(bgCacheYardNight, 0, 0);
  } else if (S.location === 'pool') {
    if (bgCachePool) ctx.drawImage(bgCachePool, 0, 0);
  } else {
    if (bgCacheYard) ctx.drawImage(bgCacheYard, 0, 0);
  }

  if (S.location === 'roof') drawPots();

  for (let r = 0; r < ROWS; r++) {
    const m = S.mowers[r];
    if (!m || (m.used && !m.active)) continue;
    drawMower(m.x, cellCY(r) + 20);
  }

  if ((S.selectedSeed || S.shovelSelected) && S.cursorX >= GRID_X && S.cursorX <= GRID_X + GRID_W
      && S.cursorY >= activeTop() && S.cursorY <= activeBottom()) {
    const c = Math.floor((S.cursorX - GRID_X) / CELL_W);
    const r = Math.floor((S.cursorY - activeTop()) / CELL_H);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
      const cellX = GRID_X + c * CELL_W;
      const cellY = activeTop() + r * CELL_H;
      const occupied = S.plants.find(p => p.row === r && p.col === c);
      const awake = S.selectedSeed ? isPlantAwake(S.selectedSeed) : true;
      if (S.shovelSelected) ctx.fillStyle = 'rgba(244,67,54,0.3)';
      else if (occupied) ctx.fillStyle = 'rgba(244,67,54,0.3)';
      else if (!awake) ctx.fillStyle = 'rgba(100,100,150,0.35)';
      else ctx.fillStyle = 'rgba(255,235,59,0.3)';
      ctx.fillRect(cellX, cellY, CELL_W, CELL_H);
      ctx.strokeStyle = S.shovelSelected ? '#f44336' : awake ? '#ffeb3b' : '#6666aa';
      ctx.lineWidth = 3;
      ctx.strokeRect(cellX + 1, cellY + 1, CELL_W - 2, CELL_H - 2);
      if (S.selectedSeed && !occupied && !S.shovelSelected) {
        ctx.globalAlpha = awake ? 0.5 : 0.3;
        ctx.save();
        ctx.translate(cellX + CELL_W / 2, cellY + CELL_H / 2);
        drawPlant(S.selectedSeed, 0, 0, S.time, 1, null);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }
  }

  const sortedPlants = [...S.plants].sort((a, b) => a.row - b.row);
  for (const p of sortedPlants) {
    drawPlant(p.type, cellCX(p.col), cellCY(p.row), S.time, 1, p);
    if (p.hp < p.maxHp && p.type !== 'cherry' && p.type !== 'potato' && p.type !== 'jalapeno' && p.type !== 'doomshroom' && p.type !== 'iceshroom') {
      const bw = 50;
      const pct = p.hp / p.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(cellCX(p.col) - bw / 2, cellCY(p.row) - 46, bw, 6);
      ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ff9800' : '#f44336';
      ctx.fillRect(cellCX(p.col) - bw / 2 + 1, cellCY(p.row) - 45, (bw - 2) * pct, 4);
    }
  }

  for (const p of S.projectiles) drawProjectile(p);
  for (const s of S.suns) drawSun(s);

  const sortedZ = [...S.zombies].sort((a, b) => a.row - b.row);
  for (const z of sortedZ) if (z.x < YARD_RIGHT) drawZombie(z, S.time);
  if (S.location !== 'roof') {
    ensureBushes();
    if (bushesCache) ctx.drawImage(bushesCache, 0, 0);
  }
  for (const z of sortedZ) if (z.x >= YARD_RIGHT) drawZombie(z, S.time);

  drawParticles();
  drawTopBar();
  drawBottomBar();
}

function drawPots() {
  if (S.location !== 'roof') return;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (S.plants.find(p => p.row === r && p.col === c)) continue;
      drawPot(cellCX(c), cellCY(r));
    }
  }
}

function drawPot(x, y) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 34, 26, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  const g = ctx.createLinearGradient(x - 22, y, x + 22, y);
  g.addColorStop(0, '#7a3a10');
  g.addColorStop(0.4, '#c8804a');
  g.addColorStop(0.6, '#d8905a');
  g.addColorStop(1, '#7a3a10');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - 24, y - 12);
  ctx.lineTo(x - 18, y + 30);
  ctx.lineTo(x + 18, y + 30);
  ctx.lineTo(x + 24, y - 12);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4a2408';
  ctx.lineWidth = 2;
  ctx.stroke();
  const tg = ctx.createLinearGradient(x - 25, 0, x + 25, 0);
  tg.addColorStop(0, '#8a4a20');
  tg.addColorStop(0.5, '#d08050');
  tg.addColorStop(1, '#8a4a20');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.ellipse(x, y - 12, 25, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  const eg = ctx.createRadialGradient(x - 4, y - 12, 2, x, y - 12, 18);
  eg.addColorStop(0, '#4a2a18');
  eg.addColorStop(1, '#1a0808');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.ellipse(x, y - 12, 20, 5, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ==================== РАСТЕНИЯ ====================
function drawPlant(type, x, y, t = 0, scale = 1, plant = null) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  const bob = Math.sin((t || 0) * 0.003 + x * 0.1) * 2;
  const awake = isPlantAwake(type);

  if (!awake) ctx.globalAlpha = 0.55;

  if (S.location !== 'roof') {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 32, 28, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  if (type === 'sunflower') drawSunflower(bob);
  else if (type === 'peashooter') drawPeashooter(bob, false, 1);
  else if (type === 'snowpea') drawPeashooter(bob, true, 1);
  else if (type === 'repeater') drawPeashooter(bob, false, 2);
  else if (type === 'threepeater') drawThreepeater(bob);
  else if (type === 'wallnut') drawWallnut(plant);
  else if (type === 'cherry') drawCherry(bob);
  else if (type === 'potato') drawPotato(plant);
  else if (type === 'chomper') drawChomper(bob, plant);
  else if (type === 'jalapeno') drawJalapeno(bob);
  else if (type === 'torchwood') drawTorchwood(bob);
  else if (type === 'garlic') drawGarlic(bob, plant);
  else if (type === 'puffshroom') drawPuffshroom(bob);
  else if (type === 'sunshroom') drawSunshroom(bob);
  else if (type === 'fumeshroom') drawFumeshroom(bob);
  else if (type === 'doomshroom') drawDoomshroom(bob);
  else if (type === 'iceshroom') drawIceshroom(bob);
  else if (type === 'hypnoshroom') drawHypnoshroom(bob);
  else if (type === 'scaredy') drawScaredy(bob);
  else if (type === 'cabbage') drawCabbage(bob);
  else if (type === 'kernelpult') drawKernelpult(bob);
  else if (type === 'coffee') drawCoffee(bob);
  else if (type === 'lilypad') drawLilypad(bob);
  else if (type === 'tanglekelp') drawTanglekelp(bob, plant);

  if (!awake) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.beginPath();
    ctx.roundRect(-22, -50, 44, 18, 6);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💤', 0, -41);
  }
  ctx.restore();
}

function drawStem(color = '#3d8b1f', leafColor = '#66bb6a') {
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 30);
  ctx.lineTo(0, -5);
  ctx.stroke();
  ctx.fillStyle = leafColor;
  ctx.beginPath();
  ctx.ellipse(-16, 12, 16, 8, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(16, 12, 16, 8, 0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawSunflower(bob) {
  drawStem();
  const cy = -16 + bob;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const px = Math.cos(a) * 26;
    const py = Math.sin(a) * 26 + cy;
    ctx.fillStyle = i % 2 ? '#ffeb3b' : '#ffca28';
    ctx.beginPath();
    ctx.ellipse(px, py, 9, 5, a, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#e6a100';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  const g = ctx.createRadialGradient(-3, cy - 4, 2, 0, cy, 18);
  g.addColorStop(0, '#a1724a');
  g.addColorStop(0.5, '#6a3a1a');
  g.addColorStop(1, '#2d1b0a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, cy, 17, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, cy - 3, 4.5, 0, Math.PI * 2);
  ctx.arc(6, cy - 3, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, cy - 3, 2.2, 0, Math.PI * 2);
  ctx.arc(6, cy - 3, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, cy + 4, 5, 0.3, Math.PI - 0.3);
  ctx.stroke();
}

function drawPeashooter(bob, ice, heads) {
  drawStem();
  const cy = -16 + bob;
  if (heads === 2) {
    const g2 = ctx.createRadialGradient(-14, cy - 18, 3, -10, cy - 18, 17);
    g2.addColorStop(0, '#c5e88a');
    g2.addColorStop(1, '#33691e');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(-10, cy - 18, 16, 0, Math.PI * 2);
    ctx.fill();
  }
  const g = ctx.createRadialGradient(-5, cy - 5, 3, 0, cy, 22);
  if (ice) {
    g.addColorStop(0, '#e1f5fe');
    g.addColorStop(0.4, '#81d4fa');
    g.addColorStop(0.7, '#4fc3f7');
    g.addColorStop(1, '#01579b');
  } else {
    g.addColorStop(0, '#e8f5c8');
    g.addColorStop(0.4, '#c5e88a');
    g.addColorStop(0.7, '#8bc34a');
    g.addColorStop(1, '#33691e');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, cy, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = ice ? '#01579b' : '#1b5e20';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = ice ? '#29b6f6' : '#558b2f';
  ctx.beginPath();
  ctx.ellipse(22, cy, 10, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = ice ? '#01579b' : '#1b5e20';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#0a1f05';
  ctx.beginPath();
  ctx.ellipse(24, cy, 6, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(3, cy - 5, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(5, cy - 5, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawThreepeater(bob) {
  drawStem();
  const cy = -16 + bob;
  const heads = [
    { x: -4, y: cy - 14, r: 15 },
    { x: 0, y: cy, r: 20 },
    { x: -4, y: cy + 14, r: 15 },
  ];
  for (const h of heads) {
    const g = ctx.createRadialGradient(h.x - 3, h.y - 3, 2, h.x, h.y, h.r);
    g.addColorStop(0, '#e8f5c8');
    g.addColorStop(0.5, '#8bc34a');
    g.addColorStop(1, '#33691e');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(h.x + 3, h.y - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(h.x + 4, h.y - 3, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7cb342';
    ctx.beginPath();
    ctx.ellipse(h.x + h.r - 2, h.y, 8, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWallnut(plant) {
  const dmg = plant ? (1 - plant.hp / plant.maxHp) : 0;
  const g = ctx.createRadialGradient(-6, -10, 5, 0, 0, 32);
  g.addColorStop(0, '#e8c898');
  g.addColorStop(0.5, '#c8a068');
  g.addColorStop(1, '#7a5a30');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, 26, 32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4e342e';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-9, -6, 7, 0, Math.PI * 2);
  ctx.arc(9, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-8, -5, 3.5, 0, Math.PI * 2);
  ctx.arc(10, -5, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (dmg < 0.4) ctx.arc(0, 8, 8, 0.1, Math.PI - 0.1);
  else if (dmg < 0.7) { ctx.moveTo(-7, 10); ctx.lineTo(7, 10); }
  else ctx.arc(0, 16, 7, Math.PI + 0.2, -0.2);
  ctx.stroke();
}

function drawCherry(bob) {
  const cy = -8 + bob;
  ctx.strokeStyle = '#4e342e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-10, cy - 15); ctx.quadraticCurveTo(0, cy - 30, 12, cy - 14);
  ctx.stroke();
  drawCherryBall(-10, cy, 17);
  drawCherryBall(12, cy + 2, 17);
}
function drawCherryBall(x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
  g.addColorStop(0, '#ff8a80');
  g.addColorStop(0.4, '#ff5252');
  g.addColorStop(0.8, '#c62828');
  g.addColorStop(1, '#7f0000');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4a0000';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - 5, y, 4, 0, Math.PI * 2);
  ctx.arc(x + 5, y, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x - 5, y, 2, 0, Math.PI * 2);
  ctx.arc(x + 5, y, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawPotato(plant) {
  const armed = plant && plant.armed;
  ctx.fillStyle = '#6d4c21';
  ctx.beginPath();
  ctx.ellipse(0, 22, 26, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  if (armed) {
    const g = ctx.createRadialGradient(-4, -6, 3, 0, 0, 22);
    g.addColorStop(0, '#d9b57a');
    g.addColorStop(1, '#8b6914');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 2, 20, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-6, 0, 4, 0, Math.PI * 2);
    ctx.arc(6, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    const pulse = 0.5 + Math.sin(S.time / 150) * 0.5;
    ctx.fillStyle = `rgba(255,0,0,${0.6 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.arc(0, -22, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawChomper(bob, plant) {
  drawStem();
  const cy = -18 + bob;
  const g = ctx.createRadialGradient(-4, -6, 3, 0, 0, 24);
  g.addColorStop(0, '#c5e88a');
  g.addColorStop(1, '#33691e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, cy, 22, 26, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3e2723';
  ctx.beginPath();
  ctx.ellipse(0, cy + 6, 14, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();

// ==================== ЗОМБИ ====================
function drawZombie(z, t) {
  const x = z.x;
  const y = cellCY(z.row);
  const dying = z.hp <= 0;
  const alpha = dying ? clamp(1 - z.dyingTimer / 800, 0, 1) : 1;
  const isBoss = z.type === 'zomboss';

  let bushAlpha = 1;
  if (z.x > ROAD_RIGHT - 20 && S.location !== 'roof') {
    const t2 = clamp((z.x - (ROAD_RIGHT - 20)) / 80, 0, 1);
    bushAlpha = 1 - t2 * 0.85;
  }

  ctx.save();
  ctx.globalAlpha = alpha * bushAlpha;
  ctx.translate(x, y);
  if (dying) ctx.rotate((1 - alpha) * 0.7);
  if (isBoss) ctx.scale(2.4, 2.4);

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 34, 24, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  const bob = dying ? 0 : Math.sin(t * 0.008 + z.walkPhase) * 3;
  const lean = dying ? 0 : Math.sin(t * 0.008 + z.walkPhase) * 0.08;
  ctx.translate(0, bob);
  ctx.rotate(lean);

  if (z.slowTimer > 0 && !dying) {
    const g = ctx.createRadialGradient(0, -10, 5, 0, -10, 50);
    g.addColorStop(0, 'rgba(79,195,247,0.4)');
    g.addColorStop(1, 'rgba(79,195,247,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -10, 50, 0, Math.PI * 2);
    ctx.fill();
  }

  if (z.hypnotized && !dying) {
    const g = ctx.createRadialGradient(0, -10, 5, 0, -10, 50);
    g.addColorStop(0, 'rgba(224,64,160,0.5)');
    g.addColorStop(1, 'rgba(224,64,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -10, 50, 0, Math.PI * 2);
    ctx.fill();
  }

  if (z.hitFlash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,255,255,${z.hitFlash / 200 * 0.6})`;
    ctx.beginPath();
    ctx.arc(0, -10, 38, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.fillStyle = z.type === 'football' ? '#333' : '#3a3a3a';
  ctx.beginPath();
  ctx.ellipse(-8, 26, 8, 12, 0, 0, Math.PI * 2);
  ctx.ellipse(8, 26, 8, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(-10, 36, 9, 5, 0, 0, Math.PI * 2);
  ctx.ellipse(10, 36, 9, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  let bodyColor = '#8b3a3a';
  if (z.type === 'flag') bodyColor = '#8b2f2f';
  if (z.type === 'football') bodyColor = '#b71c1c';
  if (z.type === 'dancer') bodyColor = '#4a148c';
  if (z.type === 'balloon') bodyColor = '#e91e63';
  if (z.type === 'zomboss') bodyColor = '#1a2a1a';
  if (z.hypnotized) bodyColor = '#c040a0';

  const bodyG = ctx.createRadialGradient(-6, -6, 3, 0, 2, 28);
  bodyG.addColorStop(0, 'rgba(255,255,255,0.25)');
  bodyG.addColorStop(0.5, bodyColor);
  bodyG.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.ellipse(0, 2, 22, 26, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#a5d66a';
  ctx.save();
  ctx.translate(-18, -4);
  ctx.rotate(-0.3);
  ctx.beginPath();
  ctx.roundRect(-6, -6, 34, 12, 6);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(18, -6);
  ctx.rotate(0.15);
  ctx.beginPath();
  ctx.roundRect(-6, -6, 34, 12, 6);
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(-24, -8, 7, 0, Math.PI * 2);
  ctx.arc(24, -8, 7, 0, Math.PI * 2);
  ctx.fill();

  const headG = ctx.createRadialGradient(-6, -22, 3, 0, -18, 22);
  if (isBoss) {
    headG.addColorStop(0, '#a0c070');
    headG.addColorStop(1, '#1a2a0a');
  } else if (z.hypnotized) {
    headG.addColorStop(0, '#ffd0e8');
    headG.addColorStop(1, '#6a1050');
  } else {
    headG.addColorStop(0, '#e8f5c8');
    headG.addColorStop(0.5, '#a5d66a');
    headG.addColorStop(1, '#558b2f');
  }
  ctx.fillStyle = headG;
  ctx.beginPath();
  ctx.arc(0, -18, 22, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8, -20, 5, 0, Math.PI * 2);
  ctx.arc(8, -20, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-9, -20, 2.5, 0, Math.PI * 2);
  ctx.arc(7, -20, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3e2723';
  ctx.beginPath();
  ctx.ellipse(0, -8, 9, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-5, -12, 3, 4);
  ctx.fillRect(-1, -12, 3, 4);
  ctx.fillRect(3, -12, 3, 4);

  if (z.type === 'cone') {
    ctx.fillStyle = '#ff8f00';
    ctx.beginPath();
    ctx.moveTo(-18, -34); ctx.lineTo(0, -68); ctx.lineTo(18, -34);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e65100';
    ctx.lineWidth = 2; ctx.stroke();
  }
  if (z.type === 'bucket') {
    const bg = ctx.createLinearGradient(-20, 0, 20, 0);
    bg.addColorStop(0, '#455a64');
    bg.addColorStop(0.5, '#cfd8dc');
    bg.addColorStop(1, '#455a64');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-20, -30); ctx.lineTo(-18, -62); ctx.lineTo(18, -62); ctx.lineTo(20, -30);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 2; ctx.stroke();
  }
  if (z.type === 'flag') {
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-26, -18); ctx.lineTo(-30, -70);
    ctx.stroke();
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.moveTo(-30, -70); ctx.lineTo(-2, -64); ctx.lineTo(-4, -46); ctx.lineTo(-30, -52);
    ctx.closePath(); ctx.fill();
  }
  if (z.type === 'football') {
    ctx.fillStyle = '#b71c1c';
    ctx.beginPath();
    ctx.arc(0, -22, 24, Math.PI, 0);
    ctx.fill();
  }
  if (z.type === 'dancer') {
    ctx.fillStyle = '#c62828';
    ctx.beginPath();
    ctx.arc(0, -34, 16, Math.PI, 0);
    ctx.fill();
  }
  if (z.type === 'balloon') {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -40); ctx.lineTo(0, -60);
    ctx.stroke();
    const bg = ctx.createRadialGradient(-4, -70, 3, 0, -68, 20);
    bg.addColorStop(0, '#ff80ab');
    bg.addColorStop(0.6, '#e91e63');
    bg.addColorStop(1, '#880e4f');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, -68, 18, 22, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  if (isBoss) {
    ctx.fillStyle = '#4a7a3a';
    ctx.beginPath();
    ctx.arc(0, -18, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff8a65';
    ctx.beginPath();
    ctx.arc(0, -22, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  if (!dying && z.hp < z.maxHp) {
    ctx.save();
    ctx.globalAlpha = bushAlpha;
    const bw = isBoss ? 140 : 44;
    const by = y - (isBoss ? 150 : 78);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x - bw / 2, by, bw, isBoss ? 12 : 6);
    const pct = z.hp / z.maxHp;
    ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ff9800' : '#f44336';
    ctx.fillRect(x - bw / 2 + 1, by + 1, (bw - 2) * pct, isBoss ? 10 : 4);
    if (isBoss) {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 20px Impact, Arial Black, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.strokeText('ЗОМБОС', x, by - 18);
      ctx.fillText('ЗОМБОС', x, by - 18);
    }
    ctx.restore();
  }
}

// ==================== СНАРЯДЫ ====================
function drawProjectile(p) {
  for (let i = 0; i < p.trail.length; i++) {
    const t = p.trail[i];
    const a = t.life / 200;
    ctx.globalAlpha = a * 0.5;
    let color = '#8bc34a';
    if (p.ice) color = '#4fc3f7';
    if (p.spore) color = '#a478b8';
    if (p.cabbage) color = '#a5d66a';
    if (p.kernel) color = '#ffd54f';
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(t.x - i * 3, t.y, 4 - i * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, 10);
  if (p.ice) {
    g.addColorStop(0, '#e1f5fe'); g.addColorStop(0.5, '#4fc3f7'); g.addColorStop(1, '#01579b');
  } else if (p.spore) {
    g.addColorStop(0, '#e0c8f0'); g.addColorStop(0.5, '#a478b8'); g.addColorStop(1, '#4a2a5a');
  } else {
    g.addColorStop(0, '#e8f5c8'); g.addColorStop(0.5, '#8bc34a'); g.addColorStop(1, '#33691e');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
  ctx.fill();
}

// ==================== СОЛНЦЕ ====================
function drawSun(s) {
  const pulse = 1 + Math.sin(S.time / 250 + s.phase) * 0.08;
  const r = 28 * pulse;
  const g = ctx.createRadialGradient(s.x, s.y, 4, s.x, s.y, r * 2);
  g.addColorStop(0, 'rgba(255,255,150,0.95)');
  g.addColorStop(0.5, 'rgba(255,213,79,0.4)');
  g.addColorStop(1, 'rgba(255,213,79,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.x, s.y, r * 2, 0, Math.PI * 2);
  ctx.fill();
  const cg = ctx.createRadialGradient(s.x - 5, s.y - 5, 3, s.x, s.y, r);
  cg.addColorStop(0, '#fffde7');
  cg.addColorStop(0.5, '#ffe082');
  cg.addColorStop(1, '#ffb300');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticles() {
  for (const p of S.particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSeedPacket(x, y, w, h, seed) {
  const isSelected = S.selectedSeed === seed.id;
  const cd = S.cooldowns[seed.id] || 0;
  const ready = cd <= 0 && S.sun >= seed.cost;
  const awake = isPlantAwake(seed.id);
  const hover = S.cursorX >= x && S.cursorX <= x + w && S.cursorY >= y && S.cursorY <= y + h;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x + 2, y + 3, w, h);

  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  if (isSelected) {
    bg.addColorStop(0, '#fff9c4');
    bg.addColorStop(1, '#ffe082');
  } else {
    bg.addColorStop(0, '#f0e2c0');
    bg.addColorStop(0.5, '#d7c9a5');
    bg.addColorStop(1, '#a8956d');
  }
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = isSelected ? '#ffeb3b' : '#3e2723';
  ctx.lineWidth = isSelected ? 3 : 2;
  ctx.strokeRect(x, y, w, h);

  ctx.save();
  ctx.translate(x + w / 2, y + h / 2 - 6);
  ctx.scale(0.62, 0.62);
  drawPlant(seed.id, 0, 0, S.time, 1, seed.id === 'potato' ? { armed: true } : null);
  ctx.restore();

  if (!awake) {
    ctx.fillStyle = 'rgba(20,20,60,0.75)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💤', x + w / 2, y + h / 2 - 6);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(x + 2, y + h - 18, w - 4, 16);
  ctx.fillStyle = ready && awake ? '#fff' : '#ff5252';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(seed.cost, x + w / 2, y + h - 9);

  if (cd > 0) {
    const cdPct = cd / seed.cd;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(x, y, w, h * cdPct);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial';
    ctx.fillText(Math.ceil(cd / 1000), x + w / 2, y + h / 2 - 6);
  } else if (S.sun < seed.cost || !awake) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, w, h);
  }

  if (hover && ready && awake && !isSelected) {
    ctx.strokeStyle = 'rgba(255,235,59,0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
  }
}

function drawShovel(x, y, w, h) {
  const isSelected = S.shovelSelected;
  ctx.fillStyle = isSelected ? '#fff9c4' : '#e8d9b0';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = isSelected ? '#ffeb3b' : '#3e2723';
  ctx.lineWidth = isSelected ? 3 : 2;
  ctx.strokeRect(x, y, w, h);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(-0.4);
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(-3, -28, 6, 40);
  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.moveTo(-3, 12); ctx.lineTo(3, 12); ctx.lineTo(3, 30);
  ctx.quadraticCurveTo(0, 38, -3, 30);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawMenuBtn(x, y, w, h) {
  const hover = S.cursorX >= x && S.cursorX <= x + w && S.cursorY >= y && S.cursorY <= y + h;

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = '#1e3a08';
  ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#1e3a08';
  ctx.lineWidth = 4;
  ctx.strokeText('MENU', x + w / 2, y + h / 2);

}

// ==================== ЛОГИКА ====================
function update(dt) {
  S.time += dt;
  const dts = dt / 1000;

  for (const k in S.cooldowns) {
    S.cooldowns[k] = Math.max(0, S.cooldowns[k] - dt);
  }

  if (S.scene === 'playing' && S.minigameType) {
    S.minigameTime += dt;
    S.minigameScore = Math.floor(S.minigameTime / 1000) + S.killedZombies * 10;
  }

  S.sunTimer += dt;
  if (S.sunTimer > 6500) {
    S.sunTimer = 0;
    const x = rand(GRID_X + 20, GRID_X + GRID_W - 20);
    const targetY = rand(activeTop() + 40, activeBottom() - 40);
    S.suns.push({
      x, y: -30, targetY,
      life: 10000, maxLife: 10000,
      vy: 1.4, phase: Math.random() * 10, value: 25
    });
  }

  for (const p of S.plants) {
    const awake = isPlantAwake(p.type);
    if (!awake) continue;

    if (p.type === 'sunflower' || p.type === 'sunshroom') {
      p.sunTimer += dt;
      const interval = p.type === 'sunshroom' ? 7000 : 5500;
      const amount = p.type === 'sunshroom' ? 15 : 25;
      if (p.sunTimer > interval) {
        p.sunTimer = 0;
        S.suns.push({
          x: cellCX(p.col) + rand(-15, 15),
          y: cellCY(p.row),
          targetY: cellCY(p.row) + 30,
          life: 10000, maxLife: 10000,
          vy: 0.8, phase: Math.random() * 10, value: amount
        });
      }
    }
    if (p.type === 'potato' && !p.armed) {
      p.armTimer = (p.armTimer || 0) + dt;
      if (p.armTimer > 15000) p.armed = true;
    }
    if (p.type === 'chomper') {
      if (p.chewing) {
        p.chewTimer -= dt;
        if (p.chewTimer <= 0) p.chewing = false;
      } else {
        p.shootTimer += dt;
        const target = S.zombies.find(z =>
          z.row === p.row && z.hp > 0 && z.x < YARD_RIGHT &&
          Math.abs(z.x - cellCX(p.col)) < 60
        );
        if (target && p.shootTimer > 3000) {
          p.shootTimer = 0;
          p.chewing = true;
          p.chewTimer = 6000;
          target.hp -= 3000;
        }
      }
    }
    if (p.type === 'peashooter' || p.type === 'snowpea' || p.type === 'repeater' || p.type === 'threepeater') {
      p.shootTimer += dt;
      const cooldown = p.type === 'snowpea' ? 1400 : 1500;
      let target = null;
      if (p.type === 'threepeater') {
        target = S.zombies.find(z =>
          Math.abs(z.row - p.row) <= 1 && z.x < ZOMBIE_ENTER_YARD_X + 5 &&
          z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized
        );
      } else {
        target = S.zombies.find(z =>
          z.row === p.row && z.x < ZOMBIE_ENTER_YARD_X + 5 &&
          z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized
        );
      }
      if (target && p.shootTimer > cooldown) {
        p.shootTimer = 0;
        if (p.type === 'threepeater') {
          for (let dr = -1; dr <= 1; dr++) {
            const row = p.row + dr;
            if (row < 0 || row >= ROWS) continue;
            S.projectiles.push({
              x: cellCX(p.col) + 22, y: cellCY(row) - 14,
              row, vx: 500, damage: 20, trail: []
            });
          }
        } else {
          const shots = p.type === 'repeater' ? 2 : 1;
          for (let i = 0; i < shots; i++) {
            S.projectiles.push({
              x: cellCX(p.col) + 22, y: cellCY(p.row) - 14,
              row: p.row, vx: 500,
              damage: p.type === 'snowpea' ? 20 : 25,
              ice: p.type === 'snowpea', trail: [],
              delay: i * 150
            });
          }
        }
      }
    }
    if (p.type === 'cabbage') {
      p.shootTimer += dt;
      const target = S.zombies.find(z =>
        z.row === p.row && z.x < ZOMBIE_ENTER_YARD_X + 5 &&
        z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized
      );
      if (target && p.shootTimer > 1500) {
        p.shootTimer = 0;
        S.projectiles.push({
          x: cellCX(p.col) + 22, y: cellCY(p.row) - 14,
          row: p.row, vx: 550, damage: 40, cabbage: true, trail: []
        });
      }
    }
    if (p.type === 'kernelpult') {
      p.shootTimer += dt;
      const target = S.zombies.find(z =>
        z.row === p.row && z.x < ZOMBIE_ENTER_YARD_X + 5 &&
        z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized
      );
      if (target && p.shootTimer > 2000) {
        p.shootTimer = 0;
        S.projectiles.push({
          x: cellCX(p.col) + 20, y: cellCY(p.row) - 20,
          row: p.row, vx: 400, damage: 20, kernel: true, trail: [],
          arc: true, vy: -3, gravity: 0.15
        });
      }
    }
    if (p.type === 'puffshroom') {
      p.shootTimer += dt;
      const target = S.zombies.find(z =>
        z.row === p.row && z.x < cellCX(p.col) + 200 &&
        z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized
      );
      if (target && p.shootTimer > 1500) {
        p.shootTimer = 0;
        S.projectiles.push({
          x: cellCX(p.col) + 20, y: cellCY(p.row) - 14,
          row: p.row, vx: 500, damage: 20, spore: true, trail: []
        });
      }
    }
    if (p.type === 'fumeshroom') {
      p.shootTimer += dt;
      const target = S.zombies.find(z =>
        z.row === p.row && z.x < cellCX(p.col) + 80 &&
        z.x > cellCX(p.col) - 20 && z.hp > 0 && !z.hypnotized
      );
      if (target && p.shootTimer > 1500) {
        p.shootTimer = 0;
        S.zombies.forEach(z => {
          if (z.row === p.row && z.x > cellCX(p.col) - 20 && z.x < cellCX(p.col) + 80 && z.hp > 0 && !z.hypnotized) {
            z.hp -= 20;
          }
        });
      }
    }
    if (p.type === 'scaredy') {
      const closeZombie = S.zombies.find(z =>
        z.row === p.row && Math.abs(z.x - cellCX(p.col)) < 50 && z.hp > 0 && !z.hypnotized
      );
      if (closeZombie) continue;
      p.shootTimer += dt;
      const target = S.zombies.find(z =>
        z.row === p.row && z.x < cellCX(p.col) + 180 &&
        z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized
      );
      if (target && p.shootTimer > 1500) {
        p.shootTimer = 0;
        S.projectiles.push({
          x: cellCX(p.col) + 20, y: cellCY(p.row) - 14,
          row: p.row, vx: 500, damage: 20, spore: true, trail: []
        });
      }
    }
    if (p.type === 'hypnoshroom') {
      p.shootTimer += dt;
      if (p.shootTimer > 3000) {
        p.shootTimer = 0;
        const target = S.zombies.find(z =>
          z.row === p.row && Math.abs(z.x - cellCX(p.col)) < 80 &&
          z.hp > 0 && !z.hypnotized
        );
        if (target) {
          target.hypnotized = true;
          target.hp = target.maxHp;
        }
      }
    }
  }

  for (const pr of S.projectiles) {
    if (pr.delay > 0) { pr.delay -= dt; continue; }
    pr.x += pr.vx * dts;
    if (pr.arc) {
      pr.vy += pr.gravity;
      pr.y += pr.vy;
    }
    pr.trail.push({ x: pr.x, y: pr.y, life: 200 });
    if (pr.trail.length > 8) pr.trail.shift();
    for (const t of pr.trail) t.life -= dt;

    for (const z of S.zombies) {
      if (z.hp <= 0) continue;
      if (z.hypnotized) continue;
      if (z.row !== pr.row) continue;
      if (z.x >= YARD_RIGHT) continue;
      const zy = cellCY(z.row) - 20;
      if (Math.abs(pr.x - z.x) < 28 && Math.abs(pr.y - zy) < 55) {
        z.hp -= pr.damage;
        z.hitFlash = 180;
        if (pr.ice) z.slowTimer = 3000;
        pr.dead = true;
        break;
      }
    }
    if (pr.x > W + 40 || pr.x > YARD_RIGHT + 5) pr.dead = true;
  }
  S.projectiles = S.projectiles.filter(p => !p.dead);

  for (const s of S.suns) {
    s.life -= dt;
    if (s.y < s.targetY) {
      s.y += s.vy * dt * 0.06;
      if (s.y > s.targetY) s.y = s.targetY;
    }
  }
  S.suns = S.suns.filter(s => s.life > 0);

  for (const z of S.zombies) {
    if (z.hp <= 0) {
      z.dyingTimer = (z.dyingTimer || 0) + dt;
      continue;
    }
    if (z.hitFlash > 0) z.hitFlash -= dt;
    if (z.slowTimer > 0) z.slowTimer -= dt;
    if (z.garlicPushTimer > 0) z.garlicPushTimer -= dt;
    z.walkPhase += dt * 0.008;

    if (z.hypnotized) {
      z.x += Math.abs(z.speed) * dts * 0.7;
      for (const other of S.zombies) {
        if (other === z || other.hypnotized || other.hp <= 0) continue;
        if (other.row === z.row && Math.abs(other.x - z.x) < 40) {
          z.attackTimer = (z.attackTimer || 0) + dt;
          if (z.attackTimer > 800) {
            z.attackTimer = 0;
            other.hp -= z.dmg;
          }
        }
      }
      continue;
    }

    const col = Math.floor((z.x - GRID_X) / CELL_W);
    const plant = S.plants.find(p => p.row === z.row && p.col === col);
    let attacking = false;

    if (plant && z.x < YARD_RIGHT && z.x - cellCX(col) < 38 && z.x - cellCX(col) > -15) {
      if (plant.type === 'garlic' && !(z.garlicPushTimer > 0)) {
        plant.hp -= z.dmg;
        if (plant.hp <= 0) {
          S.plants = S.plants.filter(p => p !== plant);
        }
        let targetRow = z.row;
        const canUp = z.row > 0;
        const canDown = z.row < ROWS - 1;
        if (canUp && canDown) {
          targetRow = Math.random() < 0.5 ? z.row - 1 : z.row + 1;
        } else if (canUp) {
          targetRow = z.row - 1;
        } else if (canDown) {
          targetRow = z.row + 1;
        }
        if (targetRow !== z.row) {
          addParticles(z.x, cellCY(z.row), 12, '#f0f0c0', 4, 500, 4);
          z.row = targetRow;
          z.x += 15;
          z.garlicPushTimer = 500;
          S.shake = 5;
          S.garlicPushes = (S.garlicPushes || 0) + 1;
        }
        attacking = true;
      } else if (plant.type !== 'garlic') {
        attacking = true;
        z.attackTimer = (z.attackTimer || 0) + dt;
        if (z.attackTimer > 800) {
          z.attackTimer = 0;
          plant.hp -= z.dmg;
          if (plant.hp <= 0) {
            if (plant.type === 'potato' && plant.armed) explodePotato(plant);
            S.plants = S.plants.filter(p => p !== plant);
          }
        }
      } else {
        attacking = true;
      }
    }

    if (!attacking) {
      const speedMul = z.slowTimer > 0 ? 0.5 : 1;
      z.x -= z.speed * speedMul * dts;
    }

    if (z.x < GRID_X - 15) {
      const mower = S.mowers[z.row];
      if (mower && !mower.used) {
        mower.used = true;
        mower.active = true;
        mower.x = GRID_X - 30;
      } else {
        gameOver(false);
        return;
      }
    }
  }

  for (const m of S.mowers) {
    if (m.active) {
      m.x += 700 * dts;
      for (const z of S.zombies) {
        if (z.row === m.row && z.hp > 0 && z.x < m.x + 40 && z.x > m.x - 60) {
          z.hp = 0;
        }
      }
      if (m.x > W + 60) m.active = false;
    }
  }

  S.zombies = S.zombies.filter(z => !(z.hp <= 0 && z.dyingTimer > 800));

  for (const p of S.particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.98;
    p.life -= dt;
  }
  S.particles = S.particles.filter(p => p.life > 0);

  S.zombieSpawnTimer += dt;
  const spawnInterval = S.currentLevel.spawnInterval;
  if (S.spawnedZombies < S.totalZombies && S.zombieSpawnTimer > spawnInterval) {
    S.zombieSpawnTimer = 0;
    spawnZombie();
  }

  if (S.currentLevel.boss === 'zomboss' && !S.bossSpawned && S.spawnedZombies >= S.totalZombies - 1) {
    S.bossSpawned = true;
    const row = Math.floor(Math.random() * ROWS);
    S.zombies.push({
      type: 'zomboss', row,
      x: ZOMBIE_SPAWN_X + 40,
      hp: ZOMBIE_TYPES.zomboss.hp, maxHp: ZOMBIE_TYPES.zomboss.hp,
      speed: ZOMBIE_TYPES.zomboss.speed, dmg: ZOMBIE_TYPES.zomboss.dmg,
      walkPhase: 0, slowTimer: 0, hitFlash: 0, dyingTimer: 0, attackTimer: 0, garlicPushTimer: 0,
      hypnotized: false,
    });
    S.shake = 30;
  }

  const zombiesPerWave = Math.ceil(S.currentLevel.totalZombies / S.currentLevel.waves);
  const waveEndKill = S.currentWave * zombiesPerWave;
  if (S.killedZombies >= waveEndKill && S.currentWave < S.currentLevel.waves) {
    const aliveThisWave = S.zombies.filter(z => z.hp > 0 && z.type !== 'zomboss').length;
    if (aliveThisWave === 0) {
      S.currentWave++;
      S.zombieSpawnTimer = 0;
    }
  }

  S.levelProgress = clamp(S.killedZombies / S.totalZombies, 0, 1);

  const bossAlive = S.zombies.some(z => (z.type === 'zomboss') && z.hp > 0);
  const allKilled = S.killedZombies >= S.totalZombies;
  if (allKilled && S.zombies.length === 0 && S.spawnedZombies >= S.totalZombies && !bossAlive) {
    gameOver(true);
  }

  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 0.02);

  // Проверка достижений каждый кадр (быстрая)
  if (S.killedZombies >= 1) unlockAchievement('first_blood');
  if (S.sun >= 1000) unlockAchievement('sunflower_farm');
}

function explodePotato(plant) {
  S.shake = 10;
  addParticles(cellCX(plant.col), cellCY(plant.row), 30, '#ff5722', 7, 800, 5);
  for (const z of S.zombies) {
    if (z.hp <= 0) continue;
    if (Math.abs(z.x - cellCX(plant.col)) < 60 && Math.abs(z.row - plant.row) < 1) {
      z.hp -= 1800;
    }
  }
}

function spawnZombie() {
  const lvl = S.currentLevel;
  const row = Math.floor(Math.random() * ROWS);
  let type = 'basic';
  const availableTypes = lvl.types;
  if (availableTypes.length === 1) {
    type = availableTypes[0];
  } else {
    type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
  }
  const def = ZOMBIE_TYPES[type];
  S.zombies.push({
    type, row,
    x: ZOMBIE_SPAWN_X + Math.random() * 40,
    hp: def.hp, maxHp: def.hp,
    speed: def.speed, dmg: def.dmg,
    walkPhase: Math.random() * Math.PI * 2,
    slowTimer: 0, hitFlash: 0, dyingTimer: 0, attackTimer: 0, garlicPushTimer: 0,
    hypnotized: false,
  });
  S.spawnedZombies++;
}

function gameOver(won) {
  S.gameOver = true;
  S.won = won;
  if (won) {
    const mowersUsed = S.mowers.filter(m => m.used).length;
    let stars = 1;
    if (mowersUsed === 0) stars = 3;
    else if (mowersUsed <= 2) stars = 2;

    const lvlId = S.currentLevel.id;
    if (lvlId > 0) {
      const prevStars = S.levelStars[lvlId] || 0;
      if (stars > prevStars) S.levelStars[lvlId] = stars;
      if (S.unlockedLevels === lvlId && lvlId < LEVELS.length) {
        S.unlockedLevels = lvlId + 1;
      }
    }
    S.totalWinsEver++;
    S.totalKillsEver += S.killedZombies;
    if (S.minigameType) {
      const best = S.minigameBest[S.minigameType] || 0;
      if (S.minigameScore > best) S.minigameBest[S.minigameType] = S.minigameScore;
    }
    checkAchievements();
    saveProgress();
  } else {
    S.shake = 30;
  }
}

function drawMower(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 12, 22, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c62828';
  ctx.beginPath();
  ctx.roundRect(-22, -18, 44, 28, 6);
  ctx.fill();
  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.roundRect(-16, -28, 32, 14, 4);
  ctx.fill();
  ctx.fillStyle = '#212121';
  ctx.beginPath();
  ctx.arc(-14, 10, 8, 0, Math.PI * 2);
  ctx.arc(14, 10, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

  ctx.moveTo(60, H * 0.55 + 10);

  else { g.addColorStop(0, '#c62828'); g.addColorStop(1, '#7f0000'); }

function drawLevelSelect() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a1a3a');
  bg.addColorStop(0.5, '#1a0f25');

  ctx.textBaseline = 'middle';
