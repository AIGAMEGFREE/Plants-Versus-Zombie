function drawSettings(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a2a3a');
  bg.addColorStop(1,'#05101a');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold 56px Impact, Arial Black, sans-serif';
  ctx.strokeStyle='#000';ctx.lineWidth=8;
  ctx.strokeText('⚙️ НАСТРОЙКИ',W/2,60);
  ctx.fillStyle='#4fc3f7';
  ctx.fillText('⚙️ НАСТРОЙКИ',W/2,60);

  drawBackBtn(20,20,140,50);

  const panelW=720;
  const panelH=580;
  const panelX=W/2-panelW/2;
  const panelY=120;

  const pg=ctx.createLinearGradient(panelX,panelY,panelX,panelY+panelH);
  pg.addColorStop(0,'rgba(60,80,100,.95)');
  pg.addColorStop(1,'rgba(20,30,45,.95)');
  ctx.fillStyle=pg;
  ctx.beginPath();
  ctx.roundRect(panelX,panelY,panelW,panelH,20);
  ctx.fill();
  ctx.strokeStyle='#4fc3f7';ctx.lineWidth=3;ctx.stroke();

  S.settingsToggles=[];
  const rowH=66;
  const startY=panelY+20;
  let rowIdx=0;

  // --- Тумблер ---
  const addToggle=(label,getVal,setVal)=>{
    const ry=startY+rowIdx*rowH;
    ctx.textAlign='left';
    ctx.font='bold 22px Trebuchet MS, Arial';
    ctx.fillStyle='#e0e0e0';
    ctx.fillText(label,panelX+40,ry+30);

    const btnW=130,btnH=44;
    const btnX=panelX+panelW-btnW-40;
    const btnY=ry+8;
    const val=getVal();

    const bg2=ctx.createLinearGradient(0,btnY,0,btnY+btnH);
    if(val){bg2.addColorStop(0,'#66bb6a');bg2.addColorStop(1,'#2e7d32');}
    else{bg2.addColorStop(0,'#666');bg2.addColorStop(1,'#333');}
    ctx.fillStyle=bg2;
    ctx.beginPath();
    ctx.roundRect(btnX,btnY,btnW,btnH,10);
    ctx.fill();
    ctx.strokeStyle=val?'#1b5e20':'#222';
    ctx.lineWidth=3;ctx.stroke();

    ctx.fillStyle='#fff';
    ctx.font='bold 18px Impact, Arial Black, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(val?'ВКЛ':'ВЫКЛ',btnX+btnW/2,btnY+btnH/2);

    S.settingsToggles.push({x:btnX,y:btnY,w:btnW,h:btnH,action:setVal});
    rowIdx++;
  };

  // --- Слайдер ---
  const addSlider=(label,getVal,setVal)=>{
    const ry=startY+rowIdx*rowH;
    ctx.textAlign='left';
    ctx.font='bold 20px Trebuchet MS, Arial';
    ctx.fillStyle='#e0e0e0';
    ctx.fillText(label,panelX+40,ry+20);

    const slX=panelX+40;
    const slY=ry+34;
    const slW=panelW-160;
    const slH=14;
    const val=getVal();

    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.beginPath();ctx.roundRect(slX,slY,slW,slH,7);ctx.fill();
    const fillG=ctx.createLinearGradient(slX,0,slX+slW,0);
    fillG.addColorStop(0,'#4fc3f7');fillG.addColorStop(1,'#0288d1');
    ctx.fillStyle=fillG;
    ctx.beginPath();ctx.roundRect(slX,slY,slW*val,slH,7);ctx.fill();

    const knobX=slX+slW*val;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(knobX,slY+slH/2,12,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#0288d1';ctx.lineWidth=3;ctx.stroke();

    ctx.textAlign='right';
    ctx.font='bold 18px Arial';
    ctx.fillStyle='#4fc3f7';
    ctx.fillText(Math.round(val*100)+'%',panelX+panelW-40,ry+20);

    S.settingsToggles.push({slider:true,x:slX,y:slY-10,w:slW,h:slH+20,setVal:setVal});
    rowIdx++;
  };

   addToggle('🎵 Музыка',()=>S.musicOn,v=>{
    S.musicOn=v;
    Sound.setMusicEnabled(v);
    if(v){
      Sound.init();
      Sound.resume();
    }
    saveProgress(true);
  });
  addSlider('🔊 Громкость музыки',()=>S.musicVolume,v=>{S.musicVolume=v;Sound.setMusicVolume(v);});
    addToggle('🔔 Звуки',()=>S.soundOn,v=>{
    S.soundOn=v;
    Sound.setSfxEnabled(v);
    // Принудительно инициализируем контекст при включении
    if(v){
      Sound.init();
      Sound.resume();
      Sound.play('click');
    }
    saveProgress(true);
  });
  addSlider('🔊 Громкость звуков',()=>S.soundVolume,v=>{S.soundVolume=v;Sound.setVolume(v);});
  addToggle('📊 Показывать FPS',()=>S.showFPS,v=>{S.showFPS=v;saveProgress(true);});
  addToggle('📏 Показывать сетку',()=>S.showGrid,v=>{S.showGrid=v;bgCacheKey='';saveProgress(true);});
  addToggle('❤️ Полоски здоровья',()=>S.showHPBars,v=>{S.showHPBars=v;saveProgress(true);});

  // Кнопка теста звука
  const testY=startY+rowIdx*rowH+10;
  const testBtnW=260,testBtnH=50;
  const testBtnX=panelX+panelW/2-testBtnW/2;
  const testHover=S.cursorX>=testBtnX&&S.cursorX<=testBtnX+testBtnW&&S.cursorY>=testY&&S.cursorY<=testY+testBtnH;
  const tbg=ctx.createLinearGradient(0,testY,0,testY+testBtnH);
  if(testHover){tbg.addColorStop(0,'#ab47bc');tbg.addColorStop(1,'#6a1b9a');}
  else{tbg.addColorStop(0,'#9c27b0');tbg.addColorStop(1,'#4a148c');}
  ctx.fillStyle=tbg;
  ctx.beginPath();ctx.roundRect(testBtnX,testY,testBtnW,testBtnH,12);ctx.fill();
  ctx.strokeStyle='#2a0050';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 22px Impact, Arial Black, sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🔊 ПРОВЕРИТЬ ЗВУК',testBtnX+testBtnW/2,testY+testBtnH/2);
  S.settingsToggles.push({testSound:true,x:testBtnX,y:testY,w:testBtnW,h:testBtnH});

  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.font='italic 14px Arial';
  ctx.fillText('v1.1 • Plants vs Zombies Fan Remake',W/2,H-30);
}

canvas.addEventListener('mousemove',(e)=>{
  const p=getPos(e);
  S.cursorX=p.x;
  S.cursorY=p.y;

  // Перетаскивание слайдера
  if(S.scene==='settings'&&S._draggingSlider!==undefined){
    const t=S.settingsToggles[S._draggingSlider];
    if(t&&t.slider){
      const val=clamp((p.x-t.x)/t.w,0,1);
      t.setVal(val);
    }
  }
});

canvas.addEventListener('mouseleave',()=>{
  S.cursorX=-1;
  S.cursorY=-1;
});

canvas.addEventListener('mousedown',(e)=>{
  if(S.scene==='settings'){
    const p=getPos(e);
    for(let i=0;i<S.settingsToggles.length;i++){
      const t=S.settingsToggles[i];
      if(t.slider&&p.x>=t.x&&p.x<=t.x+t.w&&p.y>=t.y&&p.y<=t.y+t.h){
        S._draggingSlider=i;
        break;
      }
    }
  }
});

canvas.addEventListener('mouseup',()=>{S._draggingSlider=undefined;});

canvas.addEventListener('wheel',(e)=>{
  if(S.scene==='achievements'){
    S.achScroll=clamp(S.achScroll+e.deltaY*.5,0,S.achScrollMax);
    e.preventDefault();
  }else if(S.scene==='credits'){
    S.creditsScroll=clamp((S.creditsScroll||0)+e.deltaY*.5,0,S.creditsMax||0);
    e.preventDefault();
  }
},{passive:false});

canvas.addEventListener('click',(e)=>{
  try{
    Sound.init();Sound.resume();
    const p=getPos(e);
    const x=p.x;
    const y=p.y;

        // === НАСТРОЙКИ ===
    if(S.scene==='settings'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        Sound.play('click');
        S.scene='menu';
        return;
      }
      // Сначала проверяем тумблеры и кнопки
      for(const t of S.settingsToggles){
        if(!t)continue;
        
        // Кнопка "Проверить звук"
        if(t.testSound){
          if(x>=t.x&&x<=t.x+t.w&&y>=t.y&&y<=t.y+t.h){
            // Принудительно включаем звук для теста
            const wasEnabled=Sound.sfxEnabled;
            Sound.setSfxEnabled(true);
            Sound.play('win');
            if(!wasEnabled)Sound.setSfxEnabled(S.soundOn);
            return;
          }
          continue;
        }
        
        // Слайдеры обрабатываются в mousedown, тут пропускаем
        if(t.slider)continue;
        
        // Тумблер
        if(x>=t.x&&x<=t.x+t.w&&y>=t.y&&y<=t.y+t.h){
          t.action();
          return;
        }
      }
      return;
    }

    // === ВЫБОР СЕМЯН ===
    if(S.scene==='seedselect'){
      if(S.seedSelectBackBtn&&x>=S.seedSelectBackBtn.x&&x<=S.seedSelectBackBtn.x+S.seedSelectBackBtn.w&&y>=S.seedSelectBackBtn.y&&y<=S.seedSelectBackBtn.y+S.seedSelectBackBtn.h){
        S.scene='levelselect';return;
      }
      if(S.seedSelectStartBtn&&S.seedSelectStartBtn.enabled&&x>=S.seedSelectStartBtn.x&&x<=S.seedSelectStartBtn.x+S.seedSelectStartBtn.w&&y>=S.seedSelectStartBtn.y&&y<=S.seedSelectStartBtn.y+S.seedSelectStartBtn.h){
        const lvl=S.currentLevel;
        lvl.seeds=[...S.seedSelectChosen];
        S.seedSelectMode=false;
        startLevel(lvl);return;
      }
      const slotSize=80;
      const slotGap=10;
      const maxSlots=Math.min(S.seedSelectMaxSlots,10);
      const slotRowW=maxSlots*slotSize+(maxSlots-1)*slotGap;
      const slotRowX=(W-slotRowW)/2;
      const slotRowY=150;
      for(let i=0;i<maxSlots;i++){
        const sx=slotRowX+i*(slotSize+slotGap);
        if(x>=sx&&x<=sx+slotSize&&y>=slotRowY&&y<=slotRowY+slotSize){
          if(S.seedSelectChosen[i])S.seedSelectChosen.splice(i,1);
          return;
        }
      }
      for(const c of S.seedSelectCardRects){
        if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
          const idx=S.seedSelectChosen.indexOf(c.seedId);
          if(idx>=0)S.seedSelectChosen.splice(idx,1);
          else if(S.seedSelectChosen.length<maxSlots)S.seedSelectChosen.push(c.seedId);
          return;
        }
      }
      return;
    }

    // === МАГАЗИН ===
    if(S.scene==='shop'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';return;
      }
      if(S.resetPlantsBtn&&x>=S.resetPlantsBtn.x&&x<=S.resetPlantsBtn.x+S.resetPlantsBtn.w&&y>=S.resetPlantsBtn.y&&y<=S.resetPlantsBtn.y+S.resetPlantsBtn.h){
        resetPlants();return;
      }
      if(x>=60&&x<=240&&y>=H-450&&y<=H-160){
        S.shopSpeech=SHOP_PHRASES[Math.floor(Math.random()*SHOP_PHRASES.length)];
        Sound.play('click');
        return;
      }
      if(S.shopPageBtns.prev&&x>=S.shopPageBtns.prev.x&&x<=S.shopPageBtns.prev.x+S.shopPageBtns.prev.w&&y>=S.shopPageBtns.prev.y&&y<=S.shopPageBtns.prev.y+S.shopPageBtns.prev.h){
        S.shopPage=(S.shopPage-1+SHOP_PAGES.length)%SHOP_PAGES.length;
        Sound.play('click');
        return;
      }
      if(S.shopPageBtns.next&&x>=S.shopPageBtns.next.x&&x<=S.shopPageBtns.next.x+S.shopPageBtns.next.w&&y>=S.shopPageBtns.next.y&&y<=S.shopPageBtns.next.y+S.shopPageBtns.next.h){
        S.shopPage=(S.shopPage+1)%SHOP_PAGES.length;
        Sound.play('click');
        return;
      }
      for(const c of S.shopCards){
        if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
          if(!c.owned&&c.canAfford)buyShopItem(c);
          else if(!c.canAfford&&!c.owned){showSaveToast('❌ Не хватает монет!');Sound.play('error');}
          return;
        }
      }
      return;
    }

    // === ДЕРЕВО ===
    if(S.scene==='tree'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';return;
      }
      if(S.treeWaterBtn&&x>=S.treeWaterBtn.x&&x<=S.treeWaterBtn.x+S.treeWaterBtn.w&&y>=S.treeWaterBtn.y&&y<=S.treeWaterBtn.y+S.treeWaterBtn.h){
        waterTree();return;
      }
      for(const r of S.treeShopRects){
        if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
          if(r.canAfford)buyWatering(r.pack);
          else {showSaveToast('❌ Не хватает монет!');Sound.play('error');}
          return;
        }
      }
      return;
    }

    // === ДОСТИЖЕНИЯ ===
    if(S.scene==='achievements'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';return;
      }
      return;
    }

    // === МИНИ-ИГРЫ ===
    if(S.scene==='minigames'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';return;
      }
      for(const c of S.minigameCards){
        if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
          startMinigame(c.minigame);return;
        }
      }
      return;
    }

    // === ТИТРЫ ===
    if(S.scene==='credits'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';return;
      }
      return;
    }

    // === ВЫБОР УРОВНЯ ===
    if(S.scene==='levelselect'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';return;
      }
      for(const n of S.levelNodes){
        if(x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h){
          startLevelWithSeedSelect(n.level);return;
        }
      }
      return;
    }

    // === ГЛАВНОЕ МЕНЮ ===
    if(S.scene==='menu'){
      if(S.resetBtn&&x>=S.resetBtn.x&&x<=S.resetBtn.x+S.resetBtn.w&&y>=S.resetBtn.y&&y<=S.resetBtn.y+S.resetBtn.h){
        resetProgress();return;
      }
      if(S.treeMenuBtn&&x>=S.treeMenuBtn.x&&x<=S.treeMenuBtn.x+S.treeMenuBtn.w&&y>=S.treeMenuBtn.y&&y<=S.treeMenuBtn.y+S.treeMenuBtn.h){
        S.scene='tree';return;
      }
      if(S.achMenuBtn&&x>=S.achMenuBtn.x&&x<=S.achMenuBtn.x+S.achMenuBtn.w&&y>=S.achMenuBtn.y&&y<=S.achMenuBtn.y+S.achMenuBtn.h){
        S.achScroll=0;S.scene='achievements';return;
      }
      if(S.settingsBtn&&x>=S.settingsBtn.x&&x<=S.settingsBtn.x+S.settingsBtn.w&&y>=S.settingsBtn.y&&y<=S.settingsBtn.y+S.settingsBtn.h){
        Sound.play('click');
        S.scene='settings';
        return;
      }
      if(S.shopMenuBtn&&x>=S.shopMenuBtn.x&&x<=S.shopMenuBtn.x+S.shopMenuBtn.w&&y>=S.shopMenuBtn.y&&y<=S.shopMenuBtn.y+S.shopMenuBtn.h){
        S.shopPage=0;S.scene='shop';
        S.shopSpeech=SHOP_PHRASES[Math.floor(Math.random()*SHOP_PHRASES.length)];
        return;
      }
      if(S.menuMinigameBtn&&x>=S.menuMinigameBtn.x&&x<=S.menuMinigameBtn.x+S.menuMinigameBtn.w&&y>=S.menuMinigameBtn.y&&y<=S.menuMinigameBtn.y+S.menuMinigameBtn.h){
        S.scene='minigames';return;
      }
      if(S.creditsBtn&&x>=S.creditsBtn.x&&x<=S.creditsBtn.x+S.creditsBtn.w&&y>=S.creditsBtn.y&&y<=S.creditsBtn.y+S.creditsBtn.h){
        S.creditsScroll=0;S.scene='credits';return;
      }
      if(S.menuBtn&&x>=S.menuBtn.x&&x<=S.menuBtn.x+S.menuBtn.w&&y>=S.menuBtn.y&&y<=S.menuBtn.y+S.menuBtn.h){
        S.scene='levelselect';return;
      }
      return;
    }

    // === GAME OVER ===
    if(S.scene==='playing'&&S.gameOver){
      saveProgress(true);
      S.scene='levelselect';
      S.gameOver=false;
      S.minigameType=null;
      S.minigameFlags={endless:false,sunny:false,gravity:false};
      return;
    }

    if(S.scene!=='playing'||S.gameOver)return;

    // === МОНЕТЫ НА ЗЕМЛЕ ===
    for(let i=S.coinsOnGround.length-1;i>=0;i--){
      const c=S.coinsOnGround[i];
      if(dist(c.x,c.y,x,y)<32){
        S.coins+=c.value||10;
        S.totalCoinsEarned+=c.value||10;
        S.zombieCoinsCollected+=c.value||10;
        addParticles(c.x,c.y,8,'#ffd700',4,500,4);
        S.coinsOnGround.splice(i,1);
        Sound.play('coin');
        return;
      }
    }

    // === СОЛНЦЕ ===
    for(let i=S.suns.length-1;i>=0;i--){
      const s=S.suns[i];
      if(s.life<=0)continue;
      if(dist(s.x,s.y,x,y)<40){
        S.sun=Math.max(0,Math.floor((S.sun||0)+(s.value||25)));
        addParticles(s.x,s.y,6,'#ffeb3b',4,400,4);
        S.suns.splice(i,1);
        Sound.play('sun');
        return;
      }
    }

    // === HUD ===
    const panelY=8;
    const packetW=62;
    const packetH=84;
    const sunW=78;
    const startX=8+sunW+20;
    const seeds=S.currentLevel.seeds;

    // Клик по семечку
    for(let i=0;i<seeds.length;i++){
      const sx=startX+i*(packetW+4);
      if(x>=sx&&x<=sx+packetW&&y>=panelY&&y<=panelY+packetH){
        const seed=ALL_PLANTS[seeds[i]];
        if(!seed)return;
        const cd=S.cooldowns[seed.id]||0;
        const awake=isPlantAwake(seed.id);
        if(cd>0||S.sun<seed.cost||!awake){Sound.play('error');return;}
        S.selectedSeed=(S.selectedSeed===seed.id)?null:seed.id;
        S.shovelSelected=false;
        S.gloveSelected=false;
        Sound.play('click');
        return;
      }
    }

    // Клик по лопате
    const shX=startX+seeds.length*(packetW+4)+4;
    if(x>=shX&&x<=shX+packetW&&y>=panelY&&y<=panelY+packetH){
      S.shovelSelected=!S.shovelSelected;
      S.selectedSeed=null;
      S.gloveSelected=false;
      Sound.play('click');
      return;
    }

    // Клик по перчатке
    const glX=shX+packetW+4;
    if(S.ownedItems.includes('glove')&&x>=glX&&x<=glX+packetW&&y>=panelY&&y<=panelY+packetH){
      S.gloveSelected=!S.gloveSelected;
      S.selectedSeed=null;
      S.shovelSelected=false;
      if(S.gloveHolding){
        if(!getPlantAt(S.gloveHolding.row,S.gloveHolding.col))S.plants.push(S.gloveHolding);
        S.gloveHolding=null;
        rebuildPlantCache();
      }
      Sound.play('click');
      return;
    }

    // Клик по MENU
    if(x>=W-98&&x<=W-8&&y>=panelY&&y<=panelY+40){
      saveProgress(true);
      S.scene='levelselect';
      S.gameOver=false;
      S.minigameType=null;
      S.minigameFlags={endless:false,sunny:false,gravity:false};
      Sound.play('click');
      return;
    }

    // Клик по НАСТРОЙКАМ
    if(x>=W-194&&x<=W-104&&y>=panelY&&y<=panelY+40){
      Sound.play('click');
      S.scene='settings';
      return;
    }

    // === ПОСАДКА ===
    const col=Math.floor((x-GRID_X)/CELL_W);
    const row=Math.floor((y-activeTop())/CELL_H);
    if(col<0||col>=COLS||row<0||row>=ROWS)return;

    // Перчатка
    if(S.gloveSelected){
      const plant=getPlantAt(row,col);
      if(S.gloveHolding){
        if(!plant){
          S.gloveHolding.row=row;
          S.gloveHolding.col=col;
          S.plants.push(S.gloveHolding);
          S.gloveHolding=null;
          rebuildPlantCache();
          Sound.play('glove');
        }
        return;
      }else{
        if(plant){
          S.gloveHolding=plant;
          S.plants=S.plants.filter(p=>p!==plant);
          rebuildPlantCache();
          Sound.play('glove');
        }
        return;
      }
    }

    // Лопата
    if(S.shovelSelected){
      const plant=getPlantAt(row,col);
      if(plant){
        S.plants=S.plants.filter(p=>p!==plant);
        rebuildPlantCache();
        S.usedShovelThisLevel=(S.usedShovelThisLevel||0)+1;
        addParticles(cellCX(col),cellCY(row),10,'#8bc34a',3,400,4);
        Sound.play('shovel');
      }
      return;
    }

    // Посадка семени
    if(S.selectedSeed){
      const seed=ALL_PLANTS[S.selectedSeed];
      if(!seed)return;
      if(S.sun<seed.cost||(S.cooldowns[seed.id]||0)>0)return;
      if(!isPlantAwake(seed.id))return;
      if(getPlantAt(row,col))return;
      if(S.craters.find(c=>c.row===row&&c.col===col))return;

      // === ОГРАНИЧЕНИЯ ===
      // Кукурузная пушка занимает 2 клетки (проверка справа)
      if(seed.id==='cobcannon'){
        if(col>=COLS-1||getPlantAt(row,col+1)){Sound.play('error');return;}
      }
      // Кошкамыш только на воду
      if(seed.id==='cattail'||seed.id==='catmushroom'){
        const isPool=(S.location==='pool'||S.location==='nightpool')&&row>=2&&row<4;
        if(!isPool){Sound.play('error');return;}
      }
      // Кувшинка только на воду
      if(seed.id==='lilypad'){
        const isPool=(S.location==='pool'||S.location==='nightpool')&&row>=2&&row<4;
        if(!isPool){Sound.play('error');return;}
      }
      // Водоросли только на воду
      if(seed.id==='tanglekelp'){
        const isPool=(S.location==='pool'||S.location==='nightpool')&&row>=2&&row<4;
        if(!isPool){Sound.play('error');return;}
      }

      S.sun-=seed.cost;
      S.cooldowns[seed.id]=seed.cd;
      S.plantedThisLevel++;
      Sound.play('plant');

      const isExplosive=seed.explode!==undefined||seed.freezeAll||seed.fullScreen;
      const newPlant={
        type:seed.id,row,col,hp:seed.hp,maxHp:seed.hp,
        sunTimer:0,shootTimer:0,armTimer:0,armed:false,born:S.time,
        chewing:false,chewTimer:0,used:false
      };
      if(isExplosive){
        newPlant.growTimer=0;
        newPlant.fuseDuration=seed.fuse||3000;
      }
      S.plants.push(newPlant);
      rebuildPlantCache();
      addParticles(cellCX(col),cellCY(row)+20,4,'#8bc34a',3,300,3);
      S.selectedSeed=null;
    }
  }catch(err){console.error('Click error:',err);}
});

// === КЛАВИАТУРА ===
document.addEventListener('keydown',(e)=>{
  if(S.scene!=='playing'||S.gameOver)return;
  if(e.key==='Escape'){
    S.selectedSeed=null;
    S.shovelSelected=false;
    S.gloveSelected=false;
  }
  const n=parseInt(e.key);
  if(n>=1&&n<=S.currentLevel.seeds.length){
    const seed=ALL_PLANTS[S.currentLevel.seeds[n-1]];
    if(!seed)return;
    const cd=S.cooldowns[seed.id]||0;
    if(cd<=0&&S.sun>=seed.cost&&isPlantAwake(seed.id)){
      S.selectedSeed=S.selectedSeed===seed.id?null:seed.id;
      S.shovelSelected=false;
      S.gloveSelected=false;
    }
  }
});

// ============================================================
// РЕНДЕР
// ============================================================
function render(){
  if(!Number.isFinite(S.sun))S.sun=75;
  if(!Number.isFinite(S.shake))S.shake=0;
  if(!Number.isFinite(S.time))S.time=0;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;

  ctx.save();
  if(S.shake>0)ctx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));
  ctx.clearRect(-50,-50,W+100,H+100);

  try{
    if(S.scene==='menu')drawMenu();
    else if(S.scene==='shop')drawShop();
    else if(S.scene==='tree')drawTreeScreen();
    else if(S.scene==='achievements')drawAchievements();
    else if(S.scene==='minigames')drawMinigameMenu();
    else if(S.scene==='credits')drawCredits();
    else if(S.scene==='levelselect')drawLevelSelect();
    else if(S.scene==='seedselect')drawSeedSelect();
    else if(S.scene==='settings')drawSettings();
    else{
      drawGameScene();
      if(S.gameOver)drawGameOverScreen();
    }
  }catch(err){console.error('Render error:',err);}
  ctx.restore();

  if(S.flash>0){
    ctx.fillStyle=`rgba(255,255,255,${S.flash*.9})`;
    ctx.fillRect(0,0,W,H);
  }

  drawAchievementToasts();

  // FPS
  if(S.showFPS){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.beginPath();
    ctx.roundRect(W-90,H-50,80,32,6);
    ctx.fill();
    ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=S.fps>=50?'#4caf50':S.fps>=30?'#ffeb3b':'#f44336';
    ctx.font='bold 16px Consolas, monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('FPS '+S.fps,W-50,H-34);
    ctx.restore();
  }
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
let _loopErrLogged=false;
let _wasHidden=false;

function loop(now){
  try{
    if(document.hidden){
      _wasHidden=true;
      S.lastTime=now;
      requestAnimationFrame(loop);
      return;
    }
    if(_wasHidden){
      _wasHidden=false;
      S.lastTime=now;
    }
    let dt=now-S.lastTime;
    if(dt>100)dt=50;
    S.lastTime=now;
    S.time+=dt;
    if(!Number.isFinite(S.time))S.time=0;

    // FPS счётчик
    S.fpsFrames++;
    S.fpsTimer+=dt;
    if(S.fpsTimer>=500){
      S.fps=Math.round(S.fpsFrames*1000/S.fpsTimer);
      S.fpsFrames=0;S.fpsTimer=0;
    }

    if(S.scene==='playing'&&!S.gameOver)update(dt);

    // Затухание эффектов ВСЕГДА (фикс бледного экрана)
    if(S.shake>0)S.shake=Math.max(0,S.shake-dt*.02);
    if(S.flash>0)S.flash=Math.max(0,S.flash-dt*.003);

    render();
  }catch(err){
    if(!_loopErrLogged){
      console.error('Loop error:',err);
      _loopErrLogged=true;
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(loop);
}

loadProgress();
requestAnimationFrame(loop);

})();
</script>
