function drawZombie(z,t){
  const x=z.x;
  const y=(z.y_air!==undefined&&z.falling)?z.y_air:cellCY(z.row);
  const dying=z.hp<=0;
  const alpha=dying?clamp(1-z.dyingTimer/800,0,1):1;
  const isBoss=z.type==='zomboss';
  const isGarg=z.type==='gargantuar';
  const isMini=z.type==='minizombie';
  const isHypno=z.hypnotized;

  let bushAlpha=1;
  if(z.x>ROAD_RIGHT-20&&S.location!=='roof'&&!z.falling){
    const t2=clamp((z.x-(ROAD_RIGHT-20))/80,0,1);
    bushAlpha=1-t2*.85;
  }

  ctx.save();
  ctx.globalAlpha=alpha*bushAlpha;
  ctx.translate(x,y);
  if(dying)ctx.rotate((1-alpha)*.7);
  if(isBoss)ctx.scale(2.0,2.0);
  else if(isGarg)ctx.scale(1.7,1.7);
  else if(isMini)ctx.scale(.55,.55);

  const bob=dying?0:Math.sin(t*.008+z.walkPhase)*3;
  const headBob=dying?0:Math.sin(t*.01+z.walkPhase)*2;
  ctx.translate(0,bob);

  if(!z.falling){
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(0,38,26,8,0,0,Math.PI*2);
    ctx.fill();
  }

  const legPhase1=Math.sin(t*.008+z.walkPhase);
  const legPhase2=Math.sin(t*.008+z.walkPhase+Math.PI);

  // Рука сзади
  ctx.save();
  ctx.translate(16,-8);
  ctx.rotate(.35+Math.sin(t*.008+z.walkPhase+1)*.05);
  ctx.fillStyle=isHypno?'#7a2a6a':'#3a2410';
  ctx.beginPath();
  ctx.roundRect(-8,-6,24,12,5);
  ctx.fill();
  ctx.strokeStyle='#1a0e05';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.fillStyle=isHypno?'#c060b0':'#7a9a3a';
  ctx.beginPath();
  ctx.arc(18,0,6,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#2d5a1a';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();

  // Ноги
  for(const[tx,phase]of[[-10,legPhase1],[10,legPhase2]]){
    ctx.save();
    ctx.translate(tx,22);
    ctx.rotate(phase*.12);

    const pantsG=ctx.createLinearGradient(-8,-10,8,22);
    if(isHypno){
      pantsG.addColorStop(0,'#4a1a5a');
      pantsG.addColorStop(.5,'#3a1040');
      pantsG.addColorStop(1,'#2a0a30');
    }else{
      pantsG.addColorStop(0,'#2a3a6a');
      pantsG.addColorStop(.5,'#1a2a5a');
      pantsG.addColorStop(1,'#0a1a3a');
    }
    ctx.fillStyle=pantsG;
    ctx.beginPath();
    ctx.roundRect(-8,-8,15,26,3);
    ctx.fill();
    ctx.strokeStyle='#0a0a1a';
    ctx.lineWidth=1.5;
    ctx.stroke();

    const shoeG=ctx.createLinearGradient(-8,16,12,26);
    shoeG.addColorStop(0,'#8a5a2a');
    shoeG.addColorStop(.5,'#6d4c21');
    shoeG.addColorStop(1,'#3a2410');
    ctx.fillStyle=shoeG;
    ctx.beginPath();
    ctx.ellipse(2,20,12,6,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#2d1b08';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.restore();
  }

  // Туловище
  const jacketG=ctx.createRadialGradient(-6,-6,3,0,2,30);
  if(isHypno){
    jacketG.addColorStop(0,'rgba(255,255,255,.15)');
    jacketG.addColorStop(.4,'#a040a0');
    jacketG.addColorStop(.7,'#702070');
    jacketG.addColorStop(1,'#4a1050');
  }else if(isGarg){
    jacketG.addColorStop(0,'rgba(255,255,255,.15)');
    jacketG.addColorStop(.4,'#6a4a2a');
    jacketG.addColorStop(1,'#2a1a0a');
  }else{
    jacketG.addColorStop(0,'rgba(255,255,255,.15)');
    jacketG.addColorStop(.4,'#6d4c2a');
    jacketG.addColorStop(1,'#2a1a0a');
  }
  ctx.fillStyle=jacketG;
  ctx.beginPath();
  ctx.ellipse(0,0,22,26,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#1a0e05';
  ctx.lineWidth=1.5;
  ctx.stroke();

  // Галстук
  const tieG=ctx.createLinearGradient(-6,-20,6,20);
  if(isHypno){
    tieG.addColorStop(0,'#ff60c0');
    tieG.addColorStop(.5,'#c040a0');
    tieG.addColorStop(1,'#6a1050');
  }else{
    tieG.addColorStop(0,'#e53935');
    tieG.addColorStop(.5,'#c62828');
    tieG.addColorStop(1,'#8e0000');
  }
  ctx.fillStyle=tieG;
  ctx.beginPath();
  ctx.moveTo(-3,-22);
  ctx.lineTo(3,-22);
  ctx.lineTo(5,8);
  ctx.lineTo(0,14);
  ctx.lineTo(-5,8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#4a0000';
  ctx.lineWidth=1;
  ctx.stroke();

  // Руки
  for(const[tx,ty,rot]of[[-20,-8,.5],[20,-14,.35]]){
    ctx.save();
    ctx.translate(tx,ty);
    ctx.rotate(rot+Math.sin(t*.008+z.walkPhase)*.05);

    const sleeveG=ctx.createLinearGradient(-8,-8,8,8);
    if(isHypno){
      sleeveG.addColorStop(0,'#a060a0');
      sleeveG.addColorStop(1,'#4a1050');
    }else{
      sleeveG.addColorStop(0,'#8a6a3a');
      sleeveG.addColorStop(1,'#4a3020');
    }
    ctx.fillStyle=sleeveG;
    ctx.beginPath();
    ctx.roundRect(-8,-7,32,14,5);
    ctx.fill();
    ctx.strokeStyle='#1a0e05';
    ctx.lineWidth=1.5;
    ctx.stroke();

    const skinG=ctx.createRadialGradient(28,-2,2,30,0,10);
    skinG.addColorStop(0,isHypno?'#f0b0e0':'#c8e88a');
    skinG.addColorStop(.6,isHypno?'#e090d0':'#8bc34a');
    skinG.addColorStop(1,isHypno?'#8a4080':'#4a7a2a');
    ctx.fillStyle=skinG;
    ctx.beginPath();
    ctx.arc(30,0,8,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=isHypno?'#4a1050':'#2d5a1a';
    ctx.lineWidth=1.5;
    ctx.stroke();

    // Пальцы
    for(let i=-1;i<=1;i++){
      ctx.save();
      ctx.translate(36,i*4);
      ctx.rotate(i*.3+.3);
      ctx.fillStyle=isHypno?'#f0b0e0':'#9ecf5a';
      ctx.beginPath();
      ctx.roundRect(0,-2.5,8,5,2);
      ctx.fill();
      ctx.strokeStyle=isHypno?'#4a1050':'#2d5a1a';
      ctx.lineWidth=1;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // Шея
  ctx.fillStyle=isHypno?'#a050a0':'#7a9a4a';
  ctx.beginPath();
  ctx.roundRect(-7,-30,14,12,3);
  ctx.fill();

  // Голова
  const headG=ctx.createRadialGradient(-8,-24+headBob,4,0,-18+headBob,26);
  if(isBoss){
    headG.addColorStop(0,'#a0c070');
    headG.addColorStop(.5,'#6a9a3a');
    headG.addColorStop(1,'#1a2a0a');
  }else if(isHypno){
    headG.addColorStop(0,'#ffd0e8');
    headG.addColorStop(.6,'#e060b0');
    headG.addColorStop(1,'#6a1050');
  }else if(isGarg){
    headG.addColorStop(0,'#8a9a5a');
    headG.addColorStop(.5,'#5a6a2a');
    headG.addColorStop(1,'#2a3010');
  }else{
    headG.addColorStop(0,'#c8e090');
    headG.addColorStop(.4,'#a5c66a');
    headG.addColorStop(.7,'#7a9a3a');
    headG.addColorStop(1,'#3a5a1a');
  }
  ctx.fillStyle=headG;
  ctx.beginPath();
  ctx.arc(0,-20+headBob,24,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=isBoss?'#1a2a0a':isHypno?'#4a1050':'#2d5a1a';
  ctx.lineWidth=2;
  ctx.stroke();

  // Волосы
  ctx.strokeStyle=isHypno?'#6a1060':'#2d5a1a';
  ctx.lineWidth=2;
  const hairWave=Math.sin(t*.006+z.walkPhase)*2;
  for(const hx of[-16,-10,-2,6,14]){
    ctx.beginPath();
    ctx.moveTo(hx,-38+headBob);
    ctx.quadraticCurveTo(hx-2,-44+headBob,hx-4+hairWave,-50+headBob);
    ctx.stroke();
  }

  // Глаза
  ctx.fillStyle='#f5f0d8';
  ctx.beginPath();
  ctx.arc(-9,-20+headBob,8,0,Math.PI*2);
  ctx.arc(9,-20+headBob,8,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#333';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(-9,-20+headBob,2,0,Math.PI*2);
  ctx.arc(9,-20+headBob,2,0,Math.PI*2);
  ctx.fill();

  // Рот
  ctx.fillStyle='#3a0a0a';
  ctx.beginPath();
  ctx.ellipse(0,-8+headBob,11,6,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#f5f0d8';
  for(let i=-2;i<=2;i++)ctx.fillRect(i*3-1,-13+headBob,2.5,4);

  // Замедление
  if(z.slowTimer>0){
    ctx.fillStyle=isHypno?'rgba(150,100,200,.35)':'rgba(120,200,255,.35)';
    ctx.beginPath();
    ctx.ellipse(0,-10,32,42,0,0,Math.PI*2);
    ctx.fill();
    if(z.frozenStop){
      ctx.strokeStyle='#4fc3f7';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,-10,46,0,Math.PI*2);
      ctx.stroke();
    }
  }

  // Гипно аура
  if(isHypno){
    const aura=.6+Math.sin(t*.005)*.4;
    ctx.strokeStyle=`rgba(224,64,160,${aura})`;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,-10,46,0,Math.PI*2);
    ctx.stroke();
  }

  // Аксессуары по типу
  if(z.type==='cone'){
    const coneG=ctx.createLinearGradient(-22,0,22,0);
    coneG.addColorStop(0,'#8a3a00');
    coneG.addColorStop(.3,'#d97000');
    coneG.addColorStop(.5,'#ff9500');
    coneG.addColorStop(.7,'#d97000');
    coneG.addColorStop(1,'#8a3a00');
    ctx.fillStyle=coneG;
    ctx.beginPath();
    ctx.moveTo(-22,-36);
    ctx.lineTo(0,-76);
    ctx.lineTo(22,-36);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#5a2000';
    ctx.lineWidth=2.5;
    ctx.stroke();
  }
  if(z.type==='bucket'){
    const bg=ctx.createLinearGradient(-24,0,24,0);
    bg.addColorStop(0,'#3a4a52');
    bg.addColorStop(.25,'#6a7a82');
    bg.addColorStop(.5,'#b8c0c8');
    bg.addColorStop(.75,'#6a7a82');
    bg.addColorStop(1,'#2a3a42');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(-24,-32);
    ctx.lineTo(-22,-70);
    ctx.lineTo(22,-70);
    ctx.lineTo(24,-32);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#1a2a32';
    ctx.lineWidth=2.5;
    ctx.stroke();
  }
  if(z.type==='football'){
    ctx.fillStyle='#b71c1c';
    ctx.beginPath();
    ctx.arc(0,-22,26,Math.PI,0);
    ctx.fill();
    ctx.strokeStyle='#5a0a0a';
    ctx.lineWidth=2.5;
    ctx.stroke();
    // Маска
    ctx.fillStyle='#90a4ae';
    ctx.beginPath();
    ctx.roundRect(-18,-28,36,18,6);
    ctx.fill();
    ctx.strokeStyle='#546e7a';
    ctx.lineWidth=2;
    ctx.stroke();
  }
  if(z.type==='balloon'){
    ctx.strokeStyle='#333';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,-44);
    ctx.lineTo(0,-64);
    ctx.stroke();
    const bg=ctx.createRadialGradient(-6,-76,4,0,-74,22);
    bg.addColorStop(0,'#ff80ab');
    bg.addColorStop(.6,'#e91e63');
    bg.addColorStop(1,'#880e4f');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.ellipse(0,-74,20,24,0,0,Math.PI*2);
    ctx.fill();
  }
  if(z.type==='flag'){
    ctx.strokeStyle='#4e342e';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(20,-40);
    ctx.lineTo(20,10);
    ctx.stroke();
    ctx.fillStyle='#c62828';
    ctx.beginPath();
    ctx.moveTo(20,-38);
    ctx.lineTo(52,-30);
    ctx.lineTo(20,-18);
    ctx.closePath();
    ctx.fill();
  }
  if(z.type==='dancer'){
    ctx.fillStyle='#4a148c';
    ctx.beginPath();
    ctx.arc(0,-28,26,Math.PI,0);
    ctx.fill();
  }

  // Гаргантюа — дубина
  if(isGarg){
    ctx.fillStyle='#5d4037';
    ctx.beginPath();
    ctx.roundRect(-45,-32,14,64,4);
    ctx.fill();
    ctx.strokeStyle='#2d1b12';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#8d6e63';
    ctx.beginPath();
    ctx.roundRect(-48,-38,20,10,3);
    ctx.fill();
    ctx.stroke();
  }

  // Зомбосс — шлем, глаза
  if(isBoss){
    ctx.fillStyle='#4a7a3a';
    ctx.beginPath();
    ctx.arc(0,-18,34,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1a2a0a';
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.fillStyle='#ff8a65';
    ctx.beginPath();
    ctx.arc(0,-22,22,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#ffeb3b';
    ctx.beginPath();
    ctx.arc(-9,-22,5,0,Math.PI*2);
    ctx.arc(9,-22,5,0,Math.PI*2);
    ctx.fill();
    // Корона
    ctx.fillStyle='#ffd700';
    ctx.beginPath();
    ctx.moveTo(-26,-50);
    ctx.lineTo(-22,-70);
    ctx.lineTo(-12,-58);
    ctx.lineTo(0,-76);
    ctx.lineTo(12,-58);
    ctx.lineTo(22,-70);
    ctx.lineTo(26,-50);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#b8860b';
    ctx.lineWidth=2;
    ctx.stroke();
  }

  ctx.restore();

  // HP бар
  if(!dying&&z.hp<z.maxHp&&S.showHPBars){
    ctx.save();
    ctx.globalAlpha=bushAlpha;
    const bw=isBoss?140:isGarg?100:isMini?24:46;
    const by=y-(isBoss?170:isGarg?130:isMini?50:96);
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.beginPath();
    ctx.roundRect(x-bw/2,by,bw,isBoss?12:7,3);
    ctx.fill();
    const pct=z.hp/z.maxHp;
    let fill='#81c784';
    if(pct<=.5)fill='#ffb74d';
    if(pct<=.25)fill='#ef5350';
    ctx.fillStyle=fill;
    ctx.beginPath();
    ctx.roundRect(x-bw/2+1,by+1,(bw-2)*pct,isBoss?10:5,2);
    ctx.fill();
    if(isBoss){
      ctx.fillStyle='#ffeb3b';
      ctx.font='bold 22px Impact, Arial Black, sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.strokeStyle='#000';
      ctx.lineWidth=4;
      ctx.strokeText('ЗОМБОСС',x,by-20);
      ctx.fillText('ЗОМБОСС',x,by-20);
    }
    if(isGarg){
      ctx.fillStyle='#ffeb3b';
      ctx.font='bold 18px Impact, Arial Black, sans-serif';
      ctx.textAlign='center';
      ctx.strokeStyle='#000';
      ctx.lineWidth=3;
      ctx.strokeText('ГАРГАНТЮА',x,by-15);
      ctx.fillText('ГАРГАНТЮА',x,by-15);
    }
    ctx.restore();
  }
}

// [КОНЕЦ ЧАСТИ 9/13]
// [КОНЕЦ ЧАСТИ 9/13]
// ============================================================
// ЧАСТЬ 10/13 — HUD, ПАНЕЛИ, СЕМЕНА, ЛОПАТА, БАННЕР
// ============================================================

function drawTopBar(){
  if(!S.currentLevel)return;
  const seeds=S.currentLevel.seeds.map(id=>ALL_PLANTS[id]).filter(Boolean);
  const panelX=8;
  const panelY=8;
  const packetW=62;
  const packetH=84;
  const sunW=78;
  const hasGlove=S.ownedItems.includes('glove');
  const totalPackets=seeds.length+1+(hasGlove?1:0);
  const panelW=sunW+totalPackets*(packetW+4)+40;

  // Фон панели
  const pg=ctx.createLinearGradient(0,panelY,0,panelY+packetH+12);
  pg.addColorStop(0,'#a87848');
  pg.addColorStop(.3,'#8b5a2b');
  pg.addColorStop(.7,'#6d4c21');
  pg.addColorStop(1,'#3a2410');
  ctx.fillStyle=pg;
  ctx.beginPath();
  ctx.roundRect(panelX-4,panelY-4,panelW,packetH+12,8);
  ctx.fill();
  ctx.strokeStyle='#2d1b08';
  ctx.lineWidth=3;
  ctx.stroke();

  // Солнце
  const sg=ctx.createRadialGradient(panelX+30,panelY+30,3,panelX+30,panelY+30,26);
  sg.addColorStop(0,'#fffde7');
  sg.addColorStop(.5,'#ffd54f');
  sg.addColorStop(1,'#f57f17');
  ctx.fillStyle=sg;
  ctx.beginPath();
  ctx.arc(panelX+30,panelY+30,26,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#e65100';
  ctx.lineWidth=2;
  ctx.stroke();

  // Значение солнца
  ctx.fillStyle='rgba(0,0,0,.65)';
  ctx.beginPath();
  ctx.roundRect(panelX+2,panelY+58,76,22,4);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 18px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(Math.floor(S.sun),panelX+40,panelY+69);

  // Монеты
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.beginPath();
  ctx.roundRect(panelX+82,panelY+58,76,22,4);
  ctx.fill();
  ctx.fillStyle='#ffd700';
  ctx.font='bold 15px Arial';
  ctx.fillText('💰 '+S.coins,panelX+120,panelY+69);

  // Семена
  const startX=panelX+sunW+20;
  for(let i=0;i<seeds.length;i++){
    drawSeedPacket(startX+i*(packetW+4),panelY,packetW,packetH,seeds[i]);
  }

  // Лопата
  const shX=startX+seeds.length*(packetW+4)+4;
  drawShovel(shX,panelY,packetW,packetH);

  // Перчатка
  if(hasGlove){
    const glX=shX+packetW+4;
    drawGlovePacket(glX,panelY,packetW,packetH);
  }

  // === КНОПКА MENU ===
  const menuBtnW=90;
  const menuBtnH=40;
  const menuBtnX=W-menuBtnW-8;
  const menuBtnY=panelY;
  ctx.fillStyle='#7cb342';
  ctx.beginPath();
  ctx.roundRect(menuBtnX,menuBtnY,menuBtnW,menuBtnH,8);
  ctx.fill();
  ctx.strokeStyle='#1e3a08';
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 18px Impact, Arial Black, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('MENU',menuBtnX+menuBtnW/2,menuBtnY+menuBtnH/2);

  // === КНОПКА НАСТРОЕК ===
  const setBtnW=90;
  const setBtnX=menuBtnX-menuBtnW-6;
  ctx.fillStyle='#26a69a';
  ctx.beginPath();
  ctx.roundRect(setBtnX,menuBtnY,setBtnW,menuBtnH,8);
  ctx.fill();
  ctx.strokeStyle='#004d40';
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 20px Arial';
  ctx.fillText('⚙️',setBtnX+setBtnW/2,menuBtnY+menuBtnH/2);
}

function drawSeedPacket(x,y,w,h,seed){
  if(!seed)return;
  const isSelected=S.selectedSeed===seed.id;
  const cd=S.cooldowns[seed.id]||0;
  const ready=cd<=0&&S.sun>=seed.cost;
  const awake=isPlantAwake(seed.id);

  const bg=ctx.createLinearGradient(0,y,0,y+h);
  if(isSelected){
    bg.addColorStop(0,'#fff9c4');
    bg.addColorStop(1,'#ffe082');
  }else{
    bg.addColorStop(0,'#f0e2c0');
    bg.addColorStop(.5,'#d7c9a5');
    bg.addColorStop(1,'#a8956d');
  }
  ctx.fillStyle=bg;
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=isSelected?'#ffeb3b':'#3e2723';
  ctx.lineWidth=isSelected?3:2;
  ctx.strokeRect(x,y,w,h);

  // Иконка растения
  ctx.save();
  ctx.translate(x+w/2,y+h/2-6);
  ctx.scale(.62,.62);
  const fakePlant=seed.id==='potato'?{armed:true,hp:100,maxHp:100}:null;
  drawPlant(seed.id,0,0,S.time,1,fakePlant);
  ctx.restore();

  // Сон
  if(!awake){
    ctx.fillStyle='rgba(20,20,60,.75)';
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#fff';
    ctx.font='bold 24px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('💤',x+w/2,y+h/2-6);
  }

  // Цена
  ctx.fillStyle='rgba(0,0,0,.8)';
  ctx.fillRect(x+2,y+h-18,w-4,16);
  ctx.fillStyle=(ready&&awake)?'#fff':'#ff5252';
  ctx.font='bold 13px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(seed.cost,x+w/2,y+h-9);

  // Кулдаун
  if(cd>0){

  }
}

function drawWaveBanner(){
  if(S.waveBannerTimer<=0)return;
  const t=S.waveBannerTimer;
  const totalDur=2500;
  const elapsed=totalDur-t;
  let alpha=1;
  if(elapsed<300)alpha=elapsed/300;
  else if(t<500)alpha=t/500;

  ctx.save();
  ctx.globalAlpha=alpha;

  const isBig=S.bigWave;
  const bannerH=isBig?160:120;
  const bannerY=H/2-bannerH/2;

  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.fillRect(0,bannerY-20,W,bannerH+40);

  const lineGrad=ctx.createLinearGradient(0,bannerY,W,bannerY);
  lineGrad.addColorStop(0,'rgba(255,255,255,0)');
  lineGrad.addColorStop(.5,isBig?'#ffeb3b':'#fff');
  lineGrad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.strokeStyle=lineGrad;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,bannerY);
  ctx.lineTo(W,bannerY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,bannerY+bannerH);
  ctx.lineTo(W,bannerY+bannerH);
  ctx.stroke();

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const mainSize=isBig?84:64;
  ctx.font=`bold ${mainSize}px Impact, Arial Black, sans-serif`;
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.fillText(S.waveBannerText,W/2+4,H/2+4);

  const textGrad=ctx.createLinearGradient(0,H/2-mainSize/2,0,H/2+mainSize/2);
  if(isBig){
    textGrad.addColorStop(0,'#ffffff');
    textGrad.addColorStop(.4,'#ffeb3b');
    textGrad.addColorStop(1,'#f57f17');
  }else{
    textGrad.addColorStop(0,'#ffffff');
    textGrad.addColorStop(.5,'#e0e0e0');
    textGrad.addColorStop(1,'#9e9e9e');
  }
  ctx.fillStyle=textGrad;
  ctx.strokeStyle='#000';
  ctx.lineWidth=6;
  ctx.strokeText(S.waveBannerText,W/2,H/2);
  ctx.fillText(S.waveBannerText,W/2,H/2);

  if(S.waveBannerSub){
    ctx.font=`bold ${isBig?32:24}px Impact, Arial Black, sans-serif`;
    ctx.fillStyle=isBig?'#ffeb3b':'#fff';
    ctx.strokeStyle='#000';
    ctx.lineWidth=4;
    ctx.strokeText(S.waveBannerSub,W/2,H/2+mainSize/2+20);
    ctx.fillText(S.waveBannerSub,W/2,H/2+mainSize/2+20);
  }

  ctx.restore();
}

function drawGameScene(){
  ensureBackgrounds();

  if(S.location==='roof'){if(bgCacheRoof)ctx.drawImage(bgCacheRoof,0,0);}
  else if(S.location==='night'){if(bgCacheYardNight)ctx.drawImage(bgCacheYardNight,0,0);}
  else if(S.location==='pool'){if(bgCachePool)ctx.drawImage(bgCachePool,0,0);}
  else if(S.location==='nightpool'){if(bgCacheNightPool)ctx.drawImage(bgCacheNightPool,0,0);}
  else{if(bgCacheYard)ctx.drawImage(bgCacheYard,0,0);}

  for(const c of S.craters){
    const a=clamp(c.life/c.maxLife,0,1);
    ctx.save();
    ctx.globalAlpha=a*.9;
    ctx.fillStyle='#1a1008';
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,34,13,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  for(const rk of S.rakes)drawRake(rk);

  for(let r=0;r<ROWS;r++){
    const m=S.mowers[r];
    if(!m||(m.used&&!m.active))continue;
    const isPool=(S.location==='pool'||S.location==='nightpool')&&r>=2&&r<4;
    drawMower(m.x,cellCY(r)+20,isPool);
  }

  // Подсветка клетки
  if((S.selectedSeed||S.shovelSelected||S.gloveSelected)&&
      S.cursorX>=GRID_X&&S.cursorX<=GRID_X+GRID_W&&
      S.cursorY>=activeTop()&&S.cursorY<=activeBottom()){
    const c=Math.floor((S.cursorX-GRID_X)/CELL_W);
    const r=Math.floor((S.cursorY-activeTop())/CELL_H);
    if(c>=0&&c<COLS&&r>=0&&r<ROWS){
      const cellX=GRID_X+c*CELL_W;
      const cellY=activeTop()+r*CELL_H;
      const occupied=getPlantAt(r,c);
      let fill='rgba(255,235,59,.3)';
      let stroke='#ffeb3b';
      if(S.shovelSelected){fill='rgba(244,67,54,.3)';stroke='#f44336';}
      else if(S.gloveSelected){fill='rgba(100,200,255,.3)';stroke='#4fc3f7';}
      else if(occupied){fill='rgba(244,67,54,.3)';stroke='#f44336';}
      ctx.fillStyle=fill;
      ctx.fillRect(cellX,cellY,CELL_W,CELL_H);
      ctx.strokeStyle=stroke;
      ctx.lineWidth=3;
      ctx.strokeRect(cellX+1,cellY+1,CELL_W-2,CELL_H-2);
    }
  }

  for(const p of S.plants)drawPlant(p.type,cellCX(p.col),cellCY(p.row),S.time,1,p);
  for(const p of S.projectiles)drawProjectile(p);
  for(const s of S.suns)drawSun(s);
  for(const c of S.coinsOnGround)drawCoin(c);
  for(const z of S.zombies)drawZombie(z,S.time);

  if(S.location!=='roof'){
    ensureBushes();
    if(bushesCache)ctx.drawImage(bushesCache,0,0);
  }

  drawParticles();

  if(S.gloveHolding&&S.cursorX>0){
    ctx.globalAlpha=.85;
    drawPlant(S.gloveHolding.type,S.cursorX,S.cursorY,S.time,1,S.gloveHolding);
    ctx.globalAlpha=1;
  }
  if(S.selectedSeed&&S.cursorX>0){
    ctx.globalAlpha=.7;
    drawPlant(S.selectedSeed,S.cursorX,S.cursorY,S.time,1.05,null);
    ctx.globalAlpha=1;
  }

  drawTopBar();
  drawBottomBar();
  drawWaveBanner();

  if(S.boosterTimer>0){
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.beginPath();
    ctx.roundRect(W/2-100,55,200,30,8);
    ctx.fill();
    ctx.strokeStyle='#ffeb3b';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#ffeb3b';
    ctx.font='bold 18px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('⚡ Ускоритель: '+Math.ceil(S.boosterTimer/1000)+'с',W/2,70);
  }
}

function drawGameOverScreen(){
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  if(S.won){
    ctx.font='bold 72px Impact, Arial Black, sans-serif';
    ctx.strokeStyle='#000';
    ctx.lineWidth=8;
    ctx.strokeText('УРОВЕНЬ ПРОЙДЕН!',W/2,H/2-120);
    const tg=ctx.createLinearGradient(0,H/2-160,0,H/2-80);
    tg.addColorStop(0,'#ffffff');
    tg.addColorStop(.5,'#ffe082');
    tg.addColorStop(1,'#ffb300');
    ctx.fillStyle=tg;
    ctx.fillText('УРОВЕНЬ ПРОЙДЕН!',W/2,H/2-120);

    const stars=S.currentLevel.id>0?(S.levelStars[S.currentLevel.id]||0):3;
    for(let i=0;i<3;i++){
      ctx.fillStyle=i<stars?'#ffeb3b':'rgba(255,255,255,.2)';
      const sx=W/2-100+i*100;
      const sy=H/2-10;
      const r=40;
      ctx.beginPath();
      for(let j=0;j<10;j++){
        const a=(j/10)*Math.PI*2-Math.PI/2;
        const rad=j%2===0?r:r*.5;
        const px=sx+Math.cos(a)*rad;
        const py=sy+Math.sin(a)*rad;
        if(j===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='#000';
      ctx.lineWidth=3;
      ctx.stroke();
    }

    if(S.currentLevel.reward&&S.ownedPlants.includes(S.currentLevel.reward)){
      ctx.fillStyle='#8bc34a';
      ctx.font='bold 26px Impact, Arial Black, sans-serif';
      ctx.fillText('🎁 Награда: '+ALL_PLANTS[S.currentLevel.reward].name,W/2,H/2+70);
    }
    if(S.minigameType){
      ctx.fillStyle='#ffeb3b';
      ctx.font='bold 28px Arial';
      ctx.fillText('🏅 Счёт: '+S.minigameScore,W/2,H/2+100);
    }
    ctx.fillStyle='#fff';
    ctx.font='bold 26px Arial';
    ctx.fillText('Кликните для продолжения',W/2,H/2+150);
  }else{
    ctx.font='bold 72px Impact, Arial Black, sans-serif';
    ctx.fillStyle='#f44336';
    ctx.strokeStyle='#000';
    ctx.lineWidth=8;
    ctx.strokeText('ПОРАЖЕНИЕ',W/2,H/2-40);
    ctx.fillText('ПОРАЖЕНИЕ',W/2,H/2-40);
    ctx.fillStyle='#fff';
    ctx.font='bold 26px Arial';
    ctx.fillText('Кликните, чтобы попробовать снова',W/2,H/2+40);
  }
}

}

function drawLevelSelect(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1a3a');
  bg.addColorStop(1,'#0a0510');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold 44px Impact, Arial Black, sans-serif';
  ctx.strokeStyle='#000';
  ctx.lineWidth=6;
  ctx.strokeText('ВЫБОР УРОВНЯ',W/2,45);
  ctx.fillStyle='#ffb300';
  ctx.fillText('ВЫБОР УРОВНЯ',W/2,45);

  drawBackBtn(20,20,140,50);
  S.levelNodes=[];

  const cardW=220;
  const cardH=460;
  const gap=14;
  const locations=[
    {key:'yard',levels:LEVELS.filter(l=>l.location==='yard'),name:'ДВОР',color:'#5cc42e'},
    {key:'night',levels:LEVELS.filter(l=>l.location==='night'),name:'НОЧЬ',color:'#3a4a8a'},
    {key:'pool',levels:LEVELS.filter(l=>l.location==='pool'),name:'БАССЕЙН',color:'#1a6a9a'},
    {key:'nightpool',levels:LEVELS.filter(l=>l.location==='nightpool'),name:'НОЧН.БАССЕЙН',color:'#1a2a5a'},
    {key:'roof',levels:LEVELS.filter(l=>l.location==='roof'),name:'КРЫША',color:'#a85030'}
  ];

  const totalW=cardW*5+gap*4;
  const startX=(W-totalW)/2;

  for(let i=0;i<locations.length;i++){
    const loc=locations[i];
    const cx=startX+i*(cardW+gap);
    const cy=100;

    const g=ctx.createLinearGradient(cx,cy,cx,cy+cardH);
    g.addColorStop(0,loc.color);
    g.addColorStop(1,'#0a0510');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(cx,cy,cardW,cardH,16);
    ctx.fill();
    ctx.strokeStyle=loc.color;
    ctx.lineWidth=4;
    ctx.stroke();

    ctx.fillStyle='#fff';
    ctx.font='bold 18px Impact, Arial Black, sans-serif';
    ctx.fillText(loc.name,cx+cardW/2,cy+30);

    const btnW=55;
    const btnH=45;
    const cols=3;
    const startBtnX=cx+(cardW-cols*btnW-(cols-1)*6)/2;
    const startBtnY=cy+85;

    for(let j=0;j<loc.levels.length;j++){
      const lvl=loc.levels[j];
      const col=j%cols;
      const row=Math.floor(j/cols);
      const bx=startBtnX+col*(btnW+6);
      const by=startBtnY+row*(btnH+6);
      const lvlLocked=lvl.id>S.unlockedLevels;
      const isBoss=!!lvl.boss;

      const bg2=ctx.createLinearGradient(0,by,0,by+btnH);
      if(lvlLocked){
        bg2.addColorStop(0,'#444');
        bg2.addColorStop(1,'#222');
      }else if(isBoss){
        bg2.addColorStop(0,'#d32f2f');
        bg2.addColorStop(1,'#7f0000');
      }else{
        bg2.addColorStop(0,'#8bc34a');
        bg2.addColorStop(1,'#33691e');
      }
      ctx.fillStyle=bg2;
      ctx.beginPath();
      ctx.roundRect(bx,by,btnW,btnH,8);
      ctx.fill();
      ctx.strokeStyle='#1a2a0a';
      ctx.lineWidth=2;
      ctx.stroke();

      ctx.fillStyle=lvlLocked?'#666':'#fff';
      ctx.font='bold 13px Impact, Arial Black, sans-serif';
      ctx.fillText(isBoss?'👹':lvl.name,bx+btnW/2,by+btnH/2);

      if(!lvlLocked)S.levelNodes.push({level:lvl,x:bx,y:by,w:btnW,h:btnH});
    }
  }
}

function drawSeedSelect(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1a0f25';
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold 48px Impact, Arial Black, sans-serif';
  ctx.fillStyle='#ffb300';
  ctx.fillText('ВЫБЕРИ РАСТЕНИЯ',W/2,60);

  ctx.font='bold 22px Arial';
  ctx.fillStyle='#fff';
  ctx.fillText('Слотов: '+S.seedSelectMaxSlots,W/2,110);

  const slotSize=80;
  const slotGap=10;
  const maxSlots=Math.min(S.seedSelectMaxSlots,10);
  const slotRowW=maxSlots*slotSize+(maxSlots-1)*slotGap;
  const slotRowX=(W-slotRowW)/2;
  const slotRowY=150;

  ctx.fillStyle='rgba(80,50,20,.7)';
  ctx.beginPath();
  ctx.roundRect(slotRowX-15,slotRowY-15,slotRowW+30,slotSize+30,12);
  ctx.fill();
  ctx.strokeStyle='#8b5a2b';
  ctx.lineWidth=4;
  ctx.stroke();

  for(let i=0;i<maxSlots;i++){
    const sx=slotRowX+i*(slotSize+slotGap);
    const chosen=S.seedSelectChosen[i];
    if(chosen&&ALL_PLANTS[chosen]){
      ctx.fillStyle='#f0e2c0';
      ctx.fillRect(sx,slotRowY,slotSize,slotSize);
      ctx.strokeStyle='#8b5a2b';
      ctx.lineWidth=3;
      ctx.strokeRect(sx,slotRowY,slotSize,slotSize);
      ctx.save();
      ctx.translate(sx+slotSize/2,slotRowY+slotSize/2-8);
      ctx.scale(.75,.75);
      drawPlant(chosen,0,0,S.time,1,null);
      ctx.restore();
    }else{
      ctx.fillStyle='rgba(0,0,0,.5)';
      ctx.fillRect(sx,slotRowY,slotSize,slotSize);
      ctx.strokeStyle='#666';
      ctx.lineWidth=2;
      ctx.strokeRect(sx+2,slotRowY+2,slotSize-4,slotSize-4);
      ctx.fillStyle='#555';
      ctx.font='bold 32px Arial';
      ctx.fillText('+',sx+slotSize/2,slotRowY+slotSize/2);
    }
  }

  ctx.font='bold 22px Arial';
  ctx.fillStyle='#fff';
  ctx.fillText('Твои растения ('+S.seedSelectAvailable.length+')',W/2,290);

  const availSize=60;
  const availGap=8;
  const perRow=15;
  const availRowX=(W-Math.min(perRow,S.seedSelectAvailable.length)*availSize)/2;
  const availRowY=320;
  S.seedSelectCardRects=[];

  for(let i=0;i<S.seedSelectAvailable.length;i++){
    const seedId=S.seedSelectAvailable[i];
    const def=ALL_PLANTS[seedId];
    if(!def)continue;
    const col=i%perRow;
    const row=Math.floor(i/perRow);
    const ax=availRowX+col*(availSize+availGap);
    const ay=availRowY+row*(availSize+availGap);
    const isChosen=S.seedSelectChosen.includes(seedId);

    ctx.fillStyle=isChosen?'#ffe082':'#f0e2c0';
    ctx.beginPath();
    ctx.roundRect(ax,ay,availSize,availSize,6);
    ctx.fill();
    ctx.strokeStyle=isChosen?'#4caf50':'#8b5a2b';
    ctx.lineWidth=isChosen?4:2;
    ctx.stroke();

    ctx.save();
    ctx.translate(ax+availSize/2,ay+availSize/2-6);
    ctx.scale(.55,.55);
    drawPlant(seedId,0,0,S.time,1,null);
    ctx.restore();

    S.seedSelectCardRects.push({seedId,x:ax,y:ay,w:availSize,h:availSize});
  }

  drawBackBtn(40,H-90,180,60);
  S.seedSelectBackBtn={x:40,y:H-90,w:180,h:60};

  const startW=320;
  const startH=80;
  const startX=W-startW-40;
  const startY=H-100;
  const canStart=S.seedSelectChosen.length>0;
  ctx.fillStyle=canStart?'#8bc34a':'#666';
  ctx.beginPath();
  ctx.roundRect(startX,startY,startW,startH,16);
  ctx.fill();
  ctx.strokeStyle='#1e3a08';
  ctx.lineWidth=4;
  ctx.stroke();
  ctx.fillStyle=canStart?'#fff':'#aaa';
  ctx.font='bold 36px Impact, Arial Black, sans-serif';
  ctx.fillText('В БОЙ!',startX+startW/2,startY+startH/2);
  S.seedSelectStartBtn={x:startX,y:startY,w:startW,h:startH,enabled:canStart};
}

function drawShopCards(){
  const page=SHOP_PAGES[S.shopPage]||[];
  const startX=W/2-280;
  const startY=180;
  const cardW=560;
  const cardH=110;
  const gapY=18;

  S.shopCards=[];

  for(let i=0;i<page.length;i++){
    const item=page[i];
    const ix=startX;
    const iy=startY+i*(cardH+gapY);
    const iw=cardW;
    const ih=cardH;

    let owned=false;
    if(item.type==='plant')owned=S.ownedPlants.includes(item.plantId);
    else if(item.type==='item')owned=S.ownedItems.includes(item.id);
    else if(item.type==='upgrade'&&item.isSlot)owned=S.extraSlots>=(item.slotIdx||1);
    else if(item.type==='upgrade'&&item.isIronSpike)owned=S.ownedItems.includes('spikeweed_iron');

    const canAfford=S.coins>=item.price;
    S.shopCards.push({x:ix,y:iy,w:iw,h:ih,item:item,owned:owned,canAfford:canAfford});

    const cardHover=S.cursorX>=ix&&S.cursorX<=ix+iw&&S.cursorY>=iy&&S.cursorY<=iy+ih;

    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.roundRect(ix+5,iy+6,iw,ih,15);
    ctx.fill();

    const bg=ctx.createLinearGradient(ix,iy,ix,iy+ih);
    if(owned){
      bg.addColorStop(0,'rgba(100,180,100,.95)');
      bg.addColorStop(1,'rgba(60,120,60,.95)');
    }else if(cardHover){
      bg.addColorStop(0,'#fffde7');
      bg.addColorStop(1,'#ffe082');
    }else{
      bg.addColorStop(0,'#fffef8');
      bg.addColorStop(.5,'#f5e8c8');
      bg.addColorStop(1,'#e0d0a0');
    }
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.roundRect(ix,iy,iw,ih,15);
    ctx.fill();
    ctx.strokeStyle=owned?'#2e7d32':(cardHover?'#ffd700':'#8b5a2b');
    ctx.lineWidth=cardHover?4:3;
    ctx.stroke();

    const iconX=ix+70;
    const iconY=iy+ih/2;
    const iconR=42;

    const circleG=ctx.createRadialGradient(iconX-10,iconY-10,5,iconX,iconY,iconR);
    if(owned){
      circleG.addColorStop(0,'#c8e6c9');
      circleG.addColorStop(1,'#4caf50');
    }else{
      circleG.addColorStop(0,'#fff9c4');
      circleG.addColorStop(.7,'#ffd54f');
      circleG.addColorStop(1,'#f9a825');
    }
    ctx.fillStyle=circleG;
    ctx.beginPath();
    ctx.arc(iconX,iconY,iconR,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=owned?'#1b5e20':'#8a6400';
    ctx.lineWidth=3;
    ctx.stroke();

    if(item.type==='plant'&&ALL_PLANTS[item.plantId]){
      ctx.save();
      ctx.translate(iconX,iconY+10);
      ctx.scale(.75,.75);
      drawPlant(item.plantId,0,0,S.time,1,null);
      ctx.restore();
    }else if(item.icon){
      ctx.font='bold 48px Arial';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(item.icon,iconX,iconY);
    }

    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.font='bold 22px Impact, Arial Black, sans-serif';
    ctx.fillStyle=owned?'#1b5e20':'#3e2723';
    ctx.fillText(item.name,ix+130,iy+32);

    ctx.font='italic 15px Trebuchet MS, Arial';
    ctx.fillStyle=owned?'#2e7d32':'#5d4037';
    ctx.fillText(item.desc,ix+130,iy+60);

    if(owned){
      ctx.fillStyle='#1b5e20';
      ctx.font='bold 22px Impact, Arial Black, sans-serif';
      ctx.textAlign='right';
      ctx.fillText('✓ КУПЛЕНО',ix+iw-25,iy+ih/2);
    }else{
      const priceX=ix+iw-180;
      const priceY=iy+ih/2;

      const coinG=ctx.createRadialGradient(priceX-3,priceY-3,3,priceX,priceY,18);
      coinG.addColorStop(0,'#fff59d');
      coinG.addColorStop(.5,'#ffd700');
      coinG.addColorStop(1,'#b8860b');
      ctx.fillStyle=coinG;
      ctx.beginPath();
      ctx.arc(priceX,priceY,18,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle=canAfford?'#8a6400':'#5a0000';
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.fillStyle='#8a6400';
      ctx.font='bold 18px Arial';
      ctx.textAlign='center';
      ctx.fillText('$',priceX,priceY+1);

      ctx.textAlign='left';
      ctx.font='bold 24px Impact, Arial Black, sans-serif';
      ctx.fillStyle=canAfford?'#8a6400':'#a02020';
      ctx.fillText(item.price,priceX+25,priceY+2);
    }
  }
}

function drawShopNav(){
  const btnW=180;
  const btnH=70;
  const btnY=H-95;
  const prevX=W/2-btnW-20;
  const nextX=W/2+20;

  const prevHover=S.cursorX>=prevX&&S.cursorX<=prevX+btnW&&S.cursorY>=btnY&&S.cursorY<=btnY+btnH;
  const prevBg=ctx.createLinearGradient(0,btnY,0,btnY+btnH);
  if(prevHover){prevBg.addColorStop(0,'#ef5350');prevBg.addColorStop(1,'#c62828');}
  else{prevBg.addColorStop(0,'#e53935');prevBg.addColorStop(1,'#8a1a1a');}
  ctx.fillStyle=prevBg;
  ctx.beginPath();
  ctx.roundRect(prevX,btnY,btnW,btnH,14);
  ctx.fill();
  ctx.strokeStyle='#5a0000';
  ctx.lineWidth=4;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 28px Impact, Arial Black, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('◄ НАЗАД',prevX+btnW/2,btnY+btnH/2);
  S.shopPageBtns.prev={x:prevX,y:btnY,w:btnW,h:btnH};

  const nextHover=S.cursorX>=nextX&&S.cursorX<=nextX+btnW&&S.cursorY>=btnY&&S.cursorY<=btnY+btnH;
  const nextBg=ctx.createLinearGradient(0,btnY,0,btnY+btnH);
  if(nextHover){nextBg.addColorStop(0,'#66bb6a');nextBg.addColorStop(1,'#2e7d32');}
  else{nextBg.addColorStop(0,'#4caf50');nextBg.addColorStop(1,'#1b5e20');}
  ctx.fillStyle=nextBg;
  ctx.beginPath();
  ctx.roundRect(nextX,btnY,btnW,btnH,14);
  ctx.fill();
  ctx.strokeStyle='#1b5e20';
  ctx.lineWidth=4;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.fillText('ВПЕРЁД ►',nextX+btnW/2,btnY+btnH/2);
  S.shopPageBtns.next={x:nextX,y:btnY,w:btnW,h:btnH};

  const dotsY=btnY-25;
  for(let i=0;i<SHOP_PAGES.length;i++){
    const dx=W/2-(SHOP_PAGES.length-1)*15/2+i*15;
    ctx.fillStyle=i===S.shopPage?'#ffd700':'rgba(255,255,255,.4)';
    ctx.beginPath();
    ctx.arc(dx,dotsY,i===S.shopPage?8:6,0,Math.PI*2);
    ctx.fill();
  }
}

function buyShopItem(card){
  const item=card.item;
  if(card.owned)return;
  if(S.coins<item.price){
    showSaveToast('❌ Не хватает монет!');
    Sound.play('error');
    return;
  }
  S.coins-=item.price;
  Sound.play('shop');

  if(item.type==='plant'){
    if(!S.ownedPlants.includes(item.plantId)&&ALL_PLANTS[item.plantId]){
      S.ownedPlants.push(item.plantId);
      showSaveToast('✅ Куплено: '+item.name);
    }
  }else if(item.type==='item'){
    if(!S.ownedItems.includes(item.id)){
      S.ownedItems.push(item.id);
      showSaveToast('✅ Куплено: '+item.name);
    }
  }else if(item.type==='upgrade'&&item.isSlot){
    S.extraSlots=(S.extraSlots||0)+1;
    S.seedSelectMaxSlots=6+S.extraSlots;
    showSaveToast('✅ Слотов: '+S.seedSelectMaxSlots);
  }else if(item.type==='upgrade'&&item.isIronSpike){
    if(!S.ownedItems.includes('spikeweed_iron')){
      S.ownedItems.push('spikeweed_iron');
      S.ironSpikeOwned=true;
      showSaveToast('✅ Куплено: '+item.name);
    }
  }else if(item.type==='watering'){
    S.treeWater+=(item.wateringCount||1);
    showSaveToast('💧 +'+(item.wateringCount||1)+' поливок');
  }

  S.shopSpeech=SHOP_PHRASES[Math.floor(Math.random()*SHOP_PHRASES.length)];
  saveProgress(true);
}

function drawTreeCanvas(x,y,level,scale=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  const levelScale=1+Math.min(level,100)*0.02;
  ctx.scale(levelScale,levelScale);

  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(0,0,80,20,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#4e342e';
  for(let i=0;i<5;i++){
    const a=Math.PI*(0.1+i*0.2);
    const rootLen=20+Math.min(level,50)*0.5;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(Math.cos(a)*rootLen*0.5,Math.sin(a)*-5,Math.cos(a)*rootLen,Math.sin(a)*3);
    ctx.lineTo(Math.cos(a)*rootLen+8,Math.sin(a)*3+3);
    ctx.quadraticCurveTo(Math.cos(a)*rootLen*0.5+5,Math.sin(a)*-2,8,0);
    ctx.fill();
  }

  const trunkW=30+Math.min(level,100)*0.4;
  const trunkH=180+Math.min(level,100)*0.6;

  const trunkG=ctx.createLinearGradient(-trunkW/2,0,trunkW/2,0);
  trunkG.addColorStop(0,'#3e2723');
  trunkG.addColorStop(.3,'#6d4c21');
  trunkG.addColorStop(.6,'#8b5a2b');
  trunkG.addColorStop(.85,'#6d4c21');
  trunkG.addColorStop(1,'#3e2723');
  ctx.fillStyle=trunkG;
  ctx.beginPath();
  ctx.moveTo(-trunkW/2,0);
  ctx.lineTo(-trunkW*0.35,-trunkH);
  ctx.lineTo(trunkW*0.35,-trunkH);
  ctx.lineTo(trunkW/2,0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#2d1b12';
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.strokeStyle='rgba(45,27,18,.5)';
  ctx.lineWidth=1;
  for(let i=0;i<8;i++){
    const ty=-trunkH*(0.1+i*0.1);
    ctx.beginPath();
    ctx.moveTo(-trunkW*0.3,ty);
    ctx.quadraticCurveTo(0,ty+5,trunkW*0.3,ty);
    ctx.stroke();
  }

  const leafClusters=3+Math.floor(level/10);
  const leafBaseR=40+Math.min(level,100)*0.5;

  const branches=[
    {x:-60,y:-trunkH*0.7,r:leafBaseR*0.7},
    {x:60,y:-trunkH*0.75,r:leafBaseR*0.75},
    {x:-30,y:-trunkH*0.9,r:leafBaseR*0.8},
    {x:30,y:-trunkH*0.85,r:leafBaseR*0.85},
    {x:0,y:-trunkH-30,r:leafBaseR},
    {x:-50,y:-trunkH*0.55,r:leafBaseR*0.6},
    {x:50,y:-trunkH*0.5,r:leafBaseR*0.6}
  ];

  for(let i=0;i<Math.min(branches.length,leafClusters+2);i++){
    const b=branches[i];
    ctx.strokeStyle='#5d4037';
    ctx.lineWidth=6-i*0.5;
    ctx.beginPath();
    ctx.moveTo(0,-trunkH+30);
    ctx.quadraticCurveTo(b.x*0.5,-trunkH*0.5+20,b.x,b.y+15);
    ctx.stroke();
  }

  for(let i=0;i<Math.min(branches.length,leafClusters+2);i++){
    const b=branches[i];
    const lg=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.2,b.x,b.y,b.r);
    lg.addColorStop(0,'#81c784');
    lg.addColorStop(.4,'#4caf50');
    lg.addColorStop(.8,'#2e7d32');
    lg.addColorStop(1,'#1b5e20');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';
    ctx.beginPath();
    ctx.ellipse(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.4,b.r*0.25,-0.5,0,Math.PI*2);
    ctx.fill();
  }

  if(level>=10){
    const fruitCount=Math.min(Math.floor(level/10),10);
    for(let i=0;i<fruitCount;i++){
      const a=(i/fruitCount)*Math.PI*2+S.time*0.001;
      const fx=Math.cos(a)*(leafBaseR+20);
      const fy=-trunkH*0.7+Math.sin(a)*(leafBaseR*0.5);
      const appleG=ctx.createRadialGradient(fx-3,fy-3,2,fx,fy,12);
      appleG.addColorStop(0,'#fff59d');
      appleG.addColorStop(.5,'#ffd700');
      appleG.addColorStop(1,'#b8860b');
      ctx.fillStyle=appleG;
      ctx.beginPath();
      ctx.arc(fx,fy,10,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#7a5a08';
      ctx.lineWidth=1.5;
      ctx.stroke();
    }
  }

  ctx.restore();
}

function waterTree(){
  if(S.treeWater<=0){
    showSaveToast('❌ Нет поливки!');
    Sound.play('error');
    return;
  }
  S.treeWater--;
  Sound.play('water');

  if(S.treeWater<=0){
    S.treeLevel++;
    S.treeWaterNeeded=5+S.treeLevel*3;
    S.treeWater=S.treeWaterNeeded;

    showSaveToast('🌳 Дерево выросло! Ур. '+S.treeLevel+'!');
    Sound.play('levelup');

    if(S.treeLevel%10===0){
      const allPlantsList=Object.keys(ALL_PLANTS).filter(p=>!S.ownedPlants.includes(p));
      if(allPlantsList.length>0){
        const newPlant=allPlantsList[Math.floor(Math.random()*allPlantsList.length)];
        S.ownedPlants.push(newPlant);
        showSaveToast('🌻 Новое растение: '+ALL_PLANTS[newPlant].name);
        Sound.play('reward');
      }
    }

    if(S.treeLevel>=10)unlockAchievement('tree_10');
    if(S.treeLevel>=25)unlockAchievement('tree_25');
    if(S.treeLevel>=50)unlockAchievement('tree_50');
    if(S.treeLevel>=100)unlockAchievement('tree_100');

    S.flash=0.3;
    S.shake=10;
    for(let i=0;i<50;i++){
      addParticles(W/2,H-250,1,'#a5d66a',8,1200,6);
      addParticles(W/2,H-250,1,'#ffd700',6,1000,4);
    }
  }

  S.treeLastTip=S.time;
  addParticles(W/2,H-250,15,'#4fc3f7',5,600,5);
  saveProgress(true);
}

function buyWatering(pack){
  if(S.coins<pack.price){
    showSaveToast('❌ Не хватает монет!');
    Sound.play('error');
    return;
  }
  S.coins-=pack.price;
  S.treeWater+=pack.count;
  showSaveToast('💧 Куплено '+pack.count+' поливок!');
  Sound.play('shop');
  saveProgress(true);
}

function drawAchievements(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1a3a');
  bg.addColorStop(1,'#0a0510');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const unlocked=Object.keys(S.achievements).length;
  const total=Object.keys(ACHIEVEMENTS).length;
  ctx.font='bold 48px Impact, Arial Black, sans-serif';
  ctx.strokeStyle='#000';
  ctx.lineWidth=8;
  ctx.strokeText('🏆 ДОСТИЖЕНИЯ '+unlocked+'/'+total,W/2,50);
  ctx.fillStyle='#ff6f00';
  ctx.fillText('🏆 ДОСТИЖЕНИЯ '+unlocked+'/'+total,W/2,50);

  drawBackBtn(20,20,140,50);

  const cardW=420;
  const cardH=80;
  const gap=12;
  const cols=2;
  const totalW=cols*cardW+gap;
  const startX=(W-totalW)/2;
  const startY=110;
  const viewTop=startY;
  const viewBottom=H-20;
  const viewH=viewBottom-viewTop;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0,viewTop,W,viewH);
  ctx.clip();

  const achList=Object.entries(ACHIEVEMENTS);
  const rows=Math.ceil(achList.length/cols);
  const contentH=rows*(cardH+gap);
  S.achScrollMax=Math.max(0,contentH-viewH);
  S.achScroll=clamp(S.achScroll,0,S.achScrollMax);

  for(let i=0;i<achList.length;i++){
    const[id,a]=achList[i];
    const unlockedA=!!S.achievements[id];
    const col=i%cols;
    const row=Math.floor(i/cols);
    const cx=startX+col*(cardW+gap);
    const cy=startY+row*(cardH+gap)-S.achScroll;
    if(cy+cardH<viewTop-20||cy>viewBottom+20)continue;

    const g=ctx.createLinearGradient(cx,cy,cx,cy+cardH);
    if(unlockedA){
      g.addColorStop(0,'#ffd54f');
      g.addColorStop(.5,'#ffb300');
      g.addColorStop(1,'#e65100');
    }else{
      g.addColorStop(0,'#3a3a3a');
      g.addColorStop(1,'#1a1a1a');
    }
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(cx,cy,cardW,cardH,12);
    ctx.fill();
    ctx.strokeStyle=unlockedA?'#7f3f00':'#555';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.font='bold 44px Arial';
    ctx.textAlign='center';
    ctx.globalAlpha=unlockedA?1:.4;
    ctx.fillText(a.icon,cx+45,cy+cardH/2);
    ctx.globalAlpha=1;

    ctx.textAlign='left';
    ctx.font='bold 18px Impact, Arial Black, sans-serif';
    ctx.fillStyle=unlockedA?'#3e2723':'#888';
    ctx.fillText(a.name,cx+90,cy+28);

    ctx.font='italic 12px Arial';
    ctx.fillStyle=unlockedA?'#5d4037':'#666';
    ctx.fillText(a.desc,cx+90,cy+52);

    ctx.textAlign='right';
    ctx.font='bold 28px Arial';
    ctx.fillStyle=unlockedA?'#4caf50':'#666';
    ctx.fillText(unlockedA?'✅':'🔒',cx+cardW-15,cy+cardH/2);
  }
  ctx.restore();
}

function triggerExplosion(plant){
  const def=ALL_PLANTS[plant.type];
  if(!def)return;
  const px=cellCX(plant.col);
  const py=cellCY(plant.row);
  Sound.play('explosion');

  if(def.freezeAll){
    let frozenCount=0;
    for(const z of S.zombies){
      if(z.hp<=0)continue;
      z.slowTimer=8000;
      z.frozenStop=true;
      setTimeout(()=>{z.frozenStop=false;},8000);
      frozenCount++;
    }
    S.shake=25;
    S.flash=.6;
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        for(let i=0;i<3;i++)addParticles(cellCX(c),cellCY(r),1,'#4fc3f7',2,800,4);
      }
    }
    if(frozenCount>=20)unlockAchievement('ice_apocalypse');
    Sound.play('freeze');
  }else if(def.fullScreen){
    S.shake=40;
    S.flash=1;
    unlockAchievement('nuclear_master');
    for(const z of S.zombies){
      if(z.hp<=0)continue;
      z.hp-=99999;
      z.hitFlash=300;
    }
    S.craters.push({row:plant.row,col:plant.col,x:px,y:py,life:5000,maxLife:5000});
    addParticles(px,py,60,'#ffffff',10,1000,8);
    addParticles(px,py,40,'#ff5722',8,900,6);
  }else if(def.rowOnly){
    S.shake=25;
    for(const z of S.zombies){
      if(z.hp<=0||z.row!==plant.row)continue;
      z.hp-=def.explode;
    }
    for(let c=0;c<COLS;c++)addParticles(cellCX(c),cellCY(plant.row),8,'#ff5722',6,700,5);
  }else{
    S.shake=18;
    const radiusPx=(def.radius||1.7)*CELL_W;
    for(const z of S.zombies){
      if(z.hp<=0)continue;
      const dx=z.x-px;
      if(Math.abs(dx)<radiusPx&&Math.abs(z.row-plant.row)<=1)z.hp-=def.explode;
    }
    for(let i=0;i<25;i++)addParticles(px,py,1,'#ff5722',8,800,6);
  }

  S.plants=S.plants.filter(p=>p!==plant);
  rebuildPlantCache();
}

function explodePotato(plant){
  S.shake=10;
  Sound.play('explosion');
  addParticles(cellCX(plant.col),cellCY(plant.row),20,'#ff5722',6,700,5);
  for(const z of S.zombies){
    if(z.hp<=0)continue;
    if(Math.abs(z.x-cellCX(plant.col))<60&&Math.abs(z.row-plant.row)<1)z.hp-=1800;
  }
}

function unlockAchievement(id){
  if(S.achievements[id]||!ACHIEVEMENTS[id])return false;
  S.achievements[id]=true;
  S.achievementQueue.push({id,...ACHIEVEMENTS[id],time:S.time});
  Sound.play('achievement');
  return true;
}

function checkAchievements(){
  if(S.totalZombiesDead>0)unlockAchievement('first_blood');
  if(S.totalKillsEver>=100)unlockAchievement('veteran');
  if(S.totalKillsEver>=500)unlockAchievement('warlord');
  if(S.sun>=1000)unlockAchievement('sunflower_farm');
  if(S.unlockedLevels>=20)unlockAchievement('collector');
  if(S.unlockedLevels>=35)unlockAchievement('master');
  if(S.garlicPushes>=5)unlockAchievement('garlic_master');
  if(S.hypnoCount>=10)unlockAchievement('hypno_master');
  if(S.coins>=5000)unlockAchievement('rich');
  if(S.coins>=10000)unlockAchievement('millionaire');
  if(S.ownedPlants.length>=12)unlockAchievement('shopaholic');
  if(S.ownedPlants.length>=30)unlockAchievement('gardner');
  if(S.extraSlots>=1)unlockAchievement('slot_master');
  if(S.rakesUsed>=1)unlockAchievement('rake_user');
  if(S.zombieCoinsCollected>=100)unlockAchievement('coin_farmer');
  if(S.zombieCoinsCollected>=1000)unlockAchievement('coin_tycoon');
  if(S.zombieCoinsCollected>=5000)unlockAchievement('coin_king');
  if(S.treeLevel>=10)unlockAchievement('tree_10');
  if(S.treeLevel>=25)unlockAchievement('tree_25');
  if(S.treeLevel>=50)unlockAchievement('tree_50');
  if(S.treeLevel>=100)unlockAchievement('tree_100');

  if(S.gameOver&&S.won){
    const mowersUsed=S.mowers.filter(m=>m.used).length;
    if(mowersUsed===0)unlockAchievement('no_mowers');
    if(S.location==='night')unlockAchievement('night_owl');
    if(S.location==='roof')unlockAchievement('roof_walker');
    if(S.location==='pool')unlockAchievement('pool_party');
    if(S.location==='nightpool')unlockAchievement('night_swimmer');
    if(S.currentLevel.boss==='zomboss')unlockAchievement('boss_slayer');
    if(S.currentLevel.boss==='gargantuar')unlockAchievement('gargantua_kill');
    const stars=S.levelStars[S.currentLevel.id]||0;
    if(stars===3)unlockAchievement('perfectionist');
    if(S.levelStartTime&&S.time-S.levelStartTime<60000)unlockAchievement('speedrun');
    if(S.unlockedLevels>=2)unlockAchievement('first_win');
    if(S.plantedThisLevel===0)unlockAchievement('chill_master');
    const roofLevels=LEVELS.filter(l=>l.location==='roof');
    if(roofLevels.every(l=>S.levelStars[l.id]>0))unlockAchievement('perfect_roof');
  }

  if(S.minigameType&&S.gameOver&&S.won)unlockAchievement('minigame_win');
  if(S.minigameType==='endless'&&S.currentWave>=10)unlockAchievement('endless_10');
}

function drawAchievementToasts(){
  if(S.achievementQueue.length===0)return;
  const a=S.achievementQueue[0];
  if(!a||!Number.isFinite(a.time)){S.achievementQueue.shift();return;}
  const elapsed=S.time-a.time;
  if(!Number.isFinite(elapsed)){S.achievementQueue.shift();return;}
  if(elapsed>4200){S.achievementQueue.shift();return;}

  const slideIn=Math.min(1,elapsed/400);
  const slideOut=Math.max(0,(elapsed-3600)/600);
  const y=-120+slideIn*130-slideOut*130;
  const boxW=460;
  const boxH=100;
  const boxX=W/2-boxW/2;

  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.beginPath();
  ctx.roundRect(boxX+6,y+6,boxW,boxH,14);
  ctx.fill();

  const g=ctx.createLinearGradient(boxX,y,boxX,y+boxH);
  g.addColorStop(0,'#ffd54f');
  g.addColorStop(.5,'#ffb300');
  g.addColorStop(1,'#e65100');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.roundRect(boxX,y,boxW,boxH,14);
  ctx.fill();
  ctx.strokeStyle='#4a2000';
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.font='bold 50px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(a.icon||'🏆',boxX+60,y+boxH/2);

  ctx.textAlign='left';
  ctx.font='bold 14px Arial';
  ctx.fillStyle='#5d4037';
  ctx.fillText('🏆 ДОСТИЖЕНИЕ',boxX+110,y+25);

  ctx.font='bold 22px Impact, Arial Black, sans-serif';
  ctx.fillStyle='#3e2723';
  ctx.strokeStyle='#fff';
  ctx.lineWidth=3;
  ctx.strokeText(a.name||'?',boxX+110,y+52);
  ctx.fillText(a.name||'?',boxX+110,y+52);

  ctx.font='italic 13px Arial';
  ctx.fillStyle='#5d4037';
  ctx.fillText(a.desc||'',boxX+110,y+78);

  ctx.restore();
}

function startWave(waveNum){
  S.currentWave=waveNum;
  const totalWaves=S.currentLevel.waves||5;
  const isBig=waveNum===totalWaves;
  const isBoss=S.currentLevel.boss&&waveNum===totalWaves;
  const remaining=S.totalZombies-S.spawnedZombies;
  const zombiesInWave=Math.min(remaining,Math.ceil(S.totalZombies/totalWaves));
  S.waveZombiesPerWave=zombiesInWave;
  S.waveZombiesRemaining=zombiesInWave;
  S.waveBannerTimer=2500;
  S.bigWave=isBig;

  if(isBoss){
    if(S.currentLevel.boss==='gargantuar'){
      S.waveBannerText='БОСС: ГАРГАНТЮА!';
      S.waveBannerSub='Держись изо всех сил!';
    }else{
      S.waveBannerText='БОСС: ЗОМБОСС!';
      S.waveBannerSub='Финальная битва!';
    }
  }else if(isBig){
    S.waveBannerText='ОГРОМНАЯ ВОЛНА!';
    S.waveBannerSub='Волна '+waveNum+' из '+totalWaves;
  }else{
    S.waveBannerText='ВОЛНА '+waveNum;
    S.waveBannerSub='из '+totalWaves;
  }
  S.betweenWaves=false;
  S.betweenWavesTimer=0;
  S.zombieSpawnTimer=0;
  Sound.play(isBig||isBoss?'bigwave':'wave');
}

function spawnZombie(){
  const lvl=S.currentLevel;
  const row=Math.floor(Math.random()*ROWS);
  let type='basic';
  const available=lvl.types;
  if(available.length===1)type=available[0];
  else type=available[Math.floor(Math.random()*available.length)];
  const def=ZOMBIE_TYPES[type];

  const z={
    type,row,x:ZOMBIE_SPAWN_X+Math.random()*40,
    hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,
    walkPhase:Math.random()*Math.PI*2,
    slowTimer:0,hitFlash:0,dyingTimer:0,attackTimer:0,
    garlicPushTimer:0,hypnotized:false,y_air:undefined,falling:false,frozenStop:false,
    spikeTimer:0,threwMinions:false
  };

  if(S.minigameFlags.gravity){
    z.y_air=-100;
    z.falling=true;
  }

  S.zombies.push(z);
  S.spawnedZombies++;
}

function gameOver(won){
  if(S.gameOver)return;
  S.gameOver=true;
  S.won=won;
  Sound.play(won?'win':'lose');

  if(won){
    const mowersUsed=S.mowers.filter(m=>m.used).length;
    let stars=1;
    if(mowersUsed===0)stars=3;
    else if(mowersUsed<=2)stars=2;

    const lvlId=S.currentLevel.id;
    if(lvlId>0){
      const prevStars=S.levelStars[lvlId]||0;
      if(stars>prevStars)S.levelStars[lvlId]=stars;
      if(S.unlockedLevels===lvlId&&lvlId<LEVELS.length)S.unlockedLevels=lvlId+1;

      if(S.currentLevel.reward&&ALL_PLANTS[S.currentLevel.reward]&&!S.ownedPlants.includes(S.currentLevel.reward)){
        S.ownedPlants.push(S.currentLevel.reward);
        showSaveToast('🎁 Новое растение: '+ALL_PLANTS[S.currentLevel.reward].name);
      }
    }
    S.totalWinsEver++;
    S.totalKillsEver+=S.totalZombiesDead;

    if(S.minigameType){
      if(S.minigameScore===0)S.minigameScore=S.totalZombiesDead;
      const best=S.minigameBest[S.minigameType]||0;
      if(S.minigameScore>best)S.minigameBest[S.minigameType]=S.minigameScore;
    }

    checkAchievements();
    saveProgress();
  }else{
    S.shake=30;
    S.totalKillsEver+=S.totalZombiesDead;
    saveProgress(true);
  }
}

function update(dt){
  if(dt>100)dt=100;
  const dts=dt/1000;

  if(S.waveBannerTimer>0)S.waveBannerTimer-=dt;
  for(const k in S.cooldowns)S.cooldowns[k]=Math.max(0,S.cooldowns[k]-dt);
  if(S.particles.length>250)S.particles=S.particles.slice(-250);
  if(S.boosterTimer>0)S.boosterTimer-=dt;

  // Магнит собирает монеты
  if(S.magnetActive){
    for(let i=S.coinsOnGround.length-1;i>=0;i--){
      const c=S.coinsOnGround[i];
      S.coins+=c.value||10;
      S.totalCoinsEarned+=c.value||10;
      S.zombieCoinsCollected+=c.value||10;
      addParticles(c.x,c.y,4,'#ffd700',3,300,3);
      S.coinsOnGround.splice(i,1);
      Sound.play('coin');
    }
  }

  // Падение солнца
  if(!S.minigameFlags.sunny){
    S.sunTimer+=dt;
    if(S.sunTimer>6500){
      S.sunTimer=0;
      const x=rand(GRID_X+20,GRID_X+GRID_W-20);
      const targetY=rand(activeTop()+40,activeBottom()-40);
      S.suns.push({x,y:-30,targetY,life:10000,maxLife:10000,vy:1.4,phase:Math.random()*10,value:25});
    }
  }

  // === ЛОГИКА РАСТЕНИЙ ===
  for(const p of S.plants){
    const def=ALL_PLANTS[p.type];
    if(!def)continue;

    // Взрывы
    if(def.explode!==undefined||def.freezeAll||def.fullScreen){
      p.growTimer=(p.growTimer||0)+dt;
      p.fuseDuration=p.fuseDuration||def.fuse||3000;
      if(p.growTimer>=p.fuseDuration)triggerExplosion(p);
      continue;
    }

    if(!isPlantAwake(p.type))continue;
    const boost=S.boosterTimer>0?.5:1;

    // Солнце
    if(p.type==='sunflower'||p.type==='sunshroom'){
      p.sunTimer+=dt;
      const interval=(p.type==='sunshroom'?7000:5500)*boost;
      const amount=p.type==='sunshroom'?15:25;
      if(p.sunTimer>interval){
        p.sunTimer=0;
        S.suns.push({x:cellCX(p.col)+rand(-15,15),y:cellCY(p.row),targetY:cellCY(p.row)+30,life:10000,maxLife:10000,vy:.8,phase:Math.random()*10,value:amount});
      }
    }
    if(p.type==='twinsunflower'){
      p.sunTimer+=dt;
      if(p.sunTimer>5500*boost){
        p.sunTimer=0;
        for(let i=0;i<2;i++){
          S.suns.push({x:cellCX(p.col)+rand(-25,25),y:cellCY(p.row),targetY:cellCY(p.row)+30,life:10000,maxLife:10000,vy:.8,phase:Math.random()*10,value:25});
        }
      }
    }
    if(def.isCoin){
      p.sunTimer+=dt;
      if(p.sunTimer>7000*boost){
        p.sunTimer=0;
        S.coinsOnGround.push({x:cellCX(p.col)+rand(-15,15),y:cellCY(p.row),targetY:cellCY(p.row)+30,life:12000,maxLife:12000,vy:.8,phase:Math.random()*10,value:def.coinValue||10,coinType:'bronze'});
      }
    }

    // Картошка
    if((p.type==='potato'||p.type==='potatomine')&&!p.armed){
      p.armTimer=(p.armTimer||0)+dt;
      if(p.armTimer>15000)p.armed=true;
    }

    // Жеватель (Chomper) — съедает зомби
    if(p.type==='chomper'){
      if(p.chewing){
        p.chewTimer-=dt;
        if(p.chewTimer<=0)p.chewing=false;
      }else{
        p.shootTimer+=dt;
        const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&z.x<YARD_RIGHT&&Math.abs(z.x-cellCX(p.col))<60&&!z.hypnotized);
        if(target&&p.shootTimer>3000*boost){
          p.shootTimer=0;
          p.chewing=true;
          p.chewTimer=6000;
          target.hp-=3000;
          Sound.play('hit');
        }
      }
    }

    // === СТРЕЛКИ (Peashooter, Repeater, etc) ===
    if(['peashooter','snowpea','repeater','threepeater','helmetpea'].includes(p.type)){
      p.shootTimer+=dt;
      const cooldown=(p.type==='snowpea'?1400:1500)*boost;
      let target=null;
      if(p.type==='threepeater'){
        target=S.zombies.find(z=>Math.abs(z.row-p.row)<=1&&z.x<ZOMBIE_ENTER_YARD_X+5&&z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      }else{
        target=S.zombies.find(z=>z.row===p.row&&z.x<ZOMBIE_ENTER_YARD_X+5&&z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      }
      if(target&&p.shootTimer>cooldown){
        p.shootTimer=0;
        Sound.play('shoot');
        if(p.type==='threepeater'){
          for(let dr=-1;dr<=1;dr++){
            const row=p.row+dr;
            if(row<0||row>=ROWS)continue;
            S.projectiles.push({x:cellCX(p.col)+22,y:cellCY(row)-14,row,vx:500,damage:20,trail:[]});
          }
        }else{
          const shots=p.type==='repeater'?2:1;
          for(let i=0;i<shots;i++){
            S.projectiles.push({x:cellCX(p.col)+22,y:cellCY(p.row)-14,row:p.row,vx:500,damage:p.type==='snowpea'?20:25,ice:p.type==='snowpea',delay:i*150,trail:[]});
          }
        }
      }
    }

    // Гатлинг — 4 пули
    if(p.type==='gatlingpea'||p.type==='gatlingpea_s'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.x<ZOMBIE_ENTER_YARD_X+5&&z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      if(target&&p.shootTimer>1500*boost){
        p.shootTimer=0;
        Sound.play('shoot');
        const shots=p.type==='gatlingpea_s'?4:4;
        for(let i=0;i<shots;i++){
          S.projectiles.push({x:cellCX(p.col)+22,y:cellCY(p.row)-14,row:p.row,vx:600,damage:p.type==='gatlingpea_s'?25:20,delay:i*100,trail:[]});
        }
      }
    }

    // Гипногриб — гипнотизирует при съедании
    if(p.type==='hypnoshroom'){
      // Если съеден — обрабатывается в блоке зомби (ниже)
    }

    // Кукурузная пушка (Cob Cannon) — ядерный залп по площади
    if(p.type==='cobcannon'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>Math.abs(z.row-p.row)<=1&&z.x<YARD_RIGHT&&z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      if(target&&p.shootTimer>30000*boost){
        p.shootTimer=0;
        Sound.play('explosion');
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-cellCX(p.col))<500)z.hp-=1800;
        }
        S.shake=20;
        addParticles(cellCX(p.col)+100,cellCY(p.row),50,'#ffeb3b',12,1000,8);
      }
    }

    // Кошкамыш (Cattail) — зенитка, бьёт по воздуху и по земле
    if(p.type==='cattail'||p.type==='catmushroom'||p.type==='bluemushroom'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        const candidates=S.zombies.filter(z=>z.hp>0&&!z.hypnotized&&z.x<YARD_RIGHT);
        if(candidates.length>0){
          const target=candidates.reduce((a,b)=>Math.abs(a.x-cellCX(p.col))<Math.abs(b.x-cellCX(p.col))?a:b);
          const angle=Math.atan2(cellCY(target.row)-cellCY(p.row),target.x-cellCX(p.col));
          S.projectiles.push({x:cellCX(p.col),y:cellCY(p.row)-14,row:p.row,vx:Math.cos(angle)*500,vy:Math.sin(angle)*500,damage:25,trail:[],cattail:true});
          Sound.play('shoot');
        }
      }
    }

    // Шипы
    if(p.type==='spikeweed'||p.type==='iron_spike'){
      const dmgVal=p.type==='iron_spike'?40:(def.dmg||20);
      for(const z of S.zombies){
        if(z.hp<=0||z.hypnotized)continue;
        if(z.row===p.row&&Math.abs(z.x-cellCX(p.col))<40){
          z.spikeTimer=(z.spikeTimer||0)+dt;
          if(z.spikeTimer>500){
            z.spikeTimer=0;
            z.hp-=dmgVal;
            z.hitFlash=150;
          }
        }
      }
    }

    // Магнит
    if(p.type==='magnet')S.magnetActive=true;

    // Дымогриб — урон всем в ряду
    if(p.type==='fumeshroom'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        S.zombies.forEach(z=>{
          if(z.row===p.row&&z.hp>0&&!z.hypnotized&&z.x>cellCX(p.col)-30&&z.x<cellCX(p.col)+120){
            z.hp-=20;
            z.hitFlash=150;
          }
        });
      }
    }

    // Мрачногриб — по 3 рядам
    if(p.type==='gloomyshroom'||p.type==='twinBF'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-cellCX(p.col))<120){
            z.hp-=20;
            z.hitFlash=150;
          }
        }
        addParticles(cellCX(p.col),cellCY(p.row),8,'#a040a0',4,400,5);
      }
    }

    // Грибочек / Трусогриб
    if(p.type==='puffshroom'||p.type==='scaredy'){
      if(p.type==='scaredy'){
        const closeZ=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&Math.abs(z.x-cellCX(p.col))<50);
        if(closeZ)continue;
      }
      p.shootTimer+=dt;
      const range=p.type==='puffshroom'?220:200;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&z.x<cellCX(p.col)+range&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>1500*boost){
        p.shootTimer=0;
        S.projectiles.push({x:cellCX(p.col)+20,y:cellCY(p.row)-14,row:p.row,vx:500,damage:20,spore:true,trail:[]});
        Sound.play('shoot');
      }
    }

    // Кактус — колючки
    if(p.type==='cactus'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&z.x<YARD_RIGHT&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>1500*boost){
        p.shootTimer=0;
        S.projectiles.push({x:cellCX(p.col)+20,y:cellCY(p.row)-14,row:p.row,vx:600,damage:30,trail:[]});
        Sound.play('shoot');
      }
    }

    // Клевер — сбивает воздух
    if(p.type==='clover'){
      p.shootTimer+=dt;
      if(p.shootTimer>3000*boost){
        p.shootTimer=0;
        S.zombies.forEach(z=>{
          if(z.type==='balloon'&&z.hp>0){
            z.type='basic';
            addParticles(z.x,cellCY(z.row)-60,10,'#e91e63',5,600,5);
          }
        });
      }
    }

    // Звезда — стреляет по 5 направлениям
    if(p.type==='starfruit'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        const dirs=[0,Math.PI/4,-Math.PI/4,Math.PI/2,-Math.PI/2];
        for(const angle of dirs){
          S.projectiles.push({x:cellCX(p.col),y:cellCY(p.row)-14,row:p.row,vx:Math.cos(angle)*500,vy:Math.sin(angle)*500,damage:20,trail:[],cattail:true});
        }
        Sound.play('shoot');
      }
    }

    // Арбуз-пушка — по площади
    if(p.type==='melonpult'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&z.x<YARD_RIGHT&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>2000*boost){
        p.shootTimer=0;
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-target.x)<CELL_W*1.5){
            z.hp-=80;
            z.hitFlash=200;
          }
        }
        addParticles(target.x,cellCY(target.row),15,'#4caf50',6,600,5);
        Sound.play('hit');
      }
    }

    // Ледяной арбуз — по площади + заморозка
    if(p.type==='icemelon'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&z.x<YARD_RIGHT&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>2500*boost){
        p.shootTimer=0;
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-target.x)<CELL_W*1.5){
            z.hp-=60;
            z.hitFlash=200;
            z.slowTimer=5000;
            z.frozenStop=true;
            setTimeout(()=>{z.frozenStop=false;},3000);
          }
        }
        addParticles(target.x,cellCY(target.row),20,'#4fc3f7',6,600,5);
        Sound.play('freeze');
      }
    }

    // Кукурузомёт — шанс оглушить
    if(p.type==='kernelpult'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&z.x<YARD_RIGHT&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>1500*boost){
        p.shootTimer=0;
        const isButter=Math.random()<0.25;
        target.hp-=isButter?40:20;
        if(isButter){
          target.slowTimer=3000;
          target.frozenStop=true;
          setTimeout(()=>{z.frozenStop=false;},3000);
        }
        Sound.play('shoot');
      }
    }

    // Зонтик — сбивает парашюты
    if(p.type==='umbrella'){
      S.zombies.forEach(z=>{
        if(z.type==='balloon'&&z.row===p.row&&Math.abs(z.x-cellCX(p.col))<100){
          z.type='basic';
          addParticles(z.x,cellCY(z.row)-60,8,'#e91e63',5,600,5);
        }
      });
    }
  }

  // === СНАРЯДЫ ===
  for(const pr of S.projectiles){
    if(pr.delay>0){pr.delay-=dt;continue;}
    if(pr.cattail){
      pr.x+=(pr.vx||0)*dts;
      pr.y+=(pr.vy||0)*dts;
    }else{
      pr.x+=pr.vx*dts;
    }

    for(let zi=0;zi<S.zombies.length;zi++){
      const z=S.zombies[zi];
      if(z.hp<=0||z.hypnotized)continue;
      if(!pr.cattail&&z.row!==pr.row)continue;
      if(z.x>=YARD_RIGHT)continue;

      const zy=(z.y_air!==undefined&&z.falling)?z.y_air-20:cellCY(z.row)-20;
      if(Math.abs(pr.x-z.x)<28&&Math.abs(pr.y-zy)<55){
        z.hp-=pr.damage;
        z.hitFlash=180;
        if(pr.ice)z.slowTimer=5000;
        if(pr.icemelon){
          z.slowTimer=5000;
          z.frozenStop=true;
          setTimeout(()=>{z.frozenStop=false;},3000);
        }
        addParticles(pr.x,pr.y,4,pr.ice?'#4fc3f7':pr.spore?'#c8a2d8':pr.icemelon?'#4fc3f7':'#8bc34a',3,300,3);
        pr.dead=true;
        break;
      }
    }

    if(pr.x>W+40||pr.x>YARD_RIGHT+5)pr.dead=true;
    if(pr.y<-50||pr.y>H+50)pr.dead=true;
  }
  S.projectiles=S.projectiles.filter(p=>!p.dead);

  // === СОЛНЦЕ / МОНЕТЫ ===
  for(const s of S.suns){
    s.life-=dt;
    if(s.y<s.targetY){
      s.y+=s.vy*dt*.06;
      if(s.y>s.targetY)s.y=s.targetY;
    }
  }
  S.suns=S.suns.filter(s=>s.life>0);

  for(const c of S.coinsOnGround){
    c.life-=dt;
    if(c.y<c.targetY){
      c.y+=c.vy*dt*.06;
      if(c.y>c.targetY)c.y=c.targetY;
    }
  }
  S.coinsOnGround=S.coinsOnGround.filter(c=>c.life>0);

  for(const c of S.craters)c.life-=dt;
  S.craters=S.craters.filter(c=>c.life>0);

  // === ЗОМБИ ===
  for(const z of S.zombies){
    if(z.hp<=0){z.dyingTimer=(z.dyingTimer||0)+dt;continue;}
    if(z.hitFlash>0)z.hitFlash-=dt;
    if(z.slowTimer>0)z.slowTimer-=dt;
    if(z.garlicPushTimer>0)z.garlicPushTimer-=dt;
    z.walkPhase+=dt*.008;

    if(z.hypnotized){
      z.x+=Math.abs(z.speed)*dts*.7;
      if(z.x>ROAD_RIGHT+50||z.x<GRID_X-50){
        z.hp=0;
        z.dyingTimer=800;
        continue;
      }
      for(const other of S.zombies){
        if(other===z||other.hypnotized||other.hp<=0)continue;
        if(other.row===z.row&&Math.abs(other.x-z.x)<40){
          z.attackTimer=(z.attackTimer||0)+dt;
          if(z.attackTimer>800){
            z.attackTimer=0;
            other.hp-=z.dmg;
          }
        }
      }
      continue;
    }

    const col=Math.floor((z.x-GRID_X)/CELL_W);
    const plant=getPlantAt(z.row,col);
    let attacking=false;

    // Грабли
    if(z.x<GRID_X+CELL_W&&S.rakes.length>0){
      for(let i=S.rakes.length-1;i>=0;i--){
        const rk=S.rakes[i];
        if(rk.row===z.row&&Math.abs(rk.x-z.x)<30){
          z.hp=0;
          z.dyingTimer=800;
          S.rakes.splice(i,1);
          S.rakesUsed=(S.rakesUsed||0)+1;
          addParticles(rk.x,rk.y,15,'#8d6e63',5,600,5);
          Sound.play('hit');
          break;
        }
      }
    }

    if(plant&&z.x<YARD_RIGHT&&z.x-cellCX(col)<38&&z.x-cellCX(col)>-15){
      if(plant.type==='hypnoshroom'){
        z.attackTimer=(z.attackTimer||0)+dt;
        if(z.attackTimer>800){
          z.attackTimer=0;
          plant.hp-=z.dmg;
          if(plant.hp<=0){
            z.hypnotized=true;
            z.hp=100;
            z.maxHp=100;
            z.attackTimer=0;
            S.hypnoCount=(S.hypnoCount||0)+1;
            addParticles(z.x,cellCY(z.row),20,'#e040a0',6,700,6);
            S.plants=S.plants.filter(p=>p!==plant);
            rebuildPlantCache();
            Sound.play('reward');
          }
        }
        attacking=true;
      }
      else if(plant.type==='spikeweed'||plant.type==='iron_spike'){
        attacking=false;
      }
      else if(plant.type==='garlic'&&!(z.garlicPushTimer>0)){
        plant.hp-=z.dmg;
        if(plant.hp<=0){
          S.plants=S.plants.filter(p=>p!==plant);
          rebuildPlantCache();
        }
        let targetRow=z.row;
        const canUp=z.row>0;
        const canDown=z.row<ROWS-1;
        if(canUp&&canDown)targetRow=Math.random()<.5?z.row-1:z.row+1;
        else if(canUp)targetRow=z.row-1;
        else if(canDown)targetRow=z.row+1;
        if(targetRow!==z.row){
          z.row=targetRow;
          z.x+=15;
          z.garlicPushTimer=500;
          S.shake=5;
          S.garlicPushes=(S.garlicPushes||0)+1;
        }
        attacking=true;
      }
      else{
        attacking=true;
        z.attackTimer=(z.attackTimer||0)+dt;
        if(z.attackTimer>800){
          z.attackTimer=0;
          plant.hp-=z.dmg;
          if(plant.hp<=0){
            if((plant.type==='potato'||plant.type==='potatomine')&&plant.armed)explodePotato(plant);
            S.plants=S.plants.filter(p=>p!==plant);
            rebuildPlantCache();
          }
        }
      }
    }

    if(!attacking&&!z.falling){
      let speedMul=1;
      if(z.slowTimer>0)speedMul=.5;
      if(z.frozenStop)speedMul=0;
      z.x-=z.speed*speedMul*dts;
    }

    // Косилка
    if(z.x<GRID_X-15&&!z.falling){
      const mower=S.mowers[z.row];
      if(mower&&!mower.used){
        mower.used=true;
        mower.active=true;
        mower.x=GRID_X-30;
        Sound.play('mower');
      }else{
        gameOver(false);
        return;
      }
    }

    // Гаргантюа бросает мини-зомби
    if(z.type==='gargantuar'&&!z.threwMinions&&z.hp<z.maxHp*.5){
      z.threwMinions=true;
      for(let i=0;i<3;i++){
        const row=Math.floor(Math.random()*ROWS);
        S.zombies.push({
          type:'minizombie',row,x:z.x-Math.random()*40,
          hp:50,maxHp:50,speed:22,dmg:60,
          walkPhase:Math.random()*Math.PI*2,
          slowTimer:0,hitFlash:0,dyingTimer:0,attackTimer:0,
          garlicPushTimer:0,hypnotized:false,y_air:undefined,falling:false,frozenStop:false,
          spikeTimer:0,threwMinions:false
        });
      }
      S.shake=15;
      addParticles(z.x,cellCY(z.row),25,'#7a3a8a',8,800,6);
    }
  }

  // Косилки
  for(const m of S.mowers){
    if(m.active){
      m.x+=700*dts;
      for(const z of S.zombies){
        if(z.row===m.row&&z.hp>0&&z.x<m.x+40&&z.x>m.x-60)z.hp=0;
      }
      if(m.x>W+60)m.active=false;
    }
  }

  // Смерть зомби
  for(const z of S.zombies){
    if(z.hp<=0&&!z._deadCounted){
      z._deadCounted=true;
      S.totalZombiesDead++;
      S.killedZombies++;
      Sound.play('zombieDie');
      const def=ZOMBIE_TYPES[z.type];
      if(def){
        if(def.coins){
          S.coins+=def.coins;
          S.totalCoinsEarned+=def.coins;
          S.zombieCoinsCollected+=def.coins;
        }
        if(def.dropChance&&Math.random()<def.dropChance){
          S.coinsOnGround.push({
            x:z.x,
            y:cellCY(z.row)-20,
            targetY:cellCY(z.row)+20,
            life:12000,maxLife:12000,vy:.8,
            phase:Math.random()*10,
            value:def.coins||10,
            coinType:def.coinType||'bronze'
          });
        }
      }
    }
  }
  S.zombies=S.zombies.filter(z=>!(z.hp<=0&&z.dyingTimer>800));

  // Частицы
  for(const p of S.particles){
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=p.gravity;
    p.vx*=.98;
    p.life-=dt;
  }
  S.particles=S.particles.filter(p=>p.life>0);

  // === СПАВН ЗОМБИ ===
  const totalWaves=S.currentLevel.waves||5;
  S.zombieSpawnTimer+=dt;
  const spawnInterval=S.currentLevel.spawnInterval||5000;
  let effectiveInterval=spawnInterval;
  if(S.minigameFlags.endless)effectiveInterval=Math.max(800,spawnInterval*Math.pow(.92,S.currentWave-1));

  if(S.minigameFlags.endless||S.minigameFlags.sunny){
    const aliveZ=S.zombies.filter(z=>z.hp>0).length;
    if(aliveZ<MAX_ALIVE_ZOMBIES&&S.zombieSpawnTimer>effectiveInterval){
      S.zombieSpawnTimer=0;
      spawnZombie();
    }
  }else if(S.betweenWaves){
    S.betweenWavesTimer-=dt;
    if(S.betweenWavesTimer<=0){
      S.betweenWaves=false;
      if(S.currentWave<totalWaves)startWave(S.currentWave+1);
    }
  }else{
    const aliveZ=S.zombies.filter(z=>z.hp>0&&z.type!=='zomboss'&&z.type!=='gargantuar').length;
    if(S.waveZombiesRemaining>0&&aliveZ<MAX_ALIVE_ZOMBIES&&S.zombieSpawnTimer>effectiveInterval){
      S.zombieSpawnTimer=0;
      spawnZombie();
      S.waveZombiesRemaining--;
    }
    const noWaveSpawnRemaining=S.waveZombiesRemaining<=0;
    const aliveInWave=S.zombies.filter(z=>z.hp>0&&z.type!=='zomboss'&&z.type!=='gargantuar').length;
    if(noWaveSpawnRemaining&&aliveInWave===0&&S.currentWave<totalWaves){
      S.betweenWaves=true;
      S.betweenWavesTimer=4000;
      S.zombieSpawnTimer=0;
    }
  }

  // Босс
  if(S.currentLevel.boss&&!S.bossSpawned&&S.currentWave===totalWaves&&(S.spawnedZombies>=S.totalZombies-1||S.waveZombiesRemaining<=0)){
    S.bossSpawned=true;
    const row=Math.floor(Math.random()*ROWS);
    const bossType=S.currentLevel.boss;
    const def=ZOMBIE_TYPES[bossType];
    S.zombies.push({
      type:bossType,row,x:ZOMBIE_SPAWN_X+40,
      hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,
      walkPhase:0,slowTimer:0,hitFlash:0,dyingTimer:0,attackTimer:0,
      garlicPushTimer:0,hypnotized:false,y_air:undefined,falling:false,frozenStop:false,
      threwMinions:false,spikeTimer:0
    });
    S.shake=30;
  }

  // Гравитация
  if(S.minigameFlags.gravity){
    for(const z of S.zombies){
      if(z.falling&&z.y_air!==undefined){
        z.y_air+=400*dts;
        const groundY=cellCY(z.row);
        if(z.y_air>=groundY){
          z.y_air=groundY;
          z.falling=false;
          S.shake=4;
        }
      }
    }
  }

  // Прогресс
  S.levelProgress=clamp(
    (S.currentWave-1)/totalWaves+
    (S.waveZombiesPerWave>0?(1-S.waveZombiesRemaining/S.waveZombiesPerWave)/totalWaves:0),
    0,1
  );

  // Победа/поражение
  if(S.minigameFlags.sunny&&S.sun>=500){
    S.minigameScore=Math.floor(S.sun);
    gameOver(true);
  }else if(S.minigameFlags.endless&&S.currentWave>20){
    S.minigameScore=S.killedZombies;
    gameOver(true);
  }else{
    const allSpawned=S.spawnedZombies>=S.totalZombies;
    const bossKilled=!S.currentLevel.boss||(S.bossSpawned&&!S.zombies.some(z=>z.type===S.currentLevel.boss&&z.hp>0));
    const noAlive=!S.zombies.some(z=>z.hp>0);
    const noDying=!S.zombies.some(z=>z.hp<=0&&(z.dyingTimer||0)<800);
    if(allSpawned&&bossKilled&&noAlive&&noDying&&S.currentWave>=totalWaves)gameOver(true);
  }

  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*.02);
  if(Math.floor(S.time/1000)!==Math.floor((S.time-dt)/1000))checkAchievements();
}

function startLevel(level){
  Sound.init();Sound.resume();
  if(S.musicOn)Sound.startMusic();
  ROWS=level.rows||5;
  ROW_START=level.rowsOffset||0;
  S.dayNight=level.time||'day';
  S.location=level.location||'yard';
  bgCacheKey='';
  bushesCacheKey='';
  ensureBackgrounds();
  ensureBushes();

  S.currentLevel=level;
  S.scene='playing';
  S.sun=75;
  S.plants=[];
  S.zombies=[];
  S.projectiles=[];
  S.suns=[];
  S.coinsOnGround=[];
  S.particles=[];
  S.craters=[];
  S.rakes=[];
  S.flash=0;
  S.selectedSeed=null;
  S.shovelSelected=false;
  S.gloveSelected=false;
  S.gloveHolding=null;
  S.cooldowns={};
  S.sunTimer=0;
  S.zombieSpawnTimer=0;
  S.spawnedZombies=0;
  S.killedZombies=0;
  S.totalZombiesDead=0;
  S.totalZombies=level.totalZombies;
  S.spawnInterval=level.spawnInterval;
  S.currentWave=0;
  S.gameOver=false;
  S.won=false;
  S.shake=0;
  S.levelProgress=0;
  S.bossSpawned=false;
  S.plantedThisLevel=0;
  S.usedShovelThisLevel=0;
  S.garlicPushes=0;
  S.hypnoCount=0;
  S.rakesUsed=0;
  S.levelStartTime=S.time;
  S.minigameTime=0;
  S.boosterTimer=0;
  S.mowers=[];
  S.magnetActive=false;
  S.seedSelectMaxSlots=6+(S.extraSlots||0);
  S.ironSpikeOwned=S.ownedItems.includes('spikeweed_iron');

  for(let r=0;r<ROWS;r++){
    const isPool=(S.location==='pool'||S.location==='nightpool')&&r>=2&&r<4;
    S.mowers.push({row:r,x:GRID_X-32,used:false,active:false,isPool:isPool});
  }

  if(S.ownedItems.includes('rake')){
    S.rakes.push({row:Math.floor(ROWS/2),x:GRID_X+CELL_W/2,y:cellCY(Math.floor(ROWS/2))});
  }

  for(let i=0;i<2;i++){
    const x=rand(GRID_X+40,GRID_X+GRID_W-40);
    const y=rand(activeTop()+40,activeBottom()-40);
    S.suns.push({x,y,targetY:y,life:12000,maxLife:12000,vy:0,phase:Math.random()*10,value:25});
  }

  S.waveBannerTimer=0;
  S.betweenWaves=true;
  S.betweenWavesTimer=2000;
  S.waveZombiesRemaining=0;
  S.waveZombiesPerWave=0;
  rebuildPlantCache();
}

function startMinigame(mg){
  S.minigameType=mg.id;
  S.minigameScore=0;
  S.minigameTime=0;
  S.minigameFlags={endless:false,sunny:false,gravity:false};
  if(mg.config.endless)S.minigameFlags.endless=true;
  if(mg.config.sunny)S.minigameFlags.sunny=true;
  if(mg.config.gravity)S.minigameFlags.gravity=true;
  const lvl={
    id:-1,name:mg.name.slice(0,6),location:'yard',rows:5,rowsOffset:0,time:'day',
    seeds:mg.config.seeds||['peashooter','sunflower','wallnut'],
    totalZombies:mg.config.endless?9999:30,
    spawnInterval:mg.config.spawnRate||5000,
    types:['basic','cone','bucket','flag','football','dancer'],
    waves:mg.config.endless?999:5,
    reward:null
  };
  startLevel(lvl);
  S.minigameType=mg.id;
}

function startLevelWithSeedSelect(level){
  S.currentLevel=level;
  S.seedSelectMode=true;
  const ownedAvailable=S.ownedPlants.slice();
  const prioritySeeds=[];
  for(const lvl of LEVELS){
    for(const s of lvl.seeds){
      if(ownedAvailable.includes(s)&&!prioritySeeds.includes(s))prioritySeeds.push(s);
    }
  }
  for(const s of ownedAvailable){
    if(!prioritySeeds.includes(s))prioritySeeds.push(s);
  }
  S.seedSelectAvailable=prioritySeeds.filter(s=>ALL_PLANTS[s]);

  const preChosen=[];
  const maxSlots=6+(S.extraSlots||0);
  for(const s of level.seeds){
    if(S.ownedPlants.includes(s)&&preChosen.length<maxSlots)preChosen.push(s);
  }
  for(const s of S.seedSelectAvailable){
    if(preChosen.length>=maxSlots)break;
    if(!preChosen.includes(s))preChosen.push(s);
  }
  S.seedSelectChosen=preChosen;
  S.scene='seedselect';
}

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  return{x:(e.clientX-rect.left)*(W/rect.width),y:(e.clientY-rect.top)*(H/rect.height)};
}
