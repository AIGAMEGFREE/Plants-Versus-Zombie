  S.backBtn = { x, y, w, h };
}

// ==================== ЭКРАН ВЫБОРА СЕМЯН ====================
function drawSeedSelect() {
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a1a3a'); bg.addColorStop(0.5, '#1a0f25'); bg.addColorStop(1, '#0a0510');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 48px Impact, Arial Black, sans-serif';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText('ВЫБЕРИ РАСТЕНИЯ', W / 2, 60);

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Клик — добавить/убрать · Максимум ' + S.seedSelectMaxSlots + ' слотов', W / 2, 110);

  const slotSize = 90, slotGap = 12;
  const slotRowW = S.seedSelectMaxSlots * slotSize + (S.seedSelectMaxSlots - 1) * slotGap;
  const slotRowX = (W - slotRowW) / 2;
  const slotRowY = 150;

  ctx.fillStyle = 'rgba(80,50,20,0.7)';
  ctx.beginPath(); ctx.roundRect(slotRowX - 15, slotRowY - 15, slotRowW + 30, slotSize + 30, 12); ctx.fill();
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 4; ctx.stroke();

  for (let i = 0; i < S.seedSelectMaxSlots; i++) {
    const sx = slotRowX + i * (slotSize + slotGap);
    const sy = slotRowY;
    const chosen = S.seedSelectChosen[i];

    if (chosen && ALL_PLANTS[chosen]) {
      const paperG = ctx.createLinearGradient(sx, sy, sx, sy + slotSize);
      paperG.addColorStop(0, '#f0e2c0'); paperG.addColorStop(0.5, '#e0d0a8'); paperG.addColorStop(1, '#c8b890');
      ctx.fillStyle = paperG;
      ctx.fillRect(sx, sy, slotSize, slotSize);
      ctx.strokeStyle = '#8b5a2b';
      ctx.lineWidth = 3;
      ctx.strokeRect(sx, sy, slotSize, slotSize);

      ctx.save();
      ctx.translate(sx + slotSize / 2, sy + slotSize / 2 - 8);
      ctx.scale(0.85, 0.85);
      drawPlant(chosen, 0, 0, S.time, 1, chosen === 'potato' ? { armed: true } : null);
      ctx.restore();

      const def = ALL_PLANTS[chosen];
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(sx + 2, sy + slotSize - 22, slotSize - 4, 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.cost, sx + slotSize / 2, sy + slotSize - 12);

      if (S.cursorX >= sx && S.cursorX <= sx + slotSize && S.cursorY >= sy && S.cursorY <= sy + slotSize) {
        ctx.strokeStyle = '#f44336';
        ctx.lineWidth = 4;
        ctx.strokeRect(sx - 2, sy - 2, slotSize + 4, slotSize + 4);
      }
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(sx, sy, slotSize, slotSize);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.strokeRect(sx + 2, sy + 2, slotSize - 4, slotSize - 4);
      ctx.setLineDash([]);
      ctx.fillStyle = '#555';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', sx + slotSize / 2, sy + slotSize / 2);
    }
  }

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Доступные растения', W / 2, 300);

  const availSize = 70, availGap = 10, perRow = 12;
  const available = S.seedSelectAvailable;
  const availRowW = Math.min(perRow, available.length) * availSize + (Math.min(perRow, available.length) - 1) * availGap;
  const availRowX = (W - availRowW) / 2;
  const availRowY = 330;

  S.seedSelectCardRects = [];

  for (let i = 0; i < available.length; i++) {
    const seedId = available[i];
    const def = ALL_PLANTS[seedId];
    if (!def) continue;

    const col = i % perRow;
    const row = Math.floor(i / perRow);
    const ax = availRowX + col * (availSize + availGap);
    const ay = availRowY + row * (availSize + availGap);

    const isChosen = S.seedSelectChosen.includes(seedId);
    const hover = S.cursorX >= ax && S.cursorX <= ax + availSize && S.cursorY >= ay && S.cursorY <= ay + availSize;

    const bgG = ctx.createLinearGradient(ax, ay, ax, ay + availSize);
    if (isChosen) {
      bgG.addColorStop(0, '#ffe082'); bgG.addColorStop(1, '#ffb300');
    } else {
      bgG.addColorStop(0, '#f0e2c0'); bgG.addColorStop(1, '#c8b890');
    }
    ctx.fillStyle = bgG;
    ctx.beginPath(); ctx.roundRect(ax, ay, availSize, availSize, 8); ctx.fill();
    ctx.strokeStyle = isChosen ? '#4caf50' : '#8b5a2b';
    ctx.lineWidth = isChosen ? 4 : 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(ax + availSize / 2, ay + availSize / 2 - 6);
    ctx.scale(0.65, 0.65);
    drawPlant(seedId, 0, 0, S.time, 1, seedId === 'potato' ? { armed: true } : null);
    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(ax + 2, ay + availSize - 18, availSize - 4, 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.cost, ax + availSize / 2, ay + availSize - 10);

    if (isChosen) {
      ctx.fillStyle = '#4caf50';
      ctx.beginPath(); ctx.arc(ax + availSize - 12, ay + 12, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(ax + availSize - 17, ay + 12);
      ctx.lineTo(ax + availSize - 14, ay + 16);
      ctx.lineTo(ax + availSize - 7, ay + 8);
      ctx.stroke();
    }

    if (hover) {
      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(ax - 2, ay - 2, availSize + 4, availSize + 4, 10); ctx.stroke();
    }

    S.seedSelectCardRects.push({ seedId, x: ax, y: ay, w: availSize, h: availSize });
  }

  const backW = 180, backH = 60, backX = 40, backY = H - 90;
  ctx.fillStyle = '#ff7043';
  ctx.beginPath(); ctx.roundRect(backX, backY, backW, backH, 12); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('← НАЗАД', backX + backW / 2, backY + backH / 2);
  S.seedSelectBackBtn = { x: backX, y: backY, w: backW, h: backH };

  const startW = 320, startH = 80, startX = W - startW - 40, startY = H - 100;
  const canStart = S.seedSelectChosen.length > 0;
  ctx.fillStyle = canStart ? '#8bc34a' : '#666';
  ctx.beginPath(); ctx.roundRect(startX, startY, startW, startH, 16); ctx.fill();
  ctx.fillStyle = canStart ? '#fff' : '#aaa';
  ctx.font = 'bold 36px Impact, Arial Black, sans-serif';
  ctx.fillText('В БОЙ!', startX + startW / 2, startY + startH / 2);
  S.seedSelectStartBtn = { x: startX, y: startY, w: startW, h: startH, enabled: canStart };

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 20px Arial';
  ctx.fillText('Выбрано: ' + S.seedSelectChosen.length + ' / ' + S.seedSelectMaxSlots, W / 2, H - 40);
}

// ==================== МИНИ-ИГРЫ ====================
function drawMinigameMenu() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a2a4a'); bg.addColorStop(0.5, '#0d1a2e'); bg.addColorStop(1, '#05101a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 56px Impact, Arial Black, sans-serif';
  ctx.fillStyle = '#42a5f5';
  ctx.fillText('🎮 МИНИ-ИГРЫ', W / 2, 60);

  drawBackBtn(20, 20, 140, 50);

  const achBtnW = 240, achBtnH = 50, achBtnX = W - achBtnW - 20, achBtnY = 20;
  ctx.fillStyle = '#9c27b0';
  ctx.beginPath(); ctx.roundRect(achBtnX, achBtnY, achBtnW, achBtnH, 10); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Impact, Arial Black, sans-serif';
  ctx.fillText('🏆 ' + Object.keys(S.achievements).length + '/' + Object.keys(ACHIEVEMENTS).length,
    achBtnX + achBtnW / 2, achBtnY + achBtnH / 2);
  S.achMenuBtn = { x: achBtnX, y: achBtnY, w: achBtnW, h: achBtnH };

  S.minigameCards = [];
  const cardW = 320, cardH = 220, gap = 25;
  const totalW = MINIGAMES.length * cardW + (MINIGAMES.length - 1) * gap;
  const startX = (W - totalW) / 2;
  const startY = 180;

  for (let i = 0; i < MINIGAMES.length; i++) {
    const mg = MINIGAMES[i];
    const cx = startX + i * (cardW + gap);
    const cy = startY;
    const hover = S.cursorX >= cx && S.cursorX <= cx + cardW && S.cursorY >= cy && S.cursorY <= cy + cardH;

    ctx.fillStyle = hover ? '#4fc3f7' : '#1976d2';
    ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 16); ctx.fill();
    ctx.strokeStyle = hover ? '#ffeb3b' : '#0a1a3a';
    ctx.lineWidth = hover ? 4 : 3; ctx.stroke();

    ctx.font = 'bold 80px Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText(mg.icon, cx + cardW / 2, cy + 80);

    ctx.font = 'bold 26px Impact, Arial Black, sans-serif';
    ctx.fillText(mg.name, cx + cardW / 2, cy + 145);

    ctx.font = 'italic 14px Arial';
    ctx.fillText(mg.desc, cx + cardW / 2, cy + 175);

    const best = S.minigameBest[mg.id] || 0;
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = '#ffeb3b';
    ctx.fillText('🏅 ' + best, cx + cardW / 2, cy + 200);

    S.minigameCards.push({ minigame: mg, x: cx, y: cy, w: cardW, h: cardH });
  }
}

function drawAchievements() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a1a3a'); bg.addColorStop(1, '#0a0510');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 52px Impact, Arial Black, sans-serif';
  const unlocked = Object.keys(S.achievements).length;
  const total = Object.keys(ACHIEVEMENTS).length;
  ctx.fillStyle = '#ffd54f';
  ctx.fillText('🏆 ДОСТИЖЕНИЯ ' + unlocked + '/' + total, W / 2, 55);

  drawBackBtn(20, 20, 140, 50);

  const cardW = 420, cardH = 80, gap = 12, cols = 2;
  const totalW = cols * cardW + gap;
  const startX = (W - totalW) / 2;
  const startY = 110;

  const achList = Object.entries(ACHIEVEMENTS);
  for (let i = 0; i < achList.length; i++) {
    const [id, a] = achList[i];
    const unlockedA = !!S.achievements[id];
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = startX + col * (cardW + gap);
    const cy = startY + row * (cardH + gap);
    if (cy > H - 60) continue;

    ctx.fillStyle = unlockedA ? '#ffb300' : '#333';
    ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 12); ctx.fill();
    ctx.strokeStyle = unlockedA ? '#7f3f00' : '#555';
    ctx.lineWidth = 3; ctx.stroke();

    ctx.font = 'bold 44px Arial';
    ctx.textAlign = 'center';
    ctx.globalAlpha = unlockedA ? 1 : 0.4;
    ctx.fillText(a.icon, cx + 45, cy + cardH / 2);
    ctx.globalAlpha = 1;

    ctx.textAlign = 'left';
    ctx.font = 'bold 20px Impact, Arial Black, sans-serif';
    ctx.fillStyle = unlockedA ? '#3e2723' : '#888';
    ctx.fillText(a.name, cx + 90, cy + 28);

    ctx.font = 'italic 12px Arial';
    ctx.fillStyle = unlockedA ? '#5d4037' : '#666';
    ctx.fillText(a.desc, cx + 90, cy + 52);
  }
}

// ==================== СТАРТ ====================
function startMinigame(mg) {
  S.minigameType = mg.id;
  const lvl = {
    id: -1, name: 'MG', location: 'yard', rows: 5, rowsOffset: 0, time: 'day',
    seeds: mg.config.seeds || ['peashooter','sunflower','wallnut'],
    totalZombies: mg.config.endless ? 9999 : 30,
    spawnInterval: mg.config.spawnRate || 5000,
    types: ['basic','cone','bucket','flag','football','dancer'],
    waves: mg.config.endless ? 999 : 5,
    desc: mg.name,
  };
  startLevel(lvl);
  S.minigameType = mg.id;
}

function startLevelWithSeedSelect(level) {
  // Используем полный список семян
  const seedList = level._allSeeds || level.seeds;
  if (seedList.length <= 6) { startLevel(level); return; }
  S.currentLevel = level;
  S.seedSelectMode = true;
  S.seedSelectAvailable = [...seedList];
  // Если уже было выбрано — восстанавливаем
  if (level._chosenSeeds && level._chosenSeeds.length > 0 && level._chosenSeeds.length <= 6) {
    S.seedSelectChosen = [...level._chosenSeeds];
  } else {
    S.seedSelectChosen = seedList.slice(0, 6);
  }
  S.scene = 'seedselect';
}

// ==================== ЛОГИКА ====================
function update(dt) {
  S.time += dt;
  const dts = dt / 1000;

  for (const k in S.cooldowns) {
    S.cooldowns[k] = Math.max(0, S.cooldowns[k] - dt);
  }

  S.sunTimer += dt;
  if (S.sunTimer > 6500) {
    S.sunTimer = 0;
    const x = rand(GRID_X + 20, GRID_X + GRID_W - 20);
    const targetY = rand(activeTop() + 40, activeBottom() - 40);
    S.suns.push({ x, y: -30, targetY, life: 10000, maxLife: 10000, vy: 1.4, phase: Math.random() * 10, value: 25 });
  }

  for (const p of S.plants) {
    if (!isPlantAwake(p.type)) continue;

    if (p.type === 'sunflower' || p.type === 'sunshroom') {
      p.sunTimer += dt;
      const interval = p.type === 'sunshroom' ? 7000 : 5500;
      const amount = p.type === 'sunshroom' ? 15 : 25;
      if (p.sunTimer > interval) {
        p.sunTimer = 0;
        S.suns.push({
          x: cellCX(p.col) + rand(-15, 15), y: cellCY(p.row),
          targetY: cellCY(p.row) + 30, life: 10000, maxLife: 10000, vy: 0.8,
          phase: Math.random() * 10, value: amount
        });
      }
    }
    if (p.type === 'potato' && !p.armed) {
      p.armTimer = (p.armTimer || 0) + dt;
      if (p.armTimer > 15000) p.armed = true;
    }
    if (p.type === 'chomper') {
      if (p.chewing) {
        p.chewTimer -= dt;
        if (p.chewTimer <= 0) p.chewing = false;
      } else {
        p.shootTimer += dt;
        const target = S.zombies.find(z => z.row === p.row && z.hp > 0 && z.x < YARD_RIGHT && Math.abs(z.x - cellCX(p.col)) < 60);
        if (target && p.shootTimer > 3000) {
          p.shootTimer = 0; p.chewing = true; p.chewTimer = 6000;
          target.hp -= 3000;
        }
      }
    }
    if (p.type === 'peashooter' || p.type === 'snowpea' || p.type === 'repeater' || p.type === 'threepeater') {
      p.shootTimer += dt;
      const cooldown = p.type === 'snowpea' ? 1400 : 1500;
      let target = null;
      if (p.type === 'threepeater') {
        target = S.zombies.find(z => Math.abs(z.row - p.row) <= 1 && z.x < ZOMBIE_ENTER_YARD_X + 5 && z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized);
      } else {
        target = S.zombies.find(z => z.row === p.row && z.x < ZOMBIE_ENTER_YARD_X + 5 && z.x > cellCX(p.col) && z.hp > 0 && !z.hypnotized);
      }
      if (target && p.shootTimer > cooldown) {
        p.shootTimer = 0;
        if (p.type === 'threepeater') {
          for (let dr = -1; dr <= 1; dr++) {
            const row = p.row + dr;
            if (row < 0 || row >= ROWS) continue;
            S.projectiles.push({ x: cellCX(p.col) + 22, y: cellCY(row) - 14, row, vx: 500, damage: 20 });
          }
        } else {
          const shots = p.type === 'repeater' ? 2 : 1;
          for (let i = 0; i < shots; i++) {
            S.projectiles.push({
              x: cellCX(p.col) + 22, y: cellCY(p.row) - 14, row: p.row, vx: 500,
              damage: p.type === 'snowpea' ? 20 : 25, ice: p.type === 'snowpea', delay: i * 150
            });
          }
        }
      }
    }
    if (p.type === 'hypnoshroom') {
      p.shootTimer += dt;
      if (p.shootTimer > 3000) {
        p.shootTimer = 0;
        const target = S.zombies.find(z => z.row === p.row && Math.abs(z.x - cellCX(p.col)) < 80 && z.hp > 0 && !z.hypnotized);
        if (target) { target.hypnotized = true; target.hp = target.maxHp; }
      }
    }
  }

  for (const pr of S.projectiles) {
    if (pr.delay > 0) { pr.delay -= dt; continue; }
    pr.x += pr.vx * dts;
    for (const z of S.zombies) {
      if (z.hp <= 0 || z.hypnotized) continue;
      if (z.row !== pr.row) continue;
      if (z.x >= YARD_RIGHT) continue;
      const zy = cellCY(z.row) - 20;
      if (Math.abs(pr.x - z.x) < 28 && Math.abs(pr.y - zy) < 55) {
        z.hp -= pr.damage;
        z.hitFlash = 180;
        if (pr.ice) z.slowTimer = 3000;
        pr.dead = true;
        break;
      }
    }
    if (pr.x > W + 40 || pr.x > YARD_RIGHT + 5) pr.dead = true;
  }
  S.projectiles = S.projectiles.filter(p => !p.dead);

  for (const s of S.suns) {
    s.life -= dt;
    if (s.y < s.targetY) {
      s.y += s.vy * dt * 0.06;
      if (s.y > s.targetY) s.y = s.targetY;
    }
  }
  S.suns = S.suns.filter(s => s.life > 0);

  for (const z of S.zombies) {
    if (z.hp <= 0) { z.dyingTimer = (z.dyingTimer || 0) + dt; continue; }
    if (z.hitFlash > 0) z.hitFlash -= dt;
    if (z.slowTimer > 0) z.slowTimer -= dt;
    if (z.garlicPushTimer > 0) z.garlicPushTimer -= dt;
    z.walkPhase += dt * 0.008;

    if (z.hypnotized) {
      z.x += Math.abs(z.speed) * dts * 0.7;
      for (const other of S.zombies) {
        if (other === z || other.hypnotized || other.hp <= 0) continue;
        if (other.row === z.row && Math.abs(other.x - z.x) < 40) {
          z.attackTimer = (z.attackTimer || 0) + dt;
          if (z.attackTimer > 800) { z.attackTimer = 0; other.hp -= z.dmg; }
        }
      }
      continue;
    }

    const col = Math.floor((z.x - GRID_X) / CELL_W);
    const plant = S.plants.find(p => p.row === z.row && p.col === col);
    let attacking = false;

    if (plant && z.x < YARD_RIGHT && z.x - cellCX(col) < 38 && z.x - cellCX(col) > -15) {
      if (plant.type === 'garlic' && !(z.garlicPushTimer > 0)) {
        plant.hp -= z.dmg;
        if (plant.hp <= 0) S.plants = S.plants.filter(p => p !== plant);
        let targetRow = z.row;
        const canUp = z.row > 0, canDown = z.row < ROWS - 1;
        if (canUp && canDown) targetRow = Math.random() < 0.5 ? z.row - 1 : z.row + 1;
        else if (canUp) targetRow = z.row - 1;
        else if (canDown) targetRow = z.row + 1;
        if (targetRow !== z.row) {
          addParticles(z.x, cellCY(z.row), 12, '#f0f0c0', 4, 500, 4);
          z.row = targetRow;
          z.x += 15;
          z.garlicPushTimer = 500;
          S.shake = 5;
          S.garlicPushes = (S.garlicPushes || 0) + 1;
        }
        attacking = true;
      } else if (plant.type !== 'garlic') {
        attacking = true;
        z.attackTimer = (z.attackTimer || 0) + dt;
        if (z.attackTimer > 800) {
          z.attackTimer = 0;
          plant.hp -= z.dmg;
          if (plant.hp <= 0) {
            if (plant.type === 'potato' && plant.armed) explodePotato(plant);
            S.plants = S.plants.filter(p => p !== plant);
          }
        }
      } else {
        attacking = true;
      }
    }

    if (!attacking) {
      const speedMul = z.slowTimer > 0 ? 0.5 : 1;
      z.x -= z.speed * speedMul * dts;
    }

    if (z.x < GRID_X - 15) {
      const mower = S.mowers[z.row];
      if (mower && !mower.used) {
        mower.used = true; mower.active = true; mower.x = GRID_X - 30;
      } else {
        gameOver(false);
        return;
      }
    }
  }

  for (const m of S.mowers) {
    if (m.active) {
      m.x += 700 * dts;
      for (const z of S.zombies) {
        if (z.row === m.row && z.hp > 0 && z.x < m.x + 40 && z.x > m.x - 60) z.hp = 0;
      }
      if (m.x > W + 60) m.active = false;
    }
  }

  S.zombies = S.zombies.filter(z => !(z.hp <= 0 && z.dyingTimer > 800));

  for (const p of S.particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += p.gravity; p.vx *= 0.98;
    p.life -= dt;
  }
  S.particles = S.particles.filter(p => p.life > 0);

  S.zombieSpawnTimer += dt;
  if (S.spawnedZombies < S.totalZombies && S.zombieSpawnTimer > S.currentLevel.spawnInterval) {
    S.zombieSpawnTimer = 0;
    spawnZombie();
  }

  if (S.currentLevel.boss === 'zomboss' && !S.bossSpawned && S.spawnedZombies >= S.totalZombies - 1) {
    S.bossSpawned = true;
    const row = Math.floor(Math.random() * ROWS);
    S.zombies.push({
      type: 'zomboss', row, x: ZOMBIE_SPAWN_X + 40,
      hp: ZOMBIE_TYPES.zomboss.hp, maxHp: ZOMBIE_TYPES.zomboss.hp,
      speed: ZOMBIE_TYPES.zomboss.speed, dmg: ZOMBIE_TYPES.zomboss.dmg,
      walkPhase: 0, slowTimer: 0, hitFlash: 0, dyingTimer: 0, attackTimer: 0, garlicPushTimer: 0, hypnotized: false,
    });
    S.shake = 30;
  }

  const zombiesPerWave = Math.ceil(S.currentLevel.totalZombies / S.currentLevel.waves);
  if (S.killedZombies >= S.currentWave * zombiesPerWave && S.currentWave < S.currentLevel.waves) {
    const aliveThisWave = S.zombies.filter(z => z.hp > 0 && z.type !== 'zomboss').length;
    if (aliveThisWave === 0) { S.currentWave++; S.zombieSpawnTimer = 0; }
  }

  S.levelProgress = clamp(S.killedZombies / S.totalZombies, 0, 1);

  const bossAlive = S.zombies.some(z => (z.type === 'zomboss') && z.hp > 0);
  if (S.killedZombies >= S.totalZombies && S.zombies.length === 0 && S.spawnedZombies >= S.totalZombies && !bossAlive) {
    gameOver(true);
  }

  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 0.02);
  if (S.killedZombies >= 1) unlockAchievement('first_blood');
  if (S.sun >= 1000) unlockAchievement('sunflower_farm');
}

function explodePotato(plant) {
  S.shake = 10;
  for (const z of S.zombies) {
    if (z.hp <= 0) continue;
    if (Math.abs(z.x - cellCX(plant.col)) < 60 && Math.abs(z.row - plant.row) < 1) z.hp -= 1800;
  }
}

function spawnZombie() {
  const lvl = S.currentLevel;
  const row = Math.floor(Math.random() * ROWS);
  let type = 'basic';
  const available = lvl.types;
  if (available.length === 1) type = available[0];
  else type = available[Math.floor(Math.random() * available.length)];
  const def = ZOMBIE_TYPES[type];
  S.zombies.push({
    type, row, x: ZOMBIE_SPAWN_X + Math.random() * 40,
    hp: def.hp, maxHp: def.hp, speed: def.speed, dmg: def.dmg,
    walkPhase: Math.random() * Math.PI * 2,
    slowTimer: 0, hitFlash: 0, dyingTimer: 0, attackTimer: 0, garlicPushTimer: 0, hypnotized: false,
  });
  S.spawnedZombies++;
}

function gameOver(won) {
  S.gameOver = true;
  S.won = won;
  if (won) {
    const mowersUsed = S.mowers.filter(m => m.used).length;
    let stars = 1;
    if (mowersUsed === 0) stars = 3;
    else if (mowersUsed <= 2) stars = 2;
    const lvlId = S.currentLevel.id;
    if (lvlId > 0) {
      const prevStars = S.levelStars[lvlId] || 0;
      if (stars > prevStars) S.levelStars[lvlId] = stars;
      if (S.unlockedLevels === lvlId && lvlId < LEVELS.length) S.unlockedLevels = lvlId + 1;
    }
    S.totalWinsEver++;
    S.totalKillsEver += S.killedZombies;
    if (S.minigameType) {
      const best = S.minigameBest[S.minigameType] || 0;
      if (S.minigameScore > best) S.minigameBest[S.minigameType] = S.minigameScore;
    }
    checkAchievements();
    saveProgress();
  } else {
    S.shake = 30;
  }
}

// ==================== ВВОД ====================
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height)
  };
}

canvas.addEventListener('mousemove', (e) => {
  const p = getPos(e);
  S.cursorX = p.x; S.cursorY = p.y;
});

canvas.addEventListener('mouseleave', () => {
  S.cursorX = -1; S.cursorY = -1;
});

canvas.addEventListener('click', (e) => {
  const p = getPos(e);
  const x = p.x, y = p.y;

  if (S.scene === 'minigames') {
    if (S.backBtn && x >= S.backBtn.x && x <= S.backBtn.x + S.backBtn.w &&
        y >= S.backBtn.y && y <= S.backBtn.y + S.backBtn.h) {
      S.scene = 'menu'; return;
    }
    if (S.achMenuBtn && x >= S.achMenuBtn.x && x <= S.achMenuBtn.x + S.achMenuBtn.w &&
        y >= S.achMenuBtn.y && y <= S.achMenuBtn.y + S.achMenuBtn.h) {
      S.scene = 'achievements'; return;
    }
    for (const c of S.minigameCards) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        startMinigame(c.minigame); return;
      }
    }
    return;
  }

  if (S.scene === 'achievements') {
    if (S.backBtn && x >= S.backBtn.x && x <= S.backBtn.x + S.backBtn.w &&
        y >= S.backBtn.y && y <= S.backBtn.y + S.backBtn.h) {
      S.scene = 'menu'; return;
    }
    return;
  }

  if (S.scene === 'seedselect') {
    if (S.seedSelectBackBtn && x >= S.seedSelectBackBtn.x && x <= S.seedSelectBackBtn.x + S.seedSelectBackBtn.w &&
        y >= S.seedSelectBackBtn.y && y <= S.seedSelectBackBtn.y + S.seedSelectBackBtn.h) {
      S.scene = 'levelselect'; S.seedSelectMode = false; return;
    }
    if (S.seedSelectStartBtn && S.seedSelectStartBtn.enabled &&
        x >= S.seedSelectStartBtn.x && x <= S.seedSelectStartBtn.x + S.seedSelectStartBtn.w &&
        y >= S.seedSelectStartBtn.y && y <= S.seedSelectStartBtn.y + S.seedSelectStartBtn.h) {
      const lvl = S.currentLevel;
      // ✅ Сохраняем полный список семян и выбор
      if (!lvl._allSeeds) lvl._allSeeds = [...lvl.seeds];
      lvl._chosenSeeds = [...S.seedSelectChosen];
      // ✅ Подставляем только выбранные семена
      lvl.seeds = [...S.seedSelectChosen];
      S.seedSelectMode = false;
      startLevel(lvl);
      return;
    }
    const slotSize = 90, slotGap = 12;
    const slotRowW = S.seedSelectMaxSlots * slotSize + (S.seedSelectMaxSlots - 1) * slotGap;
    const slotRowX = (W - slotRowW) / 2;
    const slotRowY = 150;
    for (let i = 0; i < S.seedSelectMaxSlots; i++) {
      const sx = slotRowX + i * (slotSize + slotGap);
      if (x >= sx && x <= sx + slotSize && y >= slotRowY && y <= slotRowY + slotSize) {
        if (S.seedSelectChosen[i]) S.seedSelectChosen.splice(i, 1);
        return;
      }
    }
    for (const c of S.seedSelectCardRects) {
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        const idx = S.seedSelectChosen.indexOf(c.seedId);
        if (idx >= 0) S.seedSelectChosen.splice(idx, 1);
        else if (S.seedSelectChosen.length < S.seedSelectMaxSlots) S.seedSelectChosen.push(c.seedId);
        return;
      }
    }
    return;
  }

  if (S.scene === 'menu') {
    if (S.resetBtn && x >= S.resetBtn.x && x <= S.resetBtn.x + S.resetBtn.w &&
        y >= S.resetBtn.y && y <= S.resetBtn.y + S.resetBtn.h) {
      resetProgress(); return;
    }
    if (S.achMenuBtn && x >= S.achMenuBtn.x && x <= S.achMenuBtn.x + S.achMenuBtn.w &&
        y >= S.achMenuBtn.y && y <= S.achMenuBtn.y + S.achMenuBtn.h) {
      S.scene = 'achievements'; return;
    }
    if (S.menuMinigameBtn && x >= S.menuMinigameBtn.x && x <= S.menuMinigameBtn.x + S.menuMinigameBtn.w &&
        y >= S.menuMinigameBtn.y && y <= S.menuMinigameBtn.y + S.menuMinigameBtn.h) {
      S.scene = 'minigames'; return;
    }
    if (S.menuBtn && x >= S.menuBtn.x && x <= S.menuBtn.x + S.menuBtn.w &&
        y >= S.menuBtn.y && y <= S.menuBtn.y + S.menuBtn.h) {
      S.scene = 'levelselect';
    }
    return;
  }

  if (S.scene === 'levelselect') {
    if (S.backBtn && x >= S.backBtn.x && x <= S.backBtn.x + S.backBtn.w &&
        y >= S.backBtn.y && y <= S.backBtn.y + S.backBtn.h) {
      S.scene = 'menu'; return;
    }
    for (const n of S.levelNodes) {
      if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) {
        startLevelWithSeedSelect(n.level);
        return;
      }
    }
    return;
  }

  if (S.gameOver) {
    saveProgress(true);
    S.scene = 'levelselect';
    S.gameOver = false;
    S.minigameType = null;
    return;
  }

  const panelY = 8;
  const packetW = 62, packetH = 84;
  const sunW = 78;
  const startX = 8 + sunW + 4;
  const seeds = S.currentLevel.seeds;

  for (let i = 0; i < seeds.length; i++) {
    const sx = startX + i * (packetW + 4);
    if (x >= sx && x <= sx + packetW && y >= panelY && y <= panelY + packetH) {
      const seed = ALL_PLANTS[seeds[i]];
      if (!seed) return;
      const cd = S.cooldowns[seed.id] || 0;
      const awake = isPlantAwake(seed.id);
      if (cd > 0 || S.sun < seed.cost || !awake) return;
      S.selectedSeed = (S.selectedSeed === seed.id) ? null : seed.id;
      S.shovelSelected = false;
      return;
    }
  }

  const shX = startX + seeds.length * (packetW + 4) + 4;
  if (x >= shX && x <= shX + packetW && y >= panelY && y <= panelY + packetH) {
    S.shovelSelected = !S.shovelSelected;
    S.selectedSeed = null;
    return;
  }

  if (x >= W - 130 && x <= W - 8 && y >= panelY && y <= panelY + 40) {
    saveProgress(true);
    S.scene = 'levelselect';
    S.gameOver = false;
    S.minigameType = null;
    return;
  }

  for (const s of S.suns) {
    if (dist(s.x, s.y, x, y) < 34) {
      S.sun += s.value;
      s.life = 0;
      return;
    }
  }

  const col = Math.floor((x - GRID_X) / CELL_W);
  const row = Math.floor((y - activeTop()) / CELL_H);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

  if (S.shovelSelected) {
    const plant = S.plants.find(p => p.row === row && p.col === col);
    if (plant) {
      S.plants = S.plants.filter(p => p !== plant);
      S.shovelSelected = false;
    }
    return;
  }

  if (S.selectedSeed) {
    const seed = ALL_PLANTS[S.selectedSeed];
    if (!seed) return;
    if (S.sun < seed.cost || (S.cooldowns[seed.id] > 0)) return;
    if (!isPlantAwake(seed.id)) return;
    if (S.plants.find(p => p.row === row && p.col === col)) return;

    if (seed.id === 'cherry' || seed.id === 'jalapeno' || seed.id === 'doomshroom' || seed.id === 'iceshroom') {
      S.sun -= seed.cost;
      S.cooldowns[seed.id] = seed.cd;
      S.plantedThisLevel++;
      S.shake = 16;
      for (const z of S.zombies) {
        if (z.hp <= 0 || z.x >= YARD_RIGHT) continue;
        if (seed.id === 'cherry') {
          if (Math.abs(z.row - row) <= 1 && Math.abs(z.x - cellCX(col)) < CELL_W * 1.7) z.hp -= 1800;
        } else if (seed.id === 'jalapeno') {
          if (z.row === row) z.hp -= 1800;
        } else if (seed.id === 'doomshroom') {
          z.hp -= 5000;
        } else if (seed.id === 'iceshroom') {
          z.slowTimer = 8000;
        }
      }
      S.selectedSeed = null;
      return;
    }

    S.plantedThisLevel++;
    S.plants.push({
      type: seed.id, row, col,
      hp: seed.id === 'wallnut' ? 4000 : seed.id === 'garlic' ? 400 : 100,
      maxHp: seed.id === 'wallnut' ? 4000 : seed.id === 'garlic' ? 400 : 100,
      sunTimer: 0, shootTimer: 0, armTimer: 0, armed: false, born: S.time,
      chewing: false, chewTimer: 0,
    });
    S.sun -= seed.cost;
    S.cooldowns[seed.id] = seed.cd;
    S.selectedSeed = null;
  }
});

document.addEventListener('keydown', (e) => {
  if (S.scene !== 'playing' || S.gameOver) return;
  if (e.key === 'Escape') {
    S.selectedSeed = null;
    S.shovelSelected = false;
  }
  const n = parseInt(e.key);
  if (n >= 1 && n <= S.currentLevel.seeds.length) {
    const seed = ALL_PLANTS[S.currentLevel.seeds[n - 1]];
    if (!seed) return;
    const cd = S.cooldowns[seed.id] || 0;
    if (cd <= 0 && S.sun >= seed.cost && isPlantAwake(seed.id)) {
      S.selectedSeed = S.selectedSeed === seed.id ? null : seed.id;
      S.shovelSelected = false;
    }
  }
});

// ==================== СТАРТ УРОВНЯ ====================
function startLevel(level) {
  ROWS = level.rows || 5;
  ROW_START = level.rowsOffset || 0;
  S.dayNight = level.time || 'day';
  S.location = level.location || 'yard';
  bgCacheKey = '';
  bushesCacheKey = '';
  ensureBackgrounds();
  ensureBushes();

  S.currentLevel = level;
  S.scene = 'playing';
  S.sun = 75;
  S.plants = [];
  S.zombies = [];
  S.projectiles = [];
  S.suns = [];
  S.particles = [];
  S.selectedSeed = null;
  S.shovelSelected = false;
  S.cooldowns = {};
  S.sunTimer = 0;
  S.zombieSpawnTimer = 3000;
  S.spawnedZombies = 0;
  S.killedZombies = 0;
  S.totalZombies = level.totalZombies;
  S.spawnInterval = level.spawnInterval;
  S.currentWave = 1;
  S.gameOver = false;
  S.won = false;
  S.shake = 0;
  S.levelProgress = 0;
  S.bossSpawned = false;
  S.plantedThisLevel = 0;
  S.usedShovelThisLevel = 0;
  S.garlicPushes = 0;
  S.levelStartTime = S.time;
  S.mowers = [];
  for (let r = 0; r < ROWS; r++) {
    S.mowers.push({ row: r, x: GRID_X - 32, used: false, active: false });
  }
  for (let i = 0; i < 2; i++) {
    const x = rand(GRID_X + 40, GRID_X + GRID_W - 40);
    const y = rand(activeTop() + 40, activeBottom() - 40);
    S.suns.push({ x, y, targetY: y, life: 12000, maxLife: 12000, vy: 0, phase: Math.random() * 10, value: 25 });
  }
}

// ==================== ГЛАВНЫЙ ЦИКЛ ====================
function render() {
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
  ctx.clearRect(-50, -50, W + 100, H + 100);

  if (S.scene === 'menu') drawMenu();
  else if (S.scene === 'levelselect') drawLevelSelect();
  else if (S.scene === 'seedselect') drawSeedSelect();
  else if (S.scene === 'minigames') drawMinigameMenu();
  else if (S.scene === 'achievements') drawAchievements();
  else {
    drawGameScene();
    if (S.gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (S.won) {
        ctx.font = 'bold 72px Impact, Arial Black, sans-serif';
        ctx.fillStyle = '#ffd54f';
        ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', W / 2, H / 2 - 120);
        if (S.plantedThisLevel === 0) {
          ctx.fillStyle = '#4fc3f7';
          ctx.font = 'bold 32px Impact, Arial Black, sans-serif';
          ctx.fillText('😎 ПОФИГИЗМ АКТИВИРОВАН!', W / 2, H / 2);
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Arial';
        ctx.fillText('Прогресс сохранён 💾', W / 2, H / 2 + 60);
        ctx.fillText('Кликните для продолжения', W / 2, H / 2 + 100);
      } else {
        ctx.font = 'bold 72px Impact, Arial Black, sans-serif';
        ctx.fillStyle = '#f44336';
        ctx.fillText('ПОРАЖЕНИЕ', W / 2, H / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Arial';
        ctx.fillText('Кликните, чтобы попробовать снова', W / 2, H / 2 + 40);
      }
    }
  }
  ctx.restore();

  if (S.scene === 'playing' && !S.gameOver && S.selectedSeed) {
    if (S.cursorX > 0 && S.cursorY > 0) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      drawPlant(S.selectedSeed, S.cursorX + 18, S.cursorY + 10, S.time, 1.05, null);
      ctx.restore();
    }
  }

  drawAchievementToasts();
}

function loop(now) {
  const dt = Math.min(now - S.lastTime, 50);
  S.lastTime = now;
  S.time += dt;

  if (S.scene === 'playing' && !S.gameOver) update(dt);
  else if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 0.02);

  if (S.scene === 'playing') {
    S.killedZombies = Math.min(S.totalZombies,
      S.spawnedZombies - S.zombies.filter(z => z.hp > 0 && z.type !== 'zomboss').length);
  }

  render();
  requestAnimationFrame(loop);
}

loadProgress();
requestAnimationFrame(loop);
})();
</script>
