}

function drawCoffee(t) {
  const breathe = Math.sin(t * 0.003) * 1;
  const cy = -8 + breathe;

  for (let i = 0; i < 3; i++) {
    const tLoop = (t * 0.002 + i * 0.6) % 1;
    const px = (i - 1) * 8 + Math.sin(t * 0.005 + i) * 3;
    const py = cy - 15 - tLoop * 20;
    ctx.fillStyle = `rgba(200,200,200,${(1 - tLoop) * 0.5})`;
    ctx.beginPath();
    ctx.arc(px, py, 4 * (1 - tLoop * 0.3), 0, Math.PI * 2);
    ctx.fill();
  }

  const g = ctx.createLinearGradient(-20, cy, 20, cy);
  g.addColorStop(0, '#c8c8c8'); g.addColorStop(0.5, '#f0f0f0'); g.addColorStop(1, '#a0a0a0');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-18, cy - 12);
  ctx.lineTo(-14, cy + 18);
  ctx.lineTo(14, cy + 18);
  ctx.lineTo(18, cy - 12);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.stroke();

  ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(20, cy + 2, 8, -Math.PI/2, Math.PI/2);
  ctx.stroke();

  const cg = ctx.createRadialGradient(-3, cy - 8, 2, 0, cy - 8, 16);
  cg.addColorStop(0, '#8a4a20'); cg.addColorStop(0.6, '#4a2410'); cg.addColorStop(1, '#2a1408');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(0, cy - 8, 15, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < 4; i++) {
    const tLoop = (t * 0.001 + i * 0.25) % 1;
    const px = (i - 1.5) * 10 + Math.sin(t * 0.003 + i) * 4;
    const py = cy - 20 - tLoop * 25;
    const alpha = 1 - tLoop;
    ctx.fillStyle = `rgba(255,220,80,${alpha * 0.8})`;
    drawStarSimple(px, py, 3 * (1 - tLoop * 0.4), 5);
  }
}

function drawStarSimple(x, y, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.5;
    const px = x + Math.cos(a) * rad;
    const py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawLilypad(t) {
  const breathe = Math.sin(t * 0.003) * 1;
  const cy = -6 + breathe;

  const g = ctx.createRadialGradient(-6, cy - 4, 3, 0, cy, 34);
  g.addColorStop(0, '#8bc34a'); g.addColorStop(0.5, '#5c9e2a'); g.addColorStop(1, '#2d5a10');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, cy, 32, 0.35, Math.PI * 2 - 0.35);
  ctx.lineTo(0, cy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2; ctx.stroke();

  ctx.strokeStyle = 'rgba(20,60,10,0.5)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + 0.4;
    ctx.beginPath();
    ctx.moveTo(0, cy);
    ctx.lineTo(Math.cos(a) * 28, cy + Math.sin(a) * 28);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(-10, cy - 12, 10, 5, -0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, cy - 4, 4, 0, Math.PI * 2);
  ctx.arc(7, cy - 4, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-7, cy - 4, 2, 0, Math.PI * 2);
  ctx.arc(7, cy - 4, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawTanglekelp(t) {
  const breathe = Math.sin(t * 0.004) * 2;

  for (let i = 0; i < 3; i++) {
    const ox = (i - 1) * 14;
    const wave = Math.sin(t * 0.002 + i * 0.7) * 6;
    const sway = Math.sin(t * 0.003 + i) * 3;

    ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ox, 22);
    ctx.quadraticCurveTo(ox + wave, 0 + breathe, ox + wave * 1.5, -22);
    ctx.stroke();

    ctx.strokeStyle = '#43a047'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ox, 22);
    ctx.quadraticCurveTo(ox + wave, 0 + breathe, ox + wave * 1.5, -22);
    ctx.stroke();

    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    ctx.ellipse(ox + wave * 0.7 - 6, 8 + breathe, 8, 4, -0.3 + sway * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ox + wave * 0.9 + 6, 2 + breathe, 8, 4, 0.3 + sway * 0.05, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, -15 + breathe, 4.5, 0, Math.PI * 2);
  ctx.arc(7, -15 + breathe, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-7, -15 + breathe, 2.2, 0, Math.PI * 2);
  ctx.arc(7, -15 + breathe, 2.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -6 + breathe, 5, 0.3, Math.PI - 0.3);
  ctx.stroke();
}

// ==================== ЗОМБИ (РУКИ ВПЕРЁД ИЗ ПЛЕЧ) ====================
function drawZombie(z, t) {
  const x = z.x;
  const y = (z.y_air !== undefined && z.falling) ? z.y_air : cellCY(z.row);
  const dying = z.hp <= 0;
  const alpha = dying ? clamp(1 - z.dyingTimer / 800, 0, 1) : 1;
  const isBoss = z.type === 'zomboss';

  let bushAlpha = 1;
  if (z.x > ROAD_RIGHT - 20 && S.location !== 'roof' && !z.falling) {
    const t2 = clamp((z.x - (ROAD_RIGHT - 20)) / 80, 0, 1);
    bushAlpha = 1 - t2 * 0.85;
  }

  ctx.save();
  ctx.globalAlpha = alpha * bushAlpha;
  ctx.translate(x, y);
  if (dying) ctx.rotate((1 - alpha) * 0.7);
  if (isBoss) ctx.scale(2.0, 2.0);

  const bob = dying ? 0 : Math.sin(t * 0.008 + z.walkPhase) * 3;
  ctx.translate(0, bob);

  if (!z.falling) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 38, 26, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const legPhase1 = Math.sin(t * 0.008 + z.walkPhase);
  const legPhase2 = Math.sin(t * 0.008 + z.walkPhase + Math.PI);

  // === ЗАДНЯЯ ПРАВАЯ РУКА (за торсом, видна частично) ===
  ctx.save();
  ctx.translate(16, -8);
  ctx.rotate(0.35 + Math.sin(t * 0.008 + z.walkPhase + 1) * 0.05);
  const backSleeve = ctx.createLinearGradient(-8, -8, 8, 8);
  backSleeve.addColorStop(0, '#3a2410'); backSleeve.addColorStop(1, '#2a1a0a');
  ctx.fillStyle = backSleeve;
  ctx.beginPath();
  ctx.roundRect(-8, -6, 24, 12, 5);
  ctx.fill();
  ctx.strokeStyle = '#1a0e05'; ctx.lineWidth = 1.5; ctx.stroke();
  // Кисть задней руки
  ctx.fillStyle = '#7a9a3a';
  ctx.beginPath();
  ctx.arc(18, 0, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  // === НОГИ ===
  ctx.save();
  ctx.translate(-10, 22);
  ctx.rotate(legPhase1 * 0.12);
  const pantsG1 = ctx.createLinearGradient(-8, -10, 8, 22);
  pantsG1.addColorStop(0, '#2a3a6a'); pantsG1.addColorStop(0.5, '#1a2a5a'); pantsG1.addColorStop(1, '#0a1a3a');
  ctx.fillStyle = pantsG1;
  ctx.beginPath(); ctx.roundRect(-8, -8, 15, 26, 3); ctx.fill();
  ctx.strokeStyle = '#0a0a1a'; ctx.lineWidth = 1.5; ctx.stroke();
  const shoeG1 = ctx.createLinearGradient(-8, 16, 12, 26);
  shoeG1.addColorStop(0, '#8a5a2a'); shoeG1.addColorStop(0.5, '#6d4c21'); shoeG1.addColorStop(1, '#3a2410');
  ctx.fillStyle = shoeG1;
  ctx.beginPath(); ctx.ellipse(2, 20, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2d1b08'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(10, 22);
  ctx.rotate(legPhase2 * 0.12);
  const pantsG2 = ctx.createLinearGradient(-8, -10, 8, 22);
  pantsG2.addColorStop(0, '#2a3a6a'); pantsG2.addColorStop(0.5, '#1a2a5a'); pantsG2.addColorStop(1, '#0a1a3a');
  ctx.fillStyle = pantsG2;
  ctx.beginPath(); ctx.roundRect(-8, -8, 15, 26, 3); ctx.fill();
  ctx.strokeStyle = '#0a0a1a'; ctx.lineWidth = 1.5; ctx.stroke();
  const shoeG2 = ctx.createLinearGradient(-8, 16, 12, 26);
  shoeG2.addColorStop(0, '#8a5a2a'); shoeG2.addColorStop(0.5, '#6d4c21'); shoeG2.addColorStop(1, '#3a2410');
  ctx.fillStyle = shoeG2;
  ctx.beginPath(); ctx.ellipse(2, 20, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2d1b08'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  // === ТОРС ===
  ctx.fillStyle = '#c8c8c8';
  ctx.beginPath(); ctx.ellipse(0, -2, 18, 24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.stroke();

  const jacketG = ctx.createRadialGradient(-6, -6, 3, 0, 2, 30);
  jacketG.addColorStop(0, 'rgba(255,255,255,0.15)');
  jacketG.addColorStop(0.4, '#6d4c2a');
  jacketG.addColorStop(0.7, '#4a3020');
  jacketG.addColorStop(1, '#2a1a0a');
  ctx.fillStyle = jacketG;
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#1a0e05'; ctx.lineWidth = 1.5; ctx.stroke();

  // Рваные края пиджака
  ctx.fillStyle = '#2a1a0a';
  for (let i = 0; i < 6; i++) {
    const rx = -20 + i * 8;
    const rh = 4 + Math.sin(t * 0.005 + i * 1.3) * 2;
    ctx.beginPath();
    ctx.moveTo(rx, 22);
    ctx.lineTo(rx + 3, 22 + rh);
    ctx.lineTo(rx + 6, 22);
    ctx.closePath(); ctx.fill();
  }

  // Полы пиджака
  ctx.fillStyle = '#3a2410';
  ctx.beginPath();
  ctx.moveTo(-22, -8); ctx.lineTo(-18, 22); ctx.lineTo(-8, 22); ctx.lineTo(-6, -8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, -8); ctx.lineTo(18, 22); ctx.lineTo(8, 22); ctx.lineTo(6, -8);
  ctx.closePath(); ctx.fill();

  // Галстук
  const tieG = ctx.createLinearGradient(-6, -20, 6, 20);
  tieG.addColorStop(0, '#e53935'); tieG.addColorStop(0.5, '#c62828'); tieG.addColorStop(1, '#8e0000');
  ctx.fillStyle = tieG;
  ctx.beginPath();
  ctx.moveTo(-3, -22); ctx.lineTo(3, -22); ctx.lineTo(5, 8); ctx.lineTo(0, 14); ctx.lineTo(-5, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-4, -14); ctx.lineTo(4, -14);
  ctx.moveTo(-4, -6); ctx.lineTo(4, -6);
  ctx.moveTo(-4, 2); ctx.lineTo(4, 2);
  ctx.stroke();
  ctx.fillStyle = '#b71c1c';
  ctx.beginPath(); ctx.ellipse(0, -24, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 1; ctx.stroke();

  // Воротник
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.moveTo(-10, -26); ctx.lineTo(-2, -18); ctx.lineTo(-6, -26);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10, -26); ctx.lineTo(2, -18); ctx.lineTo(6, -26);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.stroke();

  // === ПЕРЕДНЯЯ ЛЕВАЯ РУКА (вытянута ВПЕРЁД из левого плеча) ===
  ctx.save();
  // Крепление: левое плечо (снаружи торса, чуть ниже верха)
  ctx.translate(-20, -8);
  // Поворот: рука идёт вправо-вниз, вперёд
  ctx.rotate(0.5 + Math.sin(t * 0.008 + z.walkPhase) * 0.05);
  // Рукав
  const sleeveG1 = ctx.createLinearGradient(-8, -8, 8, 8);
  sleeveG1.addColorStop(0, '#8a6a3a'); sleeveG1.addColorStop(1, '#4a3020');
  ctx.fillStyle = sleeveG1;
  ctx.beginPath();
  ctx.roundRect(-8, -7, 32, 14, 5);
  ctx.fill();
  ctx.strokeStyle = '#1a0e05'; ctx.lineWidth = 1.5; ctx.stroke();
  // Манжета
  ctx.fillStyle = '#8a5a2a';
  ctx.fillRect(20, -7, 5, 14);
  ctx.strokeRect(20, -7, 5, 14);
  // Кисть
  const skinG1 = ctx.createRadialGradient(28, -2, 2, 30, 0, 10);
  skinG1.addColorStop(0, '#c8e88a'); skinG1.addColorStop(0.6, '#8bc34a'); skinG1.addColorStop(1, '#4a7a2a');
  ctx.fillStyle = skinG1;
  ctx.beginPath();
  ctx.arc(30, 0, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 1.5; ctx.stroke();
  // Пальцы (3 штуки, направлены вперёд)
  for (let i = -1; i <= 1; i++) {
    ctx.save();
    ctx.translate(36, i * 4);
    ctx.rotate(i * 0.3 + 0.3);
    ctx.fillStyle = '#9ecf5a';
    ctx.beginPath();
    ctx.roundRect(0, -2.5, 8, 5, 2);
    ctx.fill();
    ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 1; ctx.stroke();
    // Ноготь
    ctx.fillStyle = '#e8dcc0';
    ctx.beginPath();
    ctx.ellipse(7.5, 0, 1.5, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // === ПЕРЕДНЯЯ ПРАВАЯ РУКА (вытянута ВПЕРЁД из правого плеча, чуть выше) ===
  ctx.save();
  ctx.translate(20, -14);
  ctx.rotate(0.35 + Math.sin(t * 0.008 + z.walkPhase + 1) * 0.05);
  const sleeveG2 = ctx.createLinearGradient(-8, -8, 8, 8);
  sleeveG2.addColorStop(0, '#8a6a3a'); sleeveG2.addColorStop(1, '#4a3020');
  ctx.fillStyle = sleeveG2;
  ctx.beginPath();
  ctx.roundRect(-8, -7, 32, 14, 5);
  ctx.fill();
  ctx.strokeStyle = '#1a0e05'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#8a5a2a';
  ctx.fillRect(20, -7, 5, 14);
  ctx.strokeRect(20, -7, 5, 14);
  const skinG2 = ctx.createRadialGradient(28, -2, 2, 30, 0, 10);
  skinG2.addColorStop(0, '#c8e88a'); skinG2.addColorStop(0.6, '#8bc34a'); skinG2.addColorStop(1, '#4a7a2a');
  ctx.fillStyle = skinG2;
  ctx.beginPath();
  ctx.arc(30, 0, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 1.5; ctx.stroke();
  for (let i = -1; i <= 1; i++) {
    ctx.save();
    ctx.translate(36, i * 4);
    ctx.rotate(i * 0.3 + 0.3);
    ctx.fillStyle = '#9ecf5a';
    ctx.beginPath();
    ctx.roundRect(0, -2.5, 8, 5, 2);
    ctx.fill();
    ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#e8dcc0';
    ctx.beginPath();
    ctx.ellipse(7.5, 0, 1.5, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // === ШЕЯ ===
  ctx.fillStyle = '#7a9a4a';
  ctx.beginPath(); ctx.roundRect(-7, -30, 14, 12, 3); ctx.fill();
  ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 1.5; ctx.stroke();

  // === ГОЛОВА ===
  const headG = ctx.createRadialGradient(-8, -24, 4, 0, -18, 26);
  if (isBoss) {
    headG.addColorStop(0, '#a0c070'); headG.addColorStop(0.5, '#6a9a3a'); headG.addColorStop(1, '#1a2a0a');
  } else if (z.hypnotized) {
    headG.addColorStop(0, '#ffd0e8'); headG.addColorStop(0.6, '#e060b0'); headG.addColorStop(1, '#6a1050');
  } else {
    headG.addColorStop(0, '#c8e090'); headG.addColorStop(0.4, '#a5c66a');
    headG.addColorStop(0.7, '#7a9a3a'); headG.addColorStop(1, '#3a5a1a');
  }
  ctx.fillStyle = headG;
  ctx.beginPath(); ctx.ellipse(0, -20, 24, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = isBoss ? '#1a2a0a' : '#2d5a1a';
  ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-10, -32, 8, 6, -0.5, 0, Math.PI * 2); ctx.fill();

  // Шрамы
  ctx.strokeStyle = 'rgba(80,40,40,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-14, -32); ctx.lineTo(-8, -26);
  ctx.moveTo(-12, -36); ctx.lineTo(-6, -30);
  ctx.stroke();

  // Волосы
  ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const hairWave = Math.sin(t * 0.006 + z.walkPhase) * 2;
  ctx.beginPath();
  ctx.moveTo(-16, -38); ctx.quadraticCurveTo(-20, -44, -22 + hairWave, -50);
  ctx.moveTo(-10, -42); ctx.quadraticCurveTo(-12, -48, -14 + hairWave, -54);
  ctx.moveTo(-2, -44); ctx.quadraticCurveTo(-4, -50, -6 + hairWave, -56);
  ctx.moveTo(6, -44); ctx.quadraticCurveTo(8, -50, 10 - hairWave, -54);
  ctx.moveTo(14, -40); ctx.quadraticCurveTo(18, -46, 20 - hairWave, -50);
  ctx.stroke();

  // Глаза
  ctx.fillStyle = '#f5f0d8';
  ctx.beginPath(); ctx.arc(-9, -20, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -20, 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-9, -20, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(9, -20, 8, 0, Math.PI * 2); ctx.stroke();
  const lookX = Math.sin(t * 0.003) * 0.8;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-10 + lookX, -20, 2, 0, Math.PI * 2);
  ctx.arc(8 + lookX, -20, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(80,60,40,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(-9, -15, 5, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(9, -15, 5, 0.2, Math.PI - 0.2); ctx.stroke();

  // Нос
  ctx.fillStyle = '#5a7a2a';
  ctx.beginPath();
  ctx.arc(-2, -16, 1.5, 0, Math.PI * 2);
  ctx.arc(2, -16, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Рот
  const mouthOpen = 1 + Math.sin(t * 0.01 + z.walkPhase) * 0.2;
  ctx.fillStyle = '#3a0a0a';
  ctx.beginPath(); ctx.ellipse(0, -8, 11, 6 * mouthOpen, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#1a0505'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#f5f0d8';
  ctx.fillRect(-7, -13, 2.5, 4);
  ctx.fillRect(-3, -13, 3, 3);
  ctx.fillRect(1, -13, 2.5, 4.5);
  ctx.fillRect(5, -13, 2.5, 3);
  ctx.fillRect(-6, -6, 2.5, 2.5);
  ctx.fillRect(-1, -6, 3, 2);
  ctx.fillRect(4, -6, 2, 2.5);
  ctx.fillStyle = '#8a2a2a';
  ctx.beginPath(); ctx.ellipse(0, -5, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  const droolY = -3 + Math.sin(t * 0.005) * 1.5;
  ctx.fillStyle = 'rgba(180,200,120,0.8)';
  ctx.beginPath(); ctx.ellipse(-4, droolY, 1.8, 2.5, 0, 0, Math.PI * 2); ctx.fill();

  // Брови
  ctx.strokeStyle = '#2d5a1a'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, -28); ctx.lineTo(-5, -26);
  ctx.moveTo(14, -28); ctx.lineTo(5, -26);
  ctx.stroke();

  // Аксессуары
  if (z.type === 'cone') {
    const coneG = ctx.createLinearGradient(-22, 0, 22, 0);
    coneG.addColorStop(0, '#8a3a00'); coneG.addColorStop(0.3, '#d97000'); coneG.addColorStop(0.5, '#ff9500');
    coneG.addColorStop(0.7, '#d97000'); coneG.addColorStop(1, '#8a3a00');
    ctx.fillStyle = coneG;
    ctx.beginPath(); ctx.moveTo(-22, -36); ctx.lineTo(0, -76); ctx.lineTo(22, -36); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5a2000'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-15, -48); ctx.lineTo(15, -48);
    ctx.moveTo(-9, -58); ctx.lineTo(9, -58);
    ctx.moveTo(-4, -68); ctx.lineTo(4, -68);
    ctx.stroke();
  }

  if (z.type === 'bucket') {
    const bg = ctx.createLinearGradient(-24, 0, 24, 0);
    bg.addColorStop(0, '#3a4a52'); bg.addColorStop(0.25, '#6a7a82');
    bg.addColorStop(0.5, '#b8c0c8'); bg.addColorStop(0.75, '#6a7a82');
    bg.addColorStop(1, '#2a3a42');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-24, -32); ctx.lineTo(-22, -70); ctx.lineTo(22, -70); ctx.lineTo(24, -32);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1a2a32'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#1a2a32';
    ctx.fillRect(-25, -38, 50, 6);
    ctx.strokeRect(-25, -38, 50, 6);
    ctx.strokeStyle = '#1a2a32'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -52, 24, Math.PI, 0); ctx.stroke();
  }

  if (z.type === 'football') {
    ctx.fillStyle = '#b71c1c';
    ctx.beginPath(); ctx.arc(0, -22, 26, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#5a0a0a'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-22, -22); ctx.lineTo(22, -22);
    ctx.moveTo(-18, -16); ctx.lineTo(18, -16);
    ctx.moveTo(-14, -10); ctx.lineTo(14, -10);
    ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-8, -48); ctx.lineTo(-8, -22);
    ctx.moveTo(8, -48); ctx.lineTo(8, -22);
    ctx.stroke();
  }

  if (z.type === 'balloon') {
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -44); ctx.lineTo(0, -64); ctx.stroke();
    const bg = ctx.createRadialGradient(-6, -76, 4, 0, -74, 22);
    bg.addColorStop(0, '#ff80ab'); bg.addColorStop(0.6, '#e91e63'); bg.addColorStop(1, '#880e4f');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, -74, 20, 24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#4a0828'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(-6, -82, 6, 10, -0.3, 0, Math.PI * 2); ctx.fill();
  }

  if (z.type === 'dancer') {
    ctx.fillStyle = '#4a148c';
    ctx.beginPath(); ctx.arc(0, -28, 26, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#2a0a5a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.arc(0, -50, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f9a825'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#e91e63';
    ctx.beginPath();
    ctx.arc(-12, -46, 4, 0, Math.PI * 2);
    ctx.arc(12, -46, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  if (isBoss) {
    ctx.fillStyle = '#4a7a3a';
    ctx.beginPath(); ctx.arc(0, -18, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a2a0a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#ff8a65';
    ctx.beginPath(); ctx.arc(0, -22, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#bf360c'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(-9, -22, 5, 0, Math.PI * 2);
    ctx.arc(9, -22, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f44336';
    ctx.beginPath();
    ctx.arc(-9, -22, 2, 0, Math.PI * 2);
    ctx.arc(9, -22, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#90a4ae';
    ctx.beginPath();
    ctx.ellipse(-34, -10, 16, 24, 0, 0, Math.PI * 2);
    ctx.ellipse(34, -10, 16, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#455a64'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(-26, -50); ctx.lineTo(-22, -70); ctx.lineTo(-12, -58);
    ctx.lineTo(0, -76); ctx.lineTo(12, -58); ctx.lineTo(22, -70);
    ctx.lineTo(26, -50); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
  }

  if (z.hypnotized) {
    const aura = 0.6 + Math.sin(t * 0.005) * 0.4;
    ctx.strokeStyle = `rgba(224,64,160,${aura})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -10, 46, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = t * 0.003 + i * 2.1;
      const sx = Math.cos(a) * 38;
      const sy = Math.sin(a) * 38 - 10;
      ctx.fillStyle = `rgba(255,150,220,${0.7 + Math.sin(a * 3) * 0.3})`;
      drawStarSimple(sx, sy, 5, 5);
    }
  }

  ctx.restore();

  if (!dying && z.hp < z.maxHp) {
    ctx.save();
    ctx.globalAlpha = bushAlpha;
    const bw = isBoss ? 140 : 46;
    const by = y - (isBoss ? 170 : 96);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(x - bw / 2, by, bw, isBoss ? 12 : 7, 3); ctx.fill();
    const pct = z.hp / z.maxHp;
    const hg = ctx.createLinearGradient(0, by, 0, by + 7);
    if (pct > 0.5) { hg.addColorStop(0, '#81c784'); hg.addColorStop(1, '#388e3c'); }
    else if (pct > 0.25) { hg.addColorStop(0, '#ffb74d'); hg.addColorStop(1, '#e65100'); }
    else { hg.addColorStop(0, '#ef5350'); hg.addColorStop(1, '#b71c1c'); }
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.roundRect(x - bw / 2 + 1, by + 1, (bw - 2) * pct, isBoss ? 10 : 5, 2);
    ctx.fill();
    if (isBoss) {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 22px Impact, Arial Black, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
      ctx.strokeText('ЗОМБОС', x, by - 20);
      ctx.fillText('ЗОМБОС', x, by - 20);
    }
    ctx.restore();
  }
}

// ==================== СНАРЯДЫ ====================
function drawProjectile(p) {
  for (let i = 0; i < (p.trail?.length || 0); i++) {
    const t = p.trail[i];
    const a = t.life / 200;
    ctx.globalAlpha = a * 0.6;
    let color = '#8bc34a';
    if (p.ice) color = '#4fc3f7';
    if (p.spore) color = '#c8a2d8';
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 6 * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const g = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, 10);
  if (p.ice) {
    g.addColorStop(0, '#e1f5fe'); g.addColorStop(0.4, '#81d4fa'); g.addColorStop(1, '#01579b');
  } else if (p.spore) {
    g.addColorStop(0, '#f0d8ff'); g.addColorStop(0.4, '#c8a2d8'); g.addColorStop(1, '#4a2a5a');
  } else {
    g.addColorStop(0, '#e8f5c8'); g.addColorStop(0.4, '#a5d66a'); g.addColorStop(1, '#33691e');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = p.ice ? '#01579b' : p.spore ? '#3a1a4a' : '#1b5e20';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (p.spore) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(p.x - 3, p.y - 3, 2, 0, Math.PI * 2);
    ctx.arc(p.x + 3, p.y + 2, 1.5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(p.x - 3, p.y - 3, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==================== СОЛНЦЕ ====================
function drawSun(s) {
  const pulse = 1 + Math.sin(S.time / 250 + s.phase) * 0.08;
  const r = 28 * pulse;

  const g = ctx.createRadialGradient(s.x, s.y, 4, s.x, s.y, r * 2.5);
  g.addColorStop(0, 'rgba(255,255,150,0.9)');
  g.addColorStop(0.4, 'rgba(255,235,59,0.4)');
  g.addColorStop(1, 'rgba(255,213,79,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.x, s.y, r * 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(S.time / 1500);
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI * 2 / 12);
    const lg = ctx.createLinearGradient(0, 0, r * 1.6, 0);
    lg.addColorStop(0, 'rgba(255,240,120,0.9)');
    lg.addColorStop(1, 'rgba(255,240,120,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.lineTo(r * 1.6, 0);
    ctx.lineTo(0, 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  const cg = ctx.createRadialGradient(s.x - 5, s.y - 5, 3, s.x, s.y, r);
  cg.addColorStop(0, '#fffde7'); cg.addColorStop(0.5, '#ffe082'); cg.addColorStop(1, '#ffb300');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 2; ctx.stroke();
}

function drawParticles() {
  for (const p of S.particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMower(x, y) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, y + 14, 24, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const g = ctx.createLinearGradient(x - 22, y - 18, x + 22, y + 10);
  g.addColorStop(0, '#e53935'); g.addColorStop(0.5, '#c62828'); g.addColorStop(1, '#7f0000');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(x - 22, y - 18, 44, 28, 6);
  ctx.fill();
  ctx.strokeStyle = '#7f0000'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.roundRect(x - 16, y - 28, 32, 14, 4);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#424242'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 8, y - 26); ctx.lineTo(x - 20, y - 40);
  ctx.stroke();

  ctx.fillStyle = '#212121';
  ctx.beginPath();
  ctx.arc(x - 14, y + 10, 9, 0, Math.PI * 2);
  ctx.arc(x + 14, y + 10, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#616161';
  ctx.beginPath();
  ctx.arc(x - 14, y + 10, 3.5, 0, Math.PI * 2);
  ctx.arc(x + 14, y + 10, 3.5, 0, Math.PI * 2);
  ctx.fill();
}

// ==================== ИГРОВАЯ СЦЕНА ====================
function drawGameScene() {
  ensureBackgrounds();
  if (S.location === 'roof') {
    if (bgCacheRoof) ctx.drawImage(bgCacheRoof, 0, 0);
  } else if (S.location === 'night') {
    if (bgCacheYardNight) ctx.drawImage(bgCacheYardNight, 0, 0);
  } else if (S.location === 'pool') {
    if (bgCachePool) ctx.drawImage(bgCachePool, 0, 0);
  } else {
    if (bgCacheYard) ctx.drawImage(bgCacheYard, 0, 0);
  }

  for (const c of S.craters) {
    const a = clamp(c.life / c.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * 0.9;

    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + 8, 36, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    const cg = ctx.createRadialGradient(c.x, c.y, 5, c.x, c.y, 32);
    cg.addColorStop(0, '#000000');
    cg.addColorStop(0.4, '#1a1008');
    cg.addColorStop(0.8, '#3e2723');
    cg.addColorStop(1, '#5d4037');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 34, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a1008';
    ctx.lineWidth = 2;
    ctx.stroke();

    for (let i = 0; i < 3; i++) {
      const tLoop = ((S.time * 0.001 + i * 0.3) % 1);
      const dx = c.x + Math.sin(S.time * 0.003 + i) * 8;
      const dy = c.y - tLoop * 40;
      ctx.fillStyle = `rgba(120,120,120,${(1 - tLoop) * 0.5 * a})`;
      ctx.beginPath();
      ctx.arc(dx, dy, 6 * (1 - tLoop * 0.3), 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = 0; i < 3; i++) {
      const a2 = (i / 3) * Math.PI * 2 + S.time * 0.002;
      const cx2 = c.x + Math.cos(a2) * 12;
      const cy2 = c.y + Math.sin(a2) * 5;
      const flicker = 0.5 + Math.sin(S.time * 0.008 + i) * 0.5;
      ctx.fillStyle = `rgba(255,100,0,${flicker * a * 0.8})`;
      ctx.beginPath();
      ctx.arc(cx2, cy2, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  for (let r = 0; r < ROWS; r++) {
    const m = S.mowers[r];
    if (!m || (m.used && !m.active)) continue;
    drawMower(m.x, cellCY(r) + 20);
  }

  if ((S.selectedSeed || S.shovelSelected) && S.cursorX >= GRID_X && S.cursorX <= GRID_X + GRID_W
      && S.cursorY >= activeTop() && S.cursorY <= activeBottom()) {
    const c = Math.floor((S.cursorX - GRID_X) / CELL_W);
    const r = Math.floor((S.cursorY - activeTop()) / CELL_H);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
      const cellX = GRID_X + c * CELL_W;
      const cellY = activeTop() + r * CELL_H;
      const occupied = S.plants.find(p => p.row === r && p.col === c);
      const hasCrater = S.craters.find(cr => cr.row === r && cr.col === c);
      const awake = S.selectedSeed ? isPlantAwake(S.selectedSeed) : true;
      if (S.shovelSelected) ctx.fillStyle = 'rgba(244,67,54,0.3)';
      else if (occupied) ctx.fillStyle = 'rgba(244,67,54,0.3)';
      else if (hasCrater) ctx.fillStyle = 'rgba(50,30,10,0.5)';
      else if (!awake) ctx.fillStyle = 'rgba(100,100,150,0.35)';
      else ctx.fillStyle = 'rgba(255,235,59,0.3)';
      ctx.fillRect(cellX, cellY, CELL_W, CELL_H);
      ctx.strokeStyle = S.shovelSelected ? '#f44336' : hasCrater ? '#8b4513' : awake ? '#ffeb3b' : '#6666aa';
      ctx.lineWidth = 3;
      ctx.strokeRect(cellX + 1, cellY + 1, CELL_W - 2, CELL_H - 2);
      if (S.selectedSeed && !occupied && !S.shovelSelected && !hasCrater) {
        ctx.globalAlpha = awake ? 0.5 : 0.3;
        ctx.save();
        ctx.translate(cellX + CELL_W / 2, cellY + CELL_H / 2);
        drawPlant(S.selectedSeed, 0, 0, S.time, 1, null);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }
  }

  const sortedPlants = [...S.plants].sort((a, b) => a.row - b.row);
  for (const p of sortedPlants) {
    drawPlant(p.type, cellCX(p.col), cellCY(p.row), S.time, 1, p);
    if (p.hp < p.maxHp && p.type !== 'cherry' && p.type !== 'potato' && p.type !== 'jalapeno' && p.type !== 'doomshroom' && p.type !== 'iceshroom') {
      const bw = 50;
      const pct = p.hp / p.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.beginPath();
      ctx.roundRect(cellCX(p.col) - bw / 2, cellCY(p.row) - 48, bw, 7, 3);
      ctx.fill();
      const hg = ctx.createLinearGradient(0, 0, bw, 0);
      hg.addColorStop(0, pct > 0.5 ? '#81c784' : pct > 0.25 ? '#ffb74d' : '#ef5350');
      hg.addColorStop(1, pct > 0.5 ? '#388e3c' : pct > 0.25 ? '#e65100' : '#b71c1c');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.roundRect(cellCX(p.col) - bw / 2 + 1, cellCY(p.row) - 47, (bw - 2) * pct, 5, 2);
      ctx.fill();
    }
  }

  for (const p of S.projectiles) drawProjectile(p);
  for (const s of S.suns) drawSun(s);

  const sortedZ = [...S.zombies].sort((a, b) => a.row - b.row);
  for (const z of sortedZ) if (z.x < YARD_RIGHT) drawZombie(z, S.time);
  if (S.location !== 'roof') {
    ensureBushes();
    if (bushesCache) ctx.drawImage(bushesCache, 0, 0);
  }
  for (const z of sortedZ) if (z.x >= YARD_RIGHT) drawZombie(z, S.time);

  drawParticles();
  drawTopBar();
  drawBottomBar();

  if (S.minigameType === 'sunny_day') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(W/2 - 180, 50, 360, 50, 10); ctx.fill();
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('☀️ Цель: 500 солнца  (' + Math.floor(S.sun) + ')', W/2, 75);
  }
  if (S.minigameType === 'endless') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(W/2 - 180, 50, 360, 50, 10); ctx.fill();
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♾️ Волна: ' + S.currentWave + '  Убито: ' + S.totalZombiesDead, W/2, 75);
  }
}

// ==================== ВЕРХНЯЯ ПАНЕЛЬ ====================
function drawTopBar() {
  if (!S.currentLevel) return;
  const seeds = S.currentLevel.seeds.map(id => ALL_PLANTS[id]).filter(Boolean);
  const panelX = 8, panelY = 8;
  const packetW = 62, packetH = 84;
  const sunW = 78;

  const pg = ctx.createLinearGradient(0, panelY, 0, panelY + packetH + 12);
  pg.addColorStop(0, '#a87848'); pg.addColorStop(0.3, '#8b5a2b');
  pg.addColorStop(0.7, '#6d4c21'); pg.addColorStop(1, '#3a2410');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.roundRect(panelX - 4, panelY - 4, sunW + seeds.length * (packetW + 4) + 60 + 90, packetH + 12, 8);
  ctx.fill();
  ctx.strokeStyle = '#2d1b08'; ctx.lineWidth = 3; ctx.stroke();

  const scX = panelX, scY = panelY;
  const sg = ctx.createRadialGradient(scX + 30, scY + 30, 3, scX + 30, scY + 30, 26);
  sg.addColorStop(0, '#fffde7'); sg.addColorStop(0.5, '#ffd54f'); sg.addColorStop(1, '#f57f17');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(scX + 30, scY + 30, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#e65100'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.beginPath();
  ctx.roundRect(scX + 2, scY + 58, 76, 22, 4);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.floor(S.sun), scX + 40, scY + 69);

  const startX = scX + sunW + 4;
  for (let i = 0; i < seeds.length; i++) {
    drawSeedPacket(startX + i * (packetW + 4), panelY, packetW, packetH, seeds[i]);
  }

  const shX = startX + seeds.length * (packetW + 4) + 4;
  drawShovel(shX, panelY, packetW, packetH);

  ctx.fillStyle = '#7cb342';
  ctx.beginPath();
  ctx.roundRect(W - 130, panelY, 122, 40, 8);
  ctx.fill();
  ctx.strokeStyle = '#1e3a08'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Impact, Arial Black, sans-serif';
  ctx.fillText('MENU', W - 69, panelY + 20);
}

function drawSeedPacket(x, y, w, h, seed) {
  if (!seed) return;
  const isSelected = S.selectedSeed === seed.id;
  const cd = S.cooldowns[seed.id] || 0;
  const ready = cd <= 0 && S.sun >= seed.cost;
  const awake = isPlantAwake(seed.id);

  const bg = ctx.createLinearGradient(0, y, 0, y + h);
  if (isSelected) { bg.addColorStop(0, '#fff9c4'); bg.addColorStop(1, '#ffe082'); }
  else { bg.addColorStop(0, '#f0e2c0'); bg.addColorStop(0.5, '#d7c9a5'); bg.addColorStop(1, '#a8956d'); }
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = isSelected ? '#ffeb3b' : '#3e2723';
  ctx.lineWidth = isSelected ? 3 : 2;
  ctx.strokeRect(x, y, w, h);

  ctx.save();
  ctx.translate(x + w / 2, y + h / 2 - 6);
  ctx.scale(0.62, 0.62);
  drawPlant(seed.id, 0, 0, S.time, 1, seed.id === 'potato' ? { armed: true } : null);
  ctx.restore();

  if (!awake) {
    ctx.fillStyle = 'rgba(20,20,60,0.75)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💤', x + w / 2, y + h / 2 - 6);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(x + 2, y + h - 18, w - 4, 16);
  ctx.fillStyle = ready && awake ? '#fff' : '#ff5252';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(seed.cost, x + w / 2, y + h - 9);

  if (cd > 0) {
    const cdPct = cd / seed.cd;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(x, y, w, h * cdPct);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial';
    ctx.fillText(Math.ceil(cd / 1000), x + w / 2, y + h / 2 - 6);
  } else if (S.sun < seed.cost || !awake) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, w, h);
  }
}

function drawLevelSelect() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a1a3a'); bg.addColorStop(1, '#0a0510');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 100; i++) {
    const x = (i * 137) % W, y = (i * 71) % H;
    const a = 0.2 + Math.abs(Math.sin(S.time / 1000 + i)) * 0.5;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI*2); ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 48px Impact, Arial Black, sans-serif';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
  ctx.strokeText('ВЫБОР ЛОКАЦИИ', W / 2, 60);
  const tg = ctx.createLinearGradient(0, 30, 0, 90);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#ffb300');
  ctx.fillStyle = tg;
  ctx.fillText('ВЫБОР ЛОКАЦИИ', W / 2, 60);

  drawBackBtn(20, 20, 140, 50);

  const locations = [
    { key: 'yard',  name: 'ДВОР',    emoji: '☀',  color: '#5cc42e', bg1: '#a8d8ee', bg2: '#5aa62a', levels: LEVELS.filter(l => l.location === 'yard')  },
    { key: 'night', name: 'НОЧЬ',    emoji: '🌙', color: '#3a4a8a', bg1: '#1a2a52', bg2: '#0a0a1a', levels: LEVELS.filter(l => l.location === 'night') },
    { key: 'pool',  name: 'БАССЕЙН', emoji: '🏊', color: '#1a6a9a', bg1: '#4aa8e0', bg2: '#0a2a4a', levels: LEVELS.filter(l => l.location === 'pool')  },
    { key: 'roof',  name: 'КРЫША',   emoji: '🏠', color: '#a85030', bg1: '#d8a060', bg2: '#5a2010', levels: LEVELS.filter(l => l.location === 'roof')  },
  ];

  const cardW = 260, cardH = 440, gap = 20;
  const totalW = cardW * 4 + gap * 3;
  const startX = (W - totalW) / 2;
  const cardY = 130;

  S.levelNodes = [];

  for (let i = 0; i < locations.length; i++) {
    const loc = locations[i];
    const cx = startX + i * (cardW + gap);
    const cy = cardY;
    const firstLevel = loc.levels[0];
    const unlocked = firstLevel && firstLevel.id <= S.unlockedLevels;

    const g = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
    g.addColorStop(0, loc.bg1); g.addColorStop(1, loc.bg2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 16); ctx.fill();
    ctx.strokeStyle = unlocked ? loc.color : '#333';
    ctx.lineWidth = 4; ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px Impact, Arial Black, sans-serif';
    ctx.fillText(loc.emoji + ' ' + loc.name, cx + cardW / 2, cy + 35);

    const btnW = 60, btnH = 50, cols = 3;
    const startBtnX = cx + (cardW - cols * btnW - (cols - 1) * 8) / 2;
    const startBtnY = cy + 70;

    for (let j = 0; j < loc.levels.length; j++) {
      const lvl = loc.levels[j];
      const col = j % cols;
      const row = Math.floor(j / cols);
      const bx = startBtnX + col * (btnW + 8);
      const by = startBtnY + row * (btnH + 8);
      const lvlLocked = lvl.id > S.unlockedLevels;
      const isBoss = !!lvl.boss;

      const bg2 = ctx.createLinearGradient(0, by, 0, by + btnH);
      if (lvlLocked) { bg2.addColorStop(0, '#444'); bg2.addColorStop(1, '#222'); }
      else if (isBoss) { bg2.addColorStop(0, '#d32f2f'); bg2.addColorStop(1, '#7f0000'); }
      else { bg2.addColorStop(0, '#8bc34a'); bg2.addColorStop(1, '#33691e'); }
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.roundRect(bx, by, btnW, btnH, 8); ctx.fill();
      ctx.strokeStyle = '#1a2a0a'; ctx.lineWidth = 2; ctx.stroke();

      ctx.fillStyle = lvlLocked ? '#666' : '#fff';
      ctx.font = 'bold 14px Impact, Arial Black, sans-serif';
      ctx.fillText(isBoss ? '👹' : lvl.name, bx + btnW / 2, by + btnH / 2);

      const stars = S.levelStars[lvl.id] || 0;
      if (!lvlLocked && stars > 0 && !isBoss) {
        for (let s = 0; s < 3; s++) {
          const sx = bx + btnW / 2 - 10 + s * 10;
          const sy = by + btnH - 10;
          ctx.fillStyle = s < stars ? '#ffeb3b' : 'rgba(0,0,0,0.4)';
          drawStarSimple(sx, sy, 4, 5);
        }
      }

      if (!lvlLocked) {
        S.levelNodes.push({ level: lvl, x: bx, y: by, w: btnW, h: btnH });
      }
    }
  }
}

function drawSeedSelect() {
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a1a3a'); bg.addColorStop(0.5, '#1a0f25'); bg.addColorStop(1, '#0a0510');

  ctx.textBaseline = 'middle';
  ctx.font = 'bold 48px Impact, Arial Black, sans-serif';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
  ctx.strokeText('ВЫБЕРИ РАСТЕНИЯ', W / 2, 60);
  const tg = ctx.createLinearGradient(0, 30, 0, 90);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#ffb300');
  ctx.fillStyle = tg;
  ctx.fillText('ВЫБЕРИ РАСТЕНИЯ', W / 2, 60);

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Клик — добавить/убрать · Максимум ' + S.seedSelectMaxSlots + ' слотов', W / 2, 110);

  const slotSize = 90, slotGap = 12;
  const slotRowW = S.seedSelectMaxSlots * slotSize + (S.seedSelectMaxSlots - 1) * slotGap;
  const slotRowX = (W - slotRowW) / 2;
  const slotRowY = 150;

  ctx.fillStyle = 'rgba(80,50,20,0.7)';
  ctx.beginPath(); ctx.roundRect(slotRowX - 15, slotRowY - 15, slotRowW + 30, slotSize + 30, 12); ctx.fill();
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4; ctx.stroke();

  for (let i = 0; i < S.seedSelectMaxSlots; i++) {
    const sx = slotRowX + i * (slotSize + slotGap);
    const sy = slotRowY;
    const chosen = S.seedSelectChosen[i];

    if (chosen && ALL_PLANTS[chosen]) {
      const paperG = ctx.createLinearGradient(sx, sy, sx, sy + slotSize);
      paperG.addColorStop(0, '#f0e2c0'); paperG.addColorStop(0.5, '#e0d0a8'); paperG.addColorStop(1, '#c8b890');
      ctx.fillStyle = paperG;
      ctx.fillRect(sx, sy, slotSize, slotSize);
      ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3;
      ctx.strokeRect(sx, sy, slotSize, slotSize);

      ctx.save();
      ctx.translate(sx + slotSize / 2, sy + slotSize / 2 - 8);
      ctx.scale(0.85, 0.85);
      drawPlant(chosen, 0, 0, S.time, 1, chosen === 'potato' ? { armed: true } : null);
      ctx.restore();

      const def = ALL_PLANTS[chosen];
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(sx + 2, sy + slotSize - 22, slotSize - 4, 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.cost, sx + slotSize / 2, sy + slotSize - 12);

      if (S.cursorX >= sx && S.cursorX <= sx + slotSize && S.cursorY >= sy && S.cursorY <= sy + slotSize) {
        ctx.strokeStyle = '#f44336'; ctx.lineWidth = 4;
        ctx.strokeRect(sx - 2, sy - 2, slotSize + 4, slotSize + 4);
      }
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(sx, sy, slotSize, slotSize);
      ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.strokeRect(sx + 2, sy + 2, slotSize - 4, slotSize - 4);
      ctx.setLineDash([]);
      ctx.fillStyle = '#555';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', sx + slotSize / 2, sy + slotSize / 2);
    }
  }

  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Доступные растения', W / 2, 300);

  const availSize = 70, availGap = 10, perRow = 12;
  const available = S.seedSelectAvailable;
  const availRowW = Math.min(perRow, available.length) * availSize + (Math.min(perRow, available.length) - 1) * availGap;
  const availRowX = (W - availRowW) / 2;
  const availRowY = 330;

  S.seedSelectCardRects = [];

  for (let i = 0; i < available.length; i++) {
    const seedId = available[i];
    const def = ALL_PLANTS[seedId];
    if (!def) continue;

    const col = i % perRow;
    const row = Math.floor(i / perRow);
    const ax = availRowX + col * (availSize + availGap);
    const ay = availRowY + row * (availSize + availGap);

    const isChosen = S.seedSelectChosen.includes(seedId);
    const hover = S.cursorX >= ax && S.cursorX <= ax + availSize && S.cursorY >= ay && S.cursorY <= ay + availSize;

    const bgG = ctx.createLinearGradient(ax, ay, ax, ay + availSize);
    if (isChosen) { bgG.addColorStop(0, '#ffe082'); bgG.addColorStop(1, '#ffb300'); }
    else { bgG.addColorStop(0, '#f0e2c0'); bgG.addColorStop(1, '#c8b890'); }
    ctx.fillStyle = bgG;
    ctx.beginPath(); ctx.roundRect(ax, ay, availSize, availSize, 8); ctx.fill();
    ctx.strokeStyle = isChosen ? '#4caf50' : '#8b5a2b';
    ctx.lineWidth = isChosen ? 4 : 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(ax + availSize / 2, ay + availSize / 2 - 6);
    ctx.scale(0.65, 0.65);
    drawPlant(seedId, 0, 0, S.time, 1, seedId === 'potato' ? { armed: true } : null);
    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(ax + 2, ay + availSize - 18, availSize - 4, 16);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.cost, ax + availSize / 2, ay + availSize - 10);

    if (isChosen) {
      ctx.fillStyle = '#4caf50';
      ctx.beginPath(); ctx.arc(ax + availSize - 12, ay + 12, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(ax + availSize - 17, ay + 12);
      ctx.lineTo(ax + availSize - 14, ay + 16);
      ctx.lineTo(ax + availSize - 7, ay + 8);
      ctx.stroke();
    }

    if (hover) {
      ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(ax - 2, ay - 2, availSize + 4, availSize + 4, 10); ctx.stroke();
    }

    S.seedSelectCardRects.push({ seedId, x: ax, y: ay, w: availSize, h: availSize });
  }

  const backW = 180, backH = 60, backX = 40, backY = H - 90;
  const backG = ctx.createLinearGradient(0, backY, 0, backY + backH);
  backG.addColorStop(0, '#ff8a65'); backG.addColorStop(1, '#bf360c');
  ctx.fillStyle = backG;
  ctx.beginPath(); ctx.roundRect(backX, backY, backW, backH, 12); ctx.fill();
  ctx.strokeStyle = '#3e1a00'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('← НАЗАД', backX + backW / 2, backY + backH / 2);
  S.seedSelectBackBtn = { x: backX, y: backY, w: backW, h: backH };

  const startW = 320, startH = 80, startX = W - startW - 40, startY = H - 100;
  const canStart = S.seedSelectChosen.length > 0;
  const startG = ctx.createLinearGradient(0, startY, 0, startY + startH);
  if (canStart) { startG.addColorStop(0, '#8bc34a'); startG.addColorStop(1, '#33691e'); }
  else { startG.addColorStop(0, '#666'); startG.addColorStop(1, '#333'); }
  ctx.fillStyle = startG;
  ctx.beginPath(); ctx.roundRect(startX, startY, startW, startH, 16); ctx.fill();
  ctx.strokeStyle = '#1e3a08'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.roundRect(startX + 8, startY + 6, startW - 16, startH/2 - 6, 10); ctx.fill();
  ctx.fillStyle = canStart ? '#fff' : '#aaa';
  ctx.font = 'bold 36px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#1e3a08'; ctx.lineWidth = 5;
  ctx.strokeText('В БОЙ!', startX + startW / 2, startY + startH / 2);
  ctx.fillText('В БОЙ!', startX + startW / 2, startY + startH / 2);
  S.seedSelectStartBtn = { x: startX, y: startY, w: startW, h: startH, enabled: canStart };

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 20px Arial';
  ctx.fillText('Выбрано: ' + S.seedSelectChosen.length + ' / ' + S.seedSelectMaxSlots, W / 2, H - 40);
}

    if (hover) { bg2.addColorStop(0, '#4fc3f7'); bg2.addColorStop(1, '#0d47a1'); }

    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
