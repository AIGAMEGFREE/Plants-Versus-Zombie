const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

ctx.imageSmoothingEnabled=true;ctx.lineJoin='round';ctx.lineCap='round';

if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,r){if(typeof r==='number')r=[r,r,r,r];if(!Array.isArray(r))r=[0,0,0,0];if(r.length===1)r=[r[0],r[0],r[0],r[0]];if(r.length===2)r=[r[0],r[1],r[0],r[1]];let[tl,tr,br,bl]=r;tl=Math.min(tl,w/2,h/2);tr=Math.min(tr,w/2,h/2);br=Math.min(br,w/2,h/2);bl=Math.min(bl,w/2,h/2);this.beginPath();this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.quadraticCurveTo(x+w,y,x+w,y+tr);this.lineTo(x+w,y+h-br);this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);this.lineTo(x+bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-bl);this.lineTo(x,y+tl);this.quadraticCurveTo(x,y,x+tl,y);this.closePath();return this;};}

const CELL_W=82,CELL_H=98,GRID_W=COLS*CELL_W;

const activeBottom=()=>activeTop()+ROWS*CELL_H;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);

function addParticles(x,y,count,color,speed=4,life=600,size=4){
  if(S.particles.length>300)return;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=rand(speed*.3,speed);
    S.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life,maxLife:life,color,size:rand(size*.5,size*1.5),gravity:.12});
  }
}

// ЗВУКОВОЙ ДВИЖОК (Web Audio API, без файлов)

const Sound={
  ctx:null,masterGain:null,sfxGain:null,musicGain:null,
  enabled:true,sfxEnabled:true,musicEnabled:true,
  volume:0.5,musicVolume:0.25,
  musicTimer:null,initialized:false,

  init(){
    if(this.initialized)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC){this.enabled=false;return;}
      this.ctx=new AC();
      this.masterGain=this.ctx.createGain();
      this.masterGain.gain.value=this.volume;
      this.masterGain.connect(this.ctx.destination);
      this.sfxGain=this.ctx.createGain();
      this.sfxGain.gain.value=this.sfxEnabled?1:0;
      this.sfxGain.connect(this.masterGain);
      this.musicGain=this.ctx.createGain();
      this.musicGain.gain.value=this.musicEnabled?this.musicVolume:0;
      this.musicGain.connect(this.masterGain);
      this.initialized=true;
    }catch(e){this.enabled=false;}
  },

  resume(){
    if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
  },

  setVolume(v){this.volume=clamp(v,0,1);if(this.masterGain)this.masterGain.gain.value=this.volume;},
  setMusicVolume(v){this.musicVolume=clamp(v,0,1);if(this.musicGain)this.musicGain.gain.value=this.musicEnabled?this.musicVolume:0;},

  beep(freq,dur,type='sine',vol=0.3,slideTo=null){
    if(!this.enabled||!this.sfxEnabled||!this.ctx)return;
    try{
      const t=this.ctx.currentTime;
      const osc=this.ctx.createOscillator();
      const g=this.ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,t);
      if(slideTo)osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      osc.connect(g);g.connect(this.sfxGain);
      osc.start(t);osc.stop(t+dur+0.02);
    }catch(e){}
  },

  noise(dur,vol=0.2,filterFreq=800){
    if(!this.enabled||!this.sfxEnabled||!this.ctx)return;
    try{
      const t=this.ctx.currentTime;
      const bufSize=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
      const buffer=this.ctx.createBuffer(1,bufSize,this.ctx.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1);
      const src=this.ctx.createBufferSource();
      src.buffer=buffer;
      const filter=this.ctx.createBiquadFilter();
      filter.type='lowpass';filter.frequency.value=filterFreq;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(filter);filter.connect(g);g.connect(this.sfxGain);
      src.start(t);src.stop(t+dur+0.02);
    }catch(e){}
  },

  play(name){
    if(!this.enabled||!this.sfxEnabled)return;
    this.init();this.resume();
    switch(name){
      case 'plant':this.beep(440,0.08,'triangle',0.25,660);break;
      case 'sun':this.beep(880,0.12,'sine',0.3,1320);break;
      case 'coin':this.beep(1200,0.08,'square',0.2,1600);break;
      case 'shoot':this.beep(700,0.04,'square',0.08,900);break;
      case 'hit':this.noise(0.06,0.12,1200);break;
      case 'zombieHit':this.beep(180,0.08,'sawtooth',0.12,120);break;
      case 'zombieDie':this.beep(200,0.3,'sawtooth',0.22,60);break;
      case 'explosion':this.noise(0.45,0.5,400);this.beep(80,0.4,'sawtooth',0.3,30);break;
      case 'freeze':this.beep(1800,0.3,'sine',0.2,2800);break;
      case 'mower':this.noise(0.6,0.3,600);this.beep(120,0.5,'sawtooth',0.2,200);break;
      case 'shovel':this.noise(0.15,0.2,500);break;
      case 'glove':this.beep(600,0.08,'sine',0.2,900);break;
      case 'wave':this.beep(300,0.4,'sawtooth',0.28,150);break;
      case 'bigwave':this.beep(150,0.8,'sawtooth',0.35,80);this.noise(0.6,0.25,500);break;
      case 'win':[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.25,'triangle',0.3),i*120));break;
      case 'lose':[400,300,200,150].forEach((f,i)=>setTimeout(()=>this.beep(f,0.3,'sawtooth',0.3),i*150));break;
      case 'achievement':[660,880,1100].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'sine',0.25),i*100));break;
      case 'click':this.beep(800,0.04,'square',0.15);break;
      case 'levelup':[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>this.beep(f,0.2,'triangle',0.3),i*100));break;
      case 'water':this.beep(500,0.1,'sine',0.2,700);break;
      case 'reward':[880,1100,1320].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'triangle',0.3),i*80));break;
      case 'shop':this.beep(1000,0.1,'square',0.2,1400);break;
      case 'error':this.beep(200,0.15,'square',0.25,150);break;
      case 'banner':this.beep(400,0.5,'sawtooth',0.25,200);break;
    }
  },

  startMusic(){
    if(!this.enabled||!this.musicEnabled||this.musicTimer||!this.ctx)return;
    const melody=[523,0,659,0,784,0,659,0,587,0,698,0,880,0,698,0,659,0,784,0,988,0,784,0,587,0,698,0,880,0,698,0];
    let step=0;
    this.musicTimer=setInterval(()=>{
      if(!this.musicEnabled||!this.ctx)return;
      const f=melody[step%melody.length];
      if(f>0){
        try{
          const t=this.ctx.currentTime;
          const osc=this.ctx.createOscillator();
          const g=this.ctx.createGain();
          osc.type='triangle';
          osc.frequency.value=f;
          g.gain.setValueAtTime(0.0001,t);
          g.gain.exponentialRampToValueAtTime(0.15,t+0.02);
          g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
          osc.connect(g);g.connect(this.musicGain);
          osc.start(t);osc.stop(t+0.4);
        }catch(e){}
      }
      step++;
    },380);
  },

  stopMusic(){if(this.musicTimer){clearInterval(this.musicTimer);this.musicTimer=null;}},

  setMusicEnabled(on){
    this.musicEnabled=on;
    if(this.musicGain)this.musicGain.gain.value=on?this.musicVolume:0;
    if(on)this.startMusic();else this.stopMusic();
  },

  setSfxEnabled(on){
    this.sfxEnabled=on;
    if(this.sfxGain)this.sfxGain.gain.value=on?1:0;
  }
};

const SAVE_KEY='pvz_save_v80';
const LEGACY_SAVE_KEYS=['pvz_save_v70','pvz_save_v60','pvz_save_v50','pvz_save_v40','pvz_backup'];

function saveProgress(silent=false){
  try{
    const data={
      version:80,
      unlocked:S.unlockedLevels,
      stars:S.levelStars,
      totalKills:S.totalKillsEver,
      totalWins:S.totalWinsEver,
      achievements:S.achievements,
      minigameBest:S.minigameBest,
      coins:S.coins,
      totalCoinsEarned:S.totalCoinsEarned,
      ownedPlants:S.ownedPlants,
      ownedItems:S.ownedItems,
      extraSlots:S.extraSlots||0,
      treeLevel:S.treeLevel,
      treeWater:S.treeWater,
      treeWaterNeeded:S.treeWaterNeeded,
      treeCoinsFromZombies:S.treeCoinsFromZombies,
      zombieCoinsCollected:S.zombieCoinsCollected,
      // === НАСТРОЙКИ (НОВОЕ) ===
      settings:{
        showFPS:S.showFPS,
        showGrid:S.showGrid,
        showHPBars:S.showHPBars,
        soundOn:S.soundOn,
        musicOn:S.musicOn,
        soundVolume:S.soundVolume,
        musicVolume:S.musicVolume
      }
    };
    try{
      const prev=localStorage.getItem(SAVE_KEY);
      if(prev)localStorage.setItem('pvz_backup',prev);
    }catch(e){}
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    if(!silent)showSaveToast('💾 Прогресс сохранён');
    return true;
  }catch(e){console.error('Save error:',e);return false;}
}

function loadProgress(){
  try{
    let raw=localStorage.getItem(SAVE_KEY);
    let usedLegacy=false;
    if(!raw){
      for(const k of LEGACY_SAVE_KEYS){
        raw=localStorage.getItem(k);
        if(raw){usedLegacy=true;break;}
      }
    }
    if(!raw)return;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object')return;

    if(typeof d.unlocked==='number'&&d.unlocked>0)S.unlockedLevels=d.unlocked;
    if(d.stars&&typeof d.stars==='object')S.levelStars=d.stars;
    if(typeof d.totalKills==='number')S.totalKillsEver=d.totalKills;
    if(typeof d.totalWins==='number')S.totalWinsEver=d.totalWins;
    if(d.achievements&&typeof d.achievements==='object')S.achievements=d.achievements;
    if(d.minigameBest&&typeof d.minigameBest==='object')S.minigameBest=d.minigameBest;
    if(typeof d.coins==='number')S.coins=d.coins;
    if(typeof d.totalCoinsEarned==='number')S.totalCoinsEarned=d.totalCoinsEarned;
    if(typeof d.extraSlots==='number')S.extraSlots=d.extraSlots;
    if(typeof d.treeLevel==='number')S.treeLevel=d.treeLevel;
    if(typeof d.treeWater==='number')S.treeWater=d.treeWater;
    if(typeof d.treeWaterNeeded==='number')S.treeWaterNeeded=d.treeWaterNeeded;
    if(typeof d.treeCoinsFromZombies==='number')S.treeCoinsFromZombies=d.treeCoinsFromZombies;
    if(typeof d.zombieCoinsCollected==='number')S.zombieCoinsCollected=d.zombieCoinsCollected;

    // === НАСТРОЙКИ (НОВОЕ) ===
    if(d.settings&&typeof d.settings==='object'){
      const st=d.settings;
      if(typeof st.showFPS==='boolean')S.showFPS=st.showFPS;
      if(typeof st.showGrid==='boolean')S.showGrid=st.showGrid;
      if(typeof st.showHPBars==='boolean')S.showHPBars=st.showHPBars;
      if(typeof st.soundOn==='boolean')S.soundOn=st.soundOn;
      if(typeof st.musicOn==='boolean')S.musicOn=st.musicOn;
      if(typeof st.soundVolume==='number')S.soundVolume=st.soundVolume;
      if(typeof st.musicVolume==='number')S.musicVolume=st.musicVolume;
    }
    // Применяем настройки к звуку
    Sound.setVolume(S.soundVolume);
    Sound.setMusicVolume(S.musicVolume);
    Sound.setSfxEnabled(S.soundOn);
    Sound.musicEnabled=S.musicOn;

    const basePlants=['peashooter','sunflower'];
    if(Array.isArray(d.ownedPlants)&&d.ownedPlants.length>0){
      const merged=[...new Set([...basePlants,...d.ownedPlants])];
      S.ownedPlants=merged.filter(id=>typeof id==='string'&&id.length>0);
    }else{
      S.ownedPlants=[...basePlants];
    }

    if(Array.isArray(d.ownedItems)&&d.ownedItems.length>0){
      S.ownedItems=[...new Set(d.ownedItems)].filter(id=>typeof id==='string');
    }

    S.seedSelectMaxSlots=6+(S.extraSlots||0);
    S.ironSpikeOwned=S.ownedItems.includes('spikeweed_iron');

    if(usedLegacy)saveProgress(true);
  }catch(e){console.error('Load error:',e);}
}

function resetProgress(){
  if(!confirm('Сбросить ВЕСЬ прогресс?'))return;
  try{
    for(const k of[SAVE_KEY,...LEGACY_SAVE_KEYS]){
      try{localStorage.removeItem(k);}catch(e){}
    }
  }catch(e){}
  S.unlockedLevels=1;
  S.levelStars={};
  S.totalKillsEver=0;
  S.totalWinsEver=0;
  S.achievements={};
  S.minigameBest={};
  S.coins=0;
  S.totalCoinsEarned=0;
  S.ownedPlants=['peashooter','sunflower'];
  S.ownedItems=[];
  S.extraSlots=0;
  S.seedSelectMaxSlots=6;
  S.ironSpikeOwned=false;
  S.treeLevel=1;
  S.treeWater=0;
  S.treeWaterNeeded=8;
  S.treeCoinsFromZombies=0;
  S.zombieCoinsCollected=0;
  // Сброс настроек
  S.showFPS=false;
  S.showGrid=true;
  S.showHPBars=true;
  S.soundOn=true;
  S.musicOn=true;
  S.soundVolume=0.5;
  S.musicVolume=0.25;
  Sound.setVolume(0.5);
  Sound.setMusicVolume(0.25);
  Sound.setSfxEnabled(true);
  Sound.musicEnabled=true;
  showSaveToast('🗑 Прогресс сброшен');
}

function resetPlants(){
  if(!confirm('Сбросить список растений к базовым?\n\nГорохострел и Подсолнух останутся.'))return;
  S.ownedPlants=['peashooter','sunflower'];
  S.seedSelectMaxSlots=6+(S.extraSlots||0);
  saveProgress(true);
  showSaveToast('🌱 Растения сброшены');
}

setInterval(()=>{
  if(S.scene==='playing'&&!S.gameOver)saveProgress(true);
},15000);

window.addEventListener('beforeunload',()=>{
  if(S.scene==='playing'&&!S.gameOver)saveProgress(true);
});

function rebuildPlantCache(){
  S.plantsByCell={};
  for(const p of S.plants){
    S.plantsByCell[p.row+'_'+p.col]=p;
  }
}

function getPlantAt(row,col){
  return S.plantsByCell[row+'_'+col]||null;
}

function isPlantAwake(type){
  const p=ALL_PLANTS[type];
  if(!p)return true;
  if(p.sleep==='both')return true;
  if(S.location==='roof')return true;
  return p.sleep===S.dayNight;
}

const ALL_PLANTS={
  peashooter:{id:'peashooter',name:'Горохострел',cost:100,cd:7500,hp:100,sleep:'day'},
  sunflower:{id:'sunflower',name:'Подсолнух',cost:50,cd:7500,hp:100,sleep:'day'},
  wallnut:{id:'wallnut',name:'Стенорех',cost:50,cd:30000,hp:4000,sleep:'both'},

function drawSkyDay(g){
  const sky=g.createLinearGradient(0,0,0,340);
  sky.addColorStop(0,'#3d9bd6');
  sky.addColorStop(.35,'#7ec0e8');
  sky.addColorStop(.7,'#b8dcf0');
  sky.addColorStop(1,'#e0eef5');
  g.fillStyle=sky;
  g.fillRect(0,0,W,340);

  const sunX=W*.85;
  const sunY=60;

  const halo=g.createRadialGradient(sunX,sunY,10,sunX,sunY,180);
  halo.addColorStop(0,'rgba(255,255,200,.9)');
  halo.addColorStop(.3,'rgba(255,240,150,.4)');
  halo.addColorStop(1,'rgba(255,240,150,0)');
  g.fillStyle=halo;
  g.beginPath();
  g.arc(sunX,sunY,180,0,Math.PI*2);
  g.fill();

  const sunG=g.createRadialGradient(sunX-8,sunY-8,4,sunX,sunY,38);
  sunG.addColorStop(0,'#fffde7');
  sunG.addColorStop(.5,'#fff176');
  sunG.addColorStop(1,'#f9a825');
  g.fillStyle=sunG;
  g.beginPath();
  g.arc(sunX,sunY,38,0,Math.PI*2);
  g.fill();

  for(const c of[
    {x:180,y:70,s:1.2,alpha:1},
    {x:520,y:40,s:.9,alpha:.85},
    {x:780,y:90,s:1.1,alpha:.95},
    {x:1050,y:55,s:.8,alpha:.75},
    {x:350,y:130,s:.7,alpha:.6}
  ]){
    g.fillStyle=`rgba(120,160,200,${.25*c.alpha})`;
    g.beginPath();
    g.arc(c.x+2,c.y+8,26*c.s,0,Math.PI*2);
    g.arc(c.x+32*c.s+2,c.y-4*c.s+8,32*c.s,0,Math.PI*2);
    g.arc(c.x+68*c.s+2,c.y+8,26*c.s,0,Math.PI*2);
    g.arc(c.x+38*c.s+2,c.y+18*c.s,24*c.s,0,Math.PI*2);
    g.fill();

    g.fillStyle=`rgba(255,255,255,${c.alpha})`;
    g.beginPath();
    g.arc(c.x,c.y,26*c.s,0,Math.PI*2);
    g.arc(c.x+32*c.s,c.y-4*c.s,32*c.s,0,Math.PI*2);
    g.arc(c.x+68*c.s,c.y,26*c.s,0,Math.PI*2);
    g.arc(c.x+38*c.s,c.y+18*c.s,24*c.s,0,Math.PI*2);
    g.fill();

    g.fillStyle=`rgba(255,255,255,${.4*c.alpha})`;
    g.beginPath();
    g.arc(c.x+32*c.s,c.y-14*c.s,14*c.s,0,Math.PI*2);
    g.fill();
  }

  g.fillStyle='rgba(140,170,200,.35)';
  g.beginPath();
  g.moveTo(0,340);
  for(let x=0;x<=W;x+=40){
    const h=200+Math.sin(x*.005)*60+Math.cos(x*.013)*30;
    g.lineTo(x,h);
  }
  g.lineTo(W,340);
  g.closePath();
  g.fill();
}

function drawSkyNight(g){
  const sky=g.createLinearGradient(0,0,0,340);
  sky.addColorStop(0,'#060a20');
  sky.addColorStop(.4,'#0e1a3a');
  sky.addColorStop(.75,'#1e2e52');
  sky.addColorStop(1,'#3a4a6a');
  g.fillStyle=sky;
  g.fillRect(0,0,W,340);

  for(let i=0;i<120;i++){
    const x=(i*211)%W;
    const y=(i*89)%260;
    const twinkle=.4+Math.abs(Math.sin(i*.7))*.6;
    const size=.5+((i*3)%5)*.35;
    g.fillStyle=`rgba(255,255,255,${twinkle})`;
    g.beginPath();
    g.arc(x,y,size,0,Math.PI*2);
    g.fill();

    if(i%17===0){
      g.strokeStyle=`rgba(255,255,220,${twinkle*.8})`;
      g.lineWidth=1;
      g.beginPath();
      g.moveTo(x-3,y);
      g.lineTo(x+3,y);
      g.moveTo(x,y-3);
      g.lineTo(x,y+3);
      g.stroke();
    }
  }

  const moonX=W*.82;
  const moonY=90;

  const halo=g.createRadialGradient(moonX,moonY,20,moonX,moonY,140);
  halo.addColorStop(0,'rgba(220,230,255,.55)');
  halo.addColorStop(.4,'rgba(200,220,255,.2)');
  halo.addColorStop(1,'rgba(200,220,255,0)');
  g.fillStyle=halo;
  g.beginPath();
  g.arc(moonX,moonY,140,0,Math.PI*2);
  g.fill();

  const moonG=g.createRadialGradient(moonX-12,moonY-12,4,moonX,moonY,48);
  moonG.addColorStop(0,'#ffffff');
  moonG.addColorStop(.6,'#f0f0e0');
  moonG.addColorStop(1,'#c8c8b0');
  g.fillStyle=moonG;
  g.beginPath();
  g.arc(moonX,moonY,48,0,Math.PI*2);
  g.fill();

  g.fillStyle='rgba(160,160,140,.4)';
  g.beginPath();
  g.arc(moonX-14,moonY-8,7,0,Math.PI*2);
  g.arc(moonX+10,moonY+14,9,0,Math.PI*2);
  g.arc(moonX-6,moonY+20,5,0,Math.PI*2);
  g.arc(moonX+18,moonY-14,4,0,Math.PI*2);
  g.fill();

  for(const c of[
    {x:200,y:80,s:.9,alpha:.25},
    {x:600,y:110,s:1.1,alpha:.2},
    {x:1000,y:60,s:.8,alpha:.3}
  ]){
    g.fillStyle=`rgba(60,80,120,${c.alpha})`;
    g.beginPath();
    g.arc(c.x,c.y,30*c.s,0,Math.PI*2);
    g.arc(c.x+34*c.s,c.y-6*c.s,36*c.s,0,Math.PI*2);
    g.arc(c.x+72*c.s,c.y,30*c.s,0,Math.PI*2);
    g.arc(c.x+40*c.s,c.y+16*c.s,26*c.s,0,Math.PI*2);
    g.fill();
  }

  g.fillStyle='rgba(20,30,55,.55)';
  g.beginPath();
  g.moveTo(0,340);
  for(let x=0;x<=W;x+=40){
    const h=200+Math.sin(x*.005)*60+Math.cos(x*.013)*30;
    g.lineTo(x,h);
  }
  g.lineTo(W,340);
  g.closePath();
  g.fill();
}

function drawTreesFence(g,isNight){
  for(let i=0;i<32;i++){
    const x=220+i*38;
    const y=8+(i%3)*5;
    const r=20+(i%5)*5;

    g.fillStyle=isNight?'rgba(0,0,0,.4)':'rgba(20,50,20,.3)';
    g.beginPath();
    g.arc(x+2,y+r*.5,r*.9,0,Math.PI*2);
    g.fill();

    const treeG=g.createRadialGradient(x-r*.3,y-r*.3,r*.2,x,y,r);
    if(isNight){
      treeG.addColorStop(0,'#123818');
      treeG.addColorStop(.6,'#0a2810');
      treeG.addColorStop(1,'#041208');
    }else{
      treeG.addColorStop(0,'#5a9e3a');
      treeG.addColorStop(.5,'#3a7d25');
      treeG.addColorStop(1,'#1e4a10');
    }
    g.fillStyle=treeG;
    g.beginPath();
    g.arc(x,y,r,0,Math.PI*2);
    g.fill();

    g.fillStyle=isNight?'rgba(40,90,60,.3)':'rgba(140,200,90,.5)';
    g.beginPath();
    g.arc(x-r*.35,y-r*.35,r*.5,0,Math.PI*2);
    g.fill();
  }

  const fenceY=72;
  g.fillStyle=isNight?'#6a6550':'#d4ceb8';
  g.fillRect(220,fenceY-4,W-220,8);

  for(let x=220;x<W+10;x+=42){
    const pg=g.createLinearGradient(x,0,x+36,0);
    if(isNight){
      pg.addColorStop(0,'#5a5540');
      pg.addColorStop(.5,'#8a8270');
      pg.addColorStop(1,'#5a5540');
    }else{
      pg.addColorStop(0,'#c8c0a0');
      pg.addColorStop(.3,'#fff9e8');
      pg.addColorStop(.7,'#f0e8d0');
      pg.addColorStop(1,'#b8b098');
    }
    g.fillStyle=pg;
    g.beginPath();
    g.moveTo(x,fenceY);
    g.lineTo(x,34);
    g.lineTo(x+18,20);
    g.lineTo(x+36,34);
    g.lineTo(x+36,fenceY);
    g.closePath();
    g.fill();

    g.strokeStyle=isNight?'#3a3520':'#8a8060';
    g.lineWidth=1.5;
    g.stroke();

    g.fillStyle=isNight?'#3a3020':'#6a5a3a';
    g.beginPath();
    g.arc(x+18,fenceY-8,2,0,Math.PI*2);
    g.fill();
  }

  g.fillStyle=isNight?'rgba(60,55,40,.5)':'rgba(180,170,140,.4)';
  g.fillRect(220,54,W-220,4);
}

function drawGridBg(g,isNight,rows,rowStart){
  for(let r=0;r<rows;r++){
    const rr=rowStart+r;
    for(let c=0;c<COLS;c++){
      const x=GRID_X+c*CELL_W;
      const y=GRID_Y+rr*CELL_H;
      const light=(rr+c)%2===0;

      const baseG=g.createLinearGradient(x,y,x,y+CELL_H);
      if(isNight){
        baseG.addColorStop(0,light?'#1a4410':'#16400c');
        baseG.addColorStop(.5,light?'#225218':'#1e4a14');
        baseG.addColorStop(1,light?'#16400c':'#123a08');
      }else{
        baseG.addColorStop(0,light?'#7ad83e':'#65c82e');
        baseG.addColorStop(.5,light?'#6ccf34':'#5cc02a');
        baseG.addColorStop(1,light?'#5cc02a':'#4eb022');
      }
      g.fillStyle=baseG;
      g.fillRect(x,y,CELL_W,CELL_H);

      // Рисуем траву только если включена сетка (фикс "глазастой" текстуры)
      if(S.showGrid){
        for(let i=0;i<4;i++){
          const tx=x+8+i*18+((rr*7+c*13)%10);
          const ty=y+CELL_H*0.5+Math.sin(rr*3+c*5+i)*12;
          const th=4+((i*3+rr)%4);

          g.strokeStyle=isNight?'rgba(0,0,0,.35)':'rgba(60,120,30,.4)';
          g.lineWidth=1.5;
          g.beginPath();
          g.moveTo(tx,ty);
          g.lineTo(tx+1,ty-th);
          g.stroke();

          g.strokeStyle=isNight?'rgba(60,120,60,.3)':'rgba(180,230,100,.5)';
          g.lineWidth=.8;
          g.beginPath();
          g.moveTo(tx+1,ty-th);
          g.lineTo(tx+2,ty-th+3);
          g.stroke();
        }
      }

      g.strokeStyle=isNight?'rgba(0,0,0,.25)':'rgba(30,80,10,.2)';
      g.lineWidth=1;
      g.strokeRect(x+.5,y+.5,CELL_W-1,CELL_H-1);
    }
  }
}

function drawRoadBg(g,isNight,aTop,aBottom){
  const roadTop=aTop-30;
  const roadBottom=aBottom+30;

  const rbg=g.createLinearGradient(0,roadTop,0,roadBottom);
  if(isNight){
    rbg.addColorStop(0,'#252525');
    rbg.addColorStop(.5,'#2e2e2e');
    rbg.addColorStop(1,'#1a1a1a');
  }else{
    rbg.addColorStop(0,'#7a7a7a');
    rbg.addColorStop(.5,'#8a8a8a');
    rbg.addColorStop(1,'#6a6a6a');
  }
  g.fillStyle=rbg;
  g.fillRect(YARD_RIGHT,roadTop,ROAD_W,roadBottom-roadTop);

  const ts=72;
  for(let ty=0;ty<Math.ceil((roadBottom-roadTop)/ts);ty++){
    for(let tx=0;tx<Math.ceil(ROAD_W/ts);tx++){
      const tX=YARD_RIGHT+tx*ts;
      const tY=roadTop+ty*ts;
      const tw=Math.min(ts,YARD_RIGHT+ROAD_W-tX);
      const th=Math.min(ts,roadBottom-tY);
      const shade=(tx+ty)%2===0;

      const tg=g.createLinearGradient(tX,tY,tX,tY+th);
      if(isNight){
        tg.addColorStop(0,shade?'#454545':'#3d3d3d');
        tg.addColorStop(1,shade?'#353535':'#2d2d2d');
      }else{
        tg.addColorStop(0,shade?'#b0b0b0':'#a0a0a0');
        tg.addColorStop(1,shade?'#909090':'#808080');
      }
      g.fillStyle=tg;
      g.fillRect(tX+3,tY+3,tw-6,th-6);

      g.fillStyle='rgba(0,0,0,.15)';
      g.fillRect(tX+3,tY+3,tw-6,4);
      g.fillRect(tX+3,tY+3,4,th-6);

      g.fillStyle='rgba(255,255,255,.12)';
      g.fillRect(tX+3,tY+th-6,tw-6,3);

      g.strokeStyle=isNight?'#0a0a0a':'#4a4a4a';
      g.lineWidth=2.5;
      g.strokeRect(tX+3,tY+3,tw-6,th-6);

      if((tx*7+ty*13)%11===0){
        g.strokeStyle=isNight?'rgba(0,0,0,.5)':'rgba(60,60,60,.4)';
        g.lineWidth=1.2;
        g.beginPath();
        g.moveTo(tX+15,tY+10);
        g.lineTo(tX+22,tY+22);
        g.lineTo(tX+18,tY+35);
        g.stroke();
      }
    }
  }
}

function drawHouse(g,isNight){
  const houseW=GRID_X-45;
  const houseTop=100;
  const houseBottom=H-60;

  g.fillStyle='rgba(0,0,0,.3)';
  g.fillRect(0,houseBottom-10,houseW,20);

  const wallG=g.createLinearGradient(0,0,houseW,0);
  if(isNight){
    wallG.addColorStop(0,'#6a5a40');
    wallG.addColorStop(.3,'#8a7a5a');
    wallG.addColorStop(.7,'#a89878');
    wallG.addColorStop(1,'#4a3a25');
  }else{
    wallG.addColorStop(0,'#e8d8b8');
    wallG.addColorStop(.2,'#fff5e0');
    wallG.addColorStop(.6,'#f5e8d0');
    wallG.addColorStop(1,'#b8a080');
  }
  g.fillStyle=wallG;
  g.fillRect(0,houseTop,houseW,houseBottom-houseTop);

  g.strokeStyle=isNight?'rgba(30,20,10,.4)':'rgba(180,160,130,.3)';
  g.lineWidth=1;
  for(let y=houseTop+20;y<houseBottom;y+=28){
    g.beginPath();
    g.moveTo(0,y);
    g.lineTo(houseW,y);
    g.stroke();

    const offset=(y/28)%2===0?0:20;
    for(let x=offset;x<houseW;x+=40){
      g.beginPath();
      g.moveTo(x,y);
      g.lineTo(x,y+28);
      g.stroke();
    }
  }

  const roofG=g.createLinearGradient(0,20,0,130);
  if(isNight){
    roofG.addColorStop(0,'#5a2a20');
    roofG.addColorStop(.5,'#4a2018');
    roofG.addColorStop(1,'#2a0a08');
  }else{
    roofG.addColorStop(0,'#f5503c');
    roofG.addColorStop(.4,'#d93828');
    roofG.addColorStop(1,'#8a1a12');
  }
  g.fillStyle=roofG;
  g.beginPath();
  g.moveTo(-15,130);
  g.lineTo(houseW*.5,15);
  g.lineTo(houseW+15,130);
  g.closePath();
  g.fill();

  g.strokeStyle=isNight?'#2a0a08':'#6a1008';
  g.lineWidth=3;
  g.stroke();

  g.strokeStyle=isNight?'rgba(0,0,0,.35)':'rgba(120,20,10,.4)';
  g.lineWidth=1.5;
  for(let i=1;i<8;i++){
    const t=i/8;
    g.beginPath();
    g.moveTo(-15+t*(houseW*.5+15),130-t*115);
    g.lineTo(houseW+15-t*(houseW*.5+15),130-t*115);
    g.stroke();
  }

  const wx=30;
  const wy=160;
  const ww=70;
  const wh=85;
  g.fillStyle=isNight?'#3a2a1a':'#8b5a2b';
  g.fillRect(wx-4,wy-4,ww+8,wh+8);

  const glassG=g.createLinearGradient(wx,wy,wx,wy+wh);
  if(isNight){
    glassG.addColorStop(0,'#1a2a4a');
    glassG.addColorStop(.5,'#2a3a5a');
    glassG.addColorStop(1,'#1a2a4a');
  }else{
    glassG.addColorStop(0,'#c8e8ff');
    glassG.addColorStop(.5,'#a8d8f0');
    glassG.addColorStop(1,'#88c0e0');
  }
  g.fillStyle=glassG;
  g.fillRect(wx,wy,ww,wh);

  g.strokeStyle=isNight?'#3a2a1a':'#8b5a2b';
  g.lineWidth=4;
  g.beginPath();
  g.moveTo(wx+ww/2,wy);
  g.lineTo(wx+ww/2,wy+wh);
  g.moveTo(wx,wy+wh/2);
  g.lineTo(wx+ww,wy+wh/2);
  g.stroke();

  g.fillStyle='rgba(255,255,255,.4)';
  g.beginPath();
  g.moveTo(wx+5,wy+5);
  g.lineTo(wx+25,wy+5);
  g.lineTo(wx+5,wy+40);
  g.closePath();
  g.fill();

  if(isNight){
    g.fillStyle='rgba(255,220,120,.35)';
    g.fillRect(wx,wy,ww,wh);
  }

  const dx=39;
  const dy=450;
  const dw=87;
  const dh=156;
  g.fillStyle=isNight?'#2a1a10':'#5a3a1a';
  g.fillRect(dx-6,dy-6,dw+12,dh+6);

  const doorG=g.createLinearGradient(dx,0,dx+dw,0);
  if(isNight){
    doorG.addColorStop(0,'#3a2410');
    doorG.addColorStop(.5,'#4a3020');
    doorG.addColorStop(1,'#2a1a08');
  }else{
    doorG.addColorStop(0,'#6d4c21');
    doorG.addColorStop(.5,'#8a6438');
    doorG.addColorStop(1,'#4a3020');
  }
  g.fillStyle=doorG;
  g.fillRect(dx,dy,dw,dh);

  g.strokeStyle=isNight?'#1a0e05':'#3a2010';
  g.lineWidth=3;
  g.strokeRect(dx+10,dy+15,dw-20,50);
  g.strokeRect(dx+10,dy+80,dw-20,55);

  g.fillStyle=isNight?'#a8a080':'#d4c090';
  g.beginPath();
  g.arc(dx+dw-15,dy+dh/2,5,0,Math.PI*2);
  g.fill();
  g.strokeStyle='#4a3020';
  g.lineWidth=1.5;
  g.stroke();

  g.fillStyle=isNight?'#3a2010':'#6d4c21';
  g.beginPath();
  g.moveTo(dx-15,dy-5);
  g.lineTo(dx+dw+15,dy-5);
  g.lineTo(dx+dw+8,dy-25);
  g.lineTo(dx-8,dy-25);
  g.closePath();
  g.fill();
}

// ФОН ДВОРА
// ============================================================
function buildYardBackground(isNight,rows,rowStart){
  const oc=document.createElement('canvas');
  oc.width=W;
  oc.height=H;
  const g=oc.getContext('2d');
  const aTop=GRID_Y+rowStart*CELL_H;
  const aBottom=aTop+rows*CELL_H;

  if(isNight)drawSkyNight(g);
  else drawSkyDay(g);

  drawTreesFence(g,isNight);

  const dirtG=g.createLinearGradient(0,90,0,H);
  if(isNight){
    dirtG.addColorStop(0,'#2a1a10');
    dirtG.addColorStop(.5,'#1e1408');
    dirtG.addColorStop(1,'#0a0805');
  }else{
    dirtG.addColorStop(0,'#a07850');
    dirtG.addColorStop(.5,'#8a6438');
    dirtG.addColorStop(1,'#6a4a28');
  }
  g.fillStyle=dirtG;
  g.fillRect(0,90,W,H-90);

  for(let i=0;i<50;i++){
    const x=Math.random()*W;
    const y=90+Math.random()*(H-90);
    const r=20+Math.random()*40;
    g.fillStyle=isNight?'rgba(0,0,0,.15)':'rgba(120,80,40,.15)';
    g.beginPath();
    g.arc(x,y,r,0,Math.PI*2);
    g.fill();
  }

  drawGridBg(g,isNight,rows,rowStart);

  g.fillStyle='rgba(0,0,0,.25)';
  g.fillRect(GRID_X-8,aTop-8,GRID_W+16,8);
  g.fillRect(GRID_X-8,aBottom,GRID_W+16,8);
  g.fillRect(GRID_X-8,aTop-8,8,aBottom-aTop+16);
  g.fillRect(GRID_X+GRID_W,aTop-8,8,aBottom-aTop+16);

  for(let x=GRID_X-10;x<GRID_X+GRID_W+10;x+=6){
    const h=8+((x*7)%10);
    g.strokeStyle=isNight?'#1a4a10':'#4eb022';
    g.lineWidth=2;
    g.beginPath();
    g.moveTo(x,aTop);
    g.lineTo(x+2,aTop-h);
    g.stroke();

    g.strokeStyle=isNight?'rgba(60,120,60,.5)':'rgba(160,220,80,.7)';
    g.lineWidth=1;
    g.beginPath();
    g.moveTo(x+2,aTop-h);
    g.lineTo(x+3,aTop-h+4);
    g.stroke();
  }

  for(let x=GRID_X-10;x<GRID_X+GRID_W+10;x+=6){
    const h=8+((x*11)%10);
    g.strokeStyle=isNight?'#1a4a10':'#4eb022';
    g.lineWidth=2;
    g.beginPath();
    g.moveTo(x,aBottom);
    g.lineTo(x+2,aBottom+h);
    g.stroke();
  }

  drawRoadBg(g,isNight,aTop,aBottom);
  drawHouse(g,isNight);

  return oc;
}

// ============================================================
// УПРАВЛЕНИЕ КЭШЕМ
// ============================================================
function ensureBackgrounds(){
  const key=S.location+'_'+ROWS+'_'+ROW_START+'_'+S.showGrid;
  if(bgCacheKey===key)return;
  bgCacheKey=key;

  if(S.location==='roof'){
    bgCacheRoof=buildRoofBackground(ROWS,ROW_START);
  }else if(S.location==='night'){
    bgCacheYardNight=buildYardBackground(true,ROWS,ROW_START);
  }else if(S.location==='pool'){
    bgCachePool=buildPoolBackground(ROWS,ROW_START,false);
  }else if(S.location==='nightpool'){
    bgCacheNightPool=buildPoolBackground(ROWS,ROW_START,true);
  }else{
    bgCacheYard=buildYardBackground(false,ROWS,ROW_START);
  }
}

// ============================================================
// ФОН КРЫШИ
// ============================================================
function buildRoofBackground(rows,rowStart){
  const oc=document.createElement('canvas');
  oc.width=W;
  oc.height=H;
  const g=oc.getContext('2d');

  const sky=g.createLinearGradient(0,0,0,320);
  sky.addColorStop(0,'#4a6fa8');
  sky.addColorStop(.3,'#8a9ec8');
  sky.addColorStop(.6,'#e8b088');
  sky.addColorStop(.85,'#f0c890');
  sky.addColorStop(1,'#d8a870');
  g.fillStyle=sky;
  g.fillRect(0,0,W,320);

  const sunX=W*.75;
  const sunY=180;

  const sunHalo=g.createRadialGradient(sunX,sunY,10,sunX,sunY,160);
  sunHalo.addColorStop(0,'rgba(255,240,180,.9)');
  sunHalo.addColorStop(.4,'rgba(255,200,120,.4)');
  sunHalo.addColorStop(1,'rgba(255,200,120,0)');
  g.fillStyle=sunHalo;
  g.beginPath();
  g.arc(sunX,sunY,160,0,Math.PI*2);
  g.fill();

  const sunG=g.createRadialGradient(sunX-10,sunY-10,4,sunX,sunY,55);
  sunG.addColorStop(0,'#fff8e0');
  sunG.addColorStop(.4,'#ffd070');
  sunG.addColorStop(1,'#e08040');
  g.fillStyle=sunG;
  g.beginPath();
  g.arc(sunX,sunY,55,0,Math.PI*2);
  g.fill();

  for(const c of[
    {x:150,y:80,s:1.1,alpha:.7},
    {x:500,y:60,s:.9,alpha:.6},
    {x:1000,y:90,s:1,alpha:.55}
  ]){
    g.fillStyle=`rgba(240,180,140,${c.alpha})`;
    g.beginPath();
    g.arc(c.x,c.y,30*c.s,0,Math.PI*2);
    g.arc(c.x+34*c.s,c.y-6*c.s,38*c.s,0,Math.PI*2);
    g.arc(c.x+74*c.s,c.y,30*c.s,0,Math.PI*2);
    g.arc(c.x+40*c.s,c.y+18*c.s,28*c.s,0,Math.PI*2);
    g.fill();

    g.fillStyle=`rgba(255,220,180,${c.alpha*.5})`;
    g.beginPath();
    g.arc(c.x+34*c.s,c.y-18*c.s,14*c.s,0,Math.PI*2);
    g.fill();
  }

  g.strokeStyle='rgba(60,50,40,.5)';
  g.lineWidth=2;
  for(const b of[
    {x:280,y:120,s:.8},
    {x:340,y:100,s:.6},
    {x:420,y:130,s:.7}
  ]){
    g.beginPath();
    g.moveTo(b.x-10*b.s,b.y);
    g.quadraticCurveTo(b.x-5*b.s,b.y-6*b.s,b.x,b.y);
    g.quadraticCurveTo(b.x+5*b.s,b.y-6*b.s,b.x+10*b.s,b.y);
    g.stroke();
  }

  const roofG=g.createLinearGradient(0,90,0,H);
  roofG.addColorStop(0,'#8a4a3a');
  roofG.addColorStop(.3,'#7a3a2a');
  roofG.addColorStop(.7,'#6a2a1a');
  roofG.addColorStop(1,'#3a1008');
  g.fillStyle=roofG;
  g.fillRect(0,90,W,H-90);

  for(let y=100;y<H;y+=22){
    g.fillStyle='rgba(0,0,0,.3)';
    g.fillRect(0,y,W,3);

    g.fillStyle='rgba(255,180,120,.15)';
    g.fillRect(0,y+3,W,2);
  }

  for(let y=100;y<H;y+=22){
    const offset=((y/22)%2)*28;
    for(let x=offset;x<W;x+=56){
      g.strokeStyle='rgba(0,0,0,.35)';
      g.lineWidth=1.5;
      g.beginPath();
      g.moveTo(x,y);
      g.lineTo(x,y+22);
      g.stroke();
    }
  }

  for(let i=0;i<25;i++){
    const x=Math.random()*W;
    const y=100+Math.random()*(H-100);
    const r=15+Math.random()*30;
    g.fillStyle='rgba(0,0,0,.12)';
    g.beginPath();
    g.arc(x,y,r,0,Math.PI*2);
    g.fill();
  }

  for(let r=0;r<rows;r++){
    const rr=rowStart+r;
    for(let c=0;c<COLS;c++){
      const x=GRID_X+c*CELL_W;
      const y=GRID_Y+rr*CELL_H;
      const light=(rr+c)%2===0;

      const tg=g.createLinearGradient(x,y,x,y+CELL_H);
      tg.addColorStop(0,light?'rgba(180,120,90,.35)':'rgba(160,100,70,.35)');
      tg.addColorStop(.5,light?'rgba(200,140,100,.25)':'rgba(180,120,80,.25)');
      tg.addColorStop(1,light?'rgba(160,100,70,.35)':'rgba(140,80,60,.35)');
      g.fillStyle=tg;
      g.fillRect(x,y,CELL_W,CELL_H);

      g.strokeStyle='rgba(40,20,10,.5)';
      g.lineWidth=2;
      g.strokeRect(x+1,y+1,CELL_W-2,CELL_H-2);

      g.fillStyle='rgba(0,0,0,.1)';
      g.fillRect(x+1,y+1,CELL_W-2,4);
    }
  }

  const corniceG=g.createLinearGradient(0,80,0,120);
  corniceG.addColorStop(0,'#a87050');
  corniceG.addColorStop(.5,'#8b5a2b');
  corniceG.addColorStop(1,'#5a3010');
  g.fillStyle=corniceG;
  g.fillRect(0,80,W,40);

  g.strokeStyle='#3a1a08';
  g.lineWidth=3;
  g.beginPath();
  g.moveTo(0,80);
  g.lineTo(W,80);
  g.stroke();
  g.beginPath();
  g.moveTo(0,120);
  g.lineTo(W,120);
  g.stroke();

  for(let x=0;x<W;x+=40){
    g.strokeStyle='rgba(0,0,0,.3)';
    g.lineWidth=1.5;
    g.beginPath();
    g.moveTo(x,90);
    g.lineTo(x,110);
    g.stroke();
  }

  return oc;
}

// ФОН БАССЕЙНА

function buildPoolBackground(rows,rowStart,isNight){
  const oc=document.createElement('canvas');
  oc.width=W;
  oc.height=H;
  const g=oc.getContext('2d');
  const aTop=GRID_Y+rowStart*CELL_H;
  const aBottom=aTop+rows*CELL_H;

  if(isNight)drawSkyNight(g);
  else drawSkyDay(g);

  drawTreesFence(g,isNight);

  const dirtG=g.createLinearGradient(0,90,0,H);
  if(isNight){
    dirtG.addColorStop(0,'#2a1a10');
    dirtG.addColorStop(.5,'#1e1408');
    dirtG.addColorStop(1,'#0a0805');
  }else{
    dirtG.addColorStop(0,'#a07850');
    dirtG.addColorStop(.5,'#8a6438');
    dirtG.addColorStop(1,'#6a4a28');
  }
  g.fillStyle=dirtG;
  g.fillRect(0,90,W,H-90);

  for(let r=0;r<rows;r++){
    const rr=rowStart+r;
    const isPoolRow=rr>=2&&rr<4;
    for(let c=0;c<COLS;c++){
      const x=GRID_X+c*CELL_W;
      const y=GRID_Y+rr*CELL_H;

      if(isPoolRow){
        const wg=g.createLinearGradient(x,y,x,y+CELL_H);
        if(isNight){
          wg.addColorStop(0,c%2===0?'#0e3a58':'#0a3450');
          wg.addColorStop(.3,c%2===0?'#1a4a68':'#164458');
          wg.addColorStop(.7,c%2===0?'#256080':'#205878');
          wg.addColorStop(1,c%2===0?'#0e3850':'#0c3048');
        }else{
          wg.addColorStop(0,c%2===0?'#2e7eb8':'#2878b0');
          wg.addColorStop(.3,c%2===0?'#3a8ec8':'#3288c0');
          wg.addColorStop(.7,c%2===0?'#4aa8e0':'#42a0d8');
          wg.addColorStop(1,c%2===0?'#2e78b0':'#2a70a8');
        }
        g.fillStyle=wg;
        g.fillRect(x,y,CELL_W,CELL_H);

        g.fillStyle=isNight?'rgba(100,150,200,.25)':'rgba(255,255,255,.25)';
        g.fillRect(x,y,CELL_W,CELL_H*.25);

        g.strokeStyle=isNight?'rgba(150,200,255,.25)':'rgba(255,255,255,.35)';
        g.lineWidth=1.8;
        for(let w=0;w<3;w++){
          g.beginPath();
          const wy=y+22+w*26;
          g.moveTo(x+4,wy);
          g.bezierCurveTo(x+20,wy-5,x+35,wy+5,x+50,wy);
          g.bezierCurveTo(x+60,wy-4,x+72,wy+4,x+CELL_W-4,wy);
          g.stroke();
        }

        g.fillStyle=isNight?'rgba(180,220,255,.3)':'rgba(255,255,255,.5)';
        g.beginPath();
        g.ellipse(x+25+((r*13+c*7)%30),y+35+(c*11)%30,5,2,0,0,Math.PI*2);
        g.fill();
      }else{
        const light=(rr+c)%2===0;
        const baseG=g.createLinearGradient(x,y,x,y+CELL_H);
        if(isNight){
          baseG.addColorStop(0,light?'#1a4410':'#16400c');
          baseG.addColorStop(.5,light?'#225218':'#1e4a14');
          baseG.addColorStop(1,light?'#16400c':'#123a08');
        }else{
          baseG.addColorStop(0,light?'#7ad83e':'#65c82e');
          baseG.addColorStop(.5,light?'#6ccf34':'#5cc02a');
          baseG.addColorStop(1,light?'#5cc02a':'#4eb022');
        }
        g.fillStyle=baseG;
        g.fillRect(x,y,CELL_W,CELL_H);

        if(S.showGrid){
          for(let i=0;i<4;i++){
            const tx=x+8+i*18+((rr*7+c*13)%10);
            const ty=y+CELL_H*0.5+Math.sin(rr*3+c*5+i)*12;
            const th=4+((i*3+rr)%4);

            g.strokeStyle=isNight?'rgba(0,0,0,.35)':'rgba(60,120,30,.4)';
            g.lineWidth=1.5;
            g.beginPath();
            g.moveTo(tx,ty);
            g.lineTo(tx+1,ty-th);
            g.stroke();
          }
        }

        g.strokeStyle=isNight?'rgba(0,0,0,.25)':'rgba(30,80,10,.2)';
        g.lineWidth=1;
        g.strokeRect(x+.5,y+.5,CELL_W-1,CELL_H-1);
      }
    }
  }

  const poolTopY=GRID_Y+2*CELL_H;
  const poolBottomY=GRID_Y+4*CELL_H;

  const edgeTopG=g.createLinearGradient(0,poolTopY-12,0,poolTopY);
  edgeTopG.addColorStop(0,isNight?'#5a5040':'#d0c0a0');
  edgeTopG.addColorStop(.5,isNight?'#8a7a60':'#e8d8b8');
  edgeTopG.addColorStop(1,isNight?'#6a5a40':'#c8b898');
  g.fillStyle=edgeTopG;
  g.fillRect(GRID_X,poolTopY-12,GRID_W,12);

  g.strokeStyle=isNight?'rgba(0,0,0,.4)':'rgba(80,60,40,.3)';
  g.lineWidth=1;
  for(let x=GRID_X;x<GRID_X+GRID_W;x+=20){
    g.beginPath();
    g.moveTo(x,poolTopY-12);
    g.lineTo(x,poolTopY);
    g.stroke();
  }

  g.fillStyle='rgba(0,0,0,.3)';
  g.fillRect(GRID_X,poolTopY,GRID_W,4);

  const edgeBotG=g.createLinearGradient(0,poolBottomY,0,poolBottomY+12);
  edgeBotG.addColorStop(0,isNight?'#5a5040':'#d0c0a0');
  edgeBotG.addColorStop(.5,isNight?'#8a7a60':'#e8d8b8');
  edgeBotG.addColorStop(1,isNight?'#6a5a40':'#c8b898');
  g.fillStyle=edgeBotG;
  g.fillRect(GRID_X,poolBottomY,GRID_W,12);

  g.strokeStyle=isNight?'rgba(0,0,0,.4)':'rgba(80,60,40,.3)';
  g.lineWidth=1;
  for(let x=GRID_X;x<GRID_X+GRID_W;x+=20){
    g.beginPath();
    g.moveTo(x,poolBottomY);
    g.lineTo(x,poolBottomY+12);
    g.stroke();
  }

  g.fillStyle='rgba(0,0,0,.25)';
  g.fillRect(GRID_X,poolBottomY+12,GRID_W,4);

  drawRoadBg(g,isNight,aTop,aBottom);

  return oc;
}

// ============================================================
// КУСТЫ
// ============================================================
function buildBushes(isNight,rows,rowStart){
  const oc=document.createElement('canvas');
  oc.width=W;
  oc.height=H;
  const g=oc.getContext('2d');
  const aTop=GRID_Y+rowStart*CELL_H;
  const aBottom=aTop+rows*CELL_H;

  const rightBlobs=[];
  for(let i=0;i<70;i++){
    rightBlobs.push({
      x:ROAD_RIGHT+20+Math.random()*90,
      y:aTop-20+Math.random()*(rows*CELL_H+40),
      r:22+Math.random()*24,
      depth:Math.random(),
      shade:Math.random()>.5
    });
  }
  rightBlobs.sort((a,b)=>a.y-b.y);

  for(const b of rightBlobs){
    g.fillStyle=isNight?'rgba(0,0,0,.5)':'rgba(0,30,0,.35)';
    g.beginPath();
    g.arc(b.x+3,b.y+4,b.r*.95,0,Math.PI*2);
    g.fill();

    const bg=g.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,b.r*.2,b.x,b.y,b.r);
    if(isNight){
      bg.addColorStop(0,b.depth>.5?'#0a2a0a':'#0d300d');
      bg.addColorStop(.6,b.depth>.5?'#082208':'#0a2808');
      bg.addColorStop(1,'#041208');
    }else{
      bg.addColorStop(0,b.depth>.5?'#2a7d20':'#225a18');
      bg.addColorStop(.6,b.depth>.5?'#1e5a15':'#184a12');
      bg.addColorStop(1,'#0a2808');
    }
    g.fillStyle=bg;
    g.beginPath();
    g.arc(b.x,b.y,b.r,0,Math.PI*2);
    g.fill();

    g.fillStyle=isNight
      ?(b.shade?'rgba(40,90,60,.6)':'rgba(30,70,50,.5)')
      :(b.shade?'rgba(120,200,80,.6)':'rgba(90,170,60,.5)');
    g.beginPath();
    g.arc(b.x-b.r*.25,b.y-b.r*.3,b.r*.55,0,Math.PI*2);
    g.fill();

    for(let i=0;i<3;i++){
      const lx=b.x-b.r*.5+i*b.r*.5;
      const ly=b.y-b.r*.5+((i*17)%10);
      g.fillStyle=isNight?'rgba(60,120,70,.4)':'rgba(140,220,90,.5)';
      g.beginPath();
      g.ellipse(lx,ly,5,3,.3,0,Math.PI*2);
      g.fill();
    }
  }

  const bottomBlobs=[];
  for(let i=0;i<50;i++){
    bottomBlobs.push({
      x:GRID_X-60+Math.random()*(GRID_W+300),
      y:aBottom+55+Math.random()*45,
      r:16+Math.random()*22,
      depth:Math.random(),
      shade:Math.random()>.5
    });
  }
  bottomBlobs.sort((a,b)=>a.y-b.y);

  for(const b of bottomBlobs){
    g.fillStyle=isNight?'rgba(0,0,0,.5)':'rgba(0,30,0,.35)';
    g.beginPath();
    g.arc(b.x+2,b.y+3,b.r*.9,0,Math.PI*2);
    g.fill();

    const bg=g.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,b.r*.2,b.x,b.y,b.r);
    if(isNight){
      bg.addColorStop(0,b.depth>.5?'#0a2a0a':'#0d300d');
      bg.addColorStop(1,'#041208');
    }else{
      bg.addColorStop(0,b.depth>.5?'#2a7d20':'#225a18');
      bg.addColorStop(1,'#0a2808');
    }
    g.fillStyle=bg;
    g.beginPath();
    g.arc(b.x,b.y,b.r,0,Math.PI*2);
    g.fill();

    g.fillStyle=isNight
      ?(b.shade?'rgba(40,90,60,.6)':'rgba(30,70,50,.5)')
      :(b.shade?'rgba(120,200,80,.6)':'rgba(90,170,60,.5)');
    g.beginPath();
    g.arc(b.x-b.r*.25,b.y-b.r*.3,b.r*.55,0,Math.PI*2);
    g.fill();
  }

  return oc;
}

let bushesCache=null;
let bushesCacheKey='';

function ensureBushes(){
  const key=S.location+'_'+ROWS+'_'+ROW_START;
  if(bushesCacheKey===key)return;
  bushesCacheKey=key;

  if(S.location==='roof'){
    bushesCache=null;
    return;
  }

  const isNight=S.location==='night'||S.location==='nightpool';
  bushesCache=buildBushes(isNight,ROWS,ROW_START);
}

function drawStemSway(t,phase=0){
  const sway=Math.sin(t*.0025+phase)*4;
  const sg=ctx.createLinearGradient(-4,32,4,-8);
  sg.addColorStop(0,'#2d6b12');
  sg.addColorStop(.5,'#5cba32');
  sg.addColorStop(1,'#8bd142');
  ctx.strokeStyle=sg;
  ctx.lineWidth=9;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(0,32);
  ctx.quadraticCurveTo(sway*.3,12,sway,-8);
  ctx.stroke();

  ctx.strokeStyle='rgba(20,60,10,.5)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-4,32);
  ctx.quadraticCurveTo(sway*.3-4,12,sway-4,-8);
  ctx.stroke();

  for(const side of[-1,1]){
    const lx=side*18;
    const ly=14+sway*.1;
    const lg=ctx.createRadialGradient(lx*.5,ly,2,lx,ly,20);
    lg.addColorStop(0,'#9ed94c');
    lg.addColorStop(.5,'#4caf50');
    lg.addColorStop(1,'#2e7d32');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(lx,ly,18,10,side*.6+sway*.01,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1b5e20';
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
  return sway;
}

// ============================================================
// ПОДСОЛНУХ (редизайн: круглые лепестки, как на картинке)
// ============================================================
function drawSunflower(t){
  const sway=drawStemSway(t,0);
  const cy=-20+Math.sin(t*.002+.5)*2+sway*.3;
  const petals=22;

  // Лепестки — плотные, оранжевые с жёлтым центром
  for(let i=0;i<petals;i++){
    const a=(i/petals)*Math.PI*2+Math.sin(t*.001+i*.3)*.05;
    const px=Math.cos(a)*30;
    const py=Math.sin(a)*30+cy;
    const lg=ctx.createLinearGradient(px-8,py-8,px+8,py+8);
    lg.addColorStop(0,'#ffd54f');
    lg.addColorStop(.5,'#ffb300');
    lg.addColorStop(1,'#f57c00');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(px,py,12,7,a,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(200,110,0,.5)';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // Внутренние лепестки (ярче)
  for(let i=0;i<petals;i++){
    const a=(i/petals)*Math.PI*2;
    const px=Math.cos(a)*26;
    const py=Math.sin(a)*26+cy;
    const lg=ctx.createLinearGradient(px-6,py-6,px+6,py+6);
    lg.addColorStop(0,'#fff59d');
    lg.addColorStop(.7,'#ffeb3b');
    lg.addColorStop(1,'#fbc02d');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(px,py,10,6,a,0,Math.PI*2);
    ctx.fill();
  }

  // Центр — коричневый
  const cg=ctx.createRadialGradient(-6,cy-6,3,0,cy,20);
  cg.addColorStop(0,'#a06a3a');
  cg.addColorStop(.6,'#6a3a1a');
  cg.addColorStop(1,'#2d1608');
  ctx.fillStyle=cg;
  ctx.beginPath();
  ctx.arc(0,cy,20,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#1a0e05';
  ctx.lineWidth=2.5;
  ctx.stroke();

  // Семечки
  for(let i=0;i<30;i++){
    const a=(i*.618)*Math.PI*2+t*.0005;
    const r=4+Math.sqrt(i)*2.2;
    if(r>16)continue;
    const sx=Math.cos(a)*r;
    const sy=cy+Math.sin(a)*r*.95;
    ctx.fillStyle='rgba(20,10,5,.7)';
    ctx.beginPath();
    ctx.ellipse(sx,sy,1.5,2,a,0,Math.PI*2);
    ctx.fill();
  }

  // Глаза
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.ellipse(-7,cy-4,6,7.5,0,0,Math.PI*2);
  ctx.ellipse(7,cy-4,6,7.5,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#3a1a08';
  ctx.lineWidth=1.5;
  ctx.stroke();

  const lookX=Math.sin(t*.0008)*1.2;
  ctx.fillStyle='#0a0a0a';
  ctx.beginPath();
  ctx.arc(-6+lookX,cy-3,3,0,Math.PI*2);
  ctx.arc(8+lookX,cy-3,3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(-7.5+lookX,cy-5,1.3,0,Math.PI*2);
  ctx.arc(6.5+lookX,cy-5,1.3,0,Math.PI*2);
  ctx.fill();

  // Улыбка
  ctx.strokeStyle='#3a1a08';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(0,cy+6,6,.25,Math.PI-.25);
  ctx.stroke();
}

// ДВОЙНОЙ ПОДСОЛНУХ
// ============================================================
function drawTwinSunflower(t){
  const sway=drawStemSway(t,0);
  const cy=-20+Math.sin(t*.002+.5)*2+sway*.3;
  for(const offset of[-16,16]){
    const cy2=cy+(offset>0?4:-4);
    const petals=14;
    for(let i=0;i<petals;i++){
      const a=(i/petals)*Math.PI*2;
      const px=Math.cos(a)*22+offset;
      const py=Math.sin(a)*22+cy2;
      const lg=ctx.createLinearGradient(px-6,py-6,px+6,py+6);
      lg.addColorStop(0,'#fff9c4');
      lg.addColorStop(.5,'#ffeb3b');
      lg.addColorStop(1,'#f57c00');
      ctx.fillStyle=lg;
      ctx.beginPath();
      ctx.ellipse(px,py,10,6,a,0,Math.PI*2);
      ctx.fill();
    }
    const g=ctx.createRadialGradient(offset-4,cy2-4,3,offset,cy2,16);
    g.addColorStop(0,'#b8855a');
    g.addColorStop(.5,'#6a3a1a');
    g.addColorStop(1,'#2d1b0a');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(offset,cy2,15,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1a0e05';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(offset-4,cy2-2,4,0,Math.PI*2);
    ctx.arc(offset+4,cy2-2,4,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(offset-4,cy2-2,2,0,Math.PI*2);
    ctx.arc(offset+4,cy2-2,2,0,Math.PI*2);
    ctx.fill();
  }
}

function drawCoinflower(t,isGold){

      lg.addColorStop(0,'#fff9c4');

    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(px,py,13,7.5,a,0,Math.PI*2);

  ctx.lineWidth=2.5;

// ГОРОХОСТРЕЛ (редизайн: цилиндрическая голова с раструбом)

function drawPeashooter(t,ice,heads){
  const sway=drawStemSway(t,0);
  const cy=-20+Math.sin(t*.0025)*1.5+sway*.3;

  // Для двойного гороха — вторая голова
  if(heads===2){
    const cy2=cy-24;
    const g2=ctx.createRadialGradient(-4,cy2-4,3,0,cy2,22);
    g2.addColorStop(0,'#d4eaa0');
    g2.addColorStop(.5,'#8bc34a');
    g2.addColorStop(1,'#33691e');
    ctx.fillStyle=g2;
    ctx.beginPath();
    ctx.arc(-14,cy2,18,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1b5e20';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(-14,cy2-4,5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(-13,cy2-4,2.5,0,Math.PI*2);
    ctx.fill();
  }

  // Основная голова — шар
  const g=ctx.createRadialGradient(-8,cy-8,3,0,cy,26);
  if(ice){
    g.addColorStop(0,'#e1f5fe');
    g.addColorStop(.5,'#81d4fa');
    g.addColorStop(1,'#01579b');
  }else{
    g.addColorStop(0,'#e8f5c8');
    g.addColorStop(.4,'#b5e06a');
    g.addColorStop(.8,'#7cb342');
    g.addColorStop(1,'#33691e');
  }
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,cy,24,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=ice?'#01579b':'#1b5e20';
  ctx.lineWidth=2.5;
  ctx.stroke();

  // Раструб (дуло) — как на картинке цилиндр
  ctx.save();
  ctx.translate(22,cy);
  const dg=ctx.createRadialGradient(0,0,2,4,0,16);
  if(ice){
    dg.addColorStop(0,'#b3e5fc');
    dg.addColorStop(.6,'#4fc3f7');
    dg.addColorStop(1,'#01579b');
  }else{
    dg.addColorStop(0,'#c5e88a');
    dg.addColorStop(.5,'#8bc34a');
    dg.addColorStop(1,'#33691e');
  }
  ctx.fillStyle=dg;
  ctx.beginPath();
  ctx.ellipse(4,0,14,16,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=ice?'#01579b':'#1b5e20';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.fillStyle='#0a1f05';
  ctx.beginPath();
  ctx.ellipse(8,0,7,8,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.beginPath();
  ctx.ellipse(-2,-4,4,6,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Глаз
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.ellipse(6,cy-8,7,8,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#1b5e20';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(8,cy-7,3.5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(9,cy-8,1.5,0,Math.PI*2);
  ctx.fill();

  // Улыбка
  ctx.strokeStyle='#0a1f05';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(3,cy+6,4,.2,Math.PI-.2);
  ctx.stroke();
}

function drawWallnut(plant,t){
  const dmg=plant&&plant.maxHp>0?(1-plant.hp/plant.maxHp):0;
  const breathe=Math.sin(t*.003)*1.5;
  const wobble=dmg>.5?Math.sin(t*.008)*1.5:0;
  ctx.save();
  ctx.translate(wobble,breathe);

  const g=ctx.createRadialGradient(-10,-14,5,0,0,38);
  g.addColorStop(0,'#f5d9a8');
  g.addColorStop(.3,'#e8c898');
  g.addColorStop(.6,'#c9a370');
  g.addColorStop(.85,'#8b6a3a');
  g.addColorStop(1,'#4e342e');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(0,0,28,35,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#4e342e';
  ctx.lineWidth=3;
  ctx.stroke();

  // Глаза
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.ellipse(-10,-7,8,8,0,0,Math.PI*2);
  ctx.ellipse(10,-7,8,8,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#3e2723';
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(-9,-6,4,0,Math.PI*2);
  ctx.arc(11,-6,4,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(-10,-8,1.5,0,Math.PI*2);
  ctx.arc(10,-8,1.5,0,Math.PI*2);
  ctx.fill();

  // Рот
  ctx.strokeStyle='#000';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  if(dmg<.3)ctx.arc(0,10,9,.2,Math.PI-.2);
  else if(dmg<.6){ctx.moveTo(-8,12);ctx.lineTo(8,12);}
  else ctx.arc(0,22,8,Math.PI+.2,-.2);
  ctx.stroke();

  // Трещины
  if(dmg>.3){
    ctx.strokeStyle='#3e2723';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-18,-22);
    ctx.lineTo(-12,-10);
    ctx.lineTo(-17,0);
    ctx.stroke();
  }
  if(dmg>.6){
    ctx.beginPath();
    ctx.moveTo(15,-18);
    ctx.lineTo(10,-5);
    ctx.lineTo(18,8);
    ctx.stroke();
  }
  ctx.restore();
}

function drawExplosive(t,plant,type){
  const growTimer=plant?(plant.growTimer||0):0;
  const fuse=plant?(plant.fuseDuration||3000):3000;
  const progress=clamp(growTimer/fuse,0,1);
  const scale=.4+progress*.7;
  const pulse=1+Math.sin(t*.02)*.05*progress;
  const s=scale*pulse;
  ctx.save();
  ctx.scale(s,s);

  if(type==='cherry'){
    const cy=-8+Math.sin(t*.005)*1;
    ctx.strokeStyle='#4e342e';
    ctx.lineWidth=3.5;
    ctx.beginPath();
    ctx.moveTo(-10,cy-15);
    ctx.quadraticCurveTo(0,cy-35,12,cy-14);
    ctx.stroke();
    ctx.fillStyle='#4caf50';
    ctx.beginPath();
    ctx.ellipse(8,cy-28,9,5,-.5,0,Math.PI*2);
    ctx.fill();
    drawCherryBall(-10,cy,18);
    drawCherryBall(12,cy+2,18);
  }
  else if(type==='jalapeno'){
    const cy=-8+Math.sin(t*.005)*1.5;
    const flame=.5+Math.sin(t*.02)*.5;
    const ag=ctx.createRadialGradient(0,cy,10,0,cy,45);
    ag.addColorStop(0,`rgba(255,100,0,${.4*flame})`);
    ag.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle=ag;
    ctx.beginPath();
    ctx.arc(0,cy,45,0,Math.PI*2);
    ctx.fill();
    const g=ctx.createLinearGradient(-20,cy-25,20,cy+25);
    g.addColorStop(0,'#ff5252');
    g.addColorStop(.4,'#e53935');
    g.addColorStop(.7,'#b71c1c');
    g.addColorStop(1,'#7f0000');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,cy,22,30,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#4a0000';
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(-8,cy-4,7,0,Math.PI*2);
    ctx.arc(8,cy-4,7,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(-8,cy-4,3.5,0,Math.PI*2);
    ctx.arc(8,cy-4,3.5,0,Math.PI*2);
    ctx.fill();
  }
  else if(type==='iceshroom'){
    const cy=-10+Math.sin(t*.005)*1;
    const g=ctx.createRadialGradient(-6,cy-10,3,0,cy,28);
    g.addColorStop(0,'#e1f5fe');
    g.addColorStop(.5,'#4fc3f7');
    g.addColorStop(1,'#01579b');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,cy,26,22,0,Math.PI,0);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,cy,26,11,0,0,Math.PI);
    ctx.fill();
    ctx.strokeStyle='#01579b';
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(-8,cy+2,3,0,Math.PI*2);
    ctx.arc(8,cy+2,3,0,Math.PI*2);
    ctx.fill();
  }
  else if(type==='doomshroom'){
    const cy=-10+Math.sin(t*.005)*1;
    const p=0.5+Math.sin(t*.02)*.5*progress;
    const aura=ctx.createRadialGradient(0,cy,10,0,cy,60);
    aura.addColorStop(0,`rgba(255,0,0,${.25+p*.4})`);
    aura.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=aura;
    ctx.beginPath();
    ctx.arc(0,cy,60,0,Math.PI*2);
    ctx.fill();
    const g=ctx.createRadialGradient(-6,cy-12,3,0,cy,36);
    g.addColorStop(0,'#6a5a5a');
    g.addColorStop(.4,'#4a3a3a');
    g.addColorStop(1,'#0a0a0a');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,cy,34,28,0,Math.PI,0);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,cy,34,14,0,0,Math.PI);
    ctx.fill();
    ctx.strokeStyle='#000';
    ctx.lineWidth=3.5;
    ctx.stroke();
    ctx.fillStyle=`rgba(255,30,30,${.7+p*.3})`;
    ctx.beginPath();
    ctx.arc(-10,cy+2,6,0,Math.PI*2);
    ctx.arc(10,cy+2,6,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  if(plant&&progress<1){
    const barW=50;
    const barH=6;
    const bx=-barW/2;
    const by=-55;
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillRect(bx,by,barW,barH);
    const grad=ctx.createLinearGradient(bx,0,bx+barW,0);
    grad.addColorStop(0,'#ffeb3b');
    grad.addColorStop(1,'#f44336');
    ctx.fillStyle=grad;
    ctx.fillRect(bx,by,barW*progress,barH);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1;
    ctx.strokeRect(bx,by,barW,barH);
  }
}

function drawCobCannon(t,plant){
  const cy=-20+Math.sin(t*.003)*1;

  // Танковое основание — шире
  const baseG=ctx.createLinearGradient(-60,cy+10,60,cy+40);
  baseG.addColorStop(0,'#5a3a10');

  ctx.roundRect(-58,cy+10,116,32,8);
  ctx.fill();

  ctx.lineWidth=3;
  ctx.stroke();

  // Гусеницы
  for(let i=0;i<4;i++){
    const wx=-45+i*30;
    ctx.fillStyle='#2a1a0a';
    ctx.beginPath();
    ctx.arc(wx,cy+38,8,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#0a0500';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#5a4a2a';
    ctx.beginPath();
    ctx.arc(wx,cy+38,4,0,Math.PI*2);
    ctx.fill();
  }

  // Основной корпус — початок кукурузы
  const g=ctx.createLinearGradient(-32,cy-32,32,cy+18);
  g.addColorStop(0,'#f5e6a0');
  g.addColorStop(.4,'#ffd54f');
  g.addColorStop(.7,'#e6a800');
  g.addColorStop(1,'#a07a10');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.roundRect(-32,cy-32,64,52,14);
  ctx.fill();
  ctx.strokeStyle='#7a5a08';
  ctx.lineWidth=3;
  ctx.stroke();

  // Зёрна
  ctx.fillStyle='#b8860b';
  for(let r=0;r<5;r++){
    for(let c=0;c<6;c++){
      ctx.beginPath();
      ctx.arc(-25+c*10,cy-26+r*9,3.2,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Ствол-пушка
  const barrelG=ctx.createLinearGradient(-20,cy-42,20,cy-22);
  barrelG.addColorStop(0,'#3a2a1a');
  barrelG.addColorStop(.5,'#6a4a2a');
  barrelG.addColorStop(1,'#2a1a0a');
  ctx.fillStyle=barrelG;
  ctx.beginPath();
  ctx.roundRect(-16,cy-48,32,22,6);
  ctx.fill();
  ctx.strokeStyle='#1a0e05';
  ctx.lineWidth=2.5;
  ctx.stroke();

  // Дуло
  ctx.fillStyle='#0a0500';
  ctx.beginPath();
  ctx.ellipse(0,cy-48,10,4,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#4a3a2a';
  ctx.lineWidth=2;
  ctx.stroke();

  // Глаза
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(-11,cy-4,6.5,0,Math.PI*2);
  ctx.arc(11,cy-4,6.5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(-11,cy-4,3,0,Math.PI*2);
  ctx.arc(11,cy-4,3,0,Math.PI*2);
  ctx.fill();

  // Индикатор зарядки
  const charge=plant?(plant.shootTimer||0)/30000:0;
  const barW=64;
  const barH=6;
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.fillRect(-barW/2,cy-62,barW,barH);
  ctx.fillStyle=charge>=1?'#ffeb3b':'#ff8f00';
  ctx.fillRect(-barW/2,cy-62,barW*Math.min(charge,1),barH);
  ctx.strokeStyle='#000';
  ctx.lineWidth=1;
  ctx.strokeRect(-barW/2,cy-62,barW,barH);
}

function drawIceMelon(t){

  const cy=-20+Math.sin(t*.0025)*1.5+sway*.3;
  const g=ctx.createRadialGradient(-6,cy-6,3,0,cy,30);
  g.addColorStop(0,'#81d4fa');
  g.addColorStop(.5,'#0288d1');
  g.addColorStop(1,'#01579b');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(0,cy,26,30,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#01579b';
  ctx.lineWidth=2.5;
  ctx.stroke();
  // Ледяной шар
  const mg=ctx.createRadialGradient(-6,cy-4,3,0,cy,22);
  mg.addColorStop(0,'#e1f5fe');
  mg.addColorStop(.5,'#4fc3f7');
  mg.addColorStop(1,'#0277bd');
  ctx.fillStyle=mg;
  ctx.beginPath();
  ctx.ellipse(0,cy,20,22,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#01579b';
  ctx.lineWidth=1.5;
  ctx.stroke();
  // Полоски
  ctx.strokeStyle='rgba(255,255,255,.5)';
  ctx.lineWidth=2;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(i*8,cy-20);
    ctx.quadraticCurveTo(i*10,cy,i*8,cy+20);

  }

    ctx.arc(fx,fy,2,0,Math.PI*2);

  ctx.arc(-7,cy-6,2.5,0,Math.PI*2);
  ctx.arc(7,cy-6,2.5,0,Math.PI*2);
  ctx.fill();
}

function drawSun(s){
  if(!s||!Number.isFinite(s.x)||!Number.isFinite(s.y))return;
  const pulse=1+Math.sin(S.time/250+(s.phase||0))*.08;
  const r=28*pulse;

  const g=ctx.createRadialGradient(s.x,s.y,4,s.x,s.y,r*2);
  g.addColorStop(0,'rgba(255,255,150,.9)');
  g.addColorStop(.5,'rgba(255,235,59,.4)');
  g.addColorStop(1,'rgba(255,213,79,0)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(s.x,s.y,r*2,0,Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(S.time/1500);
  for(let i=0;i<12;i++){
    ctx.rotate(Math.PI*2/12);
    const lg=ctx.createLinearGradient(0,0,r*1.6,0);
    lg.addColorStop(0,'rgba(255,240,120,.9)');
    lg.addColorStop(1,'rgba(255,240,120,0)');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.moveTo(0,-4);
    ctx.lineTo(r*1.6,0);
    ctx.lineTo(0,4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  const cg=ctx.createRadialGradient(s.x-5,s.y-5,3,s.x,s.y,r);
  cg.addColorStop(0,'#fffde7');
  cg.addColorStop(.5,'#ffe082');
  cg.addColorStop(1,'#ffb300');
  ctx.fillStyle=cg;
  ctx.beginPath();
  ctx.arc(s.x,s.y,r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#f57f17';
  ctx.lineWidth=2;
  ctx.stroke();
}

function drawCoin(c){
  if(!c)return;
  const bob=Math.sin(S.time*.005+(c.phase||0))*3;
  ctx.save();
  ctx.translate(c.x,c.y+bob);

  const type=c.coinType||'bronze';
  const value=c.value||10;

  let glowColor='rgba(205,127,50,.7)';
  let outerColor='#cd7f32';
  let midColor='#e8a060';
  let innerColor='#a05a20';
  let strokeColor='#5a3010';

  if(type==='silver'){
    glowColor='rgba(192,192,192,.7)';
    outerColor='#a8a8a8';
    midColor='#e0e0e0';
    innerColor='#808080';
    strokeColor='#4a4a4a';
  }else if(type==='gold'){
    glowColor='rgba(255,215,0,.7)';
    outerColor='#d4af37';
    midColor='#ffe082';
    innerColor='#b8860b';
    strokeColor='#7a5a08';
  }else if(type==='diamond'){
    glowColor='rgba(180,240,255,.8)';
    outerColor='#4fc3f7';
    midColor='#e0f7ff';
    innerColor='#0288d1';
    strokeColor='#01579b';
  }

  const g=ctx.createRadialGradient(0,0,4,0,0,28);
  g.addColorStop(0,glowColor);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,0,28,0,Math.PI*2);
  ctx.fill();

  if(type==='diamond'){
    ctx.fillStyle=outerColor;
    ctx.beginPath();
    ctx.moveTo(0,-18);
    ctx.lineTo(14,-4);
    ctx.lineTo(8,16);
    ctx.lineTo(-8,16);
    ctx.lineTo(-14,-4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle=strokeColor;
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.moveTo(-4,-14);
    ctx.lineTo(2,-10);
    ctx.lineTo(-2,-4);
    ctx.closePath();
    ctx.fill();
  }else{
    const cg=ctx.createRadialGradient(-4,-4,2,0,0,16);
    cg.addColorStop(0,midColor);
    cg.addColorStop(.6,outerColor);
    cg.addColorStop(1,innerColor);
    ctx.fillStyle=cg;
    ctx.beginPath();
    ctx.arc(0,0,16,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=strokeColor;
    ctx.lineWidth=2.5;
    ctx.stroke();

    ctx.strokeStyle=strokeColor;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(0,0,12,0,Math.PI*2);
    ctx.stroke();

    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.beginPath();
    ctx.ellipse(-5,-6,5,3,-.5,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle='#fff';
  ctx.strokeStyle='#000';
  ctx.lineWidth=3;
  ctx.font='bold 16px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='bottom';
  ctx.strokeText('+'+value,0,-22);
  ctx.fillText('+'+value,0,-22);

  ctx.restore();
}

// ============================================================
// СНАРЯДЫ (горох, лед, споры, арбузы и т.д.)
// ============================================================
function drawProjectile(p){
  ctx.save();
  const g=ctx.createRadialGradient(p.x-2,p.y-2,1,p.x,p.y,10);

  if(p.ice){
    g.addColorStop(0,'#e1f5fe');
    g.addColorStop(.5,'#81d4fa');
    g.addColorStop(1,'#01579b');
  }else if(p.spore){
    g.addColorStop(0,'#f0d8ff');
    g.addColorStop(.5,'#c8a2d8');
    g.addColorStop(1,'#4a2a5a');
  }else if(p.melon){
    g.addColorStop(0,'#a5d66a');
    g.addColorStop(.5,'#4caf50');
    g.addColorStop(1,'#1b5e20');
  }else if(p.icemelon){
    g.addColorStop(0,'#81d4fa');
    g.addColorStop(.5,'#0288d1');
    g.addColorStop(1,'#01579b');
  }else if(p.cob){
    g.addColorStop(0,'#f5e6a0');
    g.addColorStop(.5,'#ffd54f');
    g.addColorStop(1,'#a07a10');
  }else{
    g.addColorStop(0,'#e8f5c8');
    g.addColorStop(.5,'#a5d66a');
    g.addColorStop(1,'#33691e');
  }
  ctx.fillStyle=g;

  let r=9;
  if(p.melon)r=14;
  else if(p.icemelon)r=15;
  else if(p.cattail)r=7;
  else if(p.cob)r=20;

  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle=p.ice?'#01579b':p.spore?'#3a1a4a':p.icemelon?'#01579b':p.melon?'#1b5e20':'#1b5e20';
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.beginPath();
  ctx.arc(p.x-2,p.y-2,Math.max(1,r*.25),0,Math.PI*2);
  ctx.fill();

  // Аура для льда
  if(p.ice||p.icemelon){
    ctx.strokeStyle='rgba(79,195,247,.5)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,r+3,0,Math.PI*2);
    ctx.stroke();
  }

  // Полоски для арбуза
  if(p.melon||p.icemelon){
    ctx.strokeStyle='rgba(0,0,0,.3)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(p.x-r*.4,p.y-r*.6);
    ctx.quadraticCurveTo(p.x,p.y,p.x-r*.4,p.y+r*.6);
    ctx.moveTo(p.x+r*.4,p.y-r*.6);
    ctx.quadraticCurveTo(p.x,p.y,p.x+r*.4,p.y+r*.6);
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles(){
  for(const p of S.particles){
    if(!p||!Number.isFinite(p.life))continue;
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color||'#fff';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawRake(rk){
  ctx.save();
  ctx.translate(rk.x,rk.y+10);
  ctx.strokeStyle='#8b5a2b';
  ctx.lineWidth=4;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-15,-18);
  ctx.lineTo(15,-18);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,-18);
  ctx.lineTo(0,8);
  ctx.stroke();
  for(let i=-3;i<=3;i++){
    ctx.strokeStyle='#5d4037';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(i*5,8);
    ctx.lineTo(i*5,18);
    ctx.stroke();
  }
  ctx.strokeStyle='#3e2723';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-15,8);
  ctx.lineTo(15,8);
  ctx.stroke();
  ctx.restore();
}

function drawMower(x,y,isPool){

  ctx.roundRect(x-16,y-28,32,14,4);
  ctx.fill();
  ctx.strokeStyle='#7f0000';
  ctx.lineWidth=1.5;

  ctx.strokeStyle='#424242';

  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-8,y-26);
  ctx.lineTo(x-20,y-40);

  ctx.fillStyle='#212121';

  ctx.arc(x+14,y+10,9,0,Math.PI*2);
  ctx.fill();
