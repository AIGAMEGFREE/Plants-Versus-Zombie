const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const W=canvas.width;
const H=canvas.height;

// ===== НАСТРОЙКИ РЕНДЕРА =====
ctx.imageSmoothingEnabled=true;
ctx.lineJoin='round';
ctx.lineCap='round';

// ===== ПОЛИФИЛЛ roundRect =====
if(!ctx.roundRect){
  ctx.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r=[r,r,r,r];
    if(!Array.isArray(r))r=[0,0,0,0];
    if(r.length===1)r=[r[0],r[0],r[0],r[0]];
    if(r.length===2)r=[r[0],r[1],r[0],r[1]];
    let[tl,tr,br,bl]=r;
    tl=Math.min(tl,w/2,h/2);
    tr=Math.min(tr,w/2,h/2);
    br=Math.min(br,w/2,h/2);
    bl=Math.min(bl,w/2,h/2);
    this.beginPath();
    this.moveTo(x+tl,y);
    this.lineTo(x+w-tr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+tr);
    this.lineTo(x+w,y+h-br);
    this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
    this.lineTo(x+bl,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-bl);
    this.lineTo(x,y+tl);
    this.quadraticCurveTo(x,y,x+tl,y);
    this.closePath();
    return this;
  };
}

// ===== КОНСТАНТЫ СЕТКИ =====
const GRID_X=258;
const GRID_Y=118;
const COLS=9;
let ROWS=5;
let ROW_START=0;
const CELL_W=82;
const CELL_H=98;
const GRID_W=COLS*CELL_W;
const YARD_RIGHT=GRID_X+GRID_W;
const ROAD_W=250;
const ROAD_RIGHT=YARD_RIGHT+ROAD_W;
const ZOMBIE_SPAWN_X=ROAD_RIGHT+60;
const ZOMBIE_ENTER_YARD_X=YARD_RIGHT-5;
const MAX_ALIVE_ZOMBIES=22;

const cellCX=c=>GRID_X+c*CELL_W+CELL_W/2;
const cellCY=r=>GRID_Y+(ROW_START+r)*CELL_H+CELL_H/2;
const activeTop=()=>GRID_Y+ROW_START*CELL_H;
const activeBottom=()=>activeTop()+ROWS*CELL_H;

// ===== УТИЛИТЫ =====
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);

function lerp(a,b,t){
  return a+(b-a)*t;
}

function easeOut(t){
  return 1-Math.pow(1-t,3);
}

function easeIn(t){
  return t*t*t;
}

function easeInOut(t){
  return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}

// ===== ЧАСТИЦЫ =====
function addParticles(x,y,count,color,speed=4,life=600,size=4){
  if(S.particles.length>300)return;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=rand(speed*.3,speed);
    S.particles.push({
      x,
      y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s-1,
      life,
      maxLife:life,
      color,
      size:rand(size*.5,size*1.5),
      gravity:.12
    });
  }
}

// ===== ТОСТ =====

function showSaveToast(msg){
  const el=document.getElementById('saveToast');
  if(!el)return;
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(saveToastTimer);
  saveToastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

const SAVE_KEY='pvz_save_v80';
const LEGACY_SAVE_KEYS=['pvz_save_v70','pvz_save_v60','pvz_save_v50','pvz_save_v40','pvz_backup'];

function saveProgress(silent=false){
  try{
    const data={
      version:80,
      unlocked:S.unlockedLevels,
      stars:S.levelStars,
      totalKills:S.totalKillsEver,
      totalWins:S.totalWinsEver,
      achievements:S.achievements,
      minigameBest:S.minigameBest,
      coins:S.coins,
      totalCoinsEarned:S.totalCoinsEarned,
      ownedPlants:S.ownedPlants,
      ownedItems:S.ownedItems,
      extraSlots:S.extraSlots||0,
      treeLevel:S.treeLevel,
      treeWater:S.treeWater,
      treeWaterNeeded:S.treeWaterNeeded,
      treeCoinsFromZombies:S.treeCoinsFromZombies,
      zombieCoinsCollected:S.zombieCoinsCollected
    };
    try{
      const prev=localStorage.getItem(SAVE_KEY);
      if(prev)localStorage.setItem('pvz_backup',prev);
    }catch(e){}
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    if(!silent)showSaveToast('💾 Прогресс сохранён');
    return true;
  }catch(e){
    console.error('Save error:',e);
    return false;
  }
}

function loadProgress(){
  try{
    let raw=localStorage.getItem(SAVE_KEY);
    let usedLegacy=false;
    if(!raw){
      for(const k of LEGACY_SAVE_KEYS){
        raw=localStorage.getItem(k);
        if(raw){usedLegacy=true;break;}
      }
    }
    if(!raw)return;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object')return;

    if(typeof d.unlocked==='number'&&d.unlocked>0)S.unlockedLevels=d.unlocked;
    if(d.stars&&typeof d.stars==='object')S.levelStars=d.stars;
    if(typeof d.totalKills==='number')S.totalKillsEver=d.totalKills;
    if(typeof d.totalWins==='number')S.totalWinsEver=d.totalWins;
    if(d.achievements&&typeof d.achievements==='object')S.achievements=d.achievements;
    if(d.minigameBest&&typeof d.minigameBest==='object')S.minigameBest=d.minigameBest;
    if(typeof d.coins==='number')S.coins=d.coins;
    if(typeof d.totalCoinsEarned==='number')S.totalCoinsEarned=d.totalCoinsEarned;
    if(typeof d.extraSlots==='number')S.extraSlots=d.extraSlots;
    if(typeof d.treeLevel==='number')S.treeLevel=d.treeLevel;
    if(typeof d.treeWater==='number')S.treeWater=d.treeWater;
    if(typeof d.treeWaterNeeded==='number')S.treeWaterNeeded=d.treeWaterNeeded;
    if(typeof d.treeCoinsFromZombies==='number')S.treeCoinsFromZombies=d.treeCoinsFromZombies;
    if(typeof d.zombieCoinsCollected==='number')S.zombieCoinsCollected=d.zombieCoinsCollected;

    const basePlants=['peashooter','sunflower'];
    if(Array.isArray(d.ownedPlants)&&d.ownedPlants.length>0){
      const merged=[...new Set([...basePlants,...d.ownedPlants])];
      S.ownedPlants=merged.filter(id=>typeof id==='string'&&id.length>0);
    }else{
      S.ownedPlants=[...basePlants];
    }

    if(Array.isArray(d.ownedItems)&&d.ownedItems.length>0){
      S.ownedItems=[...new Set(d.ownedItems)].filter(id=>typeof id==='string');
    }

    S.seedSelectMaxSlots=6+(S.extraSlots||0);
    S.ironSpikeOwned=S.ownedItems.includes('spikeweed_iron');

    if(usedLegacy)saveProgress(true);
  }catch(e){console.error('Load error:',e);}
}

function resetProgress(){
  if(!confirm('Сбросить ВЕСЬ прогресс?'))return;
  try{
    for(const k of [SAVE_KEY,...LEGACY_SAVE_KEYS]){
      try{localStorage.removeItem(k);}catch(e){}
    }
  }catch(e){}

  S.unlockedLevels=1;
  S.levelStars={};
  S.totalKillsEver=0;
  S.totalWinsEver=0;
  S.achievements={};
  S.minigameBest={};
  S.coins=0;
  S.totalCoinsEarned=0;
  S.ownedPlants=['peashooter','sunflower'];
  S.ownedItems=[];
  S.extraSlots=0;
  S.seedSelectMaxSlots=6;

  S.treeLevel=1;
  S.treeWater=0;
  S.treeWaterNeeded=8;
  S.treeCoinsFromZombies=0;
  S.zombieCoinsCollected=0;

  showSaveToast('🗑 Прогресс сброшен');
}

function resetPlants(){
  if(!confirm('Сбросить список растений к базовым?\n\nГорохострел и Подсолнух останутся.'))return;
  S.ownedPlants=['peashooter','sunflower'];
  S.seedSelectMaxSlots=6+(S.extraSlots||0);
  saveProgress(true);
  showSaveToast('🌱 Растения сброшены');

  S.plantsByCell={};
  for(const p of S.plants){
    S.plantsByCell[p.row+'_'+p.col]=p;
  }
}

function getPlantAt(row,col){
  return S.plantsByCell[row+'_'+col]||null;
}

function isPlantAwake(type){
  const p=ALL_PLANTS[type];
  if(!p)return true;
  if(p.sleep==='both')return true;
  if(S.location==='roof')return true;
  return p.sleep===S.dayNight;
}
