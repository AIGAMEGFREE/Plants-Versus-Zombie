<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Plants vs Zombies — Adventure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: #000; user-select: none;
  }
  #app {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; max-width: 100%; max-height: 100%; cursor: default; }
  #saveToast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: linear-gradient(180deg, rgba(60,40,20,0.95), rgba(30,20,10,0.95));
    color: #ffe082; padding: 12px 26px; border-radius: 10px;
    font-weight: bold; font-size: 15px; pointer-events: none; z-index: 1000;
    border: 2px solid #7cb342; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #saveToast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"><canvas id="canvas" width="1280" height="720"></canvas></div>
<div id="saveToast"></div>
<script>
(() => {
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Полифилл roundRect
if (!ctx.roundRect) {
  ctx.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    if (!Array.isArray(r)) r = [0, 0, 0, 0];
    if (r.length === 1) r = [r[0], r[0], r[0], r[0]];
    if (r.length === 2) r = [r[0], r[1], r[0], r[1]];
    let [tl, tr, br, bl] = r;
    tl = Math.min(tl, w / 2, h / 2); tr = Math.min(tr, w / 2, h / 2);
    br = Math.min(br, w / 2, h / 2); bl = Math.min(bl, w / 2, h / 2);
    this.beginPath();
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
    return this;
  };
}

// ==================== СЕТКА ====================
const GRID_X = 258, GRID_Y = 118;
const COLS = 9, MAX_ROWS = 5;
let ROWS = 5, ROW_START = 0;
const CELL_W = 82, CELL_H = 98;
const GRID_W = COLS * CELL_W, GRID_H = MAX_ROWS * CELL_H;
const YARD_RIGHT = GRID_X + GRID_W;
const ROAD_W = 250, ROAD_RIGHT = YARD_RIGHT + ROAD_W;
const ZOMBIE_SPAWN_X = ROAD_RIGHT + 60;
const ZOMBIE_ENTER_YARD_X = YARD_RIGHT - 5;

const cellCX = (c) => GRID_X + c * CELL_W + CELL_W / 2;
const cellCY = (r) => GRID_Y + (ROW_START + r) * CELL_H + CELL_H / 2;
const activeGridH = () => ROWS * CELL_H;
const activeTop = () => GRID_Y + ROW_START * CELL_H;
const activeBottom = () => activeTop() + activeGridH();

// ==================== ФОНЫ ====================
let bgCacheYard = null, bgCacheYardNight = null, bgCacheRoof = null, bgCachePool = null;
let bgCacheKey = '';

function buildYardBackground(isNight, rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');
  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const sky = g.createLinearGradient(0, 0, 0, 300);
  if (isNight) {
    sky.addColorStop(0, '#0a1530'); sky.addColorStop(0.5, '#15264a'); sky.addColorStop(1, '#2a3a5e');
  } else {
    sky.addColorStop(0, '#5aa8dc'); sky.addColorStop(0.6, '#a8d4ec'); sky.addColorStop(1, '#d4eaf4');
  }
  g.fillStyle = sky; g.fillRect(0, 0, W, 300);

  if (isNight) {
    for (let i = 0; i < 80; i++) {
      const x = (i * 211) % W, y = (i * 89) % 220;
      g.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.5})`;
      g.beginPath(); g.arc(x, y, Math.random() * 1.5 + 0.5, 0, Math.PI * 2); g.fill();
    }
    const moonG = g.createRadialGradient(W * 0.82, 100, 8, W * 0.82, 100, 100);
    moonG.addColorStop(0, 'rgba(255,255,220,0.95)');
    moonG.addColorStop(0.4, 'rgba(220,220,200,0.3)');
    moonG.addColorStop(1, 'rgba(220,220,200,0)');
    g.fillStyle = moonG;
    g.beginPath(); g.arc(W * 0.82, 100, 100, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#f5f5dc';
    g.beginPath(); g.arc(W * 0.82, 100, 52, 0, Math.PI * 2); g.fill();
  } else {
    const clouds = [{x:280,y:50,s:1},{x:620,y:30,s:.85},{x:900,y:60,s:1.1},{x:1180,y:35,s:.9}];
    for (const c of clouds) {
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.beginPath();
      g.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
      g.arc(c.x + 26 * c.s, c.y - 8 * c.s, 28 * c.s, 0, Math.PI * 2);
      g.arc(c.x + 56 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
      g.arc(c.x + 30 * c.s, c.y + 10 * c.s, 22 * c.s, 0, Math.PI * 2);
      g.fill();
    }
  }

  for (let i = 0; i < 30; i++) {
    const x = 230 + i * 40, y = 12 + (i % 3) * 6, r = 18 + (i % 4) * 4;
    g.fillStyle = isNight ? '#0a2a10' : '#2e7d32';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = isNight ? '#153815' : '#43a047';
    g.beginPath(); g.arc(x - r * 0.2, y - r * 0.2, r * 0.6, 0, Math.PI * 2); g.fill();
  }

  const fenceY = 68;
  g.fillStyle = isNight ? '#7a755e' : '#d4ceb8';
  g.fillRect(230, fenceY - 3, W - 230, 6);
  for (let x = 230; x < W + 10; x += 42) {
    const planks = g.createLinearGradient(x, 0, x + 36, 0);
    if (isNight) {
      planks.addColorStop(0, '#6a6550'); planks.addColorStop(0.5, '#b8b098'); planks.addColorStop(1, '#6a6550');
    } else {
      planks.addColorStop(0, '#d8d0b8'); planks.addColorStop(0.5, '#fff9e8'); planks.addColorStop(1, '#c8c0a0');
    }
    g.fillStyle = planks;
    g.beginPath();
    g.moveTo(x, fenceY); g.lineTo(x, 30); g.lineTo(x + 18, 18); g.lineTo(x + 36, 30); g.lineTo(x + 36, fenceY);
    g.closePath(); g.fill();
  }

  const dirtG = g.createLinearGradient(0, 90, 0, H);
  if (isNight) {
    dirtG.addColorStop(0, '#3a2a1a'); dirtG.addColorStop(1, '#1a1008');
  } else {
    dirtG.addColorStop(0, '#b08860'); dirtG.addColorStop(0.5, '#a07850'); dirtG.addColorStop(1, '#8a6438');
  }
  g.fillStyle = dirtG; g.fillRect(0, 90, W, H - 90);

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      const light = (realRow + c) % 2 === 0;
      const baseG = g.createLinearGradient(x, y, x, y + CELL_H);
      if (isNight) {
        baseG.addColorStop(0, light ? '#1e4a10' : '#1a400c');
        baseG.addColorStop(1, light ? '#2a5a18' : '#245014');
      } else {
        baseG.addColorStop(0, light ? '#6ed636' : '#5cc42e');
        baseG.addColorStop(1, light ? '#5cb82a' : '#4ea826');
      }
      g.fillStyle = baseG;
      g.fillRect(x, y, CELL_W, CELL_H);
    }
  }

  const roadX = YARD_RIGHT;
  const roadTop = aTop - 25;
  const roadBottom = aBottom + 25;
  const roadH = roadBottom - roadTop;
  const roadBgG = g.createLinearGradient(0, roadTop, 0, roadBottom);
  if (isNight) {
    roadBgG.addColorStop(0, '#2a2a2a'); roadBgG.addColorStop(0.5, '#333'); roadBgG.addColorStop(1, '#1a1a1a');
  } else {
    roadBgG.addColorStop(0, '#8a8a8a'); roadBgG.addColorStop(0.5, '#9a9a9a'); roadBgG.addColorStop(1, '#7a7a7a');
  }
  g.fillStyle = roadBgG;
  g.fillRect(roadX, roadTop, ROAD_W, roadH);

  const tileSize = 80;
  for (let ty = 0; ty < Math.ceil(roadH / tileSize); ty++) {
    for (let tx = 0; tx < Math.ceil(ROAD_W / tileSize); tx++) {
      const tileX = roadX + tx * tileSize;
      const tileY = roadTop + ty * tileSize;
      const tileW = Math.min(tileSize, roadX + ROAD_W - tileX);
      const tileH = Math.min(tileSize, roadBottom - tileY);
      const shade = (tx + ty) % 2 === 0;
      const tg = g.createLinearGradient(tileX, tileY, tileX, tileY + tileH);
      if (isNight) {
        tg.addColorStop(0, shade ? '#4a4a4a' : '#424242'); tg.addColorStop(1, shade ? '#3a3a3a' : '#323232');
      } else {
        tg.addColorStop(0, shade ? '#b8b8b8' : '#a8a8a8'); tg.addColorStop(1, shade ? '#9c9c9c' : '#8e8e8e');
      }
      g.fillStyle = tg;
      g.fillRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
      g.strokeStyle = isNight ? '#1a1a1a' : '#5a5a5a';
      g.lineWidth = 3;
      g.strokeRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
    }
  }

  const curbX = roadX - 8;
  const curbG = g.createLinearGradient(curbX, 0, curbX + 16, 0);
  if (isNight) {
    curbG.addColorStop(0, '#4a4a4a'); curbG.addColorStop(0.5, '#7a7a7a'); curbG.addColorStop(1, '#3a3a3a');
  } else {
    curbG.addColorStop(0, '#a89878'); curbG.addColorStop(0.5, '#e8d8b8'); curbG.addColorStop(1, '#8a7860');
  }
  g.fillStyle = curbG;
  g.fillRect(curbX, roadTop, 16, roadH);
  g.fillRect(roadX + ROAD_W - 8, roadTop, 16, roadH);

  for (let x = GRID_X; x < GRID_X + GRID_W; x += 8) {
    g.fillStyle = isNight ? '#1a3a10' : '#4caf50';
    g.beginPath();
    g.moveTo(x, aTop); g.lineTo(x + 3, aTop - 6 - (x % 5)); g.lineTo(x + 6, aTop);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(x, aBottom); g.lineTo(x + 3, aBottom + 6 + (x % 5)); g.lineTo(x + 6, aBottom);
    g.closePath(); g.fill();
  }

  const houseW = GRID_X - 45;
  const houseTop = 100;
  const houseBottom = H - 60;
  const wallG = g.createLinearGradient(0, 0, houseW, 0);
  if (isNight) {
    wallG.addColorStop(0, '#8a7a5a'); wallG.addColorStop(0.5, '#b8a888'); wallG.addColorStop(1, '#5a4a35');
  } else {
    wallG.addColorStop(0, '#f5e8d0'); wallG.addColorStop(0.4, '#fff5e0'); wallG.addColorStop(1, '#c8b090');
  }
  g.fillStyle = wallG;
  g.fillRect(0, houseTop, houseW, houseBottom - houseTop);

  const roofG = g.createLinearGradient(0, 30, 0, 110);
  if (isNight) {
    roofG.addColorStop(0, '#7a3a30'); roofG.addColorStop(1, '#3a1a15');
  } else {
    roofG.addColorStop(0, '#e8453c'); roofG.addColorStop(0.5, '#c92f26'); roofG.addColorStop(1, '#8a1a12');
  }
  g.fillStyle = roofG;
  g.beginPath();
  g.moveTo(-10, 110); g.lineTo(houseW * 0.5, 20); g.lineTo(houseW + 10, 110);
  g.closePath(); g.fill();

  g.fillStyle = '#8b5a2b';
  g.fillRect(25, 135, 70, 80);
  g.fillStyle = isNight ? '#2a3a5a' : '#a8d8f0';
  g.fillRect(30, 140, 60, 70);

  g.fillStyle = '#8b5a2b';
  g.fillRect(39, 450, 87, 156);
  g.fillStyle = isNight ? '#4a3020' : '#6d4c21';
  g.fillRect(45, 456, 75, 150);

  return oc;
}

function buildRoofBackground(rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');

  const sky = g.createLinearGradient(0, 0, 0, 300);
  sky.addColorStop(0, '#5a8fc4'); sky.addColorStop(0.6, '#a8d0e8'); sky.addColorStop(1, '#d8e8f0');
  g.fillStyle = sky; g.fillRect(0, 0, W, 300);

  const roofG = g.createLinearGradient(0, 90, 0, H);
  roofG.addColorStop(0, '#8b3a3a'); roofG.addColorStop(0.5, '#7a3030'); roofG.addColorStop(1, '#4a1818');
  g.fillStyle = roofG; g.fillRect(0, 90, W, H - 90);

  for (let y = 100; y < H; y += 20) {
    g.strokeStyle = 'rgba(0,0,0,0.25)';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      const light = (realRow + c) % 2 === 0;
      const tg = g.createLinearGradient(x, y, x, y + CELL_H);
      tg.addColorStop(0, light ? '#b08868' : '#a07858');
      tg.addColorStop(1, light ? '#986848' : '#885838');
      g.fillStyle = tg;
      g.fillRect(x, y, CELL_W, CELL_H);
      g.strokeStyle = 'rgba(60,30,15,0.5)';
      g.lineWidth = 2;
      g.strokeRect(x + 1, y + 1, CELL_W - 2, CELL_H - 2);
    }
  }

  g.fillStyle = '#8b5a2b';
  g.fillRect(0, 80, W, 40);
  return oc;
}

function buildPoolBackground(rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');
  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const sky = g.createLinearGradient(0, 0, 0, 300);
  sky.addColorStop(0, '#5aa8dc'); sky.addColorStop(0.6, '#a8d4ec'); sky.addColorStop(1, '#d4eaf4');
  g.fillStyle = sky; g.fillRect(0, 0, W, 300);

  for (let i = 0; i < 30; i++) {
    const x = 230 + i * 40, y = 12 + (i % 3) * 6, r = 18 + (i % 4) * 4;
    g.fillStyle = '#2e7d32';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  const fenceY = 68;
  g.fillStyle = '#d4ceb8';
  g.fillRect(230, fenceY - 3, W - 230, 6);
  for (let x = 230; x < W + 10; x += 42) {
    g.fillStyle = '#f0e9d6';
    g.beginPath();
    g.moveTo(x, fenceY); g.lineTo(x, 30); g.lineTo(x + 18, 18); g.lineTo(x + 36, 30); g.lineTo(x + 36, fenceY);
    g.closePath(); g.fill();
  }

  const dirtG = g.createLinearGradient(0, 90, 0, H);
  dirtG.addColorStop(0, '#b08860'); dirtG.addColorStop(0.5, '#a07850'); dirtG.addColorStop(1, '#8a6438');
  g.fillStyle = dirtG; g.fillRect(0, 90, W, H - 90);

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    const isPoolRow = realRow >= 2 && realRow < 4;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      if (isPoolRow) {
        const waterG = g.createLinearGradient(x, y, x, y + CELL_H);
        waterG.addColorStop(0, c % 2 === 0 ? '#3a8ec8' : '#3288c0');
        waterG.addColorStop(0.5, c % 2 === 0 ? '#4aa8e0' : '#42a0d8');
        waterG.addColorStop(1, c % 2 === 0 ? '#2e78b0' : '#2a70a8');
        g.fillStyle = waterG;
        g.fillRect(x, y, CELL_W, CELL_H);
        g.strokeStyle = 'rgba(255,255,255,0.25)';
        g.lineWidth = 1.5;
        for (let w = 0; w < 3; w++) {
          g.beginPath();
          const wy = y + 20 + w * 30;
          g.moveTo(x + 5, wy);
          g.bezierCurveTo(x + 20, wy - 4, x + 35, wy + 4, x + 50, wy);
          g.bezierCurveTo(x + 60, wy - 3, x + 70, wy + 3, x + CELL_W - 5, wy);
          g.stroke();
        }
      } else {
        const light = (realRow + c) % 2 === 0;
        const baseG = g.createLinearGradient(x, y, x, y + CELL_H);
        baseG.addColorStop(0, light ? '#6ed636' : '#5cc42e');
        baseG.addColorStop(1, light ? '#5cb82a' : '#4ea826');
        g.fillStyle = baseG;
        g.fillRect(x, y, CELL_W, CELL_H);
      }
    }
  }

  const poolTopY = GRID_Y + 2 * CELL_H;
  const poolBottomY = GRID_Y + 4 * CELL_H;
  g.fillStyle = '#e8d8b8';
  g.fillRect(GRID_X, poolTopY - 8, GRID_W, 12);
  g.fillRect(GRID_X, poolBottomY - 4, GRID_W, 12);

  const roadX = YARD_RIGHT;
  const roadTop = aTop - 25;
  const roadBottom = aBottom + 25;
  g.fillStyle = '#8a8a8a';
  g.fillRect(roadX, roadTop, ROAD_W, roadBottom - roadTop);

  return oc;
}

function ensureBackgrounds() {
  const key = S.location + '_' + ROWS + '_' + ROW_START;
  if (bgCacheKey === key) return;
  bgCacheKey = key;
  if (S.location === 'roof') bgCacheRoof = buildRoofBackground(ROWS, ROW_START);
  else if (S.location === 'night') bgCacheYardNight = buildYardBackground(true, ROWS, ROW_START);
  else if (S.location === 'pool') bgCachePool = buildPoolBackground(ROWS, ROW_START);
  else bgCacheYard = buildYardBackground(false, ROWS, ROW_START);
}

// ==================== КУСТЫ ====================
let bushesCache = null, bushesCacheKey = '';

function buildBushes(isNight, rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');
  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;
  const blobs = [];

  for (let i = 0; i < 130; i++) {
    blobs.push({ x: ROAD_RIGHT + 15 + Math.random() * 100, y: aTop - 30 + Math.random() * (rows * CELL_H + 60),
      r: 20 + Math.random() * 22, light: Math.random() > 0.5, depth: Math.random() });
  }
  for (let i = 0; i < 60; i++) {
    blobs.push({ x: GRID_X - 60 + Math.random() * (GRID_W + 300), y: aBottom + 60 + Math.random() * 40,
      r: 14 + Math.random() * 20, light: Math.random() > 0.5, depth: Math.random() });
  }
  blobs.sort((a, b) => a.y - b.y);

  for (const b of blobs) {
    g.fillStyle = isNight ? 'rgba(0,0,0,0.4)' : 'rgba(0,30,0,0.3)';
    g.beginPath(); g.arc(b.x + 1, b.y + 2, b.r * 0.9, 0, Math.PI * 2); g.fill();
    g.fillStyle = isNight ? (b.depth > 0.5 ? '#0a2a0a' : '#0d300d') : (b.depth > 0.5 ? '#1b5e20' : '#1a5018');
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
    g.fillStyle = isNight ? (b.light ? '#2a5a2a' : '#1d4a1d') : (b.light ? '#43a047' : '#2e7d32');
    g.beginPath(); g.arc(b.x - b.r * 0.15, b.y - b.r * 0.2, b.r * 0.75, 0, Math.PI * 2); g.fill();
  }
  return oc;
}

function ensureBushes() {
  const key = S.location + '_' + ROWS + '_' + ROW_START;
  if (bushesCacheKey === key) return;
  bushesCacheKey = key;
  if (S.location === 'roof') { bushesCache = null; return; }
  bushesCache = buildBushes(S.location === 'night', ROWS, ROW_START);
}

// ==================== РАСТЕНИЯ ====================
const ALL_PLANTS = {
  peashooter:  { id: 'peashooter',  name: 'Горохострел',   cost: 100, cd: 7500,  hp: 100,  sleep: 'day' },
  sunflower:   { id: 'sunflower',   name: 'Подсолнух',     cost: 50,  cd: 7500,  hp: 100,  sleep: 'day' },
  cherry:      { id: 'cherry',      name: 'Вишн. бомба',   cost: 150, cd: 50000, hp: 9999, sleep: 'both' },
  wallnut:     { id: 'wallnut',     name: 'Стенорех',      cost: 50,  cd: 30000, hp: 4000, sleep: 'both' },
  potato:      { id: 'potato',      name: 'Картошка',      cost: 25,  cd: 30000, hp: 100,  sleep: 'both' },
  snowpea:     { id: 'snowpea',     name: 'Ледяной горох', cost: 175, cd: 7500,  hp: 100,  sleep: 'day' },
  repeater:    { id: 'repeater',    name: 'Двойной горох', cost: 200, cd: 7500,  hp: 100,  sleep: 'day' },

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

function addParticles(x, y, count, color, speed = 4, life = 600, size = 4) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(speed * 0.3, speed);
    S.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life, maxLife: life, color, size: rand(size * 0.5, size * 1.5), gravity: 0.12,
    });
  }
}

function isPlantAwake(plantType) {
  const p = ALL_PLANTS[plantType];
  if (!p) return true;
  if (p.sleep === 'both') return true;
  if (S.location === 'roof') return true;
  return p.sleep === S.dayNight;
}

// ==================== СОХРАНЕНИЕ ====================
const SAVE_KEY = 'pvz_save_v15';
let saveToastTimer = null;
function showSaveToast(msg) {
  const el = document.getElementById('saveToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function saveProgress(silent = false) {
  try {
    const data = {
      version: 15,
      unlocked: S.unlockedLevels,
      stars: S.levelStars,
      totalKills: S.totalKillsEver,
      totalWins: S.totalWinsEver,
      achievements: S.achievements,
      minigameBest: S.minigameBest,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    if (!silent) showSaveToast('💾 Прогресс сохранён');
    return true;
  } catch(e) { return false; }
}

function loadProgress() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) raw = localStorage.getItem('pvz_backup');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (typeof d.unlocked === 'number' && d.unlocked > 0) S.unlockedLevels = d.unlocked;
    if (d.stars && typeof d.stars === 'object') S.levelStars = d.stars;
    if (typeof d.totalKills === 'number') S.totalKillsEver = d.totalKills;
    if (typeof d.totalWins === 'number') S.totalWinsEver = d.totalWins;
    if (d.achievements) S.achievements = d.achievements;
    if (d.minigameBest) S.minigameBest = d.minigameBest;
  } catch(e) {}
}

function resetProgress() {
  if (!confirm('Точно сбросить ВЕСЬ прогресс?')) return;
  try {
    for (const k of [SAVE_KEY, 'pvz_backup']) try { localStorage.removeItem(k); } catch(e) {}
  } catch(e) {}
  S.unlockedLevels = 1; S.levelStars = {}; S.totalKillsEver = 0; S.totalWinsEver = 0;
  S.achievements = {}; S.minigameBest = {};
  showSaveToast('🗑 Прогресс сброшен');
}

setInterval(() => { if (S.scene === 'playing' && !S.gameOver) saveProgress(true); }, 15000);
window.addEventListener('beforeunload', () => { if (S.scene === 'playing' && !S.gameOver) saveProgress(true); });

// ==================== ДОСТИЖЕНИЯ ====================
function unlockAchievement(id) {
  if (S.achievements[id] || !ACHIEVEMENTS[id]) return false;
  S.achievements[id] = true;
  S.achievementQueue.push({ id, ...ACHIEVEMENTS[id], time: S.time });
  saveProgress(true);
  return true;
}

function checkAchievements() {
  if (S.killedZombies > 0) unlockAchievement('first_blood');
  if (S.killedZombies >= 100) unlockAchievement('veteran');
  if (S.sun >= 1000) unlockAchievement('sunflower_farm');
  if (S.unlockedLevels >= 10) unlockAchievement('collector');
  if (S.garlicPushes >= 5) unlockAchievement('garlic_master');
  if (S.gameOver && S.won) {
    const mowersUsed = S.mowers.filter(m => m.used).length;
    if (mowersUsed === 0) unlockAchievement('no_mowers');
    if (S.location === 'night') unlockAchievement('night_owl');
    if (S.location === 'roof') unlockAchievement('roof_walker');
    if (S.location === 'pool') unlockAchievement('pool_party');
    if (S.currentLevel.boss) unlockAchievement('boss_slayer');
    const stars = S.levelStars[S.currentLevel.id] || 0;
    if (stars === 3) unlockAchievement('perfectionist');
    if (S.levelStartTime && S.time - S.levelStartTime < 60000) unlockAchievement('speedrun');
    if (S.unlockedLevels >= 2) unlockAchievement('first_win');
    if (S.plantedThisLevel === 0) unlockAchievement('chill_master');
  }
  if (S.minigameType && S.gameOver && S.won) unlockAchievement('minigame_win');
  if (S.minigameType === 'endless' && S.currentWave >= 10) unlockAchievement('endless_10');
}

function drawAchievementToasts() {
  if (S.achievementQueue.length === 0) return;
  const a = S.achievementQueue[0];
  const elapsed = S.time - a.time;
  if (elapsed > 4200) { S.achievementQueue.shift(); return; }
  const slideIn = Math.min(1, elapsed / 400);
  const slideOut = Math.max(0, (elapsed - 3600) / 600);
  const y = -120 + slideIn * 130 - slideOut * 130;

  const boxW = 460, boxH = 100;
  const boxX = W / 2 - boxW / 2;
  const boxY = y;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(boxX + 6, boxY + 6, boxW, boxH, 14); ctx.fill();

  const g = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
  g.addColorStop(0, '#ffd54f'); g.addColorStop(0.5, '#ffb300'); g.addColorStop(1, '#e65100');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 14); ctx.fill();
  ctx.strokeStyle = '#4a2000'; ctx.lineWidth = 3; ctx.stroke();

  ctx.font = 'bold 50px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(a.icon || '🏆', boxX + 60, boxY + boxH / 2);

  ctx.textAlign = 'left';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#5d4037';
  ctx.fillText('🏆 ДОСТИЖЕНИЕ РАЗБЛОКИРОВАНО', boxX + 110, boxY + 25);

  ctx.font = 'bold 22px Impact, Arial Black, sans-serif';
  ctx.fillStyle = '#3e2723';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeText(a.name, boxX + 110, boxY + 52);
  ctx.fillText(a.name, boxX + 110, boxY + 52);

  ctx.font = 'italic 13px Arial';
  ctx.fillStyle = '#5d4037';
  ctx.fillText(a.desc, boxX + 110, boxY + 78);
  ctx.restore();
}

// ==================== ИГРОВАЯ СЦЕНА ====================
function drawGameScene() {
  ensureBackgrounds();
  if (S.location === 'roof') {
    if (bgCacheRoof) ctx.drawImage(bgCacheRoof, 0, 0);
  } else if (S.location === 'night') {
    if (bgCacheYardNight) ctx.drawImage(bgCacheYardNight, 0, 0);
  } else if (S.location === 'pool') {
    if (bgCachePool) ctx.drawImage(bgCachePool, 0, 0);
  } else {
    if (bgCacheYard) ctx.drawImage(bgCacheYard, 0, 0);
  }

  for (let r = 0; r < ROWS; r++) {
    const m = S.mowers[r];
    if (!m || (m.used && !m.active)) continue;
    drawMower(m.x, cellCY(r) + 20);
  }

  if ((S.selectedSeed || S.shovelSelected) && S.cursorX >= GRID_X && S.cursorX <= GRID_X + GRID_W
      && S.cursorY >= activeTop() && S.cursorY <= activeBottom()) {
    const c = Math.floor((S.cursorX - GRID_X) / CELL_W);
    const r = Math.floor((S.cursorY - activeTop()) / CELL_H);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
      const cellX = GRID_X + c * CELL_W;
      const cellY = activeTop() + r * CELL_H;
      const occupied = S.plants.find(p => p.row === r && p.col === c);
      const awake = S.selectedSeed ? isPlantAwake(S.selectedSeed) : true;
      if (S.shovelSelected) ctx.fillStyle = 'rgba(244,67,54,0.3)';
      else if (occupied) ctx.fillStyle = 'rgba(244,67,54,0.3)';
      else if (!awake) ctx.fillStyle = 'rgba(100,100,150,0.35)';
      else ctx.fillStyle = 'rgba(255,235,59,0.3)';
      ctx.fillRect(cellX, cellY, CELL_W, CELL_H);
      ctx.strokeStyle = S.shovelSelected ? '#f44336' : awake ? '#ffeb3b' : '#6666aa';
      ctx.lineWidth = 3;
      ctx.strokeRect(cellX + 1, cellY + 1, CELL_W - 2, CELL_H - 2);
      if (S.selectedSeed && !occupied && !S.shovelSelected) {
        ctx.globalAlpha = awake ? 0.5 : 0.3;
        ctx.save();
        ctx.translate(cellX + CELL_W / 2, cellY + CELL_H / 2);
        drawPlant(S.selectedSeed, 0, 0, S.time, 1, null);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }
  }

  const sortedPlants = [...S.plants].sort((a, b) => a.row - b.row);
  for (const p of sortedPlants) {
    drawPlant(p.type, cellCX(p.col), cellCY(p.row), S.time, 1, p);
    if (p.hp < p.maxHp && p.type !== 'cherry' && p.type !== 'potato' && p.type !== 'jalapeno' && p.type !== 'doomshroom' && p.type !== 'iceshroom') {
      const bw = 50, pct = p.hp / p.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(cellCX(p.col) - bw / 2, cellCY(p.row) - 46, bw, 6);
      ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ff9800' : '#f44336';
      ctx.fillRect(cellCX(p.col) - bw / 2 + 1, cellCY(p.row) - 45, (bw - 2) * pct, 4);
    }
  }

  for (const p of S.projectiles) drawProjectile(p);
  for (const s of S.suns) drawSun(s);

  const sortedZ = [...S.zombies].sort((a, b) => a.row - b.row);
  for (const z of sortedZ) if (z.x < YARD_RIGHT) drawZombie(z, S.time);
  if (S.location !== 'roof') {
    ensureBushes();
    if (bushesCache) ctx.drawImage(bushesCache, 0, 0);
  }
  for (const z of sortedZ) if (z.x >= YARD_RIGHT) drawZombie(z, S.time);

  drawParticles();
  drawTopBar();
  drawBottomBar();
}

// ==================== РИСОВАНИЕ РАСТЕНИЙ ====================
function drawPlant(type, x, y, t = 0, scale = 1, plant = null) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  const bob = Math.sin((t || 0) * 0.003 + x * 0.1) * 2;
  const awake = isPlantAwake(type);
  if (!awake) ctx.globalAlpha = 0.55;

  if (S.location !== 'roof') {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 32, 28, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  if (type === 'sunflower') drawSunflower(bob);
  else if (type === 'peashooter') drawPeashooter(bob, false, 1);
  else if (type === 'snowpea') drawPeashooter(bob, true, 1);
  else if (type === 'repeater') drawPeashooter(bob, false, 2);
  else if (type === 'threepeater') drawThreepeater(bob);
  else if (type === 'wallnut') drawWallnut(plant);
  else if (type === 'cherry') drawCherry(bob);
  else if (type === 'potato') drawPotato(plant);
  else if (type === 'chomper') drawChomper(bob, plant);
  else if (type === 'jalapeno') drawJalapeno(bob);
  else if (type === 'torchwood') drawTorchwood(bob);
  else if (type === 'garlic') drawGarlic(bob, plant);
  else if (type === 'puffshroom') drawPuffshroom(bob);
  else if (type === 'sunshroom') drawSunshroom(bob);
  else if (type === 'fumeshroom') drawFumeshroom(bob);
  else if (type === 'doomshroom') drawDoomshroom(bob);
  else if (type === 'iceshroom') drawIceshroom(bob);
  else if (type === 'hypnoshroom') drawHypnoshroom(bob);
  else if (type === 'scaredy') drawScaredy(bob);
  else if (type === 'cabbage') drawCabbage(bob);
  else if (type === 'kernelpult') drawKernelpult(bob);
  else if (type === 'coffee') drawCoffee(bob);
  else if (type === 'lilypad') drawLilypad(bob);
  else if (type === 'tanglekelp') drawTanglekelp(bob, plant);

  if (!awake) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.beginPath(); ctx.roundRect(-22, -50, 44, 18, 6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💤', 0, -41);
  }
  ctx.restore();
}

function drawStem(color = '#3d8b1f', leafColor = '#66bb6a') {
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 30); ctx.lineTo(0, -5); ctx.stroke();
  ctx.fillStyle = leafColor;
  ctx.beginPath(); ctx.ellipse(-16, 12, 16, 8, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, 12, 16, 8, 0.5, 0, Math.PI * 2); ctx.fill();
}

function drawSunflower(bob) {
  drawStem();
  const cy = -16 + bob;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const px = Math.cos(a) * 26;
    const py = Math.sin(a) * 26 + cy;
    ctx.fillStyle = i % 2 ? '#ffeb3b' : '#ffca28';
    ctx.beginPath(); ctx.ellipse(px, py, 9, 5, a, 0, Math.PI * 2); ctx.fill();
  }
  const g = ctx.createRadialGradient(-3, cy - 4, 2, 0, cy, 18);
  g.addColorStop(0, '#a1724a'); g.addColorStop(1, '#2d1b0a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, cy, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, cy - 3, 4.5, 0, Math.PI * 2);
  ctx.arc(6, cy - 3, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, cy - 3, 2.2, 0, Math.PI * 2);
  ctx.arc(6, cy - 3, 2.2, 0, Math.PI * 2); ctx.fill();
}

function drawPeashooter(bob, ice, heads) {
  drawStem();
  const cy = -16 + bob;
  if (heads === 2) {
    ctx.fillStyle = '#8bc34a';
    ctx.beginPath(); ctx.arc(-10, cy - 18, 16, 0, Math.PI * 2); ctx.fill();
  }
  const g = ctx.createRadialGradient(-5, cy - 5, 3, 0, cy, 22);
  if (ice) {
    g.addColorStop(0, '#e1f5fe'); g.addColorStop(0.5, '#81d4fa'); g.addColorStop(1, '#01579b');
  } else {
    g.addColorStop(0, '#e8f5c8'); g.addColorStop(0.5, '#8bc34a'); g.addColorStop(1, '#33691e');
  }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, cy, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ice ? '#29b6f6' : '#558b2f';
  ctx.beginPath(); ctx.ellipse(22, cy, 10, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a1f05';
  ctx.beginPath(); ctx.ellipse(24, cy, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(3, cy - 5, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(5, cy - 5, 3, 0, Math.PI * 2); ctx.fill();
}

function drawThreepeater(bob) {
  drawStem();
  const cy = -16 + bob;
  const heads = [
    { x: -4, y: cy - 14, r: 15 },
    { x: 0, y: cy, r: 20 },
    { x: -4, y: cy + 14, r: 15 },
  ];
  for (const h of heads) {
    ctx.fillStyle = '#8bc34a';
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(h.x + 3, h.y - 3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(h.x + 4, h.y - 3, 2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawWallnut(plant) {
  const dmg = plant ? (1 - plant.hp / plant.maxHp) : 0;
  const g = ctx.createRadialGradient(-6, -10, 5, 0, 0, 32);
  g.addColorStop(0, '#e8c898'); g.addColorStop(0.5, '#c8a068'); g.addColorStop(1, '#7a5a30');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-9, -6, 7, 0, Math.PI * 2);
  ctx.arc(9, -6, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-8, -5, 3.5, 0, Math.PI * 2);
  ctx.arc(10, -5, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (dmg < 0.4) ctx.arc(0, 8, 8, 0.1, Math.PI - 0.1);
  else if (dmg < 0.7) { ctx.moveTo(-7, 10); ctx.lineTo(7, 10); }
  else ctx.arc(0, 16, 7, Math.PI + 0.2, -0.2);
  ctx.stroke();
}

function drawCherry(bob) {
  const cy = -8 + bob;
  ctx.strokeStyle = '#4e342e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-10, cy - 15); ctx.quadraticCurveTo(0, cy - 30, 12, cy - 14); ctx.stroke();
  drawCherryBall(-10, cy, 17);
  drawCherryBall(12, cy + 2, 17);
}

function drawCherryBall(x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
  g.addColorStop(0, '#ff8a80'); g.addColorStop(0.5, '#c62828'); g.addColorStop(1, '#7f0000');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - 5, y, 4, 0, Math.PI * 2);
  ctx.arc(x + 5, y, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x - 5, y, 2, 0, Math.PI * 2);
  ctx.arc(x + 5, y, 2, 0, Math.PI * 2); ctx.fill();
}

function drawPotato(plant) {
  const armed = plant && plant.armed;
  ctx.fillStyle = '#6d4c21';
  ctx.beginPath(); ctx.ellipse(0, 22, 26, 10, 0, 0, Math.PI * 2); ctx.fill();
  if (armed) {
    ctx.fillStyle = '#c9a36a';
    ctx.beginPath(); ctx.ellipse(0, 2, 20, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-6, 0, 4, 0, Math.PI * 2);
    ctx.arc(6, 0, 4, 0, Math.PI * 2); ctx.fill();
    const pulse = 0.5 + Math.sin(S.time / 150) * 0.5;
    ctx.fillStyle = `rgba(255,0,0,${0.6 + pulse * 0.4})`;
    ctx.beginPath(); ctx.arc(0, -22, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function drawChomper(bob, plant) {
  drawStem();
  const cy = -18 + bob;
  ctx.fillStyle = '#7cb342';
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3e2723';
  ctx.beginPath(); ctx.ellipse(0, cy + 6, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, cy - 10, 5, 0, Math.PI * 2);
  ctx.arc(7, cy - 10, 5, 0, Math.PI * 2); ctx.fill();
}

function drawJalapeno(bob) {
  const cy = -8 + bob;
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.ellipse(0, cy, 18, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2e7d32';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, cy - 24); ctx.lineTo(0, cy - 32); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, cy - 4, 5, 0, Math.PI * 2);
  ctx.arc(6, cy - 4, 5, 0, Math.PI * 2); ctx.fill();
}

function drawTorchwood(bob) {
  drawStem('#6d4c21', '#5d4037');
  const cy = -16 + bob;
  ctx.fillStyle = '#5d4037';
  ctx.beginPath(); ctx.roundRect(-18, cy - 22, 36, 44, 8); ctx.fill();
  const flame = 0.7 + Math.sin(S.time / 100) * 0.3;
  for (let i = 0; i < 5; i++) {
    const fx = (i - 2) * 8;
    const fh = (18 + Math.sin(S.time / 80 + i) * 6) * flame;
    const fg = ctx.createLinearGradient(0, cy - 22 - fh, 0, cy - 22);
    fg.addColorStop(0, 'rgba(255,255,180,0)');
    fg.addColorStop(0.4, 'rgba(255,220,80,0.9)');
    fg.addColorStop(1, 'rgba(255,100,0,0.95)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx - 5, cy - 22);
    ctx.quadraticCurveTo(fx, cy - 22 - fh, fx + 5, cy - 22);
    ctx.closePath(); ctx.fill();
  }
}

function drawGarlic(bob, plant) {
  ctx.fillStyle = '#e0e0c0';
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 28, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, -6, 5, 0, Math.PI * 2);
  ctx.arc(7, -6, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-7, -6, 2.5, 0, Math.PI * 2);
  ctx.arc(7, -6, 2.5, 0, Math.PI * 2); ctx.fill();
}

function drawMushroomStem(color = '#e8dfc8') {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-6, 0, 12, 26, 3); ctx.fill();
}

function drawPuffshroom(bob) {
  const cy = -10 + bob;
  drawMushroomStem();
  ctx.fillStyle = '#a478b8';
  ctx.beginPath(); ctx.ellipse(0, cy, 20, 16, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, cy, 20, 8, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-5, cy - 2, 2, 0, Math.PI * 2);
  ctx.arc(5, cy - 2, 2, 0, Math.PI * 2); ctx.fill();
}

function drawSunshroom(bob) {

  drawMushroomStem();
  ctx.fillStyle = '#ff9800';
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 18, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 9, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, cy - 2, 4, 0, Math.PI * 2);

function drawFumeshroom(bob) {

  ctx.beginPath(); ctx.ellipse(0, cy, 22, 18, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 9, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, cy - 2, 4, 0, Math.PI * 2);
  ctx.arc(6, cy - 2, 4, 0, Math.PI * 2); ctx.fill();
}

function drawDoomshroom(bob) {
  const cy = -10 + bob;
  drawMushroomStem('#4a4a4a');
  ctx.fillStyle = '#3a3a4a';
  ctx.beginPath(); ctx.ellipse(0, cy, 28, 22, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, cy, 28, 12, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#ff2020';
  ctx.beginPath();
  ctx.arc(-8, cy - 2, 3.5, 0, Math.PI * 2);
  ctx.arc(8, cy - 2, 3.5, 0, Math.PI * 2); ctx.fill();
}

function drawIceshroom(bob) {
  const cy = -10 + bob;
  drawMushroomStem('#d8e8f0');
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 18, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 9, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, cy - 2, 2.5, 0, Math.PI * 2);
  ctx.arc(6, cy - 2, 2.5, 0, Math.PI * 2); ctx.fill();
}

function drawHypnoshroom(bob) {
  const cy = -10 + bob;
  drawMushroomStem();
  ctx.fillStyle = '#e040a0';
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 18, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, cy, 22, 9, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 30; i++) {
    const a = i * 0.4 + S.time / 500;
    const r = i * 0.4;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r + cy - 4;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawScaredy(bob) {
  const cy = -10 + bob;
  drawMushroomStem();
  ctx.fillStyle = '#b0a890';
  ctx.beginPath(); ctx.ellipse(0, cy, 18, 14, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, cy, 18, 7, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, cy - 2, 6, 0, Math.PI * 2);
  ctx.arc(6, cy - 2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-7, cy - 2, 2, 0, Math.PI * 2);
  ctx.arc(5, cy - 2, 2, 0, Math.PI * 2); ctx.fill();
}

function drawCabbage(bob) {
  drawStem();
  const cy = -16 + bob;
  ctx.fillStyle = '#a5d66a';
  ctx.beginPath(); ctx.arc(0, cy, 21, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-6, cy - 4, 4, 0, Math.PI * 2);
  ctx.arc(6, cy - 4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, cy - 4, 2, 0, Math.PI * 2);
  ctx.arc(6, cy - 4, 2, 0, Math.PI * 2); ctx.fill();
}

function drawKernelpult(bob) {
  drawStem();
  const cy = -16 + bob;
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath(); ctx.ellipse(0, cy, 16, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b8860b';
  for (let i = 0; i < 12; i++) {
    const row = Math.floor(i / 3);
    const col = i % 3;
    ctx.beginPath(); ctx.arc(-8 + col * 8, cy - 15 + row * 10, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5, cy - 2, 3.5, 0, Math.PI * 2);
  ctx.arc(5, cy - 2, 3.5, 0, Math.PI * 2); ctx.fill();
}

function drawCoffee(bob) {
  const cy = -8 + bob;
  ctx.fillStyle = '#f0f0f0';
  ctx.beginPath();
  ctx.moveTo(-16, cy - 10);
  ctx.lineTo(-12, cy + 16);
  ctx.lineTo(12, cy + 16);
  ctx.lineTo(16, cy - 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6a3a1a';
  ctx.beginPath(); ctx.ellipse(0, cy - 8, 14, 4, 0, 0, Math.PI * 2); ctx.fill();
}

function drawLilypad(bob) {
  const cy = -6 + bob;
  ctx.fillStyle = '#5c9e2a';
  ctx.beginPath();
  ctx.arc(0, cy, 30, 0.35, Math.PI * 2 - 0.35);
  ctx.lineTo(0, cy);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, cy - 3, 3.5, 0, Math.PI * 2);
  ctx.arc(7, cy - 3, 3.5, 0, Math.PI * 2); ctx.fill();
}

function drawTanglekelp(bob, plant) {
  const cy = -6 + bob;
  for (let i = 0; i < 3; i++) {
    const ox = (i - 1) * 14;
    const wave = Math.sin(S.time / 300 + i) * 4;
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ox, cy + 22);
    ctx.quadraticCurveTo(ox + wave, cy, ox + wave * 1.5, cy - 20);
    ctx.stroke();
  }
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, cy - 15, 4, 0, Math.PI * 2);
  ctx.arc(7, cy - 15, 4, 0, Math.PI * 2); ctx.fill();
}

// ==================== ЗОМБИ ====================
function drawZombie(z, t) {
  const x = z.x, y = cellCY(z.row);
  const dying = z.hp <= 0;
  const alpha = dying ? clamp(1 - z.dyingTimer / 800, 0, 1) : 1;
  const isBoss = z.type === 'zomboss';

  let bushAlpha = 1;
  if (z.x > ROAD_RIGHT - 20 && S.location !== 'roof') {
    const t2 = clamp((z.x - (ROAD_RIGHT - 20)) / 80, 0, 1);
    bushAlpha = 1 - t2 * 0.85;
  }

  ctx.save();
  ctx.globalAlpha = alpha * bushAlpha;
  ctx.translate(x, y);
  if (dying) ctx.rotate((1 - alpha) * 0.7);
  if (isBoss) ctx.scale(2.4, 2.4);

  const bob = dying ? 0 : Math.sin(t * 0.008 + z.walkPhase) * 3;
  ctx.translate(0, bob);

  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.ellipse(-8, 26, 8, 12, 0, 0, Math.PI * 2);
  ctx.ellipse(8, 26, 8, 12, 0, 0, Math.PI * 2); ctx.fill();

  let bodyColor = '#8b3a3a';
  if (z.type === 'football') bodyColor = '#b71c1c';
  if (z.type === 'zomboss') bodyColor = '#1a2a1a';
  if (z.hypnotized) bodyColor = '#c040a0';
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.ellipse(0, 2, 22, 26, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#a5d66a';
  ctx.beginPath();
  ctx.arc(-24, -8, 7, 0, Math.PI * 2);
  ctx.arc(24, -8, 7, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = z.hypnotized ? '#e0a0d0' : '#8bc34a';
  ctx.beginPath(); ctx.arc(0, -18, 22, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8, -20, 5, 0, Math.PI * 2);
  ctx.arc(8, -20, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-9, -20, 2.5, 0, Math.PI * 2);
  ctx.arc(7, -20, 2.5, 0, Math.PI * 2); ctx.fill();

  if (z.type === 'cone') {
    ctx.fillStyle = '#ff8f00';
    ctx.beginPath();
    ctx.moveTo(-18, -34); ctx.lineTo(0, -68); ctx.lineTo(18, -34);
    ctx.closePath(); ctx.fill();
  }
  if (z.type === 'bucket') {
    ctx.fillStyle = '#90a4ae';
    ctx.beginPath();
    ctx.moveTo(-20, -30); ctx.lineTo(-18, -62); ctx.lineTo(18, -62); ctx.lineTo(20, -30);
    ctx.closePath(); ctx.fill();
  }
  if (z.type === 'balloon') {
    ctx.fillStyle = '#e91e63';
    ctx.beginPath(); ctx.ellipse(0, -68, 18, 22, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (isBoss) {
    ctx.fillStyle = '#4a7a3a';
    ctx.beginPath(); ctx.arc(0, -18, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8a65';
    ctx.beginPath(); ctx.arc(0, -22, 20, 0, Math.PI * 2); ctx.fill();
  }

  if (z.hypnotized) {
    ctx.strokeStyle = 'rgba(224,64,160,0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -10, 40, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.restore();

  if (!dying && z.hp < z.maxHp) {
    ctx.save();
    ctx.globalAlpha = bushAlpha;
    const bw = isBoss ? 140 : 44;
    const by = y - (isBoss ? 150 : 78);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x - bw / 2, by, bw, isBoss ? 12 : 6);
    const pct = z.hp / z.maxHp;
    ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ff9800' : '#f44336';
    ctx.fillRect(x - bw / 2 + 1, by + 1, (bw - 2) * pct, isBoss ? 10 : 4);
    ctx.restore();
  }
}

function drawProjectile(p) {
  const g = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, 10);
  if (p.ice) {
    g.addColorStop(0, '#e1f5fe'); g.addColorStop(0.5, '#4fc3f7'); g.addColorStop(1, '#01579b');
  } else {
    g.addColorStop(0, '#e8f5c8'); g.addColorStop(0.5, '#8bc34a'); g.addColorStop(1, '#33691e');
  }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fill();
}

function drawSun(s) {
  const pulse = 1 + Math.sin(S.time / 250 + s.phase) * 0.08;
  const r = 28 * pulse;
  const g = ctx.createRadialGradient(s.x, s.y, 4, s.x, s.y, r * 2);
  g.addColorStop(0, 'rgba(255,255,150,0.95)');
  g.addColorStop(1, 'rgba(255,213,79,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(s.x, s.y, r * 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe082';
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
}

function drawParticles() {
  for (const p of S.particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMower(x, y) {
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.roundRect(x - 22, y - 18, 44, 28, 6); ctx.fill();
  ctx.fillStyle = '#212121';
  ctx.beginPath();
  ctx.arc(x - 14, y + 10, 8, 0, Math.PI * 2);
  ctx.arc(x + 14, y + 10, 8, 0, Math.PI * 2); ctx.fill();
}

// ==================== ВЕРХНЯЯ ПАНЕЛЬ ====================
function drawTopBar() {
  if (!S.currentLevel) return;
  // ✅ ВАЖНО: seeds берём из S.currentLevel.seeds напрямую
  const seeds = S.currentLevel.seeds.map(id => ALL_PLANTS[id]).filter(Boolean);
  const panelX = 8, panelY = 8;
  const packetW = 62, packetH = 84;
  const sunW = 78;

  ctx.fillStyle = 'rgba(80,50,20,0.9)';
  ctx.beginPath();
  ctx.roundRect(panelX - 4, panelY - 4, sunW + seeds.length * (packetW + 4) + 60 + 90, packetH + 12, 8);
  ctx.fill();

  ctx.fillStyle = '#ffd54f';
  ctx.beginPath(); ctx.arc(panelX + 30, panelY + 30, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(S.sun, panelX + 40, panelY + 69);

  const startX = panelX + sunW + 4;
  for (let i = 0; i < seeds.length; i++) {
    drawSeedPacket(startX + i * (packetW + 4), panelY, packetW, packetH, seeds[i]);
  }

  const shX = startX + seeds.length * (packetW + 4) + 4;
  drawShovel(shX, panelY, packetW, packetH);

  ctx.fillStyle = '#7cb342';
  ctx.beginPath(); ctx.roundRect(W - 130, panelY, 122, 40, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Impact, Arial Black, sans-serif';
  ctx.fillText('MENU', W - 69, panelY + 20);
}

function drawSeedPacket(x, y, w, h, seed) {
  if (!seed) return;
  const isSelected = S.selectedSeed === seed.id;
  const cd = S.cooldowns[seed.id] || 0;
  const ready = cd <= 0 && S.sun >= seed.cost;
  const awake = isPlantAwake(seed.id);

  ctx.fillStyle = isSelected ? '#fff9c4' : '#e8d9b0';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = isSelected ? '#ffeb3b' : '#3e2723';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  ctx.save();
  ctx.translate(x + w / 2, y + h / 2 - 6);
  ctx.scale(0.62, 0.62);
  drawPlant(seed.id, 0, 0, S.time, 1, seed.id === 'potato' ? { armed: true } : null);
  ctx.restore();

  if (!awake) {
    ctx.fillStyle = 'rgba(20,20,60,0.75)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💤', x + w / 2, y + h / 2 - 6);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(x + 2, y + h - 18, w - 4, 16);
  ctx.fillStyle = ready && awake ? '#fff' : '#ff5252';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(seed.cost, x + w / 2, y + h - 9);

  if (cd > 0) {
    const cdPct = cd / seed.cd;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(x, y, w, h * cdPct);
  } else if (S.sun < seed.cost || !awake) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x, y, w, h);
  }
}

function drawShovel(x, y, w, h) {
  ctx.fillStyle = S.shovelSelected ? '#fff9c4' : '#e8d9b0';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#3e2723';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(-0.4);
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(-3, -28, 6, 40);
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(-3, 12, 6, 20);
  ctx.restore();
}

function drawBottomBar() {

function drawLevelSelect() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a1a3a'); bg.addColorStop(1, '#0a0510');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 48px Impact, Arial Black, sans-serif';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText('ВЫБОР ЛОКАЦИИ', W / 2, 60);

  drawBackBtn(20, 20, 140, 50);

  const locations = [
    { key: 'yard',  name: 'ДВОР',    emoji: '☀',  color: '#5cc42e', bg1: '#a8d8ee', bg2: '#5aa62a', levels: LEVELS.filter(l => l.location === 'yard')  },
    { key: 'night', name: 'НОЧЬ',    emoji: '🌙', color: '#3a4a8a', bg1: '#1a2a52', bg2: '#0a0a1a', levels: LEVELS.filter(l => l.location === 'night') },
    { key: 'pool',  name: 'БАССЕЙН', emoji: '🏊', color: '#1a6a9a', bg1: '#4aa8e0', bg2: '#0a2a4a', levels: LEVELS.filter(l => l.location === 'pool')  },
    { key: 'roof',  name: 'КРЫША',   emoji: '🏠', color: '#a85030', bg1: '#d8a060', bg2: '#5a2010', levels: LEVELS.filter(l => l.location === 'roof')  },
  ];

  const cardW = 260, cardH = 440, gap = 20;
  const totalW = cardW * 4 + gap * 3;
  const startX = (W - totalW) / 2;
  const cardY = 130;

  S.levelNodes = [];

  for (let i = 0; i < locations.length; i++) {
    const loc = locations[i];
    const cx = startX + i * (cardW + gap);
    const cy = cardY;
    const firstLevel = loc.levels[0];
    const unlocked = firstLevel && firstLevel.id <= S.unlockedLevels;

    const g = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
    g.addColorStop(0, loc.bg1);
    g.addColorStop(1, loc.bg2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 16); ctx.fill();
    ctx.strokeStyle = unlocked ? loc.color : '#333';
    ctx.lineWidth = 4; ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px Impact, Arial Black, sans-serif';
    ctx.fillText(loc.emoji + ' ' + loc.name, cx + cardW / 2, cy + 35);

    const btnW = 60, btnH = 50, cols = 3;
    const startBtnX = cx + (cardW - cols * btnW - (cols - 1) * 8) / 2;
    const startBtnY = cy + 70;

    for (let j = 0; j < loc.levels.length; j++) {
      const lvl = loc.levels[j];
      const col = j % cols;
      const row = Math.floor(j / cols);
      const bx = startBtnX + col * (btnW + 8);
      const by = startBtnY + row * (btnH + 8);
      const lvlLocked = lvl.id > S.unlockedLevels;
      const isBoss = !!lvl.boss;

      ctx.fillStyle = lvlLocked ? '#444' : (isBoss ? '#d32f2f' : '#8bc34a');
      ctx.beginPath(); ctx.roundRect(bx, by, btnW, btnH, 8); ctx.fill();

      ctx.fillStyle = lvlLocked ? '#666' : '#fff';
      ctx.font = 'bold 14px Impact, Arial Black, sans-serif';
      ctx.fillText(isBoss ? '👹' : lvl.name, bx + btnW / 2, by + btnH / 2);

      if (!lvlLocked) {
        S.levelNodes.push({ level: lvl, x: bx, y: by, w: btnW, h: btnH });
      }
    }
  }
}

function drawBackBtn(x, y, w, h) {

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
