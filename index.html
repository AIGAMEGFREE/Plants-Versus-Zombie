}

// ==================== ПОКУПКА ====================
function buyShopItem(card){
  const item=card.item;
  if(card.owned)return;
  if(S.coins<item.price){
    showSaveToast('❌ Не хватает монет!');
    return;
  }
  S.coins-=item.price;

  if(item.type==='plant'){
    if(!S.ownedPlants.includes(item.plantId)&&ALL_PLANTS[item.plantId]){
      S.ownedPlants.push(item.plantId);
      showSaveToast('✅ Куплено: '+item.name);
    }
  }else if(item.type==='item'){
    if(!S.ownedItems.includes(item.id)){
      S.ownedItems.push(item.id);
      showSaveToast('✅ Куплено: '+item.name);
    }
  }else if(item.type==='upgrade'&&item.isSlot){
    S.extraSlots=(S.extraSlots||0)+1;
    S.seedSelectMaxSlots=6+S.extraSlots;
    showSaveToast('✅ Слотов теперь: '+S.seedSelectMaxSlots);
    unlockAchievement('slot_master');
  }else if(item.type==='upgrade'&&item.isIronSpike){
    if(!S.ownedItems.includes('spikeweed_iron')){
      S.ownedItems.push('spikeweed_iron');
      S.ironSpikeOwned=true;
      showSaveToast('✅ Куплено: '+item.name);
    }
  }

  S.shopDavespeech=DAVE_PHRASES[Math.floor(Math.random()*DAVE_PHRASES.length)];
  saveProgress(true);
}

// ==================== ВЫБОР СЕМЯН ====================
function drawSeedSelect(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1a3a');
  bg.addColorStop(.5,'#1a0f25');
  bg.addColorStop(1,'#0a0510');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font='bold 48px Impact, Arial Black, sans-serif';
  ctx.strokeStyle='#000';
  ctx.lineWidth=6;
  ctx.strokeText('ВЫБЕРИ РАСТЕНИЯ',W/2,60);
  const tg=ctx.createLinearGradient(0,30,0,90);
  tg.addColorStop(0,'#ffffff');
  tg.addColorStop(1,'#ffb300');
  ctx.fillStyle=tg;
  ctx.fillText('ВЫБЕРИ РАСТЕНИЯ',W/2,60);

  ctx.font='bold 22px Arial';
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText('Слотов: '+S.seedSelectMaxSlots+' (только купленные)',W/2,110);

  // Слоты
  const slotSize=80,slotGap=10;
  const maxSlots=Math.min(S.seedSelectMaxSlots,10);
  const slotRowW=maxSlots*slotSize+(maxSlots-1)*slotGap;
  const slotRowX=(W-slotRowW)/2;
  const slotRowY=150;

  ctx.fillStyle='rgba(80,50,20,.7)';
  ctx.beginPath();
  ctx.roundRect(slotRowX-15,slotRowY-15,slotRowW+30,slotSize+30,12);
  ctx.fill();
  ctx.strokeStyle='#8b5a2b';
  ctx.lineWidth=4;
  ctx.stroke();

  for(let i=0;i<maxSlots;i++){
    const sx=slotRowX+i*(slotSize+slotGap);
    const chosen=S.seedSelectChosen[i];
    if(chosen&&ALL_PLANTS[chosen]){
      ctx.fillStyle='#f0e2c0';
      ctx.fillRect(sx,slotRowY,slotSize,slotSize);
      ctx.strokeStyle='#8b5a2b';
      ctx.lineWidth=3;
      ctx.strokeRect(sx,slotRowY,slotSize,slotSize);

      ctx.save();
      ctx.translate(sx+slotSize/2,slotRowY+slotSize/2-8);
      ctx.scale(.75,.75);
      drawPlant(chosen,0,0,S.time,1,null);
      ctx.restore();

      const def=ALL_PLANTS[chosen];
      ctx.fillStyle='rgba(0,0,0,.75)';
      ctx.fillRect(sx+2,slotRowY+slotSize-20,slotSize-4,18);
      ctx.fillStyle='#fff';
      ctx.font='bold 14px Arial';
      ctx.fillText(def.cost,sx+slotSize/2,slotRowY+slotSize-11);
    }else{
      ctx.fillStyle='rgba(0,0,0,.5)';
      ctx.fillRect(sx,slotRowY,slotSize,slotSize);
      ctx.strokeStyle='#666';
      ctx.lineWidth=2;
      ctx.strokeRect(sx+2,slotRowY+2,slotSize-4,slotSize-4);
      ctx.fillStyle='#555';
      ctx.font='bold 32px Arial';
      ctx.fillText('+',sx+slotSize/2,slotRowY+slotSize/2);
    }
  }

  // Доступные растения
  ctx.font='bold 22px Arial';
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText('Твои растения ('+S.seedSelectAvailable.length+')',W/2,290);

  const availSize=60,availGap=8,perRow=15;
  const available=S.seedSelectAvailable;
  const perRowCount=Math.min(perRow,available.length);
  const availRowW=perRowCount*availSize+(perRowCount-1)*availGap;
  const availRowX=(W-availRowW)/2;
  const availRowY=320;
  S.seedSelectCardRects=[];

  for(let i=0;i<available.length;i++){
    const seedId=available[i];
    const def=ALL_PLANTS[seedId];
    if(!def)continue;
    const col=i%perRow;
    const row=Math.floor(i/perRow);
    const ax=availRowX+col*(availSize+availGap);
    const ay=availRowY+row*(availSize+availGap);
    const isChosen=S.seedSelectChosen.includes(seedId);

    ctx.fillStyle=isChosen?'#ffe082':'#f0e2c0';
    ctx.beginPath();
    ctx.roundRect(ax,ay,availSize,availSize,6);
    ctx.fill();
    ctx.strokeStyle=isChosen?'#4caf50':'#8b5a2b';
    ctx.lineWidth=isChosen?4:2;
    ctx.stroke();

    ctx.save();
    ctx.translate(ax+availSize/2,ay+availSize/2-6);
    ctx.scale(.55,.55);
    drawPlant(seedId,0,0,S.time,1,null);
    ctx.restore();

    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillRect(ax+2,ay+availSize-16,availSize-4,14);
    ctx.fillStyle='#fff';
    ctx.font='bold 12px Arial';
    ctx.fillText(def.cost,ax+availSize/2,ay+availSize-9);

    S.seedSelectCardRects.push({seedId,x:ax,y:ay,w:availSize,h:availSize});
  }

  // Кнопка Назад
  const backW=180,backH=60,backX=40,backY=H-90;
  ctx.fillStyle='#bf360c';
  ctx.beginPath();
  ctx.roundRect(backX,backY,backW,backH,12);
  ctx.fill();
  ctx.strokeStyle='#3e1a00';
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 24px Impact, Arial Black, sans-serif';
  ctx.fillText('← НАЗАД',backX+backW/2,backY+backH/2);
  S.seedSelectBackBtn={x:backX,y:backY,w:backW,h:backH};

  // Кнопка В БОЙ
  const startW=320,startH=80,startX=W-startW-40,startY=H-100;
  const canStart=S.seedSelectChosen.length>0;
  ctx.fillStyle=canStart?'#8bc34a':'#666';
  ctx.beginPath();
  ctx.roundRect(startX,startY,startW,startH,16);
  ctx.fill();
  ctx.strokeStyle='#1e3a08';
  ctx.lineWidth=4;
  ctx.stroke();
  ctx.fillStyle=canStart?'#fff':'#aaa';
  ctx.font='bold 36px Impact, Arial Black, sans-serif';
  ctx.fillText('В БОЙ!',startX+startW/2,startY+startH/2);
  S.seedSelectStartBtn={x:startX,y:startY,w:startW,h:startH,enabled:canStart};

  // Счётчик
  ctx.fillStyle='#fff';
  ctx.font='bold 20px Arial';
  ctx.fillText('Выбрано: '+S.seedSelectChosen.length+' / '+maxSlots,W/2,H-40);
}

// ==================== ДОСТИЖЕНИЯ ====================
function unlockAchievement(id){
  if(S.achievements[id]||!ACHIEVEMENTS[id])return false;
  S.achievements[id]=true;
  S.achievementQueue.push({id,...ACHIEVEMENTS[id],time:S.time});
  return true;
}

function checkAchievements(){
  if(S.totalZombiesDead>0)unlockAchievement('first_blood');
  if(S.totalKillsEver>=100)unlockAchievement('veteran');
  if(S.totalKillsEver>=500)unlockAchievement('warlord');
  if(S.sun>=1000)unlockAchievement('sunflower_farm');
  if(S.unlockedLevels>=20)unlockAchievement('collector');
  if(S.unlockedLevels>=35)unlockAchievement('master');
  if(S.garlicPushes>=5)unlockAchievement('garlic_master');
  if(S.hypnoCount>=10)unlockAchievement('hypno_master');
  if(S.coins>=5000)unlockAchievement('rich');
  if(S.coins>=10000)unlockAchievement('millionaire');
  if(S.ownedPlants.length>=12)unlockAchievement('shopaholic');
  if(S.ownedPlants.length>=30)unlockAchievement('gardner');
  if(S.extraSlots>=1)unlockAchievement('slot_master');
  if(S.rakesUsed>=1)unlockAchievement('rake_user');

  if(S.gameOver&&S.won){
    const mowersUsed=S.mowers.filter(m=>m.used).length;
    if(mowersUsed===0)unlockAchievement('no_mowers');
    if(S.location==='night')unlockAchievement('night_owl');
    if(S.location==='roof')unlockAchievement('roof_walker');
    if(S.location==='pool')unlockAchievement('pool_party');
    if(S.location==='nightpool')unlockAchievement('night_swimmer');
    if(S.currentLevel.boss==='zomboss')unlockAchievement('boss_slayer');
    if(S.currentLevel.boss==='gargantuar')unlockAchievement('gargantua_kill');
    const stars=S.levelStars[S.currentLevel.id]||0;
    if(stars===3)unlockAchievement('perfectionist');
    if(S.levelStartTime&&S.time-S.levelStartTime<60000)unlockAchievement('speedrun');
    if(S.unlockedLevels>=2)unlockAchievement('first_win');
    if(S.plantedThisLevel===0)unlockAchievement('chill_master');
    const roofLevels=LEVELS.filter(l=>l.location==='roof');
    if(roofLevels.every(l=>S.levelStars[l.id]>0))unlockAchievement('perfect_roof');
  }

  if(S.minigameType&&S.gameOver&&S.won)unlockAchievement('minigame_win');
  if(S.minigameType==='endless'&&S.currentWave>=10)unlockAchievement('endless_10');
}

function drawAchievementToasts(){
  if(S.achievementQueue.length===0)return;
  const a=S.achievementQueue[0];
  if(!a||!Number.isFinite(a.time)){S.achievementQueue.shift();return;}
  const elapsed=S.time-a.time;
  if(!Number.isFinite(elapsed)){S.achievementQueue.shift();return;}
  if(elapsed>4200){S.achievementQueue.shift();return;}

  const slideIn=Math.min(1,elapsed/400);
  const slideOut=Math.max(0,(elapsed-3600)/600);
  const y=-120+slideIn*130-slideOut*130;

  const boxW=460,boxH=100;
  const boxX=W/2-boxW/2;
  const boxY=y;

  ctx.save();
  ctx.globalAlpha=1;

  // Тень
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.beginPath();
  ctx.roundRect(boxX+6,boxY+6,boxW,boxH,14);
  ctx.fill();

  // Градиент
  const g=ctx.createLinearGradient(boxX,boxY,boxX,boxY+boxH);
  g.addColorStop(0,'#ffd54f');
  g.addColorStop(.5,'#ffb300');
  g.addColorStop(1,'#e65100');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.roundRect(boxX,boxY,boxW,boxH,14);
  ctx.fill();
  ctx.strokeStyle='#4a2000';
  ctx.lineWidth=3;
  ctx.stroke();

  // Иконка
  ctx.font='bold 50px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(a.icon||'🏆',boxX+60,boxY+boxH/2);

  // Заголовок
  ctx.textAlign='left';
  ctx.font='bold 14px Arial';
  ctx.fillStyle='#5d4037';
  ctx.fillText('🏆 ДОСТИЖЕНИЕ РАЗБЛОКИРОВАНО',boxX+110,boxY+25);

  // Название
  ctx.font='bold 22px Impact, Arial Black, sans-serif';
  ctx.fillStyle='#3e2723';
  ctx.strokeStyle='#fff';
  ctx.lineWidth=3;
  ctx.strokeText(a.name||'?',boxX+110,boxY+52);
  ctx.fillText(a.name||'?',boxX+110,boxY+52);

  // Описание
  ctx.font='italic 13px Arial';
  ctx.fillStyle='#5d4037';
  ctx.fillText(a.desc||'',boxX+110,boxY+78);

  ctx.restore();
}

// ==================== ВОЛНЫ ====================
function startWave(waveNum){
  S.currentWave=waveNum;
  const totalWaves=S.currentLevel.waves||5;
  const isBig=waveNum===totalWaves;
  const isBoss=S.currentLevel.boss&&waveNum===totalWaves;
  const remaining=S.totalZombies-S.spawnedZombies;
  const zombiesInWave=Math.min(remaining,Math.ceil(S.totalZombies/totalWaves));
  S.waveZombiesPerWave=zombiesInWave;
  S.waveZombiesRemaining=zombiesInWave;
  S.waveBannerTimer=2500;
  S.bigWave=isBig;

  if(isBoss){
    if(S.currentLevel.boss==='gargantuar'){
      S.waveBannerText='БОСС: ГАРГАНТЮА!';
      S.waveBannerSub='Держись изо всех сил!';
    }else{
      S.waveBannerText='БОСС: ЗОМБОСС!';
      S.waveBannerSub='Финальная битва!';
    }
  }else if(isBig){
    S.waveBannerText='ОГРОМНАЯ ВОЛНА!';
    S.waveBannerSub='Волна '+waveNum+' из '+totalWaves;
  }else{
    S.waveBannerText='ВОЛНА '+waveNum;
    S.waveBannerSub='из '+totalWaves;
  }
  S.betweenWaves=false;
  S.betweenWavesTimer=0;
  S.zombieSpawnTimer=0;

  // Флаг-зомби в начале волны
  if(!isBoss&&waveNum>1&&S.waveZombiesRemaining>0){
    const row=Math.floor(Math.random()*ROWS);
    const def=ZOMBIE_TYPES.flag;
    S.zombies.push({
      type:'flag',row,x:ZOMBIE_SPAWN_X+Math.random()*40,
      hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,
      walkPhase:0,slowTimer:0,hitFlash:0,dyingTimer:0,attackTimer:0,
      garlicPushTimer:0,hypnotized:false,y_air:undefined,falling:false,frozenStop:false,
    });
    S.spawnedZombies++;
    S.waveZombiesRemaining--;
  }
}

// ==================== ВЗРЫВЫ ====================
function triggerExplosion(plant){
  const def=ALL_PLANTS[plant.type];
  if(!def)return;
  const px=cellCX(plant.col);
  const py=cellCY(plant.row);

  if(def.freezeAll){
    let frozenCount=0;
    for(const z of S.zombies){
      if(z.hp<=0)continue;
      z.slowTimer=8000;
      z.frozenStop=true;
      setTimeout(()=>{z.frozenStop=false;},8000);
      frozenCount++;
    }
    S.shake=25;
    S.flash=.6;
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        for(let i=0;i<3;i++)addParticles(cellCX(c),cellCY(r),1,'#4fc3f7',2,800,4);
      }
    }
    if(frozenCount>=20)unlockAchievement('ice_apocalypse');
  }else if(def.fullScreen){
    S.shake=40;
    S.flash=1;
    unlockAchievement('nuclear_master');
    for(const z of S.zombies){
      if(z.hp<=0)continue;
      z.hp-=99999;
      z.hitFlash=300;
    }
    S.craters.push({row:plant.row,col:plant.col,x:px,y:py,life:5000,maxLife:5000});
    addParticles(px,py,60,'#ffffff',10,1000,8);
    addParticles(px,py,40,'#ff5722',8,900,6);
  }else if(def.rowOnly){
    S.shake=25;
    for(const z of S.zombies){
      if(z.hp<=0||z.row!==plant.row)continue;
      z.hp-=def.explode;
    }
    for(let c=0;c<COLS;c++)addParticles(cellCX(c),cellCY(plant.row),8,'#ff5722',6,700,5);
  }else{
    S.shake=18;
    const radiusPx=(def.radius||1.7)*CELL_W;
    for(const z of S.zombies){
      if(z.hp<=0)continue;
      const dx=z.x-px;
      if(Math.abs(dx)<radiusPx&&Math.abs(z.row-plant.row)<=1){
        z.hp-=def.explode;
      }
    }
    for(let i=0;i<25;i++)addParticles(px,py,1,'#ff5722',8,800,6);
  }

  S.plants=S.plants.filter(p=>p!==plant);
  rebuildPlantCache();
}

function explodePotato(plant){
  S.shake=10;
  addParticles(cellCX(plant.col),cellCY(plant.row),20,'#ff5722',6,700,5);
  for(const z of S.zombies){
    if(z.hp<=0)continue;
    if(Math.abs(z.x-cellCX(plant.col))<60&&Math.abs(z.row-plant.row)<1)z.hp-=1800;
  }
}

// ==================== СПАВН ЗОМБИ ====================
function spawnZombie(){
  const lvl=S.currentLevel;
  const row=Math.floor(Math.random()*ROWS);
  let type='basic';
  const available=lvl.types;
  if(available.length===1)type=available[0];
  else type=available[Math.floor(Math.random()*available.length)];
  const def=ZOMBIE_TYPES[type];

  const z={
    type,row,x:ZOMBIE_SPAWN_X+Math.random()*40,
    hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,
    walkPhase:Math.random()*Math.PI*2,
    slowTimer:0,hitFlash:0,dyingTimer:0,attackTimer:0,
    garlicPushTimer:0,hypnotized:false,y_air:undefined,falling:false,frozenStop:false,
  };

  // Гравотационные зомби в мини-игре
  if(S.minigameFlags.gravity){
    z.y_air=-100;
    z.falling=true;
  }

  S.zombies.push(z);
  S.spawnedZombies++;
}

// ==================== КОНЕЦ ИГРЫ ====================
function gameOver(won){
  if(S.gameOver)return;
  S.gameOver=true;
  S.won=won;

  if(won){
    const mowersUsed=S.mowers.filter(m=>m.used).length;
    let stars=1;
    if(mowersUsed===0)stars=3;
    else if(mowersUsed<=2)stars=2;

    const lvlId=S.currentLevel.id;
    if(lvlId>0){
      const prevStars=S.levelStars[lvlId]||0;
      if(stars>prevStars)S.levelStars[lvlId]=stars;
      if(S.unlockedLevels===lvlId&&lvlId<LEVELS.length)S.unlockedLevels=lvlId+1;

      // Награда — новое растение
      if(S.currentLevel.reward&&ALL_PLANTS[S.currentLevel.reward]&&!S.ownedPlants.includes(S.currentLevel.reward)){
        S.ownedPlants.push(S.currentLevel.reward);
        showSaveToast('🎁 Новое растение: '+ALL_PLANTS[S.currentLevel.reward].name);
      }
    }
    S.totalWinsEver++;
    S.totalKillsEver+=S.totalZombiesDead;

    if(S.minigameType){
      if(S.minigameScore===0)S.minigameScore=S.totalZombiesDead;
      const best=S.minigameBest[S.minigameType]||0;
      if(S.minigameScore>best)S.minigameBest[S.minigameType]=S.minigameScore;
    }

    checkAchievements();
    saveProgress();
  }else{
    S.shake=30;
    S.totalKillsEver+=S.totalZombiesDead;
    saveProgress(true);
  }
}

// ============================================================
// ГЛАВНЫЙ UPDATE
// ============================================================
function update(dt){
  if(dt>100)dt=100;
  const dts=dt/1000;

  if(S.waveBannerTimer>0)S.waveBannerTimer-=dt;

  // Кулдауны семян
  for(const k in S.cooldowns){
    S.cooldowns[k]=Math.max(0,S.cooldowns[k]-dt);
  }

  // Ограничение частиц
  if(S.particles.length>200)S.particles=S.particles.slice(-200);

  // Бустер
  if(S.boosterTimer>0)S.boosterTimer-=dt;

  // ===== МАГНИТ (автосбор монет) =====
  if(S.magnetActive){
    for(let i=S.coinsOnGround.length-1;i>=0;i--){
      const c=S.coinsOnGround[i];
      S.coins+=c.value||10;
      S.totalCoinsEarned+=c.value||10;
      addParticles(c.x,c.y,4,'#ffd700',3,300,3);
      S.coinsOnGround.splice(i,1);
    }
  }

  // ===== ПАДЕНИЕ СОЛНЦА =====
  if(!S.minigameFlags.sunny){
    S.sunTimer+=dt;
    if(S.sunTimer>6500){
      S.sunTimer=0;
      const x=rand(GRID_X+20,GRID_X+GRID_W-20);
      const targetY=rand(activeTop()+40,activeBottom()-40);
      S.suns.push({
        x,y:-30,targetY,life:10000,maxLife:10000,vy:1.4,
        phase:Math.random()*10,value:25
      });
    }
  }

  // ============================================================
  // РАСТЕНИЯ
  // ============================================================
  for(const p of S.plants){
    const def=ALL_PLANTS[p.type];
    if(!def)continue;

    // Взрывные — таймер фитиля
    if(def.explode!==undefined||def.freezeAll||def.fullScreen){
      p.growTimer=(p.growTimer||0)+dt;
      p.fuseDuration=p.fuseDuration||def.fuse||3000;
      if(p.growTimer>=p.fuseDuration)triggerExplosion(p);
      continue;
    }

    if(!isPlantAwake(p.type))continue;
    const boost=S.boosterTimer>0?.5:1;

    // ===== СОЛНЕЧНЫЕ =====
    if(p.type==='sunflower'||p.type==='sunshroom'){
      p.sunTimer+=dt;
      const interval=(p.type==='sunshroom'?7000:5500)*boost;
      const amount=p.type==='sunshroom'?15:25;
      if(p.sunTimer>interval){
        p.sunTimer=0;
        S.suns.push({
          x:cellCX(p.col)+rand(-15,15),
          y:cellCY(p.row),
          targetY:cellCY(p.row)+30,
          life:10000,maxLife:10000,vy:.8,
          phase:Math.random()*10,value:amount
        });
      }
    }
    if(p.type==='twinsunflower'){
      p.sunTimer+=dt;
      if(p.sunTimer>5500*boost){
        p.sunTimer=0;
        for(let i=0;i<2;i++){
          S.suns.push({
            x:cellCX(p.col)+rand(-25,25),
            y:cellCY(p.row),
            targetY:cellCY(p.row)+30,
            life:10000,maxLife:10000,vy:.8,
            phase:Math.random()*10,value:25
          });
        }
      }
    }
    if(def.isCoin){
      p.sunTimer+=dt;
      if(p.sunTimer>7000*boost){
        p.sunTimer=0;
        S.coinsOnGround.push({
          x:cellCX(p.col)+rand(-15,15),
          y:cellCY(p.row),
          targetY:cellCY(p.row)+30,
          life:12000,maxLife:12000,vy:.8,
          phase:Math.random()*10,value:def.coinValue||10
        });
      }
    }

    // ===== КАРТОШКА-МИНА =====
    if((p.type==='potato'||p.type==='potatomine')&&!p.armed){
      p.armTimer=(p.armTimer||0)+dt;
      if(p.armTimer>15000)p.armed=true;
    }

    // ===== ЖЕВАТЕЛЬ =====
    if(p.type==='chomper'){
      if(p.chewing){
        p.chewTimer-=dt;
        if(p.chewTimer<=0)p.chewing=false;
      }else{
        p.shootTimer+=dt;
        const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&z.x<YARD_RIGHT&&
          Math.abs(z.x-cellCX(p.col))<60&&!z.hypnotized);
        if(target&&p.shootTimer>3000*boost){
          p.shootTimer=0;
          p.chewing=true;
          p.chewTimer=6000;
          target.hp-=3000;
        }
      }
    }

    // ===== СТРЕЛКИ (горох, ледяной, двойной, тройной, шлем) =====
    if(['peashooter','snowpea','repeater','threepeater','helmetpea'].includes(p.type)){
      p.shootTimer+=dt;
      const cooldown=(p.type==='snowpea'?1400:1500)*boost;
      let target=null;
      if(p.type==='threepeater'){
        target=S.zombies.find(z=>Math.abs(z.row-p.row)<=1&&z.x<ZOMBIE_ENTER_YARD_X+5&&
          z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      }else{
        target=S.zombies.find(z=>z.row===p.row&&z.x<ZOMBIE_ENTER_YARD_X+5&&
          z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      }
      if(target&&p.shootTimer>cooldown){
        p.shootTimer=0;
        if(p.type==='threepeater'){
          for(let dr=-1;dr<=1;dr++){
            const row=p.row+dr;
            if(row<0||row>=ROWS)continue;
            S.projectiles.push({
              x:cellCX(p.col)+22,y:cellCY(row)-14,row,
              vx:500,damage:20,trail:[]
            });
          }
        }else{
          const shots=p.type==='repeater'?2:1;
          for(let i=0;i<shots;i++){
            S.projectiles.push({
              x:cellCX(p.col)+22,y:cellCY(p.row)-14,row:p.row,
              vx:500,damage:p.type==='snowpea'?20:25,
              ice:p.type==='snowpea',delay:i*150,trail:[]
            });
          }
        }
      }
    }

    // ===== ГАТЛИНГ (4 пули) =====
    if(p.type==='gatlingpea'||p.type==='gatlingpea_s'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.x<ZOMBIE_ENTER_YARD_X+5&&
        z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      if(target&&p.shootTimer>1500*boost){
        p.shootTimer=0;
        for(let i=0;i<4;i++){
          S.projectiles.push({
            x:cellCX(p.col)+22,y:cellCY(p.row)-14,row:p.row,
            vx:500,damage:20,delay:i*100,trail:[]
          });
        }
      }
    }

    // ===== ГИПНОГРИБ =====
    if(p.type==='hypnoshroom'){
      p.shootTimer+=dt;
      if(!p.used&&p.shootTimer>3000){
        p.used=true;
        const target=S.zombies.find(z=>z.row===p.row&&
          Math.abs(z.x-cellCX(p.col))<80&&z.hp>0&&!z.hypnotized);
        if(target){
          target.hypnotized=true;
          target.hp=100;
          target.maxHp=100;
          target.attackTimer=0;
          S.hypnoCount=(S.hypnoCount||0)+1;
          addParticles(target.x,cellCY(target.row),15,'#e040a0',5,600,5);
        }
      }
    }

    // ===== КУКУРУЗНАЯ ПУШКА =====
    if(p.type==='cobcannon'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>Math.abs(z.row-p.row)<=1&&z.x<YARD_RIGHT&&
        z.x>cellCX(p.col)&&z.hp>0&&!z.hypnotized);
      if(target&&p.shootTimer>30000*boost){
        p.shootTimer=0;
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-cellCX(p.col))<400)z.hp-=500;
        }
        S.shake=15;
        addParticles(cellCX(p.col)+100,cellCY(p.row),40,'#ffeb3b',10,800,6);
      }
    }

    // ===== КОШКАМЫШ / КОШКА-ГРИБ / СИНИЙ ГРИБ =====
    if(p.type==='cattail'||p.type==='catmushroom'||p.type==='bluemushroom'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        const candidates=S.zombies.filter(z=>z.hp>0&&!z.hypnotized&&z.x<YARD_RIGHT);
        if(candidates.length>0){
          const target=candidates.reduce((a,b)=>
            Math.abs(a.x-cellCX(p.col))<Math.abs(b.x-cellCX(p.col))?a:b);
          const angle=Math.atan2(cellCY(target.row)-cellCY(p.row),target.x-cellCX(p.col));
          S.projectiles.push({
            x:cellCX(p.col),y:cellCY(p.row)-14,row:p.row,
            vx:Math.cos(angle)*500,vy:Math.sin(angle)*500,
            damage:25,trail:[],cattail:true
          });
        }
      }
    }

    // ===== ШИПЫ =====
    if(p.type==='spikeweed'||p.type==='iron_spike'){
      const dmgVal=p.type==='iron_spike'?40:(def.dmg||20);
      for(const z of S.zombies){
        if(z.hp<=0||z.hypnotized)continue;
        if(z.row===p.row&&Math.abs(z.x-cellCX(p.col))<40){
          z.spikeTimer=(z.spikeTimer||0)+dt;
          if(z.spikeTimer>500){
            z.spikeTimer=0;
            z.hp-=dmgVal;
            z.hitFlash=150;
          }
        }
      }
    }

    // ===== МАГНИТ-ГРИБ =====
    if(def.isMagnetPlant){
      S.magnetActive=true;
    }

    // ===== ДЫМОГРИБ =====
    if(p.type==='fumeshroom'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        S.zombies.forEach(z=>{
          if(z.row===p.row&&z.hp>0&&!z.hypnotized&&
              z.x>cellCX(p.col)-30&&z.x<cellCX(p.col)+100){
            z.hp-=20;
            z.hitFlash=150;
          }
        });
      }
    }

    // ===== МРАЧНОГРИБ / ГРИБ-ГИГАНТ =====
    if(p.type==='gloomyshroom'||p.type==='twinBF'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-cellCX(p.col))<100){
            z.hp-=20;
            z.hitFlash=150;
          }
        }
        addParticles(cellCX(p.col),cellCY(p.row),8,'#a040a0',4,400,5);
      }
    }

    // ===== ГРИБОЧЕК / ТРУСОГРИБ =====
    if(p.type==='puffshroom'||p.type==='scaredy'){
      if(p.type==='scaredy'){
        const closeZ=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&
          Math.abs(z.x-cellCX(p.col))<50);
        if(closeZ)continue;
      }
      p.shootTimer+=dt;
      const range=p.type==='puffshroom'?220:200;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&
        z.x<cellCX(p.col)+range&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>1500*boost){
        p.shootTimer=0;
        S.projectiles.push({
          x:cellCX(p.col)+20,y:cellCY(p.row)-14,row:p.row,
          vx:500,damage:20,spore:true,trail:[]
        });
      }
    }

    // ===== КАКТУС =====
    if(p.type==='cactus'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&
        z.x<YARD_RIGHT&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>1500*boost){
        p.shootTimer=0;
        S.projectiles.push({
          x:cellCX(p.col)+20,y:cellCY(p.row)-14,row:p.row,
          vx:600,damage:30,trail:[]
        });
      }
    }

    // ===== КЛЕВЕР =====
    if(p.type==='clover'){
      p.shootTimer+=dt;
      if(p.shootTimer>3000*boost){
        p.shootTimer=0;
        S.zombies.forEach(z=>{
          if(z.type==='balloon'&&z.hp>0){
            z.type='basic';
            addParticles(z.x,cellCY(z.row)-60,10,'#e91e63',5,600,5);
          }
        });
      }
    }

    // ===== ЗВЕЗДА =====
    if(p.type==='starfruit'){
      p.shootTimer+=dt;
      if(p.shootTimer>1500*boost){
        p.shootTimer=0;
        const dirs=[0,Math.PI/4,-Math.PI/4,Math.PI/2,-Math.PI/2];
        for(const angle of dirs){
          S.projectiles.push({
            x:cellCX(p.col),y:cellCY(p.row)-14,row:p.row,
            vx:Math.cos(angle)*500,vy:Math.sin(angle)*500,
            damage:20,trail:[],cattail:true
          });
        }
      }
    }

    // ===== АРБУЗ-ПУШКА =====
    if(p.type==='melonpult'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&
        z.x<YARD_RIGHT&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>2000*boost){
        p.shootTimer=0;
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-target.x)<CELL_W*1.5){
            z.hp-=80;
            z.hitFlash=200;
          }
        }
        addParticles(target.x,cellCY(target.row),15,'#4caf50',6,600,5);
      }
    }

    // ===== ЛЕДЯНОЙ АРБУЗ (МАГАЗИН) =====
    if(p.type==='icemelon'){
      p.shootTimer+=dt;
      const target=S.zombies.find(z=>z.row===p.row&&z.hp>0&&!z.hypnotized&&
        z.x<YARD_RIGHT&&z.x>cellCX(p.col));
      if(target&&p.shootTimer>2500*boost){
        p.shootTimer=0;
        for(const z of S.zombies){
          if(z.hp<=0||z.hypnotized)continue;
          if(Math.abs(z.row-p.row)<=1&&Math.abs(z.x-target.x)<CELL_W*1.5){
            z.hp-=60;
            z.hitFlash=200;
            z.slowTimer=5000;
            z.frozenStop=true;
            setTimeout(()=>{z.frozenStop=false;},3000);
          }
        }
        addParticles(target.x,cellCY(target.row),20,'#4fc3f7',6,600,5);
      }
    }

    // ===== ЗОНТИК =====
    if(p.type==='umbrella'){
      S.zombies.forEach(z=>{
        if(z.type==='balloon'&&z.row===p.row&&Math.abs(z.x-cellCX(p.col))<100){
          z.type='basic';
          addParticles(z.x,cellCY(z.row)-60,8,'#e91e63',5,600,5);
        }
      });
    }
  }

  // ============================================================
  // СНАРЯДЫ
  // ============================================================
  for(const pr of S.projectiles){
    if(pr.delay>0){pr.delay-=dt;continue;}
    if(pr.cattail){
      pr.x+=(pr.vx||0)*dts;
      pr.y+=(pr.vy||0)*dts;
    }else{
      pr.x+=pr.vx*dts;
    }

    // Проверка попадания
    for(let zi=0;zi<S.zombies.length;zi++){
      const z=S.zombies[zi];
      if(z.hp<=0||z.hypnotized)continue;
      if(!pr.cattail&&z.row!==pr.row)continue;
      if(z.x>=YARD_RIGHT)continue;

      const zy=(z.y_air!==undefined&&z.falling)?z.y_air-20:cellCY(z.row)-20;
      if(Math.abs(pr.x-z.x)<28&&Math.abs(pr.y-zy)<55){
        z.hp-=pr.damage;
        z.hitFlash=180;
        if(pr.ice)z.slowTimer=5000;
        if(pr.icemelon){
          z.slowTimer=5000;
          z.frozenStop=true;
          setTimeout(()=>{z.frozenStop=false;},3000);
        }
        addParticles(pr.x,pr.y,4,
          pr.ice?'#4fc3f7':pr.spore?'#c8a2d8':pr.icemelon?'#4fc3f7':'#8bc34a',
          3,300,3);
        pr.dead=true;
        break;
      }
    }

    if(pr.x>W+40||pr.x>YARD_RIGHT+5)pr.dead=true;
    if(pr.y<-50||pr.y>H+50)pr.dead=true;
  }
  S.projectiles=S.projectiles.filter(p=>!p.dead);

  // ============================================================
  // СОЛНЦЕ И МОНЕТЫ
  // ============================================================
  for(const s of S.suns){
    s.life-=dt;
    if(s.y<s.targetY){
      s.y+=s.vy*dt*.06;
      if(s.y>s.targetY)s.y=s.targetY;
    }
  }
  S.suns=S.suns.filter(s=>s.life>0);

  for(const c of S.coinsOnGround){
    c.life-=dt;
    if(c.y<c.targetY){
      c.y+=c.vy*dt*.06;
      if(c.y>c.targetY)c.y=c.targetY;
    }
  }
  S.coinsOnGround=S.coinsOnGround.filter(c=>c.life>0);

  for(const c of S.craters)c.life-=dt;
  S.craters=S.craters.filter(c=>c.life>0);

  if(S.flash>0)S.flash=Math.max(0,S.flash-dt*.002);

  // ============================================================
  // ЗОМБИ
  // ============================================================
  for(const z of S.zombies){
    if(z.hp<=0){z.dyingTimer=(z.dyingTimer||0)+dt;continue;}
    if(z.hitFlash>0)z.hitFlash-=dt;
    if(z.slowTimer>0)z.slowTimer-=dt;
    if(z.garlicPushTimer>0)z.garlicPushTimer-=dt;
    z.walkPhase+=dt*.008;

    // Гипнотизированный — атакует своих
    if(z.hypnotized){
      z.x+=Math.abs(z.speed)*dts*.7;
      if(z.x>ROAD_RIGHT+50||z.x<GRID_X-50){
        z.hp=0;
        z.dyingTimer=800;
        continue;
      }
      for(const other of S.zombies){
        if(other===z||other.hypnotized||other.hp<=0)continue;
        if(other.row===z.row&&Math.abs(other.x-z.x)<40){
          z.attackTimer=(z.attackTimer||0)+dt;
          if(z.attackTimer>800){
            z.attackTimer=0;
            other.hp-=z.dmg;
          }
        }
      }
      continue;
    }

    const col=Math.floor((z.x-GRID_X)/CELL_W);
    const plant=getPlantAt(z.row,col);
    let attacking=false;

    // ===== ГРАБЛИ =====
    if(z.x<GRID_X+CELL_W&&S.rakes.length>0){
      for(let i=S.rakes.length-1;i>=0;i--){
        const rk=S.rakes[i];
        if(rk.row===z.row&&Math.abs(rk.x-z.x)<30){
          z.hp=0;
          z.dyingTimer=800;
          S.rakes.splice(i,1);
          S.rakesUsed=(S.rakesUsed||0)+1;
          addParticles(rk.x,rk.y,15,'#8d6e63',5,600,5);
          break;
        }
      }
    }

    // ===== СТОЛКНОВЕНИЕ С РАСТЕНИЕМ =====
    if(plant&&z.x<YARD_RIGHT&&z.x-cellCX(col)<38&&z.x-cellCX(col)>-15){
      if(plant.type==='hypnoshroom'){
        z.attackTimer=(z.attackTimer||0)+dt;
        if(z.attackTimer>800){
          z.attackTimer=0;
          plant.hp-=z.dmg;
          if(plant.hp<=0){
            z.hypnotized=true;
            z.hp=100;
            z.maxHp=100;
            z.attackTimer=0;
            S.hypnoCount=(S.hypnoCount||0)+1;
            addParticles(z.x,cellCY(z.row),20,'#e040a0',6,700,6);
            S.plants=S.plants.filter(p=>p!==plant);
            rebuildPlantCache();
          }
        }
        attacking=true;
      }
      else if(plant.type==='spikeweed'||plant.type==='iron_spike'){
        attacking=false; // Шипы не блокируют
      }
      else if(plant.type==='garlic'&&!(z.garlicPushTimer>0)){
        plant.hp-=z.dmg;
        if(plant.hp<=0){
          S.plants=S.plants.filter(p=>p!==plant);
          rebuildPlantCache();
        }
        let targetRow=z.row;
        const canUp=z.row>0;
        const canDown=z.row<ROWS-1;
        if(canUp&&canDown)targetRow=Math.random()<.5?z.row-1:z.row+1;
        else if(canUp)targetRow=z.row-1;
        else if(canDown)targetRow=z.row+1;
        if(targetRow!==z.row){
          z.row=targetRow;
          z.x+=15;
          z.garlicPushTimer=500;
          S.shake=5;
          S.garlicPushes=(S.garlicPushes||0)+1;
        }
        attacking=true;
      }
      else{
        attacking=true;
        z.attackTimer=(z.attackTimer||0)+dt;
        if(z.attackTimer>800){
          z.attackTimer=0;
          plant.hp-=z.dmg;
          if(plant.hp<=0){
            if((plant.type==='potato'||plant.type==='potatomine')&&plant.armed){
              explodePotato(plant);
            }
            S.plants=S.plants.filter(p=>p!==plant);
            rebuildPlantCache();
          }
        }
      }
    }

    // ===== ДВИЖЕНИЕ =====
    if(!attacking&&!z.falling){
      let speedMul=1;
      if(z.slowTimer>0)speedMul=.5;
      if(z.frozenStop)speedMul=0;
      z.x-=z.speed*speedMul*dts;
    }

    // ===== ПРОХОД В ДОМ → КОСИЛКА / ПОРАЖЕНИЕ =====
    if(z.x<GRID_X-15&&!z.falling){
      const mower=S.mowers[z.row];
      if(mower&&!mower.used){
        mower.used=true;
        mower.active=true;
        mower.x=GRID_X-30;
      }else{
        gameOver(false);
        return;
      }
    }

    // ===== ГАРГАНТЮА КИДАЕТ МИНИ-ЗОМБИ =====
    if(z.type==='gargantuar'&&!z.threwMinions&&z.hp<z.maxHp*.5){
      z.threwMinions=true;
      for(let i=0;i<3;i++){
        const row=Math.floor(Math.random()*ROWS);
        S.zombies.push({
          type:'minizombie',row,x:z.x-Math.random()*40,
          hp:50,maxHp:50,speed:22,dmg:60,
          walkPhase:Math.random()*Math.PI*2,
          slowTimer:0,hitFlash:0,dyingTimer:0,attackTimer:0,
          garlicPushTimer:0,hypnotized:false,y_air:undefined,falling:false,frozenStop:false,
        });
      }
      S.shake=15;
      addParticles(z.x,cellCY(z.row),25,'#7a3a8a',8,800,6);
    }
  }

  // ===== КОСИЛКИ =====
  for(const m of S.mowers){
    if(m.active){
      m.x+=700*dts;
      for(const z of S.zombies){
        if(z.row===m.row&&z.hp>0&&z.x<m.x+40&&z.x>m.x-60)z.hp=0;
      }
      if(m.x>W+60)m.active=false;
    }
  }

  // ===== СЧЁТ УБИЙСТВ + МОНЕТЫ ЗА ЗОМБИ =====
  for(const z of S.zombies){
    if(z.hp<=0&&!z._deadCounted){
      z._deadCounted=true;
      S.totalZombiesDead++;
      S.killedZombies++;
      const def=ZOMBIE_TYPES[z.type];
      if(def&&def.coins){
        S.coins+=def.coins;
        S.totalCoinsEarned+=def.coins;
      }
    }
  }
  S.zombies=S.zombies.filter(z=>!(z.hp<=0&&z.dyingTimer>800));

  // ===== ЧАСТИЦЫ =====
  for(const p of S.particles){
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=p.gravity;
    p.vx*=.98;
    p.life-=dt;
  }
  S.particles=S.particles.filter(p=>p.life>0);

  // ============================================================
  // СПАВН ЗОМБИ ПО ВОЛНАМ
  // ============================================================
  const totalWaves=S.currentLevel.waves||5;
  S.zombieSpawnTimer+=dt;
  const spawnInterval=S.currentLevel.spawnInterval||5000;
  let effectiveInterval=spawnInterval;
  if(S.minigameFlags.endless){
    effectiveInterval=Math.max(800,spawnInterval*Math.pow(.92,S.currentWave-1));
  }

  if(S.minigameFlags.endless||S.minigameFlags.sunny){
    // Бесконечный/солнечный режим — просто спавн
    const aliveZ=S.zombies.filter(z=>z.hp>0).length;
    if(aliveZ<MAX_ALIVE_ZOMBIES&&S.zombieSpawnTimer>effectiveInterval){
      S.zombieSpawnTimer=0;
      spawnZombie();
    }
  }else if(S.betweenWaves){
    S.betweenWavesTimer-=dt;
    if(S.betweenWavesTimer<=0){
      S.betweenWaves=false;
      if(S.currentWave<totalWaves)startWave(S.currentWave+1);
    }
  }else{
    const aliveZ=S.zombies.filter(z=>z.hp>0&&z.type!=='zomboss'&&z.type!=='gargantuar').length;
    if(S.waveZombiesRemaining>0&&aliveZ<MAX_ALIVE_ZOMBIES&&S.zombieSpawnTimer>effectiveInterval){
      S.zombieSpawnTimer=0;
      spawnZombie();
      S.waveZombiesRemaining--;
    }
    const noWaveSpawnRemaining=S.waveZombiesRemaining<=0;
    const aliveInWave=S.zombies.filter(z=>z.hp>0&&z.type!=='zomboss'&&z.type!=='gargantuar').length;
    if(noWaveSpawnRemaining&&aliveInWave===0&&S.currentWave<totalWaves){
      S.betweenWaves=true;
      S.betweenWavesTimer=4000;
      S.zombieSpawnTimer=0;
    }
  }

  // ============================================================
  // СПАВН БОССА (исправлен)
  // ============================================================
  if(S.currentLevel.boss&&!S.bossSpawned&&S.currentWave===totalWaves&&
     (S.spawnedZombies>=S.totalZombies-1||S.waveZombiesRemaining<=0)){
    S.bossSpawned=true;
    const row=Math.floor(Math.random()*ROWS);
    const bossType=S.currentLevel.boss;
    const def=ZOMBIE_TYPES[bossType];
    S.zombies.push({
      type:bossType,row,x:ZOMBIE_SPAWN_X+40,
      hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,
      walkPhase:0,slowTimer:0,hitFlash:0,dyingTimer:0,attackTimer:0,
      garlicPushTimer:0,hypnotized:false,y_air:undefined,falling:false,frozenStop:false,
      threwMinions:false,
    });
    S.shake=30;
  }

  // ===== ГРАВИТАЦИЯ (мини-игра) =====
  if(S.minigameFlags.gravity){
    for(const z of S.zombies){
      if(z.falling&&z.y_air!==undefined){
        z.y_air+=400*dts;
        const groundY=cellCY(z.row);
        if(z.y_air>=groundY){
          z.y_air=groundY;
          z.falling=false;
          S.shake=4;
        }
      }
    }
  }

  // ============================================================
  // ПРОГРЕСС
  // ============================================================
  S.levelProgress=clamp(
    (S.currentWave-1)/totalWaves+
    (S.waveZombiesPerWave>0?(1-S.waveZombiesRemaining/S.waveZombiesPerWave)/totalWaves:0),
    0,1
  );

  // ============================================================
  // ПОБЕДА / МИНИ-ИГРЫ
  // ============================================================
  if(S.minigameFlags.sunny&&S.sun>=500){
    S.minigameScore=Math.floor(S.sun);
    gameOver(true);
  }
  else if(S.minigameFlags.endless&&S.currentWave>20){
    S.minigameScore=S.killedZombies;
    gameOver(true);
  }
  else{
    const allSpawned=S.spawnedZombies>=S.totalZombies;
    const bossKilled=!S.currentLevel.boss||
      (S.bossSpawned&&!S.zombies.some(z=>z.type===S.currentLevel.boss&&z.hp>0));
    const noAlive=!S.zombies.some(z=>z.hp>0);
    const noDying=!S.zombies.some(z=>z.hp<=0&&(z.dyingTimer||0)<800);
    if(allSpawned&&bossKilled&&noAlive&&noDying&&S.currentWave>=totalWaves){
      gameOver(true);
    }
  }

  // ===== SHAKE =====
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*.02);

  // ===== БЫСТРАЯ ПРОВЕРКА ДОСТИЖЕНИЙ =====
  if(Math.floor(S.time/1000)!==Math.floor((S.time-dt)/1000)){
    checkAchievements();
  }
}

function startLevel(level){
  ROWS=level.rows||5;
  ROW_START=level.rowsOffset||0;
  S.dayNight=level.time||'day';
  S.location=level.location||'yard';
  bgCacheKey='';
  bushesCacheKey='';
  ensureBackgrounds();
  ensureBushes();

  S.currentLevel=level;
  S.scene='playing';
  S.sun=75;
  S.plants=[];
  S.zombies=[];
  S.projectiles=[];
  S.suns=[];
  S.coinsOnGround=[];
  S.particles=[];
  S.craters=[];
  S.rakes=[];
  S.flash=0;
  S.selectedSeed=null;
  S.shovelSelected=false;
  S.gloveSelected=false;
  S.gloveHolding=null;
  S.cooldowns={};
  S.sunTimer=0;
  S.zombieSpawnTimer=0;
  S.spawnedZombies=0;
  S.killedZombies=0;
  S.totalZombiesDead=0;
  S.totalZombies=level.totalZombies;
  S.spawnInterval=level.spawnInterval;
  S.currentWave=0;
  S.gameOver=false;
  S.won=false;
  S.shake=0;
  S.levelProgress=0;
  S.bossSpawned=false;
  S.plantedThisLevel=0;
  S.usedShovelThisLevel=0;
  S.garlicPushes=0;
  S.hypnoCount=0;
  S.rakesUsed=0;
  S.levelStartTime=S.time;
  S.minigameTime=0;
  S.boosterTimer=0;
  S.mowers=[];
  S.magnetActive=false;
  S.seedSelectMaxSlots=6+(S.extraSlots||0);
  S.ironSpikeOwned=S.ownedItems.includes('spikeweed_iron');

  // Косилки
  for(let r=0;r<ROWS;r++){
    const isPool=(S.location==='pool'||S.location==='nightpool')&&r>=2&&r<4;
    S.mowers.push({
      row:r,
      x:GRID_X-32,
      used:false,
      active:false,
      isPool:isPool,
    });
  }

  // Грабли — если куплены
  if(S.ownedItems.includes('rake')){
    S.rakes.push({
      row:Math.floor(ROWS/2),
      x:GRID_X+CELL_W/2,
      y:cellCY(Math.floor(ROWS/2)),
    });
  }

  // Стартовое солнце
  for(let i=0;i<2;i++){
    const x=rand(GRID_X+40,GRID_X+GRID_W-40);
    const y=rand(activeTop()+40,activeBottom()-40);
    S.suns.push({
      x,y,targetY:y,life:12000,maxLife:12000,vy:0,
      phase:Math.random()*10,value:25
    });
  }

  S.waveBannerTimer=0;
  S.betweenWaves=true;
  S.betweenWavesTimer=2000;
  S.waveZombiesRemaining=0;
  S.waveZombiesPerWave=0;
  rebuildPlantCache();
}

function startMinigame(mg){
  S.minigameType=mg.id;
  S.minigameScore=0;
  S.minigameTime=0;
  S.minigameFlags={endless:false,sunny:false,gravity:false};
  if(mg.config.endless)S.minigameFlags.endless=true;
  if(mg.config.sunny)S.minigameFlags.sunny=true;
  if(mg.config.gravity)S.minigameFlags.gravity=true;

  const lvl={
    id:-1,
    name:mg.name.slice(0,6),
    location:'yard',
    rows:5,
    rowsOffset:0,
    time:'day',
    seeds:mg.config.seeds||['peashooter','sunflower','wallnut'],
    totalZombies:mg.config.endless?9999:30,
    spawnInterval:mg.config.spawnRate||5000,
    types:['basic','cone','bucket','flag','football','dancer'],
    waves:mg.config.endless?999:5,
    desc:mg.name,
    reward:null,
  };

  startLevel(lvl);
  S.minigameType=mg.id;
}

// ============================================================
// СТАРТ УРОВНЯ С ВЫБОРОМ СЕМЯН
// ============================================================
function startLevelWithSeedSelect(level){
  S.currentLevel=level;
  S.seedSelectMode=true;

  const ownedAvailable=S.ownedPlants.slice();
  const prioritySeeds=[];
  for(const lvl of LEVELS){
    for(const s of lvl.seeds){
      if(ownedAvailable.includes(s)&&!prioritySeeds.includes(s))prioritySeeds.push(s);
    }
  }
  for(const s of ownedAvailable){
    if(!prioritySeeds.includes(s))prioritySeeds.push(s);
  }

  // Фильтруем только существующие растения
  S.seedSelectAvailable=prioritySeeds.filter(s=>ALL_PLANTS[s]);

  const preChosen=[];
  const maxSlots=6+(S.extraSlots||0);
  for(const s of level.seeds){
    if(S.ownedPlants.includes(s)&&preChosen.length<maxSlots)preChosen.push(s);
  }
  for(const s of S.seedSelectAvailable){
    if(preChosen.length>=maxSlots)break;
    if(!preChosen.includes(s))preChosen.push(s);
  }
  S.seedSelectChosen=preChosen;
  S.scene='seedselect';
}

// ==================== ПОЛУЧЕНИЕ ПОЗИЦИИ МЫШИ ====================
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  return{
    x:(e.clientX-rect.left)*(W/rect.width),
    y:(e.clientY-rect.top)*(H/rect.height)
  };
}

// ==================== МЫШЬ ====================
canvas.addEventListener('mousemove',(e)=>{
  const p=getPos(e);
  S.cursorX=p.x;
  S.cursorY=p.y;
});

canvas.addEventListener('mouseleave',()=>{
  S.cursorX=-1;
  S.cursorY=-1;
});

// ==================== КОЛЕСО ====================
canvas.addEventListener('wheel',(e)=>{
  if(S.scene==='achievements'){
    S.achScroll=clamp(S.achScroll+e.deltaY*.5,0,S.achScrollMax);
    e.preventDefault();
  }else if(S.scene==='credits'){
    S.creditsScroll=clamp((S.creditsScroll||0)+e.deltaY*.5,0,S.creditsMax||0);
    e.preventDefault();
  }
},{passive:false});

// ==================== КЛИК ====================
canvas.addEventListener('click',(e)=>{
  try{
    const p=getPos(e);
    const x=p.x;
    const y=p.y;

    // ============================================================
    // МАГАЗИН
    // ============================================================
    if(S.scene==='shop'){
      // Назад
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&
         y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';
        return;
      }
      // Сброс растений
      if(S.resetPlantsBtn&&x>=S.resetPlantsBtn.x&&x<=S.resetPlantsBtn.x+S.resetPlantsBtn.w&&
         y>=S.resetPlantsBtn.y&&y<=S.resetPlantsBtn.y+S.resetPlantsBtn.h){
        resetPlants();
        return;
      }
      // Клик по Дейву — смена фразы
      if(x>=60&&x<=240&&y>=H-450&&y<=H-160){
        S.shopDavespeech=DAVE_PHRASES[Math.floor(Math.random()*DAVE_PHRASES.length)];
        return;
      }
      // ПРЕД
      if(S.shopPageBtns.prev){
        const b=S.shopPageBtns.prev;
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
          S.shopPage=(S.shopPage-1+SHOP_PAGES.length)%SHOP_PAGES.length;
          return;
        }
      }
      // СЛЕД
      if(S.shopPageBtns.next){
        const b=S.shopPageBtns.next;
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
          S.shopPage=(S.shopPage+1)%SHOP_PAGES.length;
          return;
        }
      }
      // Карточки товаров
      for(const c of S.shopCards){
        if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
          if(!c.owned&&c.canAfford)buyShopItem(c);
          else if(!c.canAfford&&!c.owned)showSaveToast('❌ Не хватает монет!');
          return;
        }
      }
      return;
    }

    // ============================================================
    // МИНИ-ИГРЫ
    // ============================================================
    if(S.scene==='minigames'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&
         y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';
        return;
      }
      for(const c of S.minigameCards){
        if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
          startMinigame(c.minigame);
          return;
        }
      }
      return;
    }

    // ============================================================
    // ДОСТИЖЕНИЯ
    // ============================================================
    if(S.scene==='achievements'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&
         y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';
        return;
      }
      return;
    }

    // ============================================================
    // ТИТРЫ
    // ============================================================
    if(S.scene==='credits'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&
         y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';
        return;
      }
      return;
    }

    // ============================================================
    // ВЫБОР СЕМЯН
    // ============================================================
    if(S.scene==='seedselect'){
      // Назад
      if(S.seedSelectBackBtn&&
         x>=S.seedSelectBackBtn.x&&x<=S.seedSelectBackBtn.x+S.seedSelectBackBtn.w&&
         y>=S.seedSelectBackBtn.y&&y<=S.seedSelectBackBtn.y+S.seedSelectBackBtn.h){
        S.scene='levelselect';
        return;
      }
      // В БОЙ
      if(S.seedSelectStartBtn&&S.seedSelectStartBtn.enabled&&
         x>=S.seedSelectStartBtn.x&&x<=S.seedSelectStartBtn.x+S.seedSelectStartBtn.w&&
         y>=S.seedSelectStartBtn.y&&y<=S.seedSelectStartBtn.y+S.seedSelectStartBtn.h){
        const lvl=S.currentLevel;
        lvl.seeds=[...S.seedSelectChosen];
        S.seedSelectMode=false;
        startLevel(lvl);
        return;
      }
      // Клик по слоту — убрать растение
      const slotSize=80,slotGap=10;
      const maxSlots=Math.min(S.seedSelectMaxSlots,10);
      const slotRowW=maxSlots*slotSize+(maxSlots-1)*slotGap;
      const slotRowX=(W-slotRowW)/2;
      const slotRowY=150;
      for(let i=0;i<maxSlots;i++){
        const sx=slotRowX+i*(slotSize+slotGap);
        if(x>=sx&&x<=sx+slotSize&&y>=slotRowY&&y<=slotRowY+slotSize){
          if(S.seedSelectChosen[i])S.seedSelectChosen.splice(i,1);
          return;
        }
      }
      // Клик по доступному растению
      for(const c of S.seedSelectCardRects){
        if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
          const idx=S.seedSelectChosen.indexOf(c.seedId);
          if(idx>=0)S.seedSelectChosen.splice(idx,1);
          else if(S.seedSelectChosen.length<maxSlots)S.seedSelectChosen.push(c.seedId);
          return;
        }
      }
      return;
    }

    // ============================================================
    // ГЛАВНОЕ МЕНЮ
    // ============================================================
    if(S.scene==='menu'){
      // СБРОС
      if(S.resetBtn&&x>=S.resetBtn.x&&x<=S.resetBtn.x+S.resetBtn.w&&
         y>=S.resetBtn.y&&y<=S.resetBtn.y+S.resetBtn.h){
        resetProgress();
        return;
      }
      // МАГАЗИН
      if(S.shopMenuBtn&&x>=S.shopMenuBtn.x&&x<=S.shopMenuBtn.x+S.shopMenuBtn.w&&
         y>=S.shopMenuBtn.y&&y<=S.shopMenuBtn.y+S.shopMenuBtn.h){
        S.shopPage=0;
        S.scene='shop';
        S.shopDavespeech=DAVE_PHRASES[Math.floor(Math.random()*DAVE_PHRASES.length)];
        return;
      }
      // ОБ ИГРЕ
      if(S.creditsBtn&&x>=S.creditsBtn.x&&x<=S.creditsBtn.x+S.creditsBtn.w&&
         y>=S.creditsBtn.y&&y<=S.creditsBtn.y+S.creditsBtn.h){
        S.creditsScroll=0;
        S.scene='credits';
        return;
      }
      // ДОСТИЖЕНИЯ
      if(S.achMenuBtn&&x>=S.achMenuBtn.x&&x<=S.achMenuBtn.x+S.achMenuBtn.w&&
         y>=S.achMenuBtn.y&&y<=S.achMenuBtn.y+S.achMenuBtn.h){
        S.achScroll=0;
        S.scene='achievements';
        return;
      }
      // МИНИ-ИГРЫ
      if(S.menuMinigameBtn&&x>=S.menuMinigameBtn.x&&x<=S.menuMinigameBtn.x+S.menuMinigameBtn.w&&
         y>=S.menuMinigameBtn.y&&y<=S.menuMinigameBtn.y+S.menuMinigameBtn.h){
        S.scene='minigames';
        return;
      }
      // FULLSCREEN
      if(S.fullscreenBtn&&x>=S.fullscreenBtn.x&&x<=S.fullscreenBtn.x+S.fullscreenBtn.w&&
         y>=S.fullscreenBtn.y&&y<=S.fullscreenBtn.y+S.fullscreenBtn.h){
        try{
          if(!document.fullscreenElement){
            if(document.documentElement.requestFullscreen){
              document.documentElement.requestFullscreen().catch(()=>{});
            }
          }else{
            if(document.exitFullscreen){
              document.exitFullscreen().catch(()=>{});
            }
          }
        }catch(err){}
        return;
      }
      // ИГРАТЬ
      if(S.menuBtn&&x>=S.menuBtn.x&&x<=S.menuBtn.x+S.menuBtn.w&&
         y>=S.menuBtn.y&&y<=S.menuBtn.y+S.menuBtn.h){
        S.scene='levelselect';
        return;
      }
      return;
    }

    // ============================================================
    // ВЫБОР УРОВНЯ
    // ============================================================
    if(S.scene==='levelselect'){
      if(S.backBtn&&x>=S.backBtn.x&&x<=S.backBtn.x+S.backBtn.w&&
         y>=S.backBtn.y&&y<=S.backBtn.y+S.backBtn.h){
        S.scene='menu';
        return;
      }
      for(const n of S.levelNodes){
        if(x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h){
          startLevelWithSeedSelect(n.level);
          return;
        }
      }
      return;
    }

    // ============================================================
    // ЭКРАН ПОРАЖЕНИЯ/ПОБЕДЫ
    // ============================================================
    if(S.scene==='playing'&&S.gameOver){
      saveProgress(true);
      S.scene='levelselect';
      S.gameOver=false;
      S.minigameType=null;
      S.minigameFlags={endless:false,sunny:false,gravity:false};
      return;
    }

    // ============================================================
    // ИГРОВАЯ СЦЕНА
    // ============================================================
    if(S.scene!=='playing'||S.gameOver)return;

    // ===== КЛИК ПО МОНЕТКЕ =====
    for(let i=S.coinsOnGround.length-1;i>=0;i--){
      const c=S.coinsOnGround[i];
      if(dist(c.x,c.y,x,y)<32){
        S.coins+=c.value||10;
        S.totalCoinsEarned+=c.value||10;
        addParticles(c.x,c.y,8,'#ffd700',4,500,4);
        S.coinsOnGround.splice(i,1);
        return;
      }
    }

    // ===== КЛИК ПО СОЛНЦУ =====
    for(let i=S.suns.length-1;i>=0;i--){
      const s=S.suns[i];
      if(s.life<=0)continue;
      if(dist(s.x,s.y,x,y)<40){
        S.sun=Math.max(0,Math.floor((S.sun||0)+(s.value||25)));
        addParticles(s.x,s.y,6,'#ffeb3b',4,400,4);
        S.suns.splice(i,1);
        return;
      }
    }

    // ===== HUD: СЕМЕНА =====
    const panelY=8;
    const packetW=62;
    const packetH=84;
    const sunW=78;
    const startX=8+sunW+20;
    const seeds=S.currentLevel.seeds;

    for(let i=0;i<seeds.length;i++){
      const sx=startX+i*(packetW+4);
      if(x>=sx&&x<=sx+packetW&&y>=panelY&&y<=panelY+packetH){
        const seed=ALL_PLANTS[seeds[i]];
        if(!seed)return;
        const cd=S.cooldowns[seed.id]||0;
        const awake=isPlantAwake(seed.id);
        if(cd>0||S.sun<seed.cost||!awake)return;
        S.selectedSeed=(S.selectedSeed===seed.id)?null:seed.id;
        S.shovelSelected=false;
        S.gloveSelected=false;
        return;
      }
    }

    // ===== HUD: ЛОПАТА =====
    const shX=startX+seeds.length*(packetW+4)+4;
    if(x>=shX&&x<=shX+packetW&&y>=panelY&&y<=panelY+packetH){
      S.shovelSelected=!S.shovelSelected;
      S.selectedSeed=null;
      S.gloveSelected=false;
      return;
    }

    // ===== HUD: ПЕРЧАТКА =====
    const glX=shX+packetW+4;
    if(S.ownedItems.includes('glove')&&
       x>=glX&&x<=glX+packetW&&y>=panelY&&y<=panelY+packetH){
      S.gloveSelected=!S.gloveSelected;
      S.selectedSeed=null;
      S.shovelSelected=false;

      // Если в руке было растение — вернуть его на поле
      if(S.gloveHolding){
        const freeCell={row:S.gloveHolding.row,col:S.gloveHolding.col};
        if(!getPlantAt(freeCell.row,freeCell.col)){
          S.plants.push(S.gloveHolding);
        }else{
          let placed=false;
          for(let r=0;r<ROWS&&!placed;r++){
            for(let c=0;c<COLS&&!placed;c++){
              if(!getPlantAt(r,c)){
                S.gloveHolding.row=r;
                S.gloveHolding.col=c;
                S.plants.push(S.gloveHolding);
                placed=true;
              }
            }
          }
        }
        S.gloveHolding=null;
        rebuildPlantCache();
      }
      return;
    }

    // ===== HUD: MENU =====
    if(x>=W-130&&x<=W-8&&y>=panelY&&y<=panelY+40){
      saveProgress(true);
      S.scene='levelselect';
      S.gameOver=false;
      S.minigameType=null;
      S.minigameFlags={endless:false,sunny:false,gravity:false};
      return;
    }

    // ===== КЛИК ПО СЕТКЕ =====
    const col=Math.floor((x-GRID_X)/CELL_W);
    const row=Math.floor((y-activeTop())/CELL_H);
    if(col<0||col>=COLS||row<0||row>=ROWS)return;

    // ===== ПЕРЧАТКА: взять/положить =====
    if(S.gloveSelected){
      const plant=getPlantAt(row,col);
      if(S.gloveHolding){
        if(!plant){
          S.gloveHolding.row=row;
          S.gloveHolding.col=col;
          S.plants.push(S.gloveHolding);
          S.gloveHolding=null;
          rebuildPlantCache();
        }
        return;
      }else{
        if(plant){
          S.gloveHolding=plant;
          S.plants=S.plants.filter(p=>p!==plant);
          rebuildPlantCache();
        }
        return;
      }
    }

    // ===== ЛОПАТА: убрать растение =====
    if(S.shovelSelected){
      const plant=getPlantAt(row,col);
      if(plant){
        S.plants=S.plants.filter(p=>p!==plant);
        rebuildPlantCache();
        S.usedShovelThisLevel=(S.usedShovelThisLevel||0)+1;
        addParticles(cellCX(col),cellCY(row),10,'#8bc34a',3,400,4);
      }
      return;
    }

    // ===== ПОСАДКА =====
    if(S.selectedSeed){
      const seed=ALL_PLANTS[S.selectedSeed];
      if(!seed)return;
      if(S.sun<seed.cost||(S.cooldowns[seed.id]||0)>0)return;
      if(!isPlantAwake(seed.id))return;
      if(getPlantAt(row,col))return;
      if(S.craters.find(c=>c.row===row&&c.col===col))return;

      // Проверка воды
      const isPoolCell=(S.location==='pool'||S.location==='nightpool')&&row>=2&&row<4;
      const waterOnly=['lilypad','tanglekelp','cattail','catmushroom'];
      if(waterOnly.includes(seed.id)&&!isPoolCell){
        showSaveToast('🌊 Только в воду!');
        return;
      }

      S.sun-=seed.cost;
      S.cooldowns[seed.id]=seed.cd;
      S.plantedThisLevel++;

      const isExplosive=seed.explode!==undefined||seed.freezeAll||seed.fullScreen;
      const newPlant={
        type:seed.id,
        row,
        col,
        hp:seed.hp,
        maxHp:seed.hp,
        sunTimer:0,
        shootTimer:0,
        armTimer:0,
        armed:false,
        born:S.time,
        chewing:false,
        chewTimer:0,
        used:false,
      };
      if(isExplosive){
        newPlant.growTimer=0;
        newPlant.fuseDuration=seed.fuse||3000;
      }
      S.plants.push(newPlant);
      rebuildPlantCache();
      addParticles(cellCX(col),cellCY(row)+20,4,'#8bc34a',3,300,3);
      S.selectedSeed=null;
    }
  }catch(err){
    console.error('Click error:',err);
  }
});

// ==================== КЛАВИАТУРА ====================
document.addEventListener('keydown',(e)=>{
  if(S.scene!=='playing'||S.gameOver)return;

  // ESC — отмена выбора
  if(e.key==='Escape'){
    S.selectedSeed=null;
    S.shovelSelected=false;
    S.gloveSelected=false;
    if(S.gloveHolding){
      if(!getPlantAt(S.gloveHolding.row,S.gloveHolding.col)){
        S.plants.push(S.gloveHolding);
      }
      S.gloveHolding=null;
      rebuildPlantCache();
    }
  }

  // 1-9 — выбор семени
  const n=parseInt(e.key);
  if(n>=1&&n<=S.currentLevel.seeds.length){
    const seed=ALL_PLANTS[S.currentLevel.seeds[n-1]];
    if(!seed)return;
    const cd=S.cooldowns[seed.id]||0;
    if(cd<=0&&S.sun>=seed.cost&&isPlantAwake(seed.id)){
      S.selectedSeed=S.selectedSeed===seed.id?null:seed.id;
      S.shovelSelected=false;
      S.gloveSelected=false;
    }
  }
});

// ============================================================
// RENDER
// ============================================================
function render(){
  // Защита от NaN
  if(!Number.isFinite(S.sun))S.sun=75;
  if(!Number.isFinite(S.shake))S.shake=0;
  if(!Number.isFinite(S.time))S.time=0;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;

  ctx.save();
  if(S.shake>0)ctx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));
  ctx.clearRect(-50,-50,W+100,H+100);

  try{
    if(S.scene==='menu')drawMenu();
    else if(S.scene==='shop'){
      drawShop();
      drawShopCards();
    }
    else if(S.scene==='levelselect')drawLevelSelect();
    else if(S.scene==='seedselect')drawSeedSelect();
    else if(S.scene==='minigames')drawMinigameMenu();
    else if(S.scene==='achievements')drawAchievements();
    else if(S.scene==='credits')drawCredits();
    else{
      // playing
      drawGameScene();

      if(S.gameOver){
        // Затемнение
        ctx.fillStyle='rgba(0,0,0,.7)';
        ctx.fillRect(0,0,W,H);
        ctx.textAlign='center';
        ctx.textBaseline='middle';

        if(S.won){
          // ЗАГОЛОВОК
          ctx.font='bold 72px Impact, Arial Black, sans-serif';
          ctx.strokeStyle='#000';
          ctx.lineWidth=8;
          ctx.strokeText('УРОВЕНЬ ПРОЙДЕН!',W/2,H/2-120);
          const tg=ctx.createLinearGradient(0,H/2-160,0,H/2-80);
          tg.addColorStop(0,'#ffffff');
          tg.addColorStop(.5,'#ffe082');
          tg.addColorStop(1,'#ffb300');
          ctx.fillStyle=tg;
          ctx.fillText('УРОВЕНЬ ПРОЙДЕН!',W/2,H/2-120);

          // ЗВЁЗДЫ
          const stars=S.currentLevel.id>0?(S.levelStars[S.currentLevel.id]||0):3;
          for(let i=0;i<3;i++){
            ctx.fillStyle=i<stars?'#ffeb3b':'rgba(255,255,255,.2)';
            const sx=W/2-100+i*100;
            const sy=H/2-10;
            const r=40;
            ctx.beginPath();
            for(let j=0;j<10;j++){
              const a=(j/10)*Math.PI*2-Math.PI/2;
              const rad=j%2===0?r:r*.5;
              const px=sx+Math.cos(a)*rad;
              const py=sy+Math.sin(a)*rad;
              if(j===0)ctx.moveTo(px,py);
              else ctx.lineTo(px,py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#000';
            ctx.lineWidth=3;
            ctx.stroke();
          }

          // НАГРАДА
          if(S.currentLevel.reward&&S.ownedPlants.includes(S.currentLevel.reward)){
            ctx.fillStyle='#8bc34a';
            ctx.font='bold 26px Impact, Arial Black, sans-serif';
            ctx.fillText('🎁 Награда: '+ALL_PLANTS[S.currentLevel.reward].name,W/2,H/2+70);
          }

          // СЧЁТ В МИНИ-ИГРЕ
          if(S.minigameType){
            ctx.fillStyle='#ffeb3b';
            ctx.font='bold 28px Arial';
            ctx.fillText('🏅 Счёт: '+S.minigameScore,W/2,H/2+100);
          }

          ctx.fillStyle='#fff';
          ctx.font='bold 26px Arial';
          ctx.fillText('Кликните для продолжения',W/2,H/2+150);
        }else{
          // ПОРАЖЕНИЕ
          ctx.font='bold 72px Impact, Arial Black, sans-serif';
          ctx.fillStyle='#f44336';
          ctx.strokeStyle='#000';
          ctx.lineWidth=8;
          ctx.strokeText('ПОРАЖЕНИЕ',W/2,H/2-40);
          ctx.fillText('ПОРАЖЕНИЕ',W/2,H/2-40);

          ctx.fillStyle='#fff';
          ctx.font='bold 26px Arial';
          ctx.fillText('Кликните, чтобы попробовать снова',W/2,H/2+40);
        }
      }
    }
  }catch(err){
    console.error('Render error:',err);
  }
  ctx.restore();

  // ===== ВСПЫШКА =====
  if(S.flash>0){
    ctx.fillStyle=`rgba(255,255,255,${S.flash*.9})`;
    ctx.fillRect(0,0,W,H);
  }

  // ===== ТОСТЫ ДОСТИЖЕНИЙ (поверх всего) =====
  drawAchievementToasts();
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
let _loopErrLogged=false;
let _wasHidden=false;

function loop(now){
  try{
    // Пауза когда вкладка свёрнута
    if(document.hidden){
      _wasHidden=true;
      S.lastTime=now;
      requestAnimationFrame(loop);
      return;
    }
    if(_wasHidden){
      _wasHidden=false;
      S.lastTime=now;
    }

    let dt=now-S.lastTime;
    if(dt>100)dt=50;
    S.lastTime=now;
    S.time+=dt;
    if(!Number.isFinite(S.time))S.time=0;

    // Update
    if(S.scene==='playing'&&!S.gameOver){
      update(dt);
    }else if(S.shake>0){
      S.shake=Math.max(0,S.shake-dt*.02);
    }

    // Render
    render();
  }catch(err){
    if(!_loopErrLogged){
      console.error('Loop error:',err);
      _loopErrLogged=true;
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(loop);
}

// ============================================================
// СТАРТ
// ============================================================
loadProgress();
requestAnimationFrame(loop);

})();
</script>
