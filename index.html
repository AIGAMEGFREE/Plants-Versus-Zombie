// Полифилл roundRect для старых браузеров
if(!ctx.roundRect){
  ctx.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r=[r,r,r,r];
    if(!Array.isArray(r))r=[0,0,0,0];
    if(r.length===1)r=[r[0],r[0],r[0],r[0]];
    if(r.length===2)r=[r[0],r[1],r[0],r[1]];
    let[tl,tr,br,bl]=r;
    tl=Math.min(tl,w/2,h/2);tr=Math.min(tr,w/2,h/2);
    br=Math.min(br,w/2,h/2);bl=Math.min(bl,w/2,h/2);
    this.beginPath();this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+tr);this.lineTo(x+w,y+h-br);
    this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);this.lineTo(x+bl,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-bl);this.lineTo(x,y+tl);
    this.quadraticCurveTo(x,y,x+tl,y);this.closePath();return this;
  };
}

const cellCY=r=>GRID_Y+(ROW_START+r)*CELL_H+CELL_H/2;
const activeTop=()=>GRID_Y+ROW_START*CELL_H;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);

function addParticles(x,y,count,color,speed=4,life=600,size=4){
  if(S.particles.length>200)return;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=rand(speed*.3,speed);
    S.particles.push({
      x,y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s-1,
      life,maxLife:life,
      color,
      size:rand(size*.5,size*1.5),
      gravity:.12
    });
  }
}

function rebuildPlantCache(){
  S.plantsByCell={};
  for(const p of S.plants){
    S.plantsByCell[p.row+'_'+p.col]=p;
  }
}

function getPlantAt(row,col){
  return S.plantsByCell[row+'_'+col]||null;
}

// ===== ПРОВЕРКА СНА (для ночных растений) =====
function isPlantAwake(type){
  const p=ALL_PLANTS[type];
  if(!p)return true;
  if(p.sleep==='both')return true;
  if(S.location==='roof')return true;
  return p.sleep===S.dayNight;
}

function saveProgress(silent=false){
  try{
    const data={
      version:40,
      unlocked:S.unlockedLevels,
      stars:S.levelStars,
      totalKills:S.totalKillsEver,
      totalWins:S.totalWinsEver,
      achievements:S.achievements,
      minigameBest:S.minigameBest,
      coins:S.coins,
      totalCoinsEarned:S.totalCoinsEarned,
      ownedPlants:S.ownedPlants,
      ownedItems:S.ownedItems,
      extraSlots:S.extraSlots||0,
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    if(!silent)showSaveToast('💾 Прогресс сохранён');
    return true;
  }catch(e){
    console.error('Save error:',e);
    return false;
  }
}

function loadProgress(){
  try{
    let raw=localStorage.getItem(SAVE_KEY);
    if(!raw){
      for(const k of LEGACY_SAVE_KEYS){
        raw=localStorage.getItem(k);
        if(raw)break;
      }
    }
    if(!raw)return;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object')return;

    if(typeof d.unlocked==='number'&&d.unlocked>0)S.unlockedLevels=d.unlocked;
    if(d.stars&&typeof d.stars==='object')S.levelStars=d.stars;
    if(typeof d.totalKills==='number')S.totalKillsEver=d.totalKills;
    if(typeof d.totalWins==='number')S.totalWinsEver=d.totalWins;
    if(d.achievements)S.achievements=d.achievements;
    if(d.minigameBest)S.minigameBest=d.minigameBest;
    if(typeof d.coins==='number')S.coins=d.coins;
    if(typeof d.totalCoinsEarned==='number')S.totalCoinsEarned=d.totalCoinsEarned;
    if(typeof d.extraSlots==='number')S.extraSlots=d.extraSlots;

    // Базовые растения всегда в наличии
    const basePlants=['peashooter','sunflower'];
    if(Array.isArray(d.ownedPlants)){
      S.ownedPlants=[...new Set([...basePlants,...d.ownedPlants])];
    }else{
      S.ownedPlants=[...basePlants];
    }
    if(Array.isArray(d.ownedItems))S.ownedItems=[...new Set(d.ownedItems)];

    S.seedSelectMaxSlots=6+(S.extraSlots||0);
    S.ironSpikeOwned=S.ownedItems.includes('spikeweed_iron');
  }catch(e){
    console.error('Load error:',e);
  }
}

function resetProgress(){
  if(!confirm('Сбросить ВЕСЬ прогресс?'))return;
  try{
    for(const k of[SAVE_KEY,...LEGACY_SAVE_KEYS]){
      try{localStorage.removeItem(k);}catch(e){}
    }
  }catch(e){}
  S.unlockedLevels=1;
  S.levelStars={};
  S.totalKillsEver=0;
  S.totalWinsEver=0;
  S.achievements={};
  S.minigameBest={};
  S.coins=0;
  S.totalCoinsEarned=0;
  S.ownedPlants=['peashooter','sunflower'];
  S.ownedItems=[];
  S.extraSlots=0;
  S.seedSelectMaxSlots=6;
  S.ironSpikeOwned=false;
  showSaveToast('🗑 Прогресс сброшен');
}

function resetPlants(){
  if(!confirm('Сбросить список растений к базовым?\n\nГорохострел и Подсолнух останутся.'))return;
  S.ownedPlants=['peashooter','sunflower'];
  S.seedSelectMaxSlots=6+(S.extraSlots||0);
  saveProgress(true);
  showSaveToast('🌱 Растения сброшены');
}

// ===== НЕБО =====
function drawSky(g,isNight){
  const sky=g.createLinearGradient(0,0,0,300);
  if(isNight){
    sky.addColorStop(0,'#0a1530');
    sky.addColorStop(.5,'#15264a');
    sky.addColorStop(1,'#2a3a5e');
  }else{
    sky.addColorStop(0,'#5aa8dc');
    sky.addColorStop(.6,'#a8d4ec');
    sky.addColorStop(1,'#d4eaf4');
  }
  g.fillStyle=sky;
  g.fillRect(0,0,W,300);

  if(isNight){
    // Звёзды
    for(let i=0;i<60;i++){
      const x=(i*211)%W;
      const y=(i*89)%220;
      g.fillStyle=`rgba(255,255,255,${.3+Math.random()*.5})`;
      g.beginPath();
      g.arc(x,y,Math.random()*1.5+.5,0,Math.PI*2);
      g.fill();
    }
    // Луна
    const mg=g.createRadialGradient(W*.82,100,8,W*.82,100,100);
    mg.addColorStop(0,'rgba(255,255,220,.95)');
    mg.addColorStop(.4,'rgba(220,220,200,.3)');
    mg.addColorStop(1,'rgba(220,220,200,0)');
    g.fillStyle=mg;
    g.beginPath();
    g.arc(W*.82,100,100,0,Math.PI*2);
    g.fill();
    g.fillStyle='#f5f5dc';
    g.beginPath();
    g.arc(W*.82,100,52,0,Math.PI*2);
    g.fill();
  }else{
    // Облака
    for(const c of[
      {x:280,y:50,s:1},
      {x:620,y:30,s:.85},
      {x:900,y:60,s:1.1},
      {x:1180,y:35,s:.9}
    ]){
      g.fillStyle='rgba(255,255,255,.9)';
      g.beginPath();
      g.arc(c.x,c.y,22*c.s,0,Math.PI*2);
      g.arc(c.x+26*c.s,c.y-8*c.s,28*c.s,0,Math.PI*2);
      g.arc(c.x+56*c.s,c.y,22*c.s,0,Math.PI*2);
      g.arc(c.x+30*c.s,c.y+10*c.s,22*c.s,0,Math.PI*2);
      g.fill();
    }
  }
}

// ===== ДЕРЕВЬЯ И ЗАБОР =====
function drawTreesFence(g,isNight){
  for(let i=0;i<30;i++){
    const x=230+i*40;
    const y=12+(i%3)*6;
    const r=18+(i%4)*4;
    g.fillStyle=isNight?'#0a2a10':'#2e7d32';
    g.beginPath();
    g.arc(x,y,r,0,Math.PI*2);
    g.fill();
    g.fillStyle=isNight?'#153815':'#43a047';
    g.beginPath();
    g.arc(x-r*.2,y-r*.2,r*.6,0,Math.PI*2);
    g.fill();
  }
  const fenceY=68;
  g.fillStyle=isNight?'#7a755e':'#d4ceb8';
  g.fillRect(230,fenceY-3,W-230,6);
  for(let x=230;x<W+10;x+=42){
    const pg=g.createLinearGradient(x,0,x+36,0);
    if(isNight){
      pg.addColorStop(0,'#6a6550');
      pg.addColorStop(.5,'#b8b098');
      pg.addColorStop(1,'#6a6550');
    }else{
      pg.addColorStop(0,'#d8d0b8');
      pg.addColorStop(.5,'#fff9e8');
      pg.addColorStop(1,'#c8c0a0');
    }
    g.fillStyle=pg;
    g.beginPath();
    g.moveTo(x,fenceY);
    g.lineTo(x,30);
    g.lineTo(x+18,18);
    g.lineTo(x+36,30);
    g.lineTo(x+36,fenceY);
    g.closePath();
    g.fill();
  }
}

// ===== СЕТКА ГАЗОНА =====
function drawGridBg(g,isNight,rows,rowStart){
  for(let r=0;r<rows;r++){
    const rr=rowStart+r;
    for(let c=0;c<COLS;c++){
      const x=GRID_X+c*CELL_W;
      const y=GRID_Y+rr*CELL_H;
      const light=(rr+c)%2===0;
      const baseG=g.createLinearGradient(x,y,x,y+CELL_H);
      if(isNight){
        baseG.addColorStop(0,light?'#1e4a10':'#1a400c');
        baseG.addColorStop(1,light?'#2a5a18':'#245014');
      }else{
        baseG.addColorStop(0,light?'#6ed636':'#5cc42e');
        baseG.addColorStop(1,light?'#5cb82a':'#4ea826');
      }
      g.fillStyle=baseG;
      g.fillRect(x,y,CELL_W,CELL_H);
    }
  }
}

// ===== ДОРОГА =====
function drawRoadBg(g,isNight,aTop,aBottom){
  const roadTop=aTop-25;
  const roadBottom=aBottom+25;
  const rbg=g.createLinearGradient(0,roadTop,0,roadBottom);
  if(isNight){
    rbg.addColorStop(0,'#2a2a2a');
    rbg.addColorStop(.5,'#333');
    rbg.addColorStop(1,'#1a1a1a');
  }else{
    rbg.addColorStop(0,'#8a8a8a');
    rbg.addColorStop(.5,'#9a9a9a');
    rbg.addColorStop(1,'#7a7a7a');
  }
  g.fillStyle=rbg;
  g.fillRect(YARD_RIGHT,roadTop,ROAD_W,roadBottom-roadTop);

  const ts=80;
  for(let ty=0;ty<Math.ceil((roadBottom-roadTop)/ts);ty++){
    for(let tx=0;tx<Math.ceil(ROAD_W/ts);tx++){
      const tX=YARD_RIGHT+tx*ts;
      const tY=roadTop+ty*ts;
      const tw=Math.min(ts,YARD_RIGHT+ROAD_W-tX);
      const th=Math.min(ts,roadBottom-tY);
      const shade=(tx+ty)%2===0;
      const tg=g.createLinearGradient(tX,tY,tX,tY+th);
      if(isNight){
        tg.addColorStop(0,shade?'#4a4a4a':'#424242');
        tg.addColorStop(1,shade?'#3a3a3a':'#323232');
      }else{
        tg.addColorStop(0,shade?'#b8b8b8':'#a8a8a8');
        tg.addColorStop(1,shade?'#9c9c9c':'#8e8e8e');
      }
      g.fillStyle=tg;
      g.fillRect(tX+3,tY+3,tw-6,th-6);
      g.strokeStyle=isNight?'#1a1a1a':'#5a5a5a';
      g.lineWidth=3;
      g.strokeRect(tX+3,tY+3,tw-6,th-6);
    }
  }
}

// ===== ДОМ =====
function drawHouse(g,isNight){

    wallG.addColorStop(1,'#c8b090');

  g.fillRect(0,houseTop,houseW,houseBottom-houseTop);

// ===== ПОСТРОЙКА ФОНА ДВОРА =====
function buildYardBackground(isNight,rows,rowStart){
  const oc=document.createElement('canvas');
  oc.width=W;oc.height=H;
  const g=oc.getContext('2d');
  const aTop=GRID_Y+rowStart*CELL_H;
  const aBottom=aTop+rows*CELL_H;

  drawSky(g,isNight);
  drawTreesFence(g,isNight);

  // Земля
  const dirtG=g.createLinearGradient(0,90,0,H);
  if(isNight){
    dirtG.addColorStop(0,'#3a2a1a');
    dirtG.addColorStop(1,'#1a1008');
  }else{
    dirtG.addColorStop(0,'#b08860');
    dirtG.addColorStop(.5,'#a07850');
    dirtG.addColorStop(1,'#8a6438');
  }
  g.fillStyle=dirtG;
  g.fillRect(0,90,W,H-90);

  drawGridBg(g,isNight,rows,rowStart);
  drawRoadBg(g,isNight,aTop,aBottom);

  // Трава по краям газона
  for(let x=GRID_X;x<GRID_X+GRID_W;x+=8){
    g.fillStyle=isNight?'#1a3a10':'#4caf50';
    g.beginPath();
    g.moveTo(x,aTop);
    g.lineTo(x+3,aTop-6-(x%5));
    g.lineTo(x+6,aTop);
    g.closePath();
    g.fill();
    g.beginPath();
    g.moveTo(x,aBottom);
    g.lineTo(x+3,aBottom+6+(x%5));
    g.lineTo(x+6,aBottom);
    g.closePath();
    g.fill();
  }

  drawHouse(g,isNight);
  return oc;
}

// ===== ПОСТРОЙКА ФОНА КРЫШИ =====
function buildRoofBackground(rows,rowStart){
  const oc=document.createElement('canvas');
  oc.width=W;oc.height=H;
  const g=oc.getContext('2d');

  // Небо
  const sky=g.createLinearGradient(0,0,0,300);
  sky.addColorStop(0,'#5a8fc4');
  sky.addColorStop(.6,'#a8d0e8');
  sky.addColorStop(1,'#d8e8f0');
  g.fillStyle=sky;
  g.fillRect(0,0,W,300);

  // Черепица
  const roofG=g.createLinearGradient(0,90,0,H);
  roofG.addColorStop(0,'#8b3a3a');
  roofG.addColorStop(.5,'#7a3030');
  roofG.addColorStop(1,'#4a1818');
  g.fillStyle=roofG;
  g.fillRect(0,90,W,H-90);

  for(let y=100;y<H;y+=20){
    g.strokeStyle='rgba(0,0,0,.25)';
    g.lineWidth=2;
    g.beginPath();
    g.moveTo(0,y);
    g.lineTo(W,y);
    g.stroke();
  }

  // Клетки крыши
  for(let r=0;r<rows;r++){
    const rr=rowStart+r;
    for(let c=0;c<COLS;c++){
      const x=GRID_X+c*CELL_W;
      const y=GRID_Y+rr*CELL_H;
      const light=(rr+c)%2===0;
      const tg=g.createLinearGradient(x,y,x,y+CELL_H);
      tg.addColorStop(0,light?'#b08868':'#a07858');
      tg.addColorStop(1,light?'#986848':'#885838');
      g.fillStyle=tg;
      g.fillRect(x,y,CELL_W,CELL_H);
      g.strokeStyle='rgba(60,30,15,.5)';
      g.lineWidth=2;
      g.strokeRect(x+1,y+1,CELL_W-2,CELL_H-2);
    }
  }

  // Карниз
  g.fillStyle='#8b5a2b';
  g.fillRect(0,80,W,40);

  return oc;
}

// ===== ПОСТРОЙКА ФОНА БАССЕЙНА =====
function buildPoolBackground(rows,rowStart,isNight){
  const oc=document.createElement('canvas');
  oc.width=W;oc.height=H;
  const g=oc.getContext('2d');
  const aTop=GRID_Y+rowStart*CELL_H;
  const aBottom=aTop+rows*CELL_H;

  drawSky(g,isNight);
  drawTreesFence(g,isNight);

  // Земля
  const dirtG=g.createLinearGradient(0,90,0,H);
  if(isNight){
    dirtG.addColorStop(0,'#3a2a1a');
    dirtG.addColorStop(1,'#1a1008');
  }else{
    dirtG.addColorStop(0,'#b08860');
    dirtG.addColorStop(.5,'#a07850');
    dirtG.addColorStop(1,'#8a6438');
  }
  g.fillStyle=dirtG;
  g.fillRect(0,90,W,H-90);

  // Клетки (2-3 ряды — вода)
  for(let r=0;r<rows;r++){
    const rr=rowStart+r;
    const isPoolRow=rr>=2&&rr<4;
    for(let c=0;c<COLS;c++){
      const x=GRID_X+c*CELL_W;
      const y=GRID_Y+rr*CELL_H;
      if(isPoolRow){
        // Вода
        const wg=g.createLinearGradient(x,y,x,y+CELL_H);
        if(isNight){
          wg.addColorStop(0,c%2===0?'#1a4a68':'#164458');
          wg.addColorStop(.5,c%2===0?'#256080':'#205878');
          wg.addColorStop(1,c%2===0?'#0e3850':'#0c3048');
        }else{
          wg.addColorStop(0,c%2===0?'#3a8ec8':'#3288c0');
          wg.addColorStop(.5,c%2===0?'#4aa8e0':'#42a0d8');
          wg.addColorStop(1,c%2===0?'#2e78b0':'#2a70a8');
        }
        g.fillStyle=wg;
        g.fillRect(x,y,CELL_W,CELL_H);

        // Волны
        g.strokeStyle=isNight?'rgba(150,200,255,.2)':'rgba(255,255,255,.25)';
        g.lineWidth=1.5;
        for(let w=0;w<3;w++){
          g.beginPath();
          const wy=y+20+w*30;
          g.moveTo(x+5,wy);
          g.bezierCurveTo(x+20,wy-4,x+35,wy+4,x+50,wy);
          g.bezierCurveTo(x+60,wy-3,x+70,wy+3,x+CELL_W-5,wy);
          g.stroke();
        }
      }else{
        // Трава
        const light=(rr+c)%2===0;
        const baseG=g.createLinearGradient(x,y,x,y+CELL_H);
        if(isNight){
          baseG.addColorStop(0,light?'#1e4a10':'#1a400c');
          baseG.addColorStop(1,light?'#2a5a18':'#245014');
        }else{
          baseG.addColorStop(0,light?'#6ed636':'#5cc42e');
          baseG.addColorStop(1,light?'#5cb82a':'#4ea826');
        }
        g.fillStyle=baseG;
        g.fillRect(x,y,CELL_W,CELL_H);
      }
    }
  }

  // Бортики бассейна
  const poolTopY=GRID_Y+2*CELL_H;
  const poolBottomY=GRID_Y+4*CELL_H;
  g.fillStyle=isNight?'#a89878':'#e8d8b8';
  g.fillRect(GRID_X,poolTopY-8,GRID_W,12);
  g.fillRect(GRID_X,poolBottomY-4,GRID_W,12);

  drawRoadBg(g,isNight,aTop,aBottom);

  return oc;
}

// ===== УПРАВЛЕНИЕ КЭШЕМ ФОНОВ =====
function ensureBackgrounds(){
  const key=S.location+'_'+ROWS+'_'+ROW_START;
  if(bgCacheKey===key)return;
  bgCacheKey=key;

  if(S.location==='roof'){
    bgCacheRoof=buildRoofBackground(ROWS,ROW_START);
  }else if(S.location==='night'){
    bgCacheYardNight=buildYardBackground(true,ROWS,ROW_START);
  }else if(S.location==='pool'){
    bgCachePool=buildPoolBackground(ROWS,ROW_START,false);
  }else if(S.location==='nightpool'){
    bgCacheNightPool=buildPoolBackground(ROWS,ROW_START,true);
  }else{
    bgCacheYard=buildYardBackground(false,ROWS,ROW_START);
  }
}

// ===== КУСТЫ (маскировка зомби на дороге) =====
function buildBushes(isNight,rows,rowStart){
  const oc=document.createElement('canvas');
  oc.width=W;oc.height=H;
  const g=oc.getContext('2d');
  const aTop=GRID_Y+rowStart*CELL_H;
  const aBottom=aTop+rows*CELL_H;

  const blobs=[];
  // Кусты на дороге справа
  for(let i=0;i<90;i++){
    blobs.push({
      x:ROAD_RIGHT+15+Math.random()*100,
      y:aTop-30+Math.random()*(rows*CELL_H+60),
      r:20+Math.random()*22,
      light:Math.random()>.5,
      depth:Math.random()
    });
  }
  // Кусты снизу
  for(let i=0;i<40;i++){
    blobs.push({
      x:GRID_X-60+Math.random()*(GRID_W+300),
      y:aBottom+60+Math.random()*40,
      r:14+Math.random()*20,
      light:Math.random()>.5,
      depth:Math.random()
    });
  }

  blobs.sort((a,b)=>a.y-b.y);

  for(const b of blobs){
    // Тень
    g.fillStyle=isNight?'rgba(0,0,0,.4)':'rgba(0,30,0,.3)';
    g.beginPath();
    g.arc(b.x+1,b.y+2,b.r*.9,0,Math.PI*2);
    g.fill();
    // Основа
    g.fillStyle=isNight
      ?(b.depth>.5?'#0a2a0a':'#0d300d')
      :(b.depth>.5?'#1b5e20':'#1a5018');
    g.beginPath();
    g.arc(b.x,b.y,b.r,0,Math.PI*2);
    g.fill();
    // Блик
    g.fillStyle=isNight
      ?(b.light?'#2a5a2a':'#1d4a1d')
      :(b.light?'#43a047':'#2e7d32');
    g.beginPath();
    g.arc(b.x-b.r*.15,b.y-b.r*.2,b.r*.75,0,Math.PI*2);
    g.fill();
  }

  return oc;
}

function ensureBushes(){
  const key=S.location+'_'+ROWS+'_'+ROW_START;
  if(bushesCacheKey===key)return;
  bushesCacheKey=key;

  if(S.location==='roof'){
    bushesCache=null;
    return;
  }

  const isNight=S.location==='night'||S.location==='nightpool';
  bushesCache=buildBushes(isNight,ROWS,ROW_START);
}

// ==================== ГЛАВНАЯ ФУНКЦИЯ ====================
function drawPlant(type,x,y,t=0,scale=1,plant=null){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  const def=ALL_PLANTS[type];

  const isExplosive=def&&(def.explode!==undefined||def.freezeAll||def.fullScreen);
  if(!awake&&!isExplosive)ctx.globalAlpha=.5;

  // Тень (не на крыше)
  if(S.location!=='roof'){
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();
    ctx.ellipse(0,32,28,8,0,0,Math.PI*2);

  else if(type==='goldflower')drawCoinflower(t,true);

  else if(type==='doomshroom')drawExplosive(t,plant,'doomshroom');
  else if(type==='iceberg')drawIceberg(t,plant);
  else if(type==='potato'||type==='potatomine')drawPotato(plant,t);
  else if(type==='chomper')drawChomper(t,plant);

  else if(type==='spikeweed'||type==='iron_spike')drawSpikeweed(t,type==='iron_spike');
  else if(type==='magnet')drawMagnetShroom(t);

// ==================== СТЕБЕЛЬ С КАЧАНИЕМ ====================
function drawStemSway(t,phase=0){
  const sway=Math.sin(t*.0025+phase)*4;
  const sg=ctx.createLinearGradient(-3,32,3,-8);
  sg.addColorStop(0,'#2d6b12');
  sg.addColorStop(.5,'#4caf50');
  sg.addColorStop(1,'#7cb342');
  ctx.strokeStyle=sg;
  ctx.lineWidth=8;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(0,32);
  ctx.quadraticCurveTo(sway*.3,12,sway,-8);
  ctx.stroke();
  ctx.strokeStyle='rgba(20,60,10,.6)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-3,32);
  ctx.quadraticCurveTo(sway*.3-3,12,sway-3,-8);
  ctx.stroke();
  // Листья
  for(const side of[-1,1]){
    const lx=side*16,ly=14;
    const lg=ctx.createRadialGradient(lx*.5,ly,2,lx,ly,18);
    lg.addColorStop(0,'#7cb342');
    lg.addColorStop(.6,'#4caf50');
    lg.addColorStop(1,'#2e7d32');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(lx,ly,16,8,side*.5+sway*.01,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1b5e20';
    ctx.lineWidth=1.2;
    ctx.stroke();
  }
  return sway;
}

// ==================== ПОДСОЛНУХ ====================
function drawSunflower(t){
  const sway=drawStemSway(t,0);
  const cy=-18+Math.sin(t*.002+.5)*1.5+sway*.3;
  const petalCount=18;
  for(let i=0;i<petalCount;i++){
    const a=(i/petalCount)*Math.PI*2+Math.sin(t*.001+i*.3)*.05;
    const px=Math.cos(a)*30;
    const py=Math.sin(a)*30+cy;
    ctx.fillStyle='#f9a825';
    ctx.beginPath();
    ctx.ellipse(px,py,12,7,a,0,Math.PI*2);
    ctx.fill();
  }
  for(let i=0;i<petalCount;i++){
    const a=(i/petalCount)*Math.PI*2+.1+Math.sin(t*.001+i*.3)*.05;
    const px=Math.cos(a)*28;
    const py=Math.sin(a)*28+cy;
    const lg=ctx.createLinearGradient(px-6,py-6,px+6,py+6);
    lg.addColorStop(0,'#fff59d');
    lg.addColorStop(.5,'#ffeb3b');
    lg.addColorStop(1,'#f9a825');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(px,py,10,6,a,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(180,120,0,.4)';
    ctx.lineWidth=.8;
    ctx.stroke();
  }
  const g=ctx.createRadialGradient(-4,cy-5,3,0,cy,20);
  g.addColorStop(0,'#a1724a');

// ==================== ДВОЙНОЙ ПОДСОЛНУХ ====================
function drawTwinSunflower(t){
  const sway=drawStemSway(t,0);
  const cy=-18+Math.sin(t*.002+.5)*1.5+sway*.3;
  for(const offset of[-14,14]){
    const cy2=cy+(offset>0?3:-3);
    const petalCount=14;
    for(let i=0;i<petalCount;i++){
      const a=(i/petalCount)*Math.PI*2+Math.sin(t*.001+i*.3)*.05;
      const px=Math.cos(a)*22+offset;
      const py=Math.sin(a)*22+cy2;
      ctx.fillStyle='#f9a825';
      ctx.beginPath();
      ctx.ellipse(px,py,10,6,a,0,Math.PI*2);
      ctx.fill();
    }
    const g=ctx.createRadialGradient(offset-4,cy2-4,3,offset,cy2,15);
    g.addColorStop(0,'#a1724a');
    g.addColorStop(.5,'#6a3a1a');
    g.addColorStop(1,'#2d1b0a');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(offset,cy2,14,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1a0e05';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(offset-4,cy2-2,4,0,Math.PI*2);
    ctx.arc(offset+4,cy2-2,4,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(offset-4,cy2-2,2,0,Math.PI*2);
    ctx.arc(offset+4,cy2-2,2,0,Math.PI*2);
    ctx.fill();
  }
}

// ==================== МОНЕТНЫЙ ЦВЕТОК / ЗОЛОТОЙ ====================
function drawCoinflower(t,isGold){
  const sway=drawStemSway(t,0);
  const cy=-18+Math.sin(t*.002+.5)*1.5+sway*.3;
  const petalCount=16;
  for(let i=0;i<petalCount;i++){
    const a=(i/petalCount)*Math.PI*2;
    const px=Math.cos(a)*30;
    const py=Math.sin(a)*30+cy;
    const lg=ctx.createLinearGradient(px-6,py-6,px+6,py+6);
    if(isGold){
      lg.addColorStop(0,'#fff59d');
      lg.addColorStop(.5,'#ffd700');
      lg.addColorStop(1,'#bf8f00');
    }else{
      lg.addColorStop(0,'#fff8e1');
      lg.addColorStop(.5,'#ffd54f');
      lg.addColorStop(1,'#c8a300');
    }
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.ellipse(px,py,12,7,a,0,Math.PI*2);
    ctx.fill();
  }
  const g=ctx.createRadialGradient(-4,cy-5,3,0,cy,20);
  if(isGold){
    g.addColorStop(0,'#fff9c4');
    g.addColorStop(.5,'#ffd700');
    g.addColorStop(1,'#b8860b');
  }else{
    g.addColorStop(0,'#fff3e0');
    g.addColorStop(.5,'#ffb300');
    g.addColorStop(1,'#8a6400');
  }
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,cy,18,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#5a4000';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.font='bold 18px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('🪙',0,cy);
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(-8,cy-6,3,0,Math.PI*2);
  ctx.arc(8,cy-6,3,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(-8,cy-6,1.5,0,Math.PI*2);
  ctx.arc(8,cy-6,1.5,0,Math.PI*2);
  ctx.fill();
}

// ==================== ГОРОХОСТРЕЛ / ЛЕДЯНОЙ / ДВОЙНОЙ ====================
function drawPeashooter(t,ice,heads){
  const sway=drawStemSway(t,0);
  const cy=-18+Math.sin(t*.0025)*1.5+sway*.3;
  // Вторая голова
  if(heads===2){
    const cy2=cy-22;
    const g2=ctx.createRadialGradient(-4,cy2-4,3,0,cy2,20);
    g2.addColorStop(0,'#c5e88a');
    g2.addColorStop(.6,'#8bc34a');
    g2.addColorStop(1,'#33691e');
    ctx.fillStyle=g2;
    ctx.beginPath();
    ctx.arc(-12,cy2,16,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1b5e20';
    ctx.lineWidth=2;
    ctx.stroke();
  }
  const g=ctx.createRadialGradient(-6,cy-6,3,0,cy,24);
  if(ice){
    g.addColorStop(0,'#e1f5fe');
    g.addColorStop(.5,'#81d4fa');
    g.addColorStop(1,'#01579b');
  }else{
    g.addColorStop(0,'#e8f5c8');
    g.addColorStop(.5,'#a5d66a');
    g.addColorStop(1,'#1b5e20');
  }
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,cy,22,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=ice?'#01579b':'#1b5e20';
  ctx.lineWidth=2.5;
  ctx.stroke();
  // Дуло
  ctx.save();
  ctx.translate(20,cy);
  const dg=ctx.createRadialGradient(0,0,2,4,0,14);
  if(ice){
    dg.addColorStop(0,'#81d4fa');
    dg.addColorStop(1,'#01579b');
  }else{
    dg.addColorStop(0,'#a5d66a');
    dg.addColorStop(1,'#33691e');
  }
  ctx.fillStyle=dg;
  ctx.beginPath();
  ctx.ellipse(4,0,12,14,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=ice?'#01579b':'#1b5e20';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.fillStyle='#0a1f05';
  ctx.beginPath();
  ctx.ellipse(7,0,6,7,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  // Глаз
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.ellipse(4,cy-6,7,7,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(6,cy-6,3.5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(7,cy-7,1.5,0,Math.PI*2);
  ctx.fill();
}

function drawWallnut(plant,t){
  const dmg=plant&&plant.maxHp>0?(1-plant.hp/plant.maxHp):0;
  const breathe=Math.sin(t*.003)*1;
  const wobble=dmg>.5?Math.sin(t*.008)*1.5:0;
  ctx.save();
  ctx.translate(wobble,breathe);
  const g=ctx.createRadialGradient(-8,-12,5,0,0,34);
  g.addColorStop(0,'#e8c898');
  g.addColorStop(.4,'#d4b078');
  g.addColorStop(.7,'#a17947');
  g.addColorStop(1,'#6d4c21');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(0,0,26,33,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#4e342e';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.ellipse(-9,-6,7,7,0,0,Math.PI*2);
  ctx.arc(9,-6,7,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(-8,-5,3.5,0,Math.PI*2);
  ctx.arc(10,-5,3.5,0,Math.PI*2);
  ctx.fill();
  // Рот
  ctx.strokeStyle='#000';
  ctx.lineWidth=2;
  ctx.beginPath();
  if(dmg<.3)ctx.arc(0,8,8,.2,Math.PI-.2);
  else if(dmg<.6){ctx.moveTo(-7,10);ctx.lineTo(7,10);}
  else ctx.arc(0,18,7,Math.PI+.2,-.2);
  ctx.stroke();
  // Трещины
  if(dmg>.3){
    ctx.strokeStyle='#3e2723';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(-16,-20);
    ctx.lineTo(-10,-8);
    ctx.lineTo(-15,2);
    ctx.stroke();
  }
  ctx.restore();
}

// ==================== ВЗРЫВНЫЕ ====================
function drawExplosive(t,plant,type){
  const growTimer=plant?(plant.growTimer||0):0;
  const fuse=plant?(plant.fuseDuration||3000):3000;
  const progress=clamp(growTimer/fuse,0,1);
  const scale=.4+progress*.7;
  const pulse=1+Math.sin(t*.02)*.05*progress;
  const s=scale*pulse;
  ctx.save();
  ctx.scale(s,s);

  if(type==='cherry'){
    const cy=-8+Math.sin(t*.005)*1;
    ctx.strokeStyle='#4e342e';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(-10,cy-15);
    ctx.quadraticCurveTo(0,cy-32,12,cy-14);
    ctx.stroke();
    ctx.fillStyle='#4caf50';
    ctx.beginPath();
    ctx.ellipse(6,cy-26,8,4,-.5,0,Math.PI*2);
    ctx.fill();
    drawCherryBall(-10,cy,17);
    drawCherryBall(12,cy+2,17);
  }else if(type==='jalapeno'){
    const cy=-8+Math.sin(t*.005)*1.5;
    const flame=.5+Math.sin(t*.02)*.5;
    const ag=ctx.createRadialGradient(0,cy,10,0,cy,40);
    ag.addColorStop(0,`rgba(255,100,0,${.3*flame})`);
    ag.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle=ag;
    ctx.beginPath();
    ctx.arc(0,cy,40,0,Math.PI*2);
    ctx.fill();
    const g=ctx.createLinearGradient(-18,cy-22,18,cy+22);
    g.addColorStop(0,'#ff5252');
    g.addColorStop(.4,'#e53935');
    g.addColorStop(.7,'#b71c1c');
    g.addColorStop(1,'#7f0000');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,cy,20,28,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#4a0000';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(-7,cy-4,6,0,Math.PI*2);
    ctx.arc(7,cy-4,6,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(-7,cy-4,3,0,Math.PI*2);
    ctx.arc(7,cy-4,3,0,Math.PI*2);
    ctx.fill();
  }else if(type==='iceshroom'){
    const cy=-10+Math.sin(t*.005)*1;
    const g=ctx.createRadialGradient(-6,cy-10,3,0,cy,26);
    g.addColorStop(0,'#e1f5fe');
    g.addColorStop(.5,'#4fc3f7');
    g.addColorStop(1,'#01579b');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,cy,24,20,0,Math.PI,0);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,cy,24,10,0,0,Math.PI);
    ctx.fill();
    ctx.strokeStyle='#01579b';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(-7,cy+2,2.5,0,Math.PI*2);
    ctx.arc(7,cy+2,2.5,0,Math.PI*2);
    ctx.fill();
    const pulse=0.5+Math.sin(t*.02)*.5*progress;
    const aura=ctx.createRadialGradient(0,cy,5,0,cy,40);
    aura.addColorStop(0,`rgba(79,195,247,${.2+pulse*.4})`);
    aura.addColorStop(1,'rgba(79,195,247,0)');
    ctx.fillStyle=aura;
    ctx.beginPath();
    ctx.arc(0,cy,40,0,Math.PI*2);
    ctx.fill();
  }else if(type==='doomshroom'){
    const cy=-10+Math.sin(t*.005)*1;
    const pulse=0.5+Math.sin(t*.02)*.5*progress;
    const aura=ctx.createRadialGradient(0,cy,10,0,cy,55);
    aura.addColorStop(0,`rgba(255,0,0,${.2+pulse*.4})`);
    aura.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=aura;
    ctx.beginPath();
    ctx.arc(0,cy,55,0,Math.PI*2);
    ctx.fill();
    const g=ctx.createRadialGradient(-6,cy-12,3,0,cy,34);
    g.addColorStop(0,'#6a5a5a');
    g.addColorStop(.4,'#4a3a3a');
    g.addColorStop(1,'#0a0a0a');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(0,cy,32,26,0,Math.PI,0);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,cy,32,13,0,0,Math.PI);
    ctx.fill();
    ctx.strokeStyle='#000';
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.fillStyle=`rgba(255,30,30,${.7+pulse*.3})`;
    ctx.beginPath();
    ctx.arc(-10,cy+2,5,0,Math.PI*2);
    ctx.arc(10,cy+2,5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // HP-бар фитиля
  if(plant&&progress<1){
    const barW=50,barH=6;
    const bx=-barW/2,by=-55;
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillRect(bx,by,barW,barH);
    const grad=ctx.createLinearGradient(bx,0,bx+barW,0);
    grad.addColorStop(0,'#ffeb3b');
    grad.addColorStop(1,'#f44336');
    ctx.fillStyle=grad;
    ctx.fillRect(bx,by,barW*progress,barH);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1;
    ctx.strokeRect(bx,by,barW,barH);
  }
}

// ==================== ЛЕДЯНОЙ ЖЁЛУДЬ ====================
function drawIceberg(t,plant){
  const growTimer=plant?(plant.growTimer||0):0;
  const fuse=plant?(plant.fuseDuration||2000):2000;
  const progress=clamp(growTimer/fuse,0,1);
  const scale=.4+progress*.7;
  const pulse=1+Math.sin(t*.02)*.05*progress;
  ctx.save();
  ctx.scale(scale*pulse,scale*pulse);
  const cy=-10+Math.sin(t*.005)*1;
  const g=ctx.createRadialGradient(-6,cy-10,3,0,cy,26);
  g.addColorStop(0,'#e1f5fe');
  g.addColorStop(.5,'#81d4fa');
  g.addColorStop(1,'#0277bd');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(0,cy,20,18,0,Math.PI,0);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0,cy,20,9,0,0,Math.PI);
  ctx.fill();
  ctx.strokeStyle='#01579b';
  ctx.lineWidth=2;
  ctx.stroke();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+t*.005;
    const fx=Math.cos(a)*14;
    const fy=cy+Math.sin(a)*10;
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(fx-2,fy);
    ctx.lineTo(fx+2,fy);
    ctx.moveTo(fx,fy-2);
    ctx.lineTo(fx,fy+2);
    ctx.stroke();
  }
  ctx.restore();
  if(plant&&progress<1){
    const barW=50,barH=6;
    const bx=-barW/2,by=-55;
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillRect(bx,by,barW,barH);
    ctx.fillStyle='#4fc3f7';
    ctx.fillRect(bx,by,barW*progress,barH);
  }
}

  const cy=-10+breathe;
  const used=plant&&plant.used;
  const g=ctx.createRadialGradient(-6,cy-10,3,0,cy,26);

    g.addColorStop(.5,'#666');
    g.addColorStop(1,'#333');
  }else{
    g.addColorStop(0,'#ffc8e0');

  ctx.stroke();

    ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<40;i++){
      const a=i*.4+t*.003;
      const r=i*.4;
      const px=Math.cos(a)*r;
      const py=Math.sin(a)*r+cy-4;
      if(i===0)ctx.moveTo(px,py);

  ctx.beginPath();
  ctx.arc(-7,cy+2,3,0,Math.PI*2);
  ctx.arc(7,cy+2,3,0,Math.PI*2);

// ==================== СОЛНЦЕ ====================
function drawSun(s){
  if(!s||!Number.isFinite(s.x)||!Number.isFinite(s.y))return;
  const pulse=1+Math.sin(S.time/250+(s.phase||0))*.08;
  const r=28*pulse;
  const g=ctx.createRadialGradient(s.x,s.y,4,s.x,s.y,r*2);
  g.addColorStop(0,'rgba(255,255,150,.9)');
  g.addColorStop(.5,'rgba(255,235,59,.4)');
  g.addColorStop(1,'rgba(255,213,79,0)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(s.x,s.y,r*2,0,Math.PI*2);
  ctx.fill();
  // Лучи
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(S.time/1500);
  for(let i=0;i<12;i++){
    ctx.rotate(Math.PI*2/12);
    const lg=ctx.createLinearGradient(0,0,r*1.6,0);
    lg.addColorStop(0,'rgba(255,240,120,.9)');
    lg.addColorStop(1,'rgba(255,240,120,0)');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.moveTo(0,-4);
    ctx.lineTo(r*1.6,0);
    ctx.lineTo(0,4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  // Ядро
  const cg=ctx.createRadialGradient(s.x-5,s.y-5,3,s.x,s.y,r);
  cg.addColorStop(0,'#fffde7');
  cg.addColorStop(.5,'#ffe082');
  cg.addColorStop(1,'#ffb300');
  ctx.fillStyle=cg;
  ctx.beginPath();
  ctx.arc(s.x,s.y,r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#f57f17';
  ctx.lineWidth=2;
  ctx.stroke();
}

// ==================== МОНЕТКА (3 типа) ====================
function drawCoin(c){
  if(!c)return;
  const bob=Math.sin(S.time*.005+(c.phase||0))*3;
  ctx.save();
  ctx.translate(c.x,c.y+bob);

  const type=c.coinType||'bronze';
  const value=c.value||10;

  let glowColor='rgba(205,127,50,.7)';
  let outerColor='#cd7f32',midColor='#e8a060',innerColor='#a05a20',strokeColor='#5a3010';

  if(type==='silver'){
    glowColor='rgba(192,192,192,.7)';
    outerColor='#a8a8a8';midColor='#e0e0e0';innerColor='#808080';strokeColor='#4a4a4a';
  }else if(type==='gold'){
    glowColor='rgba(255,215,0,.7)';
    outerColor='#d4af37';midColor='#ffe082';innerColor='#b8860b';strokeColor='#7a5a08';
  }else if(type==='diamond'){
    glowColor='rgba(180,240,255,.8)';
    outerColor='#4fc3f7';midColor='#e0f7ff';innerColor='#0288d1';strokeColor='#01579b';
  }

  // Свечение
  const g=ctx.createRadialGradient(0,0,4,0,0,28);
  g.addColorStop(0,glowColor);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,0,28,0,Math.PI*2);
  ctx.fill();

  if(type==='diamond'){
    // Алмаз — ромб
    ctx.fillStyle=outerColor;
    ctx.beginPath();
    ctx.moveTo(0,-18);
    ctx.lineTo(14,-4);
    ctx.lineTo(8,16);
    ctx.lineTo(-8,16);
    ctx.lineTo(-14,-4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle=strokeColor;
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.moveTo(-4,-14);
    ctx.lineTo(2,-10);
    ctx.lineTo(-2,-4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.moveTo(4,-4);
    ctx.lineTo(8,0);
    ctx.lineTo(2,4);
    ctx.closePath();
    ctx.fill();
  }else{
    // Круглая
    const cg=ctx.createRadialGradient(-4,-4,2,0,0,16);
    cg.addColorStop(0,midColor);
    cg.addColorStop(.6,outerColor);
    cg.addColorStop(1,innerColor);
    ctx.fillStyle=cg;
    ctx.beginPath();
    ctx.arc(0,0,16,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=strokeColor;
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.strokeStyle=strokeColor;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(0,0,12,0,Math.PI*2);
    ctx.stroke();
    // Блик
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.beginPath();
    ctx.ellipse(-5,-6,5,3,-.5,0,Math.PI*2);
    ctx.fill();
    // Символ
    ctx.fillStyle=strokeColor;
    ctx.font='bold 18px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    if(type==='silver')ctx.fillText('💿',0,1);
    else if(type==='gold')ctx.fillText('📀',0,1);
    else ctx.fillText('$',0,1);
  }

  // Значение
  ctx.fillStyle='#fff';
  ctx.strokeStyle='#000';
  ctx.lineWidth=3;
  ctx.font='bold 16px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='bottom';
  ctx.strokeText('+'+value,0,-22);
  ctx.fillText('+'+value,0,-22);

  ctx.restore();
}

// ==================== СНАРЯД ====================
function drawProjectile(p){
  ctx.save();
  const g=ctx.createRadialGradient(p.x-2,p.y-2,1,p.x,p.y,10);
  if(p.ice){
    g.addColorStop(0,'#e1f5fe');
    g.addColorStop(.5,'#81d4fa');
    g.addColorStop(1,'#01579b');
  }else if(p.spore){
    g.addColorStop(0,'#f0d8ff');
    g.addColorStop(.5,'#c8a2d8');
    g.addColorStop(1,'#4a2a5a');
  }else if(p.melon){
    g.addColorStop(0,'#a5d66a');
    g.addColorStop(.5,'#4caf50');
    g.addColorStop(1,'#1b5e20');
  }else if(p.icemelon){
    g.addColorStop(0,'#81d4fa');
    g.addColorStop(.5,'#0288d1');
    g.addColorStop(1,'#01579b');
  }else{
    g.addColorStop(0,'#e8f5c8');
    g.addColorStop(.5,'#a5d66a');
    g.addColorStop(1,'#33691e');
  }
  ctx.fillStyle=g;
  const r=p.melon?14:(p.icemelon?15:(p.cattail?7:9));
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=p.ice?'#01579b':p.spore?'#3a1a4a':p.icemelon?'#01579b':'#1b5e20';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.beginPath();
  ctx.arc(p.x-2,p.y-2,2,0,Math.PI*2);
  ctx.fill();
  // Аура холода
  if(p.ice||p.icemelon){
    ctx.strokeStyle='rgba(79,195,247,.5)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,r+3,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

// ==================== ЧАСТИЦЫ ====================
function drawParticles(){
  for(const p of S.particles){
    if(!p||!Number.isFinite(p.life))continue;
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color||'#fff';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ==================== ГРАБЛИ ====================
function drawRake(rk){
  ctx.save();
  ctx.translate(rk.x,rk.y+10);
  ctx.strokeStyle='#8b5a2b';
  ctx.lineWidth=4;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-15,-18);
  ctx.lineTo(15,-18);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,-18);
  ctx.lineTo(0,8);
  ctx.stroke();
  for(let i=-3;i<=3;i++){
    ctx.strokeStyle='#5d4037';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(i*5,8);
    ctx.lineTo(i*5,18);
    ctx.stroke();
  }
  ctx.strokeStyle='#3e2723';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-15,8);
  ctx.lineTo(15,8);
  ctx.stroke();
  ctx.restore();
}

// ==================== КОСИЛКА ====================
function drawMower(x,y,isPool){
  // Тень
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(x,y+14,24,6,0,0,Math.PI*2);
  ctx.fill();
  // Корпус
  const g=ctx.createLinearGradient(x-22,y-18,x+22,y+10);
  g.addColorStop(0,'#e53935');
  g.addColorStop(.5,'#c62828');
  g.addColorStop(1,'#7f0000');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.roundRect(x-22,y-18,44,28,6);
  ctx.fill();
  ctx.strokeStyle='#7f0000';
  ctx.lineWidth=2;
  ctx.stroke();
  // Верхняя часть
  ctx.fillStyle='#e53935';
  ctx.beginPath();
  ctx.roundRect(x-16,y-28,32,14,4);
  ctx.fill();
  ctx.strokeStyle='#7f0000';
  ctx.lineWidth=1.5;
  ctx.stroke();
  // Руль
  ctx.strokeStyle='#424242';
  ctx.lineWidth=3;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-8,y-26);
  ctx.lineTo(x-20,y-40);
  ctx.stroke();
  // Колёса
  ctx.fillStyle='#212121';
  ctx.beginPath();
  ctx.arc(x-14,y+10,9,0,Math.PI*2);
  ctx.arc(x+14,y+10,9,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#000';
  ctx.lineWidth=2;
  ctx.stroke();
  // Ступицы
  ctx.fillStyle='#616161';
  ctx.beginPath();
  ctx.arc(x-14,y+10,3.5,0,Math.PI*2);
  ctx.arc(x+14,y+10,3.5,0,Math.PI*2);
  ctx.fill();
  // Вода под косилкой
  if(isPool){
    ctx.fillStyle='rgba(80,180,240,.6)';
    ctx.beginPath();
    ctx.ellipse(x,y+18,26,5,0,0,Math.PI*2);
    ctx.fill();
  }
}

// ==================== ЗОМБИ ====================
function drawZombie(z,t){
  const x=z.x;
  const y=(z.y_air!==undefined&&z.falling)?z.y_air:cellCY(z.row);
  const dying=z.hp<=0;
  const alpha=dying?clamp(1-z.dyingTimer/800,0,1):1;
  const isBoss=z.type==='zomboss';
  const isGarg=z.type==='gargantuar';
  const isMini=z.type==='minizombie';
  const isHypno=z.hypnotized;

  let bushAlpha=1;
  if(z.x>ROAD_RIGHT-20&&S.location!=='roof'&&!z.falling){
    const t2=clamp((z.x-(ROAD_RIGHT-20))/80,0,1);
    bushAlpha=1-t2*.85;
  }

  ctx.save();
  ctx.globalAlpha=alpha*bushAlpha;
  ctx.translate(x,y);
  if(dying)ctx.rotate((1-alpha)*.7);
  if(isBoss)ctx.scale(2.0,2.0);
  else if(isGarg)ctx.scale(1.7,1.7);
  else if(isMini)ctx.scale(.55,.55);

  const bob=dying?0:Math.sin(t*.008+z.walkPhase)*3;
  const headBob=dying?0:Math.sin(t*.01+z.walkPhase)*2;
  ctx.translate(0,bob);

  if(!z.falling){
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(0,38,26,8,0,0,Math.PI*2);
    ctx.fill();
  }

  const legPhase1=Math.sin(t*.008+z.walkPhase);
  const legPhase2=Math.sin(t*.008+z.walkPhase+Math.PI);

  // ===== ЗАДНЯЯ РУКА =====
  ctx.save();
  ctx.translate(16,-8);
  ctx.rotate(.35+Math.sin(t*.008+z.walkPhase+1)*.05);
  ctx.fillStyle=isHypno?'#7a2a6a':'#3a2410';
  ctx.beginPath();
  ctx.roundRect(-8,-6,24,12,5);
  ctx.fill();
  ctx.strokeStyle='#1a0e05';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.fillStyle=isHypno?'#c060b0':'#7a9a3a';
  ctx.beginPath();
  ctx.arc(18,0,6,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#2d5a1a';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();

  // ===== НОГИ =====
  for(const[tx,phase]of[[-10,legPhase1],[10,legPhase2]]){
    ctx.save();
    ctx.translate(tx,22);
    ctx.rotate(phase*.12);
    const pantsG=ctx.createLinearGradient(-8,-10,8,22);
    if(isHypno){
      pantsG.addColorStop(0,'#4a1a5a');
      pantsG.addColorStop(.5,'#3a1040');
      pantsG.addColorStop(1,'#2a0a30');
    }else{
      pantsG.addColorStop(0,'#2a3a6a');
      pantsG.addColorStop(.5,'#1a2a5a');
      pantsG.addColorStop(1,'#0a1a3a');
    }
    ctx.fillStyle=pantsG;
    ctx.beginPath();
    ctx.roundRect(-8,-8,15,26,3);
    ctx.fill();
    ctx.strokeStyle='#0a0a1a';
    ctx.lineWidth=1.5;
    ctx.stroke();
    const shoeG=ctx.createLinearGradient(-8,16,12,26);
    shoeG.addColorStop(0,'#8a5a2a');
    shoeG.addColorStop(.5,'#6d4c21');
    shoeG.addColorStop(1,'#3a2410');
    ctx.fillStyle=shoeG;
    ctx.beginPath();
    ctx.ellipse(2,20,12,6,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#2d1b08';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.restore();
  }

  // ===== ТОРС =====
  ctx.fillStyle=isHypno?'#e0a0d0':'#c8c8c8';
  ctx.beginPath();
  ctx.ellipse(0,-2,18,24,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#666';
  ctx.lineWidth=1.5;
  ctx.stroke();

  const jacketG=ctx.createRadialGradient(-6,-6,3,0,2,30);
  if(isHypno){
    jacketG.addColorStop(0,'rgba(255,255,255,.15)');
    jacketG.addColorStop(.4,'#a040a0');
    jacketG.addColorStop(.7,'#702070');
    jacketG.addColorStop(1,'#4a1050');
  }else if(isGarg){
    jacketG.addColorStop(0,'rgba(255,255,255,.15)');
    jacketG.addColorStop(.4,'#6a4a2a');
    jacketG.addColorStop(1,'#2a1a0a');
  }else{
    jacketG.addColorStop(0,'rgba(255,255,255,.15)');
    jacketG.addColorStop(.4,'#6d4c2a');
    jacketG.addColorStop(1,'#2a1a0a');
  }
  ctx.fillStyle=jacketG;
  ctx.beginPath();
  ctx.ellipse(0,0,22,26,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#1a0e05';
  ctx.lineWidth=1.5;
  ctx.stroke();

  // Рваные края
  ctx.fillStyle=isHypno?'#4a1050':'#2a1a0a';
  for(let i=0;i<6;i++){
    const rx=-20+i*8;
    const rh=4+Math.sin(t*.005+i*1.3)*2;
    ctx.beginPath();
    ctx.moveTo(rx,22);
    ctx.lineTo(rx+3,22+rh);
    ctx.lineTo(rx+6,22);
    ctx.closePath();
    ctx.fill();
  }

  // Полы
  ctx.fillStyle=isHypno?'#4a1050':'#3a2410';
  ctx.beginPath();
  ctx.moveTo(-22,-8);
  ctx.lineTo(-18,22);
  ctx.lineTo(-8,22);
  ctx.lineTo(-6,-8);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22,-8);
  ctx.lineTo(18,22);
  ctx.lineTo(8,22);
  ctx.lineTo(6,-8);
  ctx.closePath();
  ctx.fill();

  // Рубашка
  ctx.fillStyle=isHypno?'#f0d0e0':'#e8e8e8';
  ctx.beginPath();
  ctx.moveTo(-10,-26);
  ctx.lineTo(-2,-18);
  ctx.lineTo(-6,-26);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10,-26);
  ctx.lineTo(2,-18);
  ctx.lineTo(6,-26);
  ctx.closePath();
  ctx.fill();

  // Галстук
  const tieG=ctx.createLinearGradient(-6,-20,6,20);
  if(isHypno){
    tieG.addColorStop(0,'#ff60c0');
    tieG.addColorStop(.5,'#c040a0');
    tieG.addColorStop(1,'#6a1050');
  }else{
    tieG.addColorStop(0,'#e53935');
    tieG.addColorStop(.5,'#c62828');
    tieG.addColorStop(1,'#8e0000');
  }
  ctx.fillStyle=tieG;
  ctx.beginPath();
  ctx.moveTo(-3,-22);
  ctx.lineTo(3,-22);
  ctx.lineTo(5,8);
  ctx.lineTo(0,14);
  ctx.lineTo(-5,8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#4a0000';
  ctx.lineWidth=1;
  ctx.stroke();

  // ===== ПЕРЕДНИЕ РУКИ =====
  for(const[tx,ty,rot]of[[-20,-8,.5],[20,-14,.35]]){
    ctx.save();
    ctx.translate(tx,ty);
    ctx.rotate(rot+Math.sin(t*.008+z.walkPhase)*.05);
    const sleeveG=ctx.createLinearGradient(-8,-8,8,8);
    if(isHypno){
      sleeveG.addColorStop(0,'#a060a0');
      sleeveG.addColorStop(1,'#4a1050');
    }else{
      sleeveG.addColorStop(0,'#8a6a3a');
      sleeveG.addColorStop(1,'#4a3020');
    }
    ctx.fillStyle=sleeveG;
    ctx.beginPath();
    ctx.roundRect(-8,-7,32,14,5);
    ctx.fill();
    ctx.strokeStyle='#1a0e05';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle=isHypno?'#c060b0':'#8a5a2a';
    ctx.fillRect(20,-7,5,14);
    ctx.strokeStyle='#1a0e05';
    ctx.lineWidth=1;
    ctx.strokeRect(20,-7,5,14);
    // КИСТЬ
    const skinG=ctx.createRadialGradient(28,-2,2,30,0,10);
    skinG.addColorStop(0,isHypno?'#f0b0e0':'#c8e88a');
    skinG.addColorStop(.6,isHypno?'#e090d0':'#8bc34a');
    skinG.addColorStop(1,isHypno?'#8a4080':'#4a7a2a');
    ctx.fillStyle=skinG;
    ctx.beginPath();
    ctx.arc(30,0,8,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=isHypno?'#4a1050':'#2d5a1a';
    ctx.lineWidth=1.5;
    ctx.stroke();
    // Пальцы
    for(let i=-1;i<=1;i++){
      ctx.save();
      ctx.translate(36,i*4);
      ctx.rotate(i*.3+.3);
      ctx.fillStyle=isHypno?'#f0b0e0':'#9ecf5a';
      ctx.beginPath();
      ctx.roundRect(0,-2.5,8,5,2);
      ctx.fill();
      ctx.strokeStyle=isHypno?'#4a1050':'#2d5a1a';
      ctx.lineWidth=1;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ===== ШЕЯ =====
  ctx.fillStyle=isHypno?'#a050a0':'#7a9a4a';
  ctx.beginPath();
  ctx.roundRect(-7,-30,14,12,3);
  ctx.fill();

  // ===== ГОЛОВА =====
  const headG=ctx.createRadialGradient(-8,-24+headBob,4,0,-18+headBob,26);
  if(isBoss){
    headG.addColorStop(0,'#a0c070');
    headG.addColorStop(.5,'#6a9a3a');
    headG.addColorStop(1,'#1a2a0a');
  }else if(isHypno){
    headG.addColorStop(0,'#ffd0e8');
    headG.addColorStop(.6,'#e060b0');
    headG.addColorStop(1,'#6a1050');
  }else if(isGarg){
    headG.addColorStop(0,'#8a9a5a');
    headG.addColorStop(.5,'#5a6a2a');
    headG.addColorStop(1,'#2a3010');
  }else{
    headG.addColorStop(0,'#c8e090');
    headG.addColorStop(.4,'#a5c66a');
    headG.addColorStop(.7,'#7a9a3a');
    headG.addColorStop(1,'#3a5a1a');
  }
  ctx.fillStyle=headG;
  ctx.beginPath();
  ctx.arc(0,-20+headBob,24,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=isBoss?'#1a2a0a':isHypno?'#4a1050':'#2d5a1a';
  ctx.lineWidth=2;
  ctx.stroke();

  // Блик
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();
  ctx.ellipse(-10,-32+headBob,8,6,-.5,0,Math.PI*2);
  ctx.fill();

  // Шрамы
  ctx.strokeStyle='rgba(80,40,40,.6)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-14,-32+headBob);
  ctx.lineTo(-8,-26+headBob);
  ctx.moveTo(-12,-36+headBob);
  ctx.lineTo(-6,-30+headBob);
  ctx.stroke();

  // Волосы
  ctx.strokeStyle=isHypno?'#6a1060':'#2d5a1a';
  ctx.lineWidth=2;
  ctx.lineCap='round';
  const hairWave=Math.sin(t*.006+z.walkPhase)*2;
  for(const hx of[-16,-10,-2,6,14]){
    ctx.beginPath();
    ctx.moveTo(hx,-38+headBob);
    ctx.quadraticCurveTo(hx-2,-44+headBob,hx-4+hairWave,-50+headBob);
    ctx.stroke();
  }

  // Глаза
  ctx.fillStyle='#f5f0d8';
  ctx.beginPath();
  ctx.arc(-9,-20+headBob,8,0,Math.PI*2);
  ctx.arc(9,-20+headBob,8,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#333';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(-9,-20+headBob,8,0,Math.PI*2);
  ctx.arc(9,-20+headBob,8,0,Math.PI*2);
  ctx.stroke();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(-9,-20+headBob,2,0,Math.PI*2);
  ctx.arc(9,-20+headBob,2,0,Math.PI*2);
  ctx.fill();

  // Рот
  ctx.fillStyle='#3a0a0a';
  ctx.beginPath();
  ctx.ellipse(0,-8+headBob,11,6,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#f5f0d8';
  for(let i=-2;i<=2;i++)ctx.fillRect(i*3-1,-13+headBob,2.5,4);

  // ===== ЗАМОРОЗКА =====
  if(z.slowTimer>0){
    ctx.fillStyle=isHypno?'rgba(150,100,200,.35)':'rgba(120,200,255,.35)';
    ctx.beginPath();
    ctx.ellipse(0,-10,32,42,0,0,Math.PI*2);
    ctx.fill();
    for(let i=0;i<3;i++){
      const a=t*.002+i*2;
      const sx=Math.cos(a)*30;
      const sy=Math.sin(a)*30-10;
      ctx.strokeStyle='#e0f7ff';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(sx-4,sy);
      ctx.lineTo(sx+4,sy);
      ctx.moveTo(sx,sy-4);
      ctx.lineTo(sx,sy+4);
      ctx.stroke();
    }
    if(z.frozenStop){
      ctx.strokeStyle='#4fc3f7';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,-10,46,0,Math.PI*2);
      ctx.stroke();
    }
  }

  // ===== ГИПНО-АУРА =====
  if(isHypno){
    const aura=.6+Math.sin(t*.005)*.4;
    ctx.strokeStyle=`rgba(224,64,160,${aura})`;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,-10,46,0,Math.PI*2);
    ctx.stroke();
    for(let i=0;i<3;i++){
      const a=t*.003+i*2.1;
      const sx=Math.cos(a)*38;
      const sy=Math.sin(a)*38-10;
      ctx.fillStyle=`rgba(255,150,220,${.7+Math.sin(a*3)*.3})`;
      ctx.beginPath();
      ctx.arc(sx,sy,5,0,Math.PI*2);
      ctx.fill();
    }
  }

  // ===== АКСЕССУАРЫ =====
  if(z.type==='cone'){
    const coneG=ctx.createLinearGradient(-22,0,22,0);
    coneG.addColorStop(0,'#8a3a00');
    coneG.addColorStop(.3,'#d97000');
    coneG.addColorStop(.5,'#ff9500');
    coneG.addColorStop(.7,'#d97000');
    coneG.addColorStop(1,'#8a3a00');
    ctx.fillStyle=coneG;
    ctx.beginPath();
    ctx.moveTo(-22,-36);
    ctx.lineTo(0,-76);
    ctx.lineTo(22,-36);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#5a2000';
    ctx.lineWidth=2.5;
    ctx.stroke();
  }
  if(z.type==='bucket'){
    const bg=ctx.createLinearGradient(-24,0,24,0);
    bg.addColorStop(0,'#3a4a52');
    bg.addColorStop(.25,'#6a7a82');
    bg.addColorStop(.5,'#b8c0c8');
    bg.addColorStop(.75,'#6a7a82');
    bg.addColorStop(1,'#2a3a42');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(-24,-32);
    ctx.lineTo(-22,-70);
    ctx.lineTo(22,-70);
    ctx.lineTo(24,-32);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#1a2a32';
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.fillStyle='#1a2a32';
    ctx.fillRect(-25,-38,50,6);
  }
  if(z.type==='football'){
    ctx.fillStyle='#b71c1c';
    ctx.beginPath();
    ctx.arc(0,-22,26,Math.PI,0);
    ctx.fill();
    ctx.strokeStyle='#5a0a0a';
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(-22,-22);
    ctx.lineTo(22,-22);
    ctx.moveTo(-18,-16);
    ctx.lineTo(18,-16);
    ctx.moveTo(-14,-10);
    ctx.lineTo(14,-10);
    ctx.stroke();
  }
  if(z.type==='balloon'){
    ctx.strokeStyle='#333';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,-44);
    ctx.lineTo(0,-64);
    ctx.stroke();
    const bg=ctx.createRadialGradient(-6,-76,4,0,-74,22);
    bg.addColorStop(0,'#ff80ab');
    bg.addColorStop(.6,'#e91e63');
    bg.addColorStop(1,'#880e4f');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.ellipse(0,-74,20,24,0,0,Math.PI*2);
    ctx.fill();
  }
  if(z.type==='flag'){
    ctx.strokeStyle='#4e342e';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(20,-40);
    ctx.lineTo(20,10);
    ctx.stroke();
    ctx.fillStyle='#c62828';
    ctx.beginPath();
    ctx.moveTo(20,-38);
    ctx.lineTo(52,-30);
    ctx.lineTo(20,-18);
    ctx.closePath();
    ctx.fill();
  }
  if(z.type==='dancer'){
    ctx.fillStyle='#4a148c';
    ctx.beginPath();
    ctx.arc(0,-28,26,Math.PI,0);
    ctx.fill();
    ctx.strokeStyle='#2a0a5a';
    ctx.lineWidth=2;
    ctx.stroke();
  }

  // ===== ГАРГАНТЮА — СТОЛБ =====
  if(isGarg){
    ctx.fillStyle='#5d4037';
    ctx.beginPath();
    ctx.roundRect(-45,-32,14,64,4);
    ctx.fill();
    ctx.strokeStyle='#2d1b12';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#8d6e63';
    ctx.beginPath();
    ctx.roundRect(-48,-38,20,10,3);
    ctx.fill();
    ctx.strokeStyle='#2d1b12';
    ctx.lineWidth=2;
    ctx.stroke();
    if(z.hp<z.maxHp*.5){
      const pulse=.5+Math.sin(t*.01)*.5;
      ctx.fillStyle=`rgba(255,50,50,${.4+pulse*.3})`;
      ctx.beginPath();
      ctx.arc(0,-18,34,0,Math.PI*2);
      ctx.fill();
    }
  }

  // ===== ЗОМБОСС =====
  if(isBoss){
    ctx.fillStyle='#4a7a3a';
    ctx.beginPath();
    ctx.arc(0,-18,34,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#1a2a0a';
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.fillStyle='#ff8a65';
    ctx.beginPath();
    ctx.arc(0,-22,22,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#bf360c';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#ffeb3b';
    ctx.beginPath();
    ctx.arc(-9,-22,5,0,Math.PI*2);
    ctx.arc(9,-22,5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#90a4ae';
    ctx.beginPath();
    ctx.ellipse(-34,-10,16,24,0,0,Math.PI*2);
    ctx.ellipse(34,-10,16,24,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#455a64';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#ffd700';
    ctx.beginPath();
    ctx.moveTo(-26,-50);
    ctx.lineTo(-22,-70);
    ctx.lineTo(-12,-58);
    ctx.lineTo(0,-76);
    ctx.lineTo(12,-58);
    ctx.lineTo(22,-70);
    ctx.lineTo(26,-50);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#b8860b';
    ctx.lineWidth=2;
    ctx.stroke();
  }

  ctx.restore();

  // ===== HP-БАР =====
  if(!dying&&z.hp<z.maxHp){
    ctx.save();
    ctx.globalAlpha=bushAlpha;
    const bw=isBoss?140:isGarg?100:isMini?24:46;
    const by=y-(isBoss?170:isGarg?130:isMini?50:96);
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.beginPath();
    ctx.roundRect(x-bw/2,by,bw,isBoss?12:7,3);
    ctx.fill();
    const pct=z.hp/z.maxHp;
    let fill='#81c784';
    if(pct<=.5)fill='#ffb74d';
    if(pct<=.25)fill='#ef5350';
    ctx.fillStyle=fill;
    ctx.beginPath();
    ctx.roundRect(x-bw/2+1,by+1,(bw-2)*pct,isBoss?10:5,2);
    ctx.fill();
    if(isBoss){
      ctx.fillStyle='#ffeb3b';
      ctx.font='bold 22px Impact, Arial Black, sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.strokeStyle='#000';
      ctx.lineWidth=4;
      ctx.strokeText('ЗОМБОСС',x,by-20);
      ctx.fillText('ЗОМБОСС',x,by-20);
    }
    if(isGarg){
      ctx.fillStyle='#ffeb3b';
      ctx.font='bold 18px Impact, Arial Black, sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.strokeStyle='#000';
      ctx.lineWidth=3;
      ctx.strokeText('ГАРГАНТЮА',x,by-15);
      ctx.fillText('ГАРГАНТЮА',x,by-15);
    }
    ctx.restore();
  }
}

// ==================== ВЕРХНЯЯ ПАНЕЛЬ ====================
function drawTopBar(){

  ctx.lineWidth=3;
  ctx.stroke();

  // ===== СОЛНЦЕ =====

  sg.addColorStop(0,'#fffde7');
  sg.addColorStop(.5,'#ffd54f');
  sg.addColorStop(1,'#f57f17');
  ctx.fillStyle=sg;
  ctx.beginPath();
  ctx.arc(panelX+30,panelY+30,26,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#e65100';
  ctx.lineWidth=2;
  ctx.stroke();

  // Значение солнца

// ==================== ПАКЕТ СЕМЕНИ ====================
function drawSeedPacket(x,y,w,h,seed){
  if(!seed)return;
  const isSelected=S.selectedSeed===seed.id;
  const cd=S.cooldowns[seed.id]||0;
  const ready=cd<=0&&S.sun>=seed.cost;
  const awake=isPlantAwake(seed.id);

  // Фон пакета
  const bg=ctx.createLinearGradient(0,y,0,y+h);
  if(isSelected){
    bg.addColorStop(0,'#fff9c4');
    bg.addColorStop(1,'#ffe082');
  }else{
    bg.addColorStop(0,'#f0e2c0');
    bg.addColorStop(.5,'#d7c9a5');
    bg.addColorStop(1,'#a8956d');
  }
  ctx.fillStyle=bg;
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=isSelected?'#ffeb3b':'#3e2723';
  ctx.lineWidth=isSelected?3:2;
  ctx.strokeRect(x,y,w,h);

  // Растение внутри
  ctx.save();
  ctx.translate(x+w/2,y+h/2-6);
  ctx.scale(.62,.62);
  const fakePlant=seed.id==='potato'?{armed:true,hp:100,maxHp:100}:null;
  drawPlant(seed.id,0,0,S.time,1,fakePlant);
  ctx.restore();

  // Оверлей сна (если ночное растение днём)
  if(!awake){
    ctx.fillStyle='rgba(20,20,60,.75)';
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#fff';
    ctx.font='bold 24px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('💤',x+w/2,y+h/2-6);
  }

  // Стоимость
  ctx.fillStyle='rgba(0,0,0,.8)';
  ctx.fillRect(x+2,y+h-18,w-4,16);
  ctx.fillStyle=(ready&&awake)?'#fff':'#ff5252';
  ctx.font='bold 13px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(seed.cost,x+w/2,y+h-9);

  // Кулдаун
  if(cd>0){
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillRect(x,y,w,h*(cd/seed.cd));
    ctx.fillStyle='#fff';
    ctx.font='bold 16px Arial';
    ctx.fillText(Math.ceil(cd/1000),x+w/2,y+h/2-6);
  }else if(S.sun<seed.cost||!awake){
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.fillRect(x,y,w,h);
  }
}

// ==================== ЛОПАТА ====================
function drawShovel(x,y,w,h){
  const isSelected=S.shovelSelected;
  ctx.fillStyle=isSelected?'#fff9c4':'#e8d9b0';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=isSelected?'#ffeb3b':'#3e2723';
  ctx.lineWidth=isSelected?3:2;
  ctx.strokeRect(x,y,w,h);

  ctx.save();
  ctx.translate(x+w/2,y+h/2);
  ctx.rotate(-.4);
  // Черенок
  ctx.fillStyle='#8d6e63';
  ctx.fillRect(-3,-28,6,40);
  ctx.strokeStyle='#3e2723';
  ctx.lineWidth=1;
  ctx.strokeRect(-3,-28,6,40);
  // Лезвие
  ctx.fillStyle='#5d4037';
  ctx.beginPath();
  ctx.moveTo(-3,12);
  ctx.lineTo(3,12);
  ctx.lineTo(3,30);
  ctx.quadraticCurveTo(0,38,-3,30);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#3e2723';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.restore();
}

// ==================== ПЕРЧАТКА ====================

  ctx.font='bold 12px Arial';
  ctx.textAlign='center';

}

// ==================== БАННЕР ВОЛНЫ ====================
function drawWaveBanner(){
  if(S.waveBannerTimer<=0)return;
  const t=S.waveBannerTimer;
  const totalDur=2500;
  const elapsed=totalDur-t;
  let alpha=1;
  if(elapsed<300)alpha=elapsed/300;
  else if(t<500)alpha=t/500;

  ctx.save();
  ctx.globalAlpha=alpha;

  const isBig=S.bigWave;
  const bannerH=isBig?160:120;
  const bannerY=H/2-bannerH/2;

  // Затемнение
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.fillRect(0,bannerY-20,W,bannerH+40);

  // Линии сверху/снизу
  const lineGrad=ctx.createLinearGradient(0,bannerY,W,bannerY);
  lineGrad.addColorStop(0,'rgba(255,255,255,0)');
  lineGrad.addColorStop(.5,isBig?'#ffeb3b':'#fff');
  lineGrad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.strokeStyle=lineGrad;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,bannerY);
  ctx.lineTo(W,bannerY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,bannerY+bannerH);
  ctx.lineTo(W,bannerY+bannerH);
  ctx.stroke();

  // Главный текст
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const mainSize=isBig?84:64;
  ctx.font=`bold ${mainSize}px Impact, Arial Black, sans-serif`;
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.fillText(S.waveBannerText,W/2+4,H/2+4);

  const textGrad=ctx.createLinearGradient(0,H/2-mainSize/2,0,H/2+mainSize/2);
  if(isBig){
    textGrad.addColorStop(0,'#ffffff');
    textGrad.addColorStop(.4,'#ffeb3b');
    textGrad.addColorStop(1,'#f57f17');
  }else{
    textGrad.addColorStop(0,'#ffffff');
    textGrad.addColorStop(.5,'#e0e0e0');
    textGrad.addColorStop(1,'#9e9e9e');
  }
  ctx.fillStyle=textGrad;
  ctx.strokeStyle='#000';
  ctx.lineWidth=6;
  ctx.strokeText(S.waveBannerText,W/2,H/2);
  ctx.fillText(S.waveBannerText,W/2,H/2);

  // Подзаголовок
  if(S.waveBannerSub){
    ctx.font=`bold ${isBig?32:24}px Impact, Arial Black, sans-serif`;
    ctx.fillStyle=isBig?'#ffeb3b':'#fff';
    ctx.strokeStyle='#000';
    ctx.lineWidth=4;
    ctx.strokeText(S.waveBannerSub,W/2,H/2+mainSize/2+20);
    ctx.fillText(S.waveBannerSub,W/2,H/2+mainSize/2+20);
  }

  ctx.restore();
}

function drawCursorPreview(){

// ==================== ПОДСВЕТКА КЛЕТКИ ====================
function drawCellHighlight(){
  if(!S.selectedSeed&&!S.shovelSelected&&!S.gloveSelected)return;
  if(S.cursorX<GRID_X||S.cursorX>GRID_X+GRID_W)return;
  if(S.cursorY<activeTop()||S.cursorY>activeBottom())return;

  const c=Math.floor((S.cursorX-GRID_X)/CELL_W);
  const r=Math.floor((S.cursorY-activeTop())/CELL_H);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;

  const cellX=GRID_X+c*CELL_W;
  const cellY=activeTop()+r*CELL_H;
  const occupied=getPlantAt(r,c);

  let fill='rgba(255,235,59,.3)';
  let stroke='#ffeb3b';

  if(S.shovelSelected){
    fill='rgba(244,67,54,.3)';
    stroke='#f44336';
  }else if(S.gloveSelected){
    fill='rgba(100,200,255,.3)';
    stroke='#4fc3f7';
  }else if(occupied){
    fill='rgba(244,67,54,.3)';
    stroke='#f44336';
  }

  ctx.fillStyle=fill;
  ctx.fillRect(cellX,cellY,CELL_W,CELL_H);
  ctx.strokeStyle=stroke;
  ctx.lineWidth=3;
  ctx.strokeRect(cellX+1,cellY+1,CELL_W-2,CELL_H-2);
}

// ==================== ПОЛНАЯ СЦЕНА ИГРЫ ====================
function drawGameScene(){
  ensureBackgrounds();

  // Фон
  if(S.location==='roof'){if(bgCacheRoof)ctx.drawImage(bgCacheRoof,0,0);}
  else if(S.location==='night'){if(bgCacheYardNight)ctx.drawImage(bgCacheYardNight,0,0);}
  else if(S.location==='pool'){if(bgCachePool)ctx.drawImage(bgCachePool,0,0);}
  else if(S.location==='nightpool'){if(bgCacheNightPool)ctx.drawImage(bgCacheNightPool,0,0);}
  else{if(bgCacheYard)ctx.drawImage(bgCacheYard,0,0);}

  // Кратеры от взрывов
  for(const c of S.craters){
    const a=clamp(c.life/c.maxLife,0,1);
    ctx.save();
    ctx.globalAlpha=a*.9;
    ctx.fillStyle='#1a1008';
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,34,13,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Грабли
  for(const rk of S.rakes)drawRake(rk);

  // Косилки
  for(let r=0;r<ROWS;r++){
    const m=S.mowers[r];
    if(!m||(m.used&&!m.active))continue;
    const isPool=(S.location==='pool'||S.location==='nightpool')&&r>=2&&r<4;
    drawMower(m.x,cellCY(r)+20,isPool);
  }

  // Подсветка клетки
  drawCellHighlight();

  // Растения
  for(const p of S.plants)drawPlant(p.type,cellCX(p.col),cellCY(p.row),S.time,1,p);

  // Снаряды
  for(const p of S.projectiles)drawProjectile(p);

  // Солнце
  for(const s of S.suns)drawSun(s);

  // Монеты на земле
  for(const c of S.coinsOnGround)drawCoin(c);

  // Зомби
  for(const z of S.zombies)drawZombie(z,S.time);

  // Кусты (поверх зомби на дороге)
  if(S.location!=='roof'){
    ensureBushes();
    if(bushesCache)ctx.drawImage(bushesCache,0,0);
  }

function drawLevelSelect(){
  // Фон
  const bg=ctx.createLinearGradient(0,0,0,H);

  // Заголовок

  ctx.textBaseline='middle';
  ctx.font='bold 44px Impact, Arial Black, sans-serif';
  ctx.strokeStyle='#000';
  ctx.lineWidth=6;
  ctx.strokeText('ВЫБОР ЛОКАЦИИ',W/2,45);
  const tg=ctx.createLinearGradient(0,15,0,75);
  tg.addColorStop(0,'#ffffff');
  tg.addColorStop(1,'#ffb300');
  ctx.fillStyle=tg;
  ctx.fillText('ВЫБОР ЛОКАЦИИ',W/2,45);

  drawBackBtn(20,20,140,50);

  // Локации
  const locations=[
    {key:'yard',     name:'ДВОР',           emoji:'☀',  color:'#5cc42e', bg1:'#a8d8ee', bg2:'#5aa62a', levels:LEVELS.filter(l=>l.location==='yard')},
    {key:'night',    name:'НОЧЬ',           emoji:'🌙',  color:'#3a4a8a', bg1:'#1a2a52', bg2:'#0a0a1a', levels:LEVELS.filter(l=>l.location==='night')},
    {key:'pool',     name:'БАССЕЙН',        emoji:'🏊',  color:'#1a6a9a', bg1:'#4aa8e0', bg2:'#0a2a4a', levels:LEVELS.filter(l=>l.location==='pool')},
    {key:'nightpool',name:'НОЧН. БАССЕЙН',  emoji:'🌊',  color:'#1a2a5a', bg1:'#205070', bg2:'#0a1a30', levels:LEVELS.filter(l=>l.location==='nightpool')},
    {key:'roof',     name:'КРЫША',          emoji:'🏠',  color:'#a85030', bg1:'#d8a060', bg2:'#5a2010', levels:LEVELS.filter(l=>l.location==='roof')},
  ];

  const cardW=220,cardH=460,gap=14;
  const totalW=cardW*5+gap*4;
  const startX=(W-totalW)/2;
  const cardY=100;
  S.levelNodes=[];

  for(let i=0;i<locations.length;i++){
    const loc=locations[i];
    const cx=startX+i*(cardW+gap);
    const cy=cardY;
    const unlocked=loc.levels[0]&&loc.levels[0].id<=S.unlockedLevels;

    // Фон карточки
    const g=ctx.createLinearGradient(cx,cy,cx,cy+cardH);
    g.addColorStop(0,loc.bg1);
    g.addColorStop(1,loc.bg2);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(cx,cy,cardW,cardH,16);
    ctx.fill();
    ctx.strokeStyle=unlocked?loc.color:'#333';
    ctx.lineWidth=4;
    ctx.stroke();

    // Название локации
    ctx.fillStyle='#fff';
    ctx.font='bold 22px Impact, Arial Black, sans-serif';
    ctx.fillText(loc.emoji,cx+cardW/2,cy+30);
    ctx.font='bold 14px Impact, Arial Black, sans-serif';
    ctx.fillText(loc.name,cx+cardW/2,cy+58);

    // Кнопки уровней
    const btnW=55,btnH=45,cols=3;
    const startBtnX=cx+(cardW-cols*btnW-(cols-1)*6)/2;
    const startBtnY=cy+85;

    for(let j=0;j<loc.levels.length;j++){
      const lvl=loc.levels[j];
      const col=j%cols;
      const row=Math.floor(j/cols);
      const bx=startBtnX+col*(btnW+6);
      const by=startBtnY+row*(btnH+6);
      const lvlLocked=lvl.id>S.unlockedLevels;
      const isBoss=!!lvl.boss;

      const bg2=ctx.createLinearGradient(0,by,0,by+btnH);
      if(lvlLocked){
        bg2.addColorStop(0,'#444');
        bg2.addColorStop(1,'#222');
      }else if(isBoss){
        bg2.addColorStop(0,'#d32f2f');
        bg2.addColorStop(1,'#7f0000');
      }else{
        bg2.addColorStop(0,'#8bc34a');
        bg2.addColorStop(1,'#33691e');
      }
      ctx.fillStyle=bg2;
      ctx.beginPath();
      ctx.roundRect(bx,by,btnW,btnH,8);
      ctx.fill();
      ctx.strokeStyle='#1a2a0a';
      ctx.lineWidth=2;
      ctx.stroke();

      ctx.fillStyle=lvlLocked?'#666':'#fff';
      ctx.font='bold 13px Impact, Arial Black, sans-serif';
      ctx.fillText(isBoss?'👹':lvl.name,bx+btnW/2,by+btnH/2);

      // Звёзды
      const stars=S.levelStars[lvl.id]||0;
      if(!lvlLocked&&stars>0&&!isBoss){
        for(let s=0;s<3;s++){
          const sx=bx+btnW/2-8+s*8;
          const sy=by+btnH-8;
          ctx.fillStyle=s<stars?'#ffeb3b':'rgba(0,0,0,.4)';
          ctx.beginPath();
          ctx.arc(sx,sy,3,0,Math.PI*2);
          ctx.fill();
        }
      }

      if(!lvlLocked)S.levelNodes.push({level:lvl,x:bx,y:by,w:btnW,h:btnH});
    }
  }
}

// ==================== ДОСТИЖЕНИЯ ====================
function drawAchievements(){
  // Фон
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a1a3a');
  bg.addColorStop(1,'#0a0510');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Звёзды
  for(let i=0;i<100;i++){
    const x=(i*137)%W;
    const y=(i*71)%H;
    const a=.2+Math.abs(Math.sin(S.time/1000+i))*.5;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(x,y,1,0,Math.PI*2);
    ctx.fill();
  }

  // Заголовок
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const unlocked=Object.keys(S.achievements).length;
  const total=Object.keys(ACHIEVEMENTS).length;
  ctx.font='bold 52px Impact, Arial Black, sans-serif';
  ctx.strokeStyle='#000';
  ctx.lineWidth=8;
  ctx.strokeText('🏆 ДОСТИЖЕНИЯ '+unlocked+'/'+total,W/2,55);
  ctx.fillStyle='#ff6f00';
  ctx.fillText('🏆 ДОСТИЖЕНИЯ '+unlocked+'/'+total,W/2,55);

  drawBackBtn(20,20,140,50);

  // Сетка
  const cardW=420,cardH=80,gap=12,cols=2;
  const totalW=cols*cardW+gap;
  const startX=(W-totalW)/2;
  const startY=110;
  const viewTop=startY;
  const viewBottom=H-20;
  const viewH=viewBottom-viewTop;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0,viewTop,W,viewH);
  ctx.clip();

  const achList=Object.entries(ACHIEVEMENTS);
  const rows=Math.ceil(achList.length/cols);
  const contentH=rows*(cardH+gap);
  S.achScrollMax=Math.max(0,contentH-viewH);
  S.achScroll=clamp(S.achScroll,0,S.achScrollMax);

  for(let i=0;i<achList.length;i++){
    const[id,a]=achList[i];
    const unlockedA=!!S.achievements[id];
    const col=i%cols;
    const row=Math.floor(i/cols);
    const cx=startX+col*(cardW+gap);
    const cy=startY+row*(cardH+gap)-S.achScroll;
    if(cy+cardH<viewTop-20||cy>viewBottom+20)continue;

    const g=ctx.createLinearGradient(cx,cy,cx,cy+cardH);
    if(unlockedA){
      g.addColorStop(0,'#ffd54f');
      g.addColorStop(.5,'#ffb300');
      g.addColorStop(1,'#e65100');
    }else{
      g.addColorStop(0,'#3a3a3a');
      g.addColorStop(1,'#1a1a1a');
    }
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(cx,cy,cardW,cardH,12);
    ctx.fill();
    ctx.strokeStyle=unlockedA?'#7f3f00':'#555';
    ctx.lineWidth=3;
    ctx.stroke();

    // Иконка
    ctx.font='bold 44px Arial';
    ctx.textAlign='center';
    ctx.globalAlpha=unlockedA?1:.4;
    ctx.fillText(a.icon,cx+45,cy+cardH/2);
    ctx.globalAlpha=1;

    // Название
    ctx.textAlign='left';
    ctx.font='bold 20px Impact, Arial Black, sans-serif';
    ctx.fillStyle=unlockedA?'#3e2723':'#888';
    ctx.fillText(a.name,cx+90,cy+28);

    // Описание
    ctx.font='italic 12px Arial';
    ctx.fillStyle=unlockedA?'#5d4037':'#666';
    ctx.fillText(a.desc,cx+90,cy+52);

    // Статус
    ctx.textAlign='right';
    ctx.font='bold 28px Arial';
    if(unlockedA){
      ctx.fillStyle='#4caf50';
      ctx.fillText('✅',cx+cardW-15,cy+cardH/2);
    }else{
      ctx.fillStyle='#666';
      ctx.fillText('🔒',cx+cardW-15,cy+cardH/2);
    }
  }
  ctx.restore();

  // Скроллбар
  if(S.achScrollMax>0){
    const barX=W-15;
    const barW=8;
    const thumbH=Math.max(30,viewH*(viewH/contentH));
    const thumbY=viewTop+(S.achScroll/S.achScrollMax)*(viewH-thumbH);
    ctx.fillStyle='rgba(255,255,255,.15)';
    ctx.beginPath();
    ctx.roundRect(barX,viewTop,barW,viewH,4);
    ctx.fill();
    ctx.fillStyle='rgba(255,235,59,.7)';
    ctx.beginPath();
    ctx.roundRect(barX,thumbY,barW,thumbH,4);
    ctx.fill();
  }
}

// ==================== CRAZY DAVE (ОТРИСОВКА) ====================
function drawCrazyDave(x,y,scale=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  // Тело (рубашка)
  ctx.fillStyle='#f0f0f0';
  ctx.beginPath();
  ctx.moveTo(-50,60);
  ctx.quadraticCurveTo(-55,0,-30,-30);
  ctx.lineTo(30,-30);
  ctx.quadraticCurveTo(55,0,50,60);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#333';
  ctx.lineWidth=2;
  ctx.stroke();

  // Руки
  const wave=Math.sin(S.time*.003)*8;
  ctx.fillStyle='#f0d0b0';
  ctx.beginPath();
  ctx.ellipse(-70,-15,18,28,-.5+wave*.01,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#8a6a4a';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(75,-25,22,30,.3+wave*.01,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#8a6a4a';
  ctx.lineWidth=2;
  ctx.stroke();

  // Пальцы
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.ellipse(85+Math.cos(i*.4)*5,-40+i*5,5,8,i*.3,0,Math.PI*2);
    ctx.fill();

  ctx.fillStyle='#ddd';
  ctx.beginPath();
  ctx.arc(0,-10,3,0,Math.PI*2);

  ctx.fillStyle='#8a5a2a';

  ctx.lineWidth=2;
  ctx.strokeRect(-50,45,100,10);

  ctx.fillRect(4,55,44,55);
  ctx.strokeStyle='#1a2a5a';
  ctx.lineWidth=2;
  ctx.strokeRect(-48,55,44,55);
  ctx.strokeRect(4,55,44,55);

  // Шея
  ctx.fillStyle='#f0d0b0';
  ctx.fillRect(-14,-40,28,15);

  // Голова
  ctx.fillStyle='#f0d0b0';
  ctx.beginPath();
  ctx.arc(0,-70,32,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#8a6a4a';
  ctx.lineWidth=2;
  ctx.stroke();

  // Борода
  ctx.fillStyle='#d4a070';
  ctx.beginPath();
  ctx.moveTo(-25,-58);
  ctx.quadraticCurveTo(-20,-35,0,-30);
  ctx.quadraticCurveTo(20,-35,25,-58);
  ctx.quadraticCurveTo(15,-65,0,-65);
  ctx.quadraticCurveTo(-15,-65,-25,-58);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#8a5a2a';
  ctx.lineWidth=1.5;
  ctx.stroke();

  // Брови
  ctx.fillStyle='#8a5a2a';
  ctx.beginPath();
  ctx.ellipse(-12,-80,10,4,-.1,0,Math.PI*2);
  ctx.ellipse(12,-80,10,4,.1,0,Math.PI*2);
  ctx.fill();

  // Глаза
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(-12,-72,9,0,Math.PI*2);
  ctx.arc(12,-72,9,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#333';
  ctx.lineWidth=1.5;
  ctx.stroke();

  const lookX=Math.sin(S.time*.001)*2;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(-13+lookX,-71,4,0,Math.PI*2);
  ctx.arc(11+lookX,-73,4,0,Math.PI*2);
  ctx.fill();

  // Нос
  ctx.fillStyle='#e0b090';
  ctx.beginPath();
  ctx.ellipse(0,-62,6,8,0,0,Math.PI*2);

  ctx.lineWidth=1;

  ctx.arc(0,-88,36,Math.PI,0);
  ctx.lineTo(36,-85);
  ctx.lineTo(-36,-85);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#555';

// ==================== РЕЧЬ ДЕЙВА ====================
function drawDaveSpeechBubble(x,y,text){
  if(!text)return;
  ctx.save();
  ctx.font='bold 18px Trebuchet MS, Arial';
  const metrics=ctx.measureText(text);
  const textW=Math.min(metrics.width+40,600);
  const textH=60;
  const boxX=x-textW/2;
  const boxY=y-textH-20;

  // Тень
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.roundRect(boxX+4,boxY+4,textW,textH,20);
  ctx.fill();

  // Пузырь
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.roundRect(boxX,boxY,textW,textH,20);
  ctx.fill();
  ctx.strokeStyle='#333';
  ctx.lineWidth=3;
  ctx.stroke();

  // Хвостик
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(x-15,boxY+textH-5);
  ctx.lineTo(x-30,boxY+textH+25);
  ctx.lineTo(x+15,boxY+textH-5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#333';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x-15,boxY+textH-5);
  ctx.lineTo(x-30,boxY+textH+25);
  ctx.lineTo(x+15,boxY+textH-5);
  ctx.stroke();

  // Текст
  ctx.fillStyle='#000';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(text,x,boxY+textH/2);
  ctx.restore();
}

  bodyG.addColorStop(1,'#3a8858');
  ctx.fillStyle=bodyG;
  ctx.beginPath();
  ctx.roundRect(x,y+80,w,h-80,20);
  ctx.fill();
  ctx.strokeStyle='#1a4a2a';
  ctx.lineWidth=4;
  ctx.stroke();

  // Крыша (скошенная)
  ctx.save();
  ctx.translate(x+w/2,y+80);
  ctx.rotate(-1.2);
  ctx.fillStyle='#5aa878';
  ctx.beginPath();
  ctx.roundRect(-w/2,-30,w,30,10);
  ctx.fill();
  ctx.strokeStyle='#1a4a2a';
  ctx.lineWidth=3;

  ctx.restore();

  ctx.fillStyle='#8b5a2b';
  ctx.fillRect(innerX,innerY+70,innerW,8);

}

// ==================== КАРТОЧКИ МАГАЗИНА ====================
function drawShopCards(){
  const page=SHOP_PAGES[S.shopPage]||[];
  const innerX=W-500+20;
  const innerY=180+120;
  const innerW=480-40;

  const itemW=innerW/4;
  S.shopCards=[];

  for(let i=0;i<page.length;i++){
    const item=page[i];
    const col=i%4;
    const row=Math.floor(i/4);
    const ix=innerX+col*itemW+8;
    const iy=innerY+row*80+8;
    const iw=itemW-16;
    const ih=64;

    // Проверка владения
    let owned=false;
    if(item.type==='plant')owned=S.ownedPlants.includes(item.plantId);
    else if(item.type==='item')owned=S.ownedItems.includes(item.id);
    else if(item.type==='upgrade'&&item.isSlot)owned=S.extraSlots>=(item.slotIdx||1);
    else if(item.type==='upgrade'&&item.isIronSpike)owned=S.ownedItems.includes('spikeweed_iron');

    S.shopCards.push({
      x:ix,y:iy,w:iw,h:ih,
      item:item,
      owned:owned,
      canAfford:S.coins>=item.price,
    });

    const cardHover=S.cursorX>=ix&&S.cursorX<=ix+iw&&S.cursorY>=iy&&S.cursorY<=iy+ih;

    ctx.fillStyle=owned?'rgba(60,120,40,.85)':(cardHover?'rgba(255,255,200,.95)':'rgba(255,250,230,.85)');
    ctx.beginPath();
    ctx.roundRect(ix,iy,iw,ih,6);
    ctx.fill();
    ctx.strokeStyle=owned?'#4caf50':(cardHover?'#ffeb3b':'#8b5a2b');
    ctx.lineWidth=cardHover?3:2;
    ctx.stroke();

    // Иконка
    if(item.type==='plant'&&ALL_PLANTS[item.plantId]){
      ctx.save();
      ctx.translate(ix+30,iy+32);
      ctx.scale(.45,.45);
      drawPlant(item.plantId,0,0,S.time,1,null);
      ctx.restore();
    }else if(item.icon){
      ctx.font='bold 32px Arial';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillStyle='#000';
      ctx.fillText(item.icon,ix+30,iy+32);
    }

    // Название
    ctx.fillStyle='#000';
    ctx.font='bold 12px Trebuchet MS, Arial';
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillText(item.name,ix+58,iy+20);

    // Цена / Куплено
    if(owned){
      ctx.fillStyle='#2a5a10';
      ctx.font='bold 13px Arial';
      ctx.fillText('✓ Куплено',ix+58,iy+42);
    }else{
      ctx.fillStyle=item.price<=S.coins?'#8a6400':'#a02020';
      ctx.font='bold 13px Arial';
      ctx.fillText('💰 '+item.price,ix+58,iy+42);
    }
  }
}

  ctx.fillStyle='#c62828';

  ctx.roundRect(nextX,btnY,btnW,btnH,12);

  ctx.strokeStyle='#3e0000';
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.roundRect(W/2-100,btnY+btnH+15,200,40,8);

  ctx.fillStyle='#fff';
  ctx.font='bold 22px Impact, Arial Black, sans-serif';
