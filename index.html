<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Plants vs Zombies — Adventure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: #000; user-select: none;
  }
  #app {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; max-width: 100%; max-height: 100%; cursor: default; }
  #saveToast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: linear-gradient(180deg, rgba(60,40,20,0.95), rgba(30,20,10,0.95));
    color: #ffe082; padding: 12px 26px; border-radius: 10px;
    font-weight: bold; font-size: 15px; pointer-events: none; z-index: 1000;
    border: 2px solid #7cb342; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #saveToast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"><canvas id="canvas" width="1280" height="720"></canvas></div>
<div id="saveToast"></div>
<script>
(() => {
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

if (!ctx.roundRect) {
  ctx.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    if (!Array.isArray(r)) r = [0, 0, 0, 0];
    if (r.length === 1) r = [r[0], r[0], r[0], r[0]];
    if (r.length === 2) r = [r[0], r[1], r[0], r[1]];
    let [tl, tr, br, bl] = r;
    tl = Math.min(tl, w/2, h/2); tr = Math.min(tr, w/2, h/2);
    br = Math.min(br, w/2, h/2); bl = Math.min(bl, w/2, h/2);
    this.beginPath();
    this.moveTo(x+tl, y);
    this.lineTo(x+w-tr, y);
    this.quadraticCurveTo(x+w, y, x+w, y+tr);
    this.lineTo(x+w, y+h-br);
    this.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
    this.lineTo(x+bl, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-bl);
    this.lineTo(x, y+tl);
    this.quadraticCurveTo(x, y, x+tl, y);
    this.closePath();
    return this;
  };
}

// ==================== СЕТКА ====================
const GRID_X = 258, GRID_Y = 118;
const COLS = 9, MAX_ROWS = 5;
let ROWS = 5, ROW_START = 0;
const CELL_W = 82, CELL_H = 98;
const GRID_W = COLS * CELL_W;
const YARD_RIGHT = GRID_X + GRID_W;
const ROAD_W = 250, ROAD_RIGHT = YARD_RIGHT + ROAD_W;
const ZOMBIE_SPAWN_X = ROAD_RIGHT + 60;
const ZOMBIE_ENTER_YARD_X = YARD_RIGHT - 5;

const cellCX = (c) => GRID_X + c * CELL_W + CELL_W / 2;
const cellCY = (r) => GRID_Y + (ROW_START + r) * CELL_H + CELL_H / 2;
const activeGridH = () => ROWS * CELL_H;
const activeTop = () => GRID_Y + ROW_START * CELL_H;
const activeBottom = () => activeTop() + activeGridH();

// ==================== ФОНЫ ====================
let bgCacheYard = null, bgCacheYardNight = null, bgCacheRoof = null, bgCachePool = null;
let bgCacheKey = '';

function buildYardBackground(isNight, rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');
  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const sky = g.createLinearGradient(0, 0, 0, 300);
  if (isNight) {
    sky.addColorStop(0, '#0a1530'); sky.addColorStop(0.5, '#15264a'); sky.addColorStop(1, '#2a3a5e');
  } else {
    sky.addColorStop(0, '#5aa8dc'); sky.addColorStop(0.6, '#a8d4ec'); sky.addColorStop(1, '#d4eaf4');
  }
  g.fillStyle = sky; g.fillRect(0, 0, W, 300);

  if (isNight) {
    for (let i = 0; i < 80; i++) {
      const x = (i * 211) % W, y = (i * 89) % 220;
      g.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.5})`;
      g.beginPath(); g.arc(x, y, Math.random() * 1.5 + 0.5, 0, Math.PI * 2); g.fill();
    }
    const moonG = g.createRadialGradient(W * 0.82, 100, 8, W * 0.82, 100, 100);
    moonG.addColorStop(0, 'rgba(255,255,220,0.95)');
    moonG.addColorStop(0.4, 'rgba(220,220,200,0.3)');
    moonG.addColorStop(1, 'rgba(220,220,200,0)');
    g.fillStyle = moonG;
    g.beginPath(); g.arc(W * 0.82, 100, 100, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#f5f5dc';
    g.beginPath(); g.arc(W * 0.82, 100, 52, 0, Math.PI * 2); g.fill();
  } else {
    const clouds = [{x:280,y:50,s:1},{x:620,y:30,s:.85},{x:900,y:60,s:1.1},{x:1180,y:35,s:.9}];
    for (const c of clouds) {
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.beginPath();
      g.arc(c.x, c.y, 22*c.s, 0, Math.PI*2);
      g.arc(c.x+26*c.s, c.y-8*c.s, 28*c.s, 0, Math.PI*2);
      g.arc(c.x+56*c.s, c.y, 22*c.s, 0, Math.PI*2);
      g.arc(c.x+30*c.s, c.y+10*c.s, 22*c.s, 0, Math.PI*2);
      g.fill();
    }
  }

  for (let i = 0; i < 30; i++) {
    const x = 230 + i * 40, y = 12 + (i % 3) * 6, r = 18 + (i % 4) * 4;
    g.fillStyle = isNight ? '#0a2a10' : '#2e7d32';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    g.fillStyle = isNight ? '#153815' : '#43a047';
    g.beginPath(); g.arc(x - r*0.2, y - r*0.2, r*0.6, 0, Math.PI*2); g.fill();
  }

  const fenceY = 68;
  g.fillStyle = isNight ? '#7a755e' : '#d4ceb8';
  g.fillRect(230, fenceY - 3, W - 230, 6);
  for (let x = 230; x < W + 10; x += 42) {
    const planks = g.createLinearGradient(x, 0, x + 36, 0);
    if (isNight) {
      planks.addColorStop(0, '#6a6550'); planks.addColorStop(0.5, '#b8b098'); planks.addColorStop(1, '#6a6550');
    } else {
      planks.addColorStop(0, '#d8d0b8'); planks.addColorStop(0.5, '#fff9e8'); planks.addColorStop(1, '#c8c0a0');
    }
    g.fillStyle = planks;
    g.beginPath();
    g.moveTo(x, fenceY); g.lineTo(x, 30); g.lineTo(x+18, 18); g.lineTo(x+36, 30); g.lineTo(x+36, fenceY);
    g.closePath(); g.fill();
  }

  const dirtG = g.createLinearGradient(0, 90, 0, H);
  if (isNight) {
    dirtG.addColorStop(0, '#3a2a1a'); dirtG.addColorStop(1, '#1a1008');
  } else {
    dirtG.addColorStop(0, '#b08860'); dirtG.addColorStop(0.5, '#a07850'); dirtG.addColorStop(1, '#8a6438');
  }
  g.fillStyle = dirtG; g.fillRect(0, 90, W, H - 90);

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      const light = (realRow + c) % 2 === 0;
      const baseG = g.createLinearGradient(x, y, x, y + CELL_H);
      if (isNight) {
        baseG.addColorStop(0, light ? '#1e4a10' : '#1a400c');
        baseG.addColorStop(1, light ? '#2a5a18' : '#245014');
      } else {
        baseG.addColorStop(0, light ? '#6ed636' : '#5cc42e');
        baseG.addColorStop(1, light ? '#5cb82a' : '#4ea826');
      }
      g.fillStyle = baseG;
      g.fillRect(x, y, CELL_W, CELL_H);
    }
  }

  const roadX = YARD_RIGHT;
  const roadTop = aTop - 25;
  const roadBottom = aBottom + 25;
  const roadH = roadBottom - roadTop;
  const roadBgG = g.createLinearGradient(0, roadTop, 0, roadBottom);
  if (isNight) {
    roadBgG.addColorStop(0, '#2a2a2a'); roadBgG.addColorStop(0.5, '#333'); roadBgG.addColorStop(1, '#1a1a1a');
  } else {
    roadBgG.addColorStop(0, '#8a8a8a'); roadBgG.addColorStop(0.5, '#9a9a9a'); roadBgG.addColorStop(1, '#7a7a7a');
  }
  g.fillStyle = roadBgG;
  g.fillRect(roadX, roadTop, ROAD_W, roadH);

  const tileSize = 80;
  for (let ty = 0; ty < Math.ceil(roadH/tileSize); ty++) {
    for (let tx = 0; tx < Math.ceil(ROAD_W/tileSize); tx++) {
      const tileX = roadX + tx*tileSize;
      const tileY = roadTop + ty*tileSize;
      const tileW = Math.min(tileSize, roadX + ROAD_W - tileX);
      const tileH = Math.min(tileSize, roadBottom - tileY);
      const shade = (tx + ty) % 2 === 0;
      const tg = g.createLinearGradient(tileX, tileY, tileX, tileY + tileH);
      if (isNight) {
        tg.addColorStop(0, shade ? '#4a4a4a' : '#424242'); tg.addColorStop(1, shade ? '#3a3a3a' : '#323232');
      } else {
        tg.addColorStop(0, shade ? '#b8b8b8' : '#a8a8a8'); tg.addColorStop(1, shade ? '#9c9c9c' : '#8e8e8e');
      }
      g.fillStyle = tg;
      g.fillRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
      g.strokeStyle = isNight ? '#1a1a1a' : '#5a5a5a';
      g.lineWidth = 3;
      g.strokeRect(tileX + 3, tileY + 3, tileW - 6, tileH - 6);
    }
  }

  const curbX = roadX - 8;
  const curbG = g.createLinearGradient(curbX, 0, curbX + 16, 0);
  if (isNight) {
    curbG.addColorStop(0, '#4a4a4a'); curbG.addColorStop(0.5, '#7a7a7a'); curbG.addColorStop(1, '#3a3a3a');
  } else {
    curbG.addColorStop(0, '#a89878'); curbG.addColorStop(0.5, '#e8d8b8'); curbG.addColorStop(1, '#8a7860');
  }
  g.fillStyle = curbG;
  g.fillRect(curbX, roadTop, 16, roadH);
  g.fillRect(roadX + ROAD_W - 8, roadTop, 16, roadH);

  for (let x = GRID_X; x < GRID_X + GRID_W; x += 8) {
    g.fillStyle = isNight ? '#1a3a10' : '#4caf50';
    g.beginPath();
    g.moveTo(x, aTop); g.lineTo(x + 3, aTop - 6 - (x % 5)); g.lineTo(x + 6, aTop);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(x, aBottom); g.lineTo(x + 3, aBottom + 6 + (x % 5)); g.lineTo(x + 6, aBottom);
    g.closePath(); g.fill();
  }

  const houseW = GRID_X - 45;
  const houseTop = 100, houseBottom = H - 60;
  const wallG = g.createLinearGradient(0, 0, houseW, 0);
  if (isNight) {
    wallG.addColorStop(0, '#8a7a5a'); wallG.addColorStop(0.5, '#b8a888'); wallG.addColorStop(1, '#5a4a35');
  } else {
    wallG.addColorStop(0, '#f5e8d0'); wallG.addColorStop(0.4, '#fff5e0'); wallG.addColorStop(1, '#c8b090');
  }
  g.fillStyle = wallG;
  g.fillRect(0, houseTop, houseW, houseBottom - houseTop);

  const roofG = g.createLinearGradient(0, 30, 0, 110);
  if (isNight) {
    roofG.addColorStop(0, '#7a3a30'); roofG.addColorStop(1, '#3a1a15');
  } else {
    roofG.addColorStop(0, '#e8453c'); roofG.addColorStop(0.5, '#c92f26'); roofG.addColorStop(1, '#8a1a12');
  }
  g.fillStyle = roofG;
  g.beginPath();
  g.moveTo(-10, 110); g.lineTo(houseW * 0.5, 20); g.lineTo(houseW + 10, 110);
  g.closePath(); g.fill();

  g.fillStyle = '#8b5a2b';
  g.fillRect(25, 135, 70, 80);
  g.fillStyle = isNight ? '#2a3a5a' : '#a8d8f0';
  g.fillRect(30, 140, 60, 70);

  g.fillStyle = '#8b5a2b';
  g.fillRect(39, 450, 87, 156);
  g.fillStyle = isNight ? '#4a3020' : '#6d4c21';
  g.fillRect(45, 456, 75, 150);

  return oc;
}

function buildRoofBackground(rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');

  const sky = g.createLinearGradient(0, 0, 0, 300);
  sky.addColorStop(0, '#5a8fc4'); sky.addColorStop(0.6, '#a8d0e8'); sky.addColorStop(1, '#d8e8f0');
  g.fillStyle = sky; g.fillRect(0, 0, W, 300);

  const roofG = g.createLinearGradient(0, 90, 0, H);
  roofG.addColorStop(0, '#8b3a3a'); roofG.addColorStop(0.5, '#7a3030'); roofG.addColorStop(1, '#4a1818');
  g.fillStyle = roofG; g.fillRect(0, 90, W, H - 90);

  for (let y = 100; y < H; y += 20) {
    g.strokeStyle = 'rgba(0,0,0,0.25)';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      const light = (realRow + c) % 2 === 0;
      const tg = g.createLinearGradient(x, y, x, y + CELL_H);
      tg.addColorStop(0, light ? '#b08868' : '#a07858');
      tg.addColorStop(1, light ? '#986848' : '#885838');
      g.fillStyle = tg;
      g.fillRect(x, y, CELL_W, CELL_H);
      g.strokeStyle = 'rgba(60,30,15,0.5)';
      g.lineWidth = 2;
      g.strokeRect(x + 1, y + 1, CELL_W - 2, CELL_H - 2);
    }
  }

  g.fillStyle = '#8b5a2b';
  g.fillRect(0, 80, W, 40);
  return oc;
}

function buildPoolBackground(rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');
  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;

  const sky = g.createLinearGradient(0, 0, 0, 300);
  sky.addColorStop(0, '#5aa8dc'); sky.addColorStop(0.6, '#a8d4ec'); sky.addColorStop(1, '#d4eaf4');
  g.fillStyle = sky; g.fillRect(0, 0, W, 300);

  for (let i = 0; i < 30; i++) {
    const x = 230 + i * 40, y = 12 + (i % 3) * 6, r = 18 + (i % 4) * 4;
    g.fillStyle = '#2e7d32';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }

  const fenceY = 68;
  g.fillStyle = '#d4ceb8';
  g.fillRect(230, fenceY - 3, W - 230, 6);
  for (let x = 230; x < W + 10; x += 42) {
    g.fillStyle = '#f0e9d6';
    g.beginPath();
    g.moveTo(x, fenceY); g.lineTo(x, 30); g.lineTo(x+18, 18); g.lineTo(x+36, 30); g.lineTo(x+36, fenceY);
    g.closePath(); g.fill();
  }

  const dirtG = g.createLinearGradient(0, 90, 0, H);
  dirtG.addColorStop(0, '#b08860'); dirtG.addColorStop(0.5, '#a07850'); dirtG.addColorStop(1, '#8a6438');
  g.fillStyle = dirtG; g.fillRect(0, 90, W, H - 90);

  for (let r = 0; r < rows; r++) {
    const realRow = rowStart + r;
    const isPoolRow = realRow >= 2 && realRow < 4;
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL_W;
      const y = GRID_Y + realRow * CELL_H;
      if (isPoolRow) {
        const waterG = g.createLinearGradient(x, y, x, y + CELL_H);
        waterG.addColorStop(0, c % 2 === 0 ? '#3a8ec8' : '#3288c0');
        waterG.addColorStop(0.5, c % 2 === 0 ? '#4aa8e0' : '#42a0d8');
        waterG.addColorStop(1, c % 2 === 0 ? '#2e78b0' : '#2a70a8');
        g.fillStyle = waterG;
        g.fillRect(x, y, CELL_W, CELL_H);
        g.strokeStyle = 'rgba(255,255,255,0.25)';
        g.lineWidth = 1.5;
        for (let w = 0; w < 3; w++) {
          g.beginPath();
          const wy = y + 20 + w * 30;
          g.moveTo(x + 5, wy);
          g.bezierCurveTo(x + 20, wy - 4, x + 35, wy + 4, x + 50, wy);
          g.bezierCurveTo(x + 60, wy - 3, x + 70, wy + 3, x + CELL_W - 5, wy);
          g.stroke();
        }
      } else {
        const light = (realRow + c) % 2 === 0;
        const baseG = g.createLinearGradient(x, y, x, y + CELL_H);
        baseG.addColorStop(0, light ? '#6ed636' : '#5cc42e');
        baseG.addColorStop(1, light ? '#5cb82a' : '#4ea826');
        g.fillStyle = baseG;
        g.fillRect(x, y, CELL_W, CELL_H);
      }
    }
  }

  const poolTopY = GRID_Y + 2 * CELL_H;
  const poolBottomY = GRID_Y + 4 * CELL_H;
  g.fillStyle = '#e8d8b8';
  g.fillRect(GRID_X, poolTopY - 8, GRID_W, 12);
  g.fillRect(GRID_X, poolBottomY - 4, GRID_W, 12);

  const roadX = YARD_RIGHT;
  const roadTop = aTop - 25;
  const roadBottom = aBottom + 25;
  g.fillStyle = '#8a8a8a';
  g.fillRect(roadX, roadTop, ROAD_W, roadBottom - roadTop);

  return oc;
}

function ensureBackgrounds() {
  const key = S.location + '_' + ROWS + '_' + ROW_START;
  if (bgCacheKey === key) return;
  bgCacheKey = key;
  if (S.location === 'roof') bgCacheRoof = buildRoofBackground(ROWS, ROW_START);
  else if (S.location === 'night') bgCacheYardNight = buildYardBackground(true, ROWS, ROW_START);
  else if (S.location === 'pool') bgCachePool = buildPoolBackground(ROWS, ROW_START);
  else bgCacheYard = buildYardBackground(false, ROWS, ROW_START);
}

// ==================== КУСТЫ ====================
let bushesCache = null, bushesCacheKey = '';

function buildBushes(isNight, rows, rowStart) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const g = oc.getContext('2d');
  const aTop = GRID_Y + rowStart * CELL_H;
  const aBottom = aTop + rows * CELL_H;
  const blobs = [];

  for (let i = 0; i < 130; i++) {
    blobs.push({ x: ROAD_RIGHT + 15 + Math.random()*100, y: aTop - 30 + Math.random()*(rows*CELL_H+60),
      r: 20 + Math.random()*22, light: Math.random() > 0.5, depth: Math.random() });
  }
  for (let i = 0; i < 60; i++) {
    blobs.push({ x: GRID_X - 60 + Math.random()*(GRID_W+300), y: aBottom + 60 + Math.random()*40,
      r: 14 + Math.random()*20, light: Math.random() > 0.5, depth: Math.random() });
  }
  blobs.sort((a, b) => a.y - b.y);

  for (const b of blobs) {
    g.fillStyle = isNight ? 'rgba(0,0,0,0.4)' : 'rgba(0,30,0,0.3)';
    g.beginPath(); g.arc(b.x+1, b.y+2, b.r*0.9, 0, Math.PI*2); g.fill();
    g.fillStyle = isNight ? (b.depth > 0.5 ? '#0a2a0a' : '#0d300d') : (b.depth > 0.5 ? '#1b5e20' : '#1a5018');
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI*2); g.fill();
    g.fillStyle = isNight ? (b.light ? '#2a5a2a' : '#1d4a1d') : (b.light ? '#43a047' : '#2e7d32');
    g.beginPath(); g.arc(b.x - b.r*0.15, b.y - b.r*0.2, b.r*0.75, 0, Math.PI*2); g.fill();
  }
  return oc;
}

function ensureBushes() {
  const key = S.location + '_' + ROWS + '_' + ROW_START;
  if (bushesCacheKey === key) return;
  bushesCacheKey = key;
  if (S.location === 'roof') { bushesCache = null; return; }
  bushesCache = buildBushes(S.location === 'night', ROWS, ROW_START);
}

// ==================== РАСТЕНИЯ ====================
const ALL_PLANTS = {
  peashooter:  { id: 'peashooter',  name: 'Горохострел',   cost: 100, cd: 7500,  hp: 100,  sleep: 'day' },
  sunflower:   { id: 'sunflower',   name: 'Подсолнух',     cost: 50,  cd: 7500,  hp: 100,  sleep: 'day' },
  cherry:      { id: 'cherry',      name: 'Вишн. бомба',   cost: 150, cd: 50000, hp: 9999, sleep: 'both' },
  wallnut:     { id: 'wallnut',     name: 'Стенорех',      cost: 50,  cd: 30000, hp: 4000, sleep: 'both' },
  potato:      { id: 'potato',      name: 'Картошка',      cost: 25,  cd: 30000, hp: 100,  sleep: 'both' },
  snowpea:     { id: 'snowpea',     name: 'Ледяной горох', cost: 175, cd: 7500,  hp: 100,  sleep: 'day' },
  repeater:    { id: 'repeater',    name: 'Двойной горох', cost: 200, cd: 7500,  hp: 100,  sleep: 'day' },
  chomper:     { id: 'chomper',     name: 'Жеватель',      cost: 150, cd: 15000, hp: 100,  sleep: 'both' },

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

function addParticles(x, y, count, color, speed = 4, life = 600, size = 4) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(speed * 0.3, speed);
    S.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life, maxLife: life, color, size: rand(size * 0.5, size * 1.5), gravity: 0.12,
    });
  }
}

function isPlantAwake(plantType) {
  const p = ALL_PLANTS[plantType];
  if (!p) return true;
  if (p.sleep === 'both') return true;
  if (S.location === 'roof') return true;
  return p.sleep === S.dayNight;
}

const SAVE_KEY = 'pvz_save_v23';
let saveToastTimer = null;
function showSaveToast(msg) {
  const el = document.getElementById('saveToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function saveProgress(silent = false) {
  try {
    const data = {
      version: 23,
      unlocked: S.unlockedLevels,
      stars: S.levelStars,
      totalKills: S.totalKillsEver,
      totalWins: S.totalWinsEver,
      achievements: S.achievements,
      minigameBest: S.minigameBest,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    if (!silent) showSaveToast('💾 Прогресс сохранён');
    return true;
  } catch(e) { return false; }
}

function loadProgress() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) raw = localStorage.getItem('pvz_backup');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (typeof d.unlocked === 'number' && d.unlocked > 0) S.unlockedLevels = d.unlocked;
    if (d.stars && typeof d.stars === 'object') S.levelStars = d.stars;
    if (typeof d.totalKills === 'number') S.totalKillsEver = d.totalKills;
    if (typeof d.totalWins === 'number') S.totalWinsEver = d.totalWins;
    if (d.achievements) S.achievements = d.achievements;
    if (d.minigameBest) S.minigameBest = d.minigameBest;
  } catch(e) {}
}

function resetProgress() {
  if (!confirm('Точно сбросить ВЕСЬ прогресс?')) return;
  try {
    for (const k of [SAVE_KEY, 'pvz_backup']) try { localStorage.removeItem(k); } catch(e) {}
  } catch(e) {}
  S.unlockedLevels = 1; S.levelStars = {}; S.totalKillsEver = 0; S.totalWinsEver = 0;
  S.achievements = {}; S.minigameBest = {};
  showSaveToast('🗑 Прогресс сброшен');
}

setInterval(() => { if (S.scene === 'playing' && !S.gameOver) saveProgress(true); }, 15000);
window.addEventListener('beforeunload', () => { if (S.scene === 'playing' && !S.gameOver) saveProgress(true); });

// ==================== ДОСТИЖЕНИЯ ====================
function unlockAchievement(id) {
  if (S.achievements[id] || !ACHIEVEMENTS[id]) return false;
  S.achievements[id] = true;
  S.achievementQueue.push({ id, ...ACHIEVEMENTS[id], time: S.time });
  saveProgress(true);
  return true;
}

function checkAchievements() {
  if (S.totalZombiesDead > 0) unlockAchievement('first_blood');
  if (S.totalKillsEver >= 100) unlockAchievement('veteran');
  if (S.sun >= 1000) unlockAchievement('sunflower_farm');
  if (S.unlockedLevels >= 10) unlockAchievement('collector');
  if (S.garlicPushes >= 5) unlockAchievement('garlic_master');
  if (S.gameOver && S.won) {
    const mowersUsed = S.mowers.filter(m => m.used).length;
    if (mowersUsed === 0) unlockAchievement('no_mowers');
    if (S.location === 'night') unlockAchievement('night_owl');
    if (S.location === 'roof') unlockAchievement('roof_walker');
    if (S.location === 'pool') unlockAchievement('pool_party');
    if (S.currentLevel.boss) unlockAchievement('boss_slayer');
    const stars = S.levelStars[S.currentLevel.id] || 0;
    if (stars === 3) unlockAchievement('perfectionist');
    if (S.levelStartTime && S.time - S.levelStartTime < 60000) unlockAchievement('speedrun');
    if (S.unlockedLevels >= 2) unlockAchievement('first_win');
    if (S.plantedThisLevel === 0) unlockAchievement('chill_master');
  }
  if (S.minigameType && S.gameOver && S.won) unlockAchievement('minigame_win');
  if (S.minigameType === 'endless' && S.currentWave >= 10) unlockAchievement('endless_10');
}

function drawAchievementToasts() {
  if (S.achievementQueue.length === 0) return;
  const a = S.achievementQueue[0];
  const elapsed = S.time - a.time;
  if (elapsed > 4200) { S.achievementQueue.shift(); return; }
  const slideIn = Math.min(1, elapsed / 400);
  const slideOut = Math.max(0, (elapsed - 3600) / 600);
  const y = -120 + slideIn * 130 - slideOut * 130;

  const boxW = 460, boxH = 100;
  const boxX = W / 2 - boxW / 2;
  const boxY = y;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(boxX + 6, boxY + 6, boxW, boxH, 14); ctx.fill();

  const g = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
  g.addColorStop(0, '#ffd54f'); g.addColorStop(0.5, '#ffb300'); g.addColorStop(1, '#e65100');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 14); ctx.fill();
  ctx.strokeStyle = '#4a2000'; ctx.lineWidth = 3; ctx.stroke();

  ctx.font = 'bold 50px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(a.icon || '🏆', boxX + 60, boxY + boxH / 2);

  ctx.textAlign = 'left';
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#5d4037';
  ctx.fillText('🏆 ДОСТИЖЕНИЕ РАЗБЛОКИРОВАНО', boxX + 110, boxY + 25);

  ctx.font = 'bold 22px Impact, Arial Black, sans-serif';
  ctx.fillStyle = '#3e2723';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeText(a.name, boxX + 110, boxY + 52);
  ctx.fillText(a.name, boxX + 110, boxY + 52);

  ctx.font = 'italic 13px Arial';
  ctx.fillStyle = '#5d4037';
  ctx.fillText(a.desc, boxX + 110, boxY + 78);
  ctx.restore();
}

function drawPlant(type, x, y, t = 0, scale = 1, plant = null) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  const awake = isPlantAwake(type);
  if (!awake) ctx.globalAlpha = 0.5;

  if (S.location !== 'roof') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 32, 28, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  if (type === 'sunflower') drawSunflower(t);
  else if (type === 'peashooter') drawPeashooter(t, false, 1);
  else if (type === 'snowpea') drawPeashooter(t, true, 1);
  else if (type === 'repeater') drawPeashooter(t, false, 2);
  else if (type === 'threepeater') drawThreepeater(t);
  else if (type === 'wallnut') drawWallnut(plant, t);
  else if (type === 'cherry') drawCherry(t);
  else if (type === 'potato') drawPotato(plant, t);
  else if (type === 'chomper') drawChomper(t, plant);
  else if (type === 'jalapeno') drawJalapeno(t);
  else if (type === 'torchwood') drawTorchwood(t);
  else if (type === 'garlic') drawGarlic(t);
  else if (type === 'puffshroom') drawPuffshroom(t);
  else if (type === 'sunshroom') drawSunshroom(t);
  else if (type === 'fumeshroom') drawFumeshroom(t);
  else if (type === 'doomshroom') drawDoomshroom(t);
  else if (type === 'iceshroom') drawIceshroom(t);
  else if (type === 'hypnoshroom') drawHypnoshroom(t);
  else if (type === 'scaredy') drawScaredy(t);
  else if (type === 'cabbage') drawCabbage(t);
  else if (type === 'kernelpult') drawKernelpult(t);
  else if (type === 'coffee') drawCoffee(t);
  else if (type === 'lilypad') drawLilypad(t);
  else if (type === 'tanglekelp') drawTanglekelp(t);

  if (!awake) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(-22, -58, 44, 20, 6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💤', 0, -48);
  }
  ctx.restore();
}

function drawStemSway(t, phase = 0) {
  const sway = Math.sin(t * 0.0025 + phase) * 4;
  const sg = ctx.createLinearGradient(-3, 32, 3, -8);
  sg.addColorStop(0, '#2d6b12'); sg.addColorStop(0.5, '#4caf50'); sg.addColorStop(1, '#7cb342');
  ctx.strokeStyle = sg;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 32);
  ctx.quadraticCurveTo(sway * 0.3, 12, sway, -8);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(20,60,10,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-3, 32);
  ctx.quadraticCurveTo(sway * 0.3 - 3, 12, sway - 3, -8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(3, 32);
  ctx.quadraticCurveTo(sway * 0.3 + 3, 12, sway + 3, -8);
  ctx.stroke();

  for (const side of [-1, 1]) {
    const lx = side * 16, ly = 14;
    const lg = ctx.createRadialGradient(lx * 0.5, ly, 2, lx, ly, 18);
    lg.addColorStop(0, '#7cb342'); lg.addColorStop(0.6, '#4caf50'); lg.addColorStop(1, '#2e7d32');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.ellipse(lx, ly, 16, 8, side * 0.5 + sway * 0.01, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(20,80,10,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(side * 2, ly + 2);
    ctx.quadraticCurveTo(lx * 0.7, ly - 1, lx * 1.15, ly - 2);
    ctx.stroke();
  }
  return sway;
}

function drawSunflower(t) {
  const sway = drawStemSway(t, 0);
  const breathe = Math.sin(t * 0.002 + 0.5) * 1.5;
  const cy = -18 + breathe + sway * 0.3;

  const petalCount = 18;
  for (let i = 0; i < petalCount; i++) {
    const a = (i / petalCount) * Math.PI * 2 + Math.sin(t * 0.001 + i * 0.3) * 0.05;
    const px = Math.cos(a) * 30;
    const py = Math.sin(a) * 30 + cy;
    ctx.fillStyle = '#f9a825';
    ctx.beginPath();
    ctx.ellipse(px, py, 12, 7, a, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = 0; i < petalCount; i++) {
    const a = (i / petalCount) * Math.PI * 2 + 0.1 + Math.sin(t * 0.001 + i * 0.3) * 0.05;
    const px = Math.cos(a) * 28;
    const py = Math.sin(a) * 28 + cy;
    const lg = ctx.createLinearGradient(px - 6, py - 6, px + 6, py + 6);
    lg.addColorStop(0, '#fff59d'); lg.addColorStop(0.5, '#ffeb3b'); lg.addColorStop(1, '#f9a825');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.ellipse(px, py, 10, 6, a, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,120,0,0.4)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  const g = ctx.createRadialGradient(-4, cy - 5, 3, 0, cy, 20);
  g.addColorStop(0, '#a1724a'); g.addColorStop(0.5, '#6a3a1a'); g.addColorStop(1, '#2d1b0a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, cy, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a0e05'; ctx.lineWidth = 2; ctx.stroke();

  for (let i = 0; i < 30; i++) {
    const a = (i / 30) * Math.PI * 2 + t * 0.0005;
    const r = 6 + (i % 3) * 4;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r, cy + Math.sin(a) * r, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  const blink = (Math.sin(t * 0.001 + 0.7) > 0.97) ? 0.1 : 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-6, cy - 3, 5, 5 * blink, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(6, cy - 3, 5, 5 * blink, 0, 0, Math.PI * 2);
  ctx.fill();
  if (blink > 0.5) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-6, cy - 3, 2.5, 0, Math.PI * 2);
    ctx.arc(6, cy - 3, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-7, cy - 4, 0.8, 0, Math.PI * 2);
    ctx.arc(5, cy - 4, 0.8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, cy + 4, 5, 0.3, Math.PI - 0.3);
  ctx.stroke();
}

function drawPeashooter(t, ice, heads) {
  const sway = drawStemSway(t, 0);
  const breathe = Math.sin(t * 0.0025) * 1.5;
  const cy = -18 + breathe + sway * 0.3;

  if (heads === 2) {
    const cy2 = cy - 22;
    const g2 = ctx.createRadialGradient(-4, cy2 - 4, 3, 0, cy2, 20);
    g2.addColorStop(0, '#c5e88a'); g2.addColorStop(0.6, '#8bc34a'); g2.addColorStop(1, '#33691e');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(-12, cy2, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-16, cy2 - 4, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-17, cy2 - 4, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a1f05';
    ctx.beginPath();
    ctx.ellipse(-2, cy2 + 2, 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const g = ctx.createRadialGradient(-6, cy - 6, 3, 0, cy, 24);
  if (ice) {
    g.addColorStop(0, '#e1f5fe'); g.addColorStop(0.4, '#81d4fa'); g.addColorStop(0.7, '#29b6f6'); g.addColorStop(1, '#01579b');
  } else {
    g.addColorStop(0, '#e8f5c8'); g.addColorStop(0.5, '#a5d66a'); g.addColorStop(0.8, '#558b2f'); g.addColorStop(1, '#1b5e20');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, cy, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = ice ? '#01579b' : '#1b5e20';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.save();
  ctx.translate(20, cy);
  const dg = ctx.createRadialGradient(0, 0, 2, 4, 0, 14);
  if (ice) { dg.addColorStop(0, '#81d4fa'); dg.addColorStop(1, '#01579b'); }
  else { dg.addColorStop(0, '#a5d66a'); dg.addColorStop(1, '#33691e'); }
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.ellipse(4, 0, 12, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = ice ? '#01579b' : '#1b5e20';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  const holeSize = 6 + Math.sin(t * 0.003) * 0.5;
  ctx.fillStyle = '#0a1f05';
  ctx.beginPath();
  ctx.ellipse(7, 0, holeSize, holeSize + 1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = ice ? '#4fc3f7' : '#2e7d32';
  ctx.beginPath();
  ctx.ellipse(5, -1, holeSize * 0.7, holeSize * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.ellipse(-8, cy - 10, 6, 4, -0.5, 0, Math.PI * 2);
  ctx.fill();

  const blink = (Math.sin(t * 0.0015 + 0.3) > 0.97) ? 0.1 : 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(4, cy - 6, 7, 7 * blink, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  if (blink > 0.5) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(6, cy - 6, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, cy - 7, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawThreepeater(t) {
  const sway = drawStemSway(t, 0);
  const breathe = Math.sin(t * 0.0025) * 1.5;
  const cy = -18 + breathe + sway * 0.3;

  const heads = [
    { x: -6, y: cy - 18, r: 15 },
    { x: 0, y: cy, r: 20 },
    { x: -6, y: cy + 18, r: 15 },
  ];

  for (let i = 0; i < heads.length; i++) {
    const h = heads[i];
    const hBreathe = Math.sin(t * 0.0025 + i * 0.5) * 1;
    const g = ctx.createRadialGradient(h.x - 3, h.y - 3, 2, h.x, h.y, h.r);
    g.addColorStop(0, '#c5e88a'); g.addColorStop(0.5, '#8bc34a'); g.addColorStop(1, '#33691e');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y + hBreathe, h.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#7cb342';
    ctx.beginPath();
    ctx.ellipse(h.x + h.r - 2, h.y + hBreathe, 8, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a1f05';
    ctx.beginPath();
    ctx.ellipse(h.x + h.r + 1, h.y + hBreathe, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(h.x + 3, h.y - 3 + hBreathe, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(h.x + 4, h.y - 3 + hBreathe, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWallnut(plant, t) {
  const dmg = plant ? (1 - plant.hp / plant.maxHp) : 0;
  const breathe = Math.sin(t * 0.003) * 1;
  const wobble = dmg > 0.5 ? Math.sin(t * 0.008) * 1.5 : 0;

  ctx.save();
  ctx.translate(wobble, breathe);

  const g = ctx.createRadialGradient(-8, -12, 5, 0, 0, 34);
  g.addColorStop(0, '#e8c898'); g.addColorStop(0.4, '#d4b078');
  g.addColorStop(0.7, '#a17947'); g.addColorStop(1, '#6d4c21');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, 26, 33, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 2.5; ctx.stroke();

  ctx.fillStyle = 'rgba(255,240,200,0.5)';
  ctx.beginPath();
  ctx.ellipse(-9, -15, 8, 5, -0.5, 0, Math.PI * 2);
  ctx.fill();

  const blink = (Math.sin(t * 0.002) > 0.95) ? 0.1 : 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-9, -6, 7, 7 * blink, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(9, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  if (blink > 0.5) {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-8, -5, 3.5, 0, Math.PI * 2);
    ctx.arc(10, -5, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (dmg < 0.3) ctx.arc(0, 8, 8, 0.2, Math.PI - 0.2);
  else if (dmg < 0.6) { ctx.moveTo(-7, 10); ctx.lineTo(7, 10); }
  else ctx.arc(0, 18, 7, Math.PI + 0.2, -0.2);
  ctx.stroke();

  if (dmg > 0.2) {
    ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-16, -20); ctx.lineTo(-10, -8); ctx.lineTo(-15, 2);
    ctx.stroke();
  }
  if (dmg > 0.5) {
    ctx.beginPath();
    ctx.moveTo(12, -18); ctx.lineTo(7, -4); ctx.lineTo(13, 5);
    ctx.stroke();
  }
  if (dmg > 0.75) {
    ctx.beginPath();
    ctx.moveTo(-5, -28); ctx.lineTo(-2, -14); ctx.lineTo(-8, -10);
    ctx.stroke();
  }

  ctx.restore();
}

function drawCherry(t) {
  const breathe = Math.sin(t * 0.003) * 2;
  const cy = -8 + breathe;
  const shake = Math.sin(t * 0.01) * 1;

  ctx.strokeStyle = '#4e342e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-10, cy - 15); ctx.quadraticCurveTo(0, cy - 32, 12, cy - 14);
  ctx.stroke();

  ctx.fillStyle = '#4caf50';
  ctx.beginPath();
  ctx.ellipse(6, cy - 26, 8, 4, -0.5, 0, Math.PI * 2);
  ctx.fill();

  drawCherryBall(-10 + shake, cy, 17);
  drawCherryBall(12 + shake, cy + 2, 17);
}

function drawCherryBall(x, y, r) {
  const g = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 2, x, y, r);
  g.addColorStop(0, '#ff8a80'); g.addColorStop(0.4, '#e53935');
  g.addColorStop(0.8, '#b71c1c'); g.addColorStop(1, '#7f0000');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.ellipse(x - r*0.35, y - r*0.4, r*0.28, r*0.18, -0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - 5, y, 4, 0, Math.PI * 2);
  ctx.arc(x + 5, y, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x - 5, y, 2, 0, Math.PI * 2);
  ctx.arc(x + 5, y, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawPotato(plant, t) {
  const armed = plant && plant.armed;
  const breathe = Math.sin(t * 0.003) * 0.5;

  const g = ctx.createRadialGradient(0, 26, 4, 0, 22, 30);
  g.addColorStop(0, '#7a5a30'); g.addColorStop(1, '#4e342e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 24, 28, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2; ctx.stroke();

  for (let i = 0; i < 5; i++) {
    const angle = (i - 2) * 0.3;
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * 20, 20);
    ctx.lineTo(Math.cos(angle) * 24, 8 + Math.sin(t * 0.003 + i) * 2);
    ctx.stroke();
  }

  if (armed) {
    ctx.save();
    ctx.translate(0, breathe);
    const pg = ctx.createRadialGradient(-5, -6, 3, 0, 0, 24);
    pg.addColorStop(0, '#e0c08a'); pg.addColorStop(0.6, '#c9a36a'); pg.addColorStop(1, '#8b6914');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2; ctx.stroke();

    for (let i = 0; i < 4; i++) {
      const px = -12 + i * 8;
      const py = 4 + (i % 2) * 4;
      ctx.fillStyle = 'rgba(100,80,40,0.6)';
      ctx.beginPath();
      ctx.ellipse(px, py, 2, 1.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-7, -2, 4.5, 0, Math.PI * 2);
    ctx.arc(7, -2, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-7, -2, 2.2, 0, Math.PI * 2);
    ctx.arc(7, -2, 2.2, 0, Math.PI * 2);
    ctx.fill();

    const pulse = 0.5 + Math.sin(t * 0.008) * 0.5;
    const lg = ctx.createRadialGradient(0, -22, 1, 0, -22, 10);
    lg.addColorStop(0, `rgba(255,255,150,${0.8 + pulse * 0.2})`);
    lg.addColorStop(0.5, `rgba(255,0,0,${0.7 + pulse * 0.3})`);
    lg.addColorStop(1, 'rgba(150,0,0,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(0, -22, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f44336';
    ctx.beginPath();
    ctx.arc(0, -22, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#555';
    ctx.fillRect(-3, -17, 6, 4);
    ctx.restore();
  } else {
    ctx.fillStyle = '#c9a36a';
    ctx.beginPath();
    ctx.arc(0, 4, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('...', 0, 4);
  }
}

function drawChomper(t, plant) {
  const sway = drawStemSway(t, 1);
  const chewing = plant && plant.chewing;
  const breathe = Math.sin(t * 0.003) * 2;
  const cy = -20 + breathe + sway * 0.3;

  ctx.save();
  ctx.translate(sway * 0.5, cy);
  if (chewing) ctx.rotate(Math.sin(t * 0.02) * 0.15);

  const g = ctx.createRadialGradient(-6, -8, 4, 0, 0, 26);
  g.addColorStop(0, '#c5e88a'); g.addColorStop(0.5, '#8bc34a'); g.addColorStop(1, '#33691e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, 24, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2.5; ctx.stroke();

  if (!chewing) {
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.ellipse(0, 6, 15, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i*5 - 2, 0); ctx.lineTo(i*5 + 2, 0); ctx.lineTo(i*5, 8);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(i*5 - 2, 14); ctx.lineTo(i*5 + 2, 14); ctx.lineTo(i*5, 6);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#c62828';
    ctx.beginPath();
    ctx.ellipse(0, 8, 6, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-10, 6); ctx.quadraticCurveTo(0, 3, 10, 6); ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-7, -10, 5, 0, Math.PI * 2);
  ctx.arc(7, -10, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, -10, 2.5, 0, Math.PI * 2);
  ctx.arc(8, -10, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawJalapeno(t) {
  const breathe = Math.sin(t * 0.004) * 1.5;
  const cy = -8 + breathe;

  for (let i = 0; i < 3; i++) {
    const a = t * 0.002 + i * 2;
    const px = Math.cos(a) * 25;
    const py = Math.sin(a * 0.7) * 15 + cy - 30;
    ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.sin(a * 2) * 0.1})`;
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  const flame = 0.5 + Math.sin(t * 0.01) * 0.5;
  const ag = ctx.createRadialGradient(0, cy, 10, 0, cy, 40);
  ag.addColorStop(0, `rgba(255,100,0,${0.3 * flame})`);
  ag.addColorStop(1, 'rgba(255,100,0,0)');
  ctx.fillStyle = ag;
  ctx.beginPath();
  ctx.arc(0, cy, 40, 0, Math.PI * 2);
  ctx.fill();

  const g = ctx.createLinearGradient(-18, cy - 22, 18, cy + 22);
  g.addColorStop(0, '#ff5252'); g.addColorStop(0.4, '#e53935');
  g.addColorStop(0.7, '#b71c1c'); g.addColorStop(1, '#7f0000');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, cy, 20, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();

function drawTorchwood(t) {
  drawStemSway(t, 2);
  const breathe = Math.sin(t * 0.003) * 1;
  const cy = -18 + breathe;

  const g = ctx.createLinearGradient(-20, cy - 22, 20, cy + 22);
  g.addColorStop(0, '#a89080'); g.addColorStop(0.5, '#5d4037'); g.addColorStop(1, '#2d1b12');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(-20, cy - 24, 40, 48, 10);
  ctx.fill();
  ctx.strokeStyle = '#2d1b12'; ctx.lineWidth = 2; ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  for (let i = -12; i <= 12; i += 8) {
    ctx.beginPath();
    ctx.moveTo(i, cy - 20); ctx.lineTo(i, cy + 20); ctx.stroke();
  }

  const flame = 0.7 + Math.sin(t * 0.008) * 0.3;
  for (let i = 0; i < 7; i++) {
    const fx = (i - 3) * 6;
    const fh = (22 + Math.sin(t * 0.01 + i * 0.5) * 8) * flame;
    const fg = ctx.createLinearGradient(0, cy - 24 - fh, 0, cy - 24);
    fg.addColorStop(0, 'rgba(255,255,180,0)');
    fg.addColorStop(0.3, 'rgba(255,220,80,0.9)');
    fg.addColorStop(0.7, 'rgba(255,120,0,0.95)');
    fg.addColorStop(1, 'rgba(255,60,0,0.9)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx - 6, cy - 24);
    ctx.quadraticCurveTo(fx, cy - 24 - fh, fx + 6, cy - 24);
    ctx.closePath(); ctx.fill();
  }

  const glow = ctx.createRadialGradient(0, cy - 30, 5, 0, cy - 30, 50);
  glow.addColorStop(0, `rgba(255,180,60,${0.3 + flame * 0.2})`);
  glow.addColorStop(1, 'rgba(255,180,60,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, cy - 30, 50, 0, Math.PI * 2);

  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-7, cy, 2.5, 0, Math.PI * 2);
  ctx.arc(7, cy, 2.5, 0, Math.PI * 2);

}

function drawGarlic(t) {
  const breathe = Math.sin(t * 0.003) * 1;
  const smellPulse = 0.4 + Math.sin(t * 0.005) * 0.3;
  for (let i = 0; i < 4; i++) {
    const r = 30 + i * 10 + Math.sin(t * 0.004 + i * 0.5) * 6;
    ctx.strokeStyle = `rgba(200,200,120,${smellPulse * (1 - i * 0.2)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  const g = ctx.createRadialGradient(-8, -12, 5, 0, 0, 32);
  g.addColorStop(0, '#fff8e8'); g.addColorStop(0.5, '#e0e0c0'); g.addColorStop(1, '#a0a080');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, breathe, 24, 30, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#808060'; ctx.lineWidth = 2.5; ctx.stroke();

  ctx.strokeStyle = 'rgba(120,120,90,0.7)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-16 + i*8, -26 + breathe);
    ctx.quadraticCurveTo(-16 + i*8, 0 + breathe, -16 + i*8, 26 + breathe);
    ctx.stroke();
  }

  for (let i = 0; i < 4; i++) {
    const tLoop = (t * 0.001 + i * 0.5) % 1;
    const ang = i * 1.57 + t * 0.001;
    const px = Math.cos(ang) * (22 + tLoop * 30);
    const py = Math.sin(ang) * (22 + tLoop * 30) - tLoop * 15;
    ctx.fillStyle = `rgba(180,180,100,${(1 - tLoop) * 0.7})`;
    ctx.beginPath();
    ctx.arc(px, py, 4 * (1 - tLoop * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8, -6 + breathe, 6, 0, Math.PI * 2);
  ctx.arc(8, -6 + breathe, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-8, -6 + breathe, 3, 0, Math.PI * 2);
  ctx.arc(8, -6 + breathe, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 14 + breathe, 6, Math.PI + 0.3, -0.3);
  ctx.stroke();
}

function drawMushroomStem(t, color = '#e8dfc8') {

function drawDoomshroom(t) {
  const breathe = drawMushroomStem(t, '#3a2a2a');

  aura.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(0, cy, 55, 0, Math.PI * 2);
  ctx.fill();

  const g = ctx.createRadialGradient(-6, cy - 12, 3, 0, cy, 34);
  g.addColorStop(0, '#6a5a5a'); g.addColorStop(0.4, '#4a3a3a'); g.addColorStop(1, '#0a0a0a');

  ctx.beginPath();
  ctx.ellipse(0, cy, 32, 13, 0, 0, Math.PI);
  ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = 'rgba(200,20,20,0.9)';
  ctx.beginPath();
  ctx.arc(-13, cy - 12, 6, 0, Math.PI * 2);

  ctx.arc(-6, cy - 18, 3.5, 0, Math.PI * 2);
  ctx.arc(6, cy - 20, 3, 0, Math.PI * 2);
  ctx.fill();

  const glow = 0.6 + Math.sin(t * 0.008) * 0.4;
  const eg = ctx.createRadialGradient(-10, cy + 2, 1, -10, cy + 2, 10);
  eg.addColorStop(0, `rgba(255,255,255,${glow})`);
  eg.addColorStop(0.3, `rgba(255,50,50,${glow})`);
  eg.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.arc(-10, cy + 2, 10, 0, Math.PI * 2);
  ctx.fill();

  const eg2 = ctx.createRadialGradient(10, cy + 2, 1, 10, cy + 2, 10);
  eg2.addColorStop(0, `rgba(255,255,255,${glow})`);
  eg2.addColorStop(0.3, `rgba(255,50,50,${glow})`);
  eg2.addColorStop(1, 'rgba(255,0,0,0)');

  ctx.arc(10, cy + 2, 5, 0, Math.PI * 2);

  ctx.arc(0, 0, 4, 0, Math.PI * 2);

    ctx.save();

    ctx.moveTo(-3, -6); ctx.lineTo(3, -6); ctx.lineTo(6, -12); ctx.lineTo(-6, -12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  for (let i = 0; i < 4; i++) {
    const a2 = (i / 4) * Math.PI * 2 + t * 0.003;
    const cx2 = Math.cos(a2) * 38;
    const cy2 = Math.sin(a2) * 20 + cy;
    ctx.fillStyle = `rgba(255,100,0,${glow * 0.7})`;
    ctx.beginPath();
    ctx.arc(cx2, cy2, 2.5, 0, Math.PI * 2);

  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + t * 0.002;

  ctx.arc(6, cy - 4, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-6, cy - 4, 2.2, 0, Math.PI * 2);
  ctx.arc(6, cy - 4, 2.2, 0, Math.PI * 2);
